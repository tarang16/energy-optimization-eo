  const samplePath = `${aff} &gt; ${esc(d.name)} &gt; ${esc(n.areas[0]?.name||'Area')}A &gt; ${esc(d.groups?Object.values(d.groups)[0]?.name:`${d.name} Equipment`)}A &gt; ${esc(n.areas[0]?.tag||'AREA')} ElementA`;
  const schemaCard = el('div'); schemaCard.style.cssText='background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:14px 0';
  schemaCard.innerHTML = `
    <div style="font-size:12.5px;font-weight:700;margin-bottom:6px"> Output schema  single sheet per network, identical to Steam Network v12</div>
    <div style="font-size:11px;color:var(--text2);line-height:1.7;font-family:var(--mono)">
      A  Element ID (key) &nbsp;&nbsp; B  Attribute ID (key) &nbsp;&nbsp; C  Element Path &nbsp;&nbsp; D  Element Type<br>
      E  Attribute Name &nbsp;&nbsp; F  UOM &nbsp;&nbsp; G  PI Sensors &nbsp;&nbsp; H  flag_sip<br>
      I  SIP Min % &nbsp;&nbsp; J  SIP Max % &nbsp;&nbsp; K  Formula &nbsp;&nbsp; L  Default Value
    </div>
    <div style="font-size:11px;color:var(--text3);margin-top:10px;line-height:1.6">
      Row 1 = <code>System: ${esc(aff)}</code>  Row 2 = banner  Row 3 = headers<br>
      Row 4+ = system attrs  plant rows  element &amp; sub-component rows<br>
      Path convention: <code style="color:var(--net-color)">${samplePath}</code><br>
      Boilers / fired heaters / reformers auto-emit sub-component rows (Air Preheater, BFW Pump, Economizer, Stack, etc.) matching v12's behavior.
    </div>
    <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--text2);line-height:1.7">
      <b style="color:var(--purple)"> Second sheet: "${esc(d.name)}  Optim"</b>  companion EO Optimization Metadata sheet with <b style="color:var(--cyan)">18 columns</b>:<br>
      <span style="font-family:var(--mono);font-size:10.5px;color:var(--text3)">
        Var Type (MV/CV/DV/PV)  Design Min/Max (physical limits)  SIP Min/Max %  Cost Type  Cost Coef  Annual Cost  PI Tag Base  Service Mode  Design Load %
      </span><br>
      <span style="font-family:var(--mono);font-size:10.5px;color:var(--green)">NOR  Normal Operating</span> &nbsp;&nbsp;
      <span style="font-family:var(--mono);font-size:10.5px;color:var(--orange)">DSN  Design Basis</span> &nbsp;&nbsp;
      <span style="font-family:var(--mono);font-size:10.5px;color:var(--red)">RTD  Rated / Nameplate Max</span><br>
      Annual Cost = Cost Coef  <b>NOR</b>  ${escAttr(+getSystemCostRate('Annual Operating Hours')||8000)} h/yr. Spare / Out-of-service excluded.
    </div>`;
  w.appendChild(schemaCard);

  /* Live preview from the new schema */
  const previewRows = buildAllAttrRowsForNet(STATE.activeNet);
  const prev = el('div','tree'); prev.style.maxHeight='420px';
  prev.innerHTML = `<div class="tlevel"> Preview  ${previewRows.length} attribute rows (+ ${SYSTEM_ATTRS.length} system rows on top)</div>` +
    previewRows.slice(0,40).map(r=>`<div class="tnode">${esc(r[2])}  <span class="tcount">${esc(r[4])} [${esc(r[5]||'-')}]</span> = ${esc(String(r[11]||''))}</div>`).join('') +
    (previewRows.length>40?`<div class="tcount"> and ${previewRows.length-40} more rows</div>`:'') +
    (previewRows.length===0?`<div class="tcount">No element attributes yet  add elements & fill defaults in Properties tab.</div>`:'');
  w.appendChild(prev);
  return w;
}

/* 
 *  Build the 12-column "All Attributes" rows for ONE network
 *  Mirrors steam_network_studio_v12 conventions:
 *    Path:   Affiliate > Network > AreaA > <Group>A > <AreaTag> <ElemType><A|B|C>
 *    Element Type: header/area-prefixed (e.g. "OLE Boiler") for disambiguation
 *    Sub-components: auto-emitted for elements with `subcomponents` key
 *    Routing: Letdown / SourceDest rows under a Connections group
 *    Schema:
 *      Element ID (key) | Attribute ID (key) | Element Path | Element Type |
 *      Attribute Name   | UOM | PI Sensors | flag_sip |
 *      SIP Min %        | SIP Max % | Formula | Default Value
 *  */
function buildAllAttrRowsForNet(netKey){
  const d = NETWORKS[netKey], net = STATE.nets[netKey];
  if (!d || !net || d.external) return [];
  const rows = [];
  const A = (i)=>String.fromCharCode(65+i);           /* A, B, C */
  const aff = STATE.affiliate || 'System';
  const netRoot = `${aff} > ${d.name}`;
  const isSteam = d.customUI === 'steam';

  /* Helper: push a "block" of attribute rows for one element instance */
  function pushBlock(elementType, elementPath, attrs){
    const eid = hash(elementPath);
    attrs.forEach(at=>{
      rows.push([
        eid, hash(elementPath + '_' + (at.name||'')),
        elementPath, elementType, at.name||'', at.uom||'',
        at.pi||'', at.flagSip ? '1' : '',
        at.sipMin||'', at.sipMax||'', at.formula||'', at.default||''
      ]);
    });
  }

  /* Default-template attrs (no user edits  used for sub-components) */
  function defAttrs(arr){
    return (arr||[]).map(at=>({name:at.name, uom:at.uom||'', pi:'', flagSip:0, sipMin:'', sipMax:'', formula:'', default:''}));
  }

  net.areas.forEach(a=>{
    const areaTag  = a.tag || a.name.slice(0,3).toUpperCase();
    const areaName = `${a.name}${a.tag?' ['+a.tag+']':''}`;
    const areaPath = `${netRoot} > ${areaName}${A(0)}`;     /* "United > Air Network > Olefin Plant [OLE]A" */

    const countsSource = buildCountsSource(a, d, isSteam);

    Object.entries(countsSource).forEach(([ek,v])=>{
      if(+v<=0) return;
      const ed = d.elementTree.find(x=>x.key===ek); if(!ed) return;

      /* Group wrapper level  always present. Falls back to role or "Equipment". */
      const grp = d.groups?.[ed.group];
      const groupName = grp?.name || (ed.role ? `${d.name} ${ed.role}s` : `${d.name} Equipment`);
      const groupPath = `${areaPath} > ${groupName}${A(0)}`;

      for (let i=0; i<v; i++){
        let elemType, leafName, suffix;
        if (isSteam) {
          const info = getSteamInstanceInfo(a, ek, i);
          const prefix = info.hdrShort ? `${info.hdrShort} ` : '';
          elemType = `${areaTag} ${prefix}${ed.name}`.trim();
          suffix = info.suffix;
          leafName = `${elemType}${A(i)}-${suffix}`;
        } else {
          elemType = `${areaTag} ${ed.name}`.trim();
          suffix = `${ed.name.toLowerCase()} ${String.fromCharCode(97 + i)}`;
          leafName = `${elemType}${A(i)}-${suffix}`;
        }
        const leafPath = `${groupPath} > ${leafName}`;
        const attrs = ensureAttrSet(a, ed, i);

        /* 1) Main element rows */
        pushBlock(elemType, leafPath, attrs);

        /* 2) Sub-components (boiler/fired-heater/reformer family) */
        const subTpl = ed.subcomponents && SUBCOMPONENTS[ed.subcomponents];
        if (subTpl){
          subTpl.forEach(sc=>{
            let subType, subPath;
            if (isSteam) {
              const info = getSteamInstanceInfo(a, ek, i);
              const prefix = info.hdrShort ? `${info.hdrShort} ` : '';
              subType = `${areaTag} ${prefix}${ed.name} ${sc.name}`;
              subPath = sc.parent
                ? `${leafPath} > ${areaTag} ${prefix}${ed.name} ${sc.parent}${A(0)} > ${subType}${A(0)}`
                : `${leafPath} > ${subType}${A(0)}`;
            } else {
              subType = `${areaTag} ${ed.name} ${sc.name}`;
              subPath = sc.parent
                ? `${leafPath} > ${areaTag} ${ed.name} ${sc.parent}${A(0)} > ${subType}${A(0)}`
                : `${leafPath} > ${subType}${A(0)}`;
            }
            pushBlock(subType, subPath, defAttrs(sc.attrs));
          });
        }
      }
    });

    /* Plant-based consumer rows (Fuel Network: fuelEquip; Air/plantConsumer: one row per plant) */
    if (d.key === 'fuel_network' || d.plantConsumer) {
      const fp = a.fuelPlants || {};
      const fe = a.fuelEquip  || {};
      const conEls = d.elementTree.filter(e => e.group === 'con');
      const grpDef = d.groups?.['con'];
      const conGroupName = grpDef?.name || `${d.name} Consumers`;
      const conGroupPath = `${areaPath} > ${conGroupName}${A(0)}`;

      Object.keys(fp).forEach(pid => {
        if (!fp[pid]) return;
        const plant = STATE.plants.find(p => p.id === pid);
        if (!plant) return;

        if (d.key === 'fuel_network') {
          /* Fuel: equipment counts per plant from fuelEquip */
          const pe = fe[pid] || {};
          conEls.forEach(ed => {
            const cnt = +pe[ed.key] || 0;
            if (cnt <= 0) return;
            for (let i = 0; i < cnt; i++) {
              const elemType = `${plant.name} ${ed.name}`.trim();
              const suffix   = `${ed.name.toLowerCase().replace(/\s+/g,'_')}_${String.fromCharCode(97+i)}`;
              const leafName = `${plant.name} ${ed.name}${A(i)}-${suffix}`;
              const leafPath = `${conGroupPath} > ${leafName}`;
              pushBlock(elemType, leafPath, defAttrs(ed.attrs));
              /* Sub-components */
              const subTpl = ed.subcomponents && SUBCOMPONENTS[ed.subcomponents];
              if (subTpl) {
                subTpl.forEach(sc => {
                  const subType = `${plant.name} ${ed.name} ${sc.name}`;
                  const subPath = sc.parent
                    ? `${leafPath} > ${plant.name} ${ed.name} ${sc.parent}${A(0)} > ${subType}${A(0)}`
                    : `${leafPath} > ${subType}${A(0)}`;
                  pushBlock(subType, subPath, defAttrs(sc.attrs));
                });
              }
            }
          });
        } else {
          /* plantConsumer (Air, etc.): one consumer element row per selected plant */
          conEls.forEach(ed => {
            const elemType = `${plant.name} ${ed.name}`.trim();
            const leafName = `${plant.name} ${ed.name}${A(0)}-consumer`;
            const leafPath = `${conGroupPath} > ${leafName}`;
            pushBlock(elemType, leafPath, defAttrs(ed.attrs));
          });
        }
      });
    }

    /* Routing rows under a Connections group */
    if (d.routing?.enabled){
      const areaRoutes = net.routing.filter(r=>r.area===a.id);
      if (areaRoutes.length){
        const groupName = `${d.name} Connections`;
        const groupPath = `${areaPath} > ${groupName}${A(0)}`;
        areaRoutes.forEach((r,ri)=>{
          const fr = d.elementTree.find(x=>x.key===r.from);
          const to = d.elementTree.find(x=>x.key===r.to);
          if(!fr||!to) return;
          const elemType = `${areaTag} ${fr.name}  ${to.name}`;
          const leafName = `${elemType}${A(ri)}`;
          const leafPath = `${groupPath} > ${leafName}`;
          rows.push([
            hash(leafPath), hash(leafPath+'_Count'),
            leafPath, elemType, 'Count', '', '', '', '', '', '', String(r.count||1)
          ]);
        });
      }
    }
  });
  return rows;
}

/* 
 *  Build EO Optimization Metadata rows for ONE network
 *  Schema (16 columns):
 *    Element Path | Element Type | Attribute Name | UOM | Var Type
 *    Design Min | Design Max | SIP Min % | SIP Max %
 *    Cost Type | Cost Coef | Annual Cost
 *    PI Tag Base | Service Mode | Design Load % | Default Value
 *  */
function buildOptimRowsForNet(netKey){
  const d = NETWORKS[netKey], net = STATE.nets[netKey];
  if (!d || !net || d.external) return [];
  const rows = [];
  const A = (i)=>String.fromCharCode(65+i);
  const aff = STATE.affiliate || 'System';
  const hours = +getSystemCostRate('Annual Operating Hours') || 8000;
  const isSteam = d.customUI === 'steam';

  net.areas.forEach(a=>{
    const plantName = STATE.plants.find(p=>p.id===a.plantId)?.name || '';
    const areaTag   = a.tag || a.name.slice(0,3).toUpperCase();
    const areaLabel = `${a.name}${a.tag?' ['+a.tag+']':''}`;
    const countsSource = buildCountsSource(a, d, isSteam);

    /* helper: emit one optimisation record for an element instance */
    function pushOptim(ed, elemType, leafPath, i){
      const attrs = ensureAttrSet(a, ed, i);
      const meta  = ensureInstanceMeta(a, ed, i);
      attrs.forEach(at=>{
        const ct = COST_TYPES[at.costType||''] || COST_TYPES[''];
        const rate = at.costCoef!=='' ? +at.costCoef : (ct?.rateAttr ? +getSystemCostRate(ct.rateAttr) : 0);
        const dflt = at.default!==''  ? +at.default  : 0;
        const includeCost = (meta.serviceMode==='in-service'||meta.serviceMode==='maintenance');
        const annualCost = (includeCost && rate && dflt) ? rate * dflt * hours : '';
        const ctName = (at.costType && COST_TYPES[at.costType]) ? COST_TYPES[at.costType].name : (at.costType || '');
        rows.push([
          leafPath, elemType, at.name||'', at.uom||'',
          at.varType||'CV',
          at.designMin||'', at.designMax||'',
          at.sipMin||'',    at.sipMax||'',
          ctName,
          at.costCoef!=='' ? at.costCoef : (rate||''),
          annualCost===''?'':annualCost.toFixed(2),
          meta.piTagBase||'',
          meta.serviceMode||'in-service',
          meta.designLoad||'',
          at.default||'',  /* NOR  Normal Operating */
          at.design||'',   /* DSN  Design basis     */
          at.rated||''     /* RTD  Rated / Max      */
        ]);
      });
    }

    Object.entries(countsSource).forEach(([ek,v])=>{
      if(+v<=0) return;
      const ed = d.elementTree.find(x=>x.key===ek); if(!ed) return;
      for (let i=0; i<v; i++){
        let elemType, leafName, suffix;
        if (isSteam) {
          const info = getSteamInstanceInfo(a, ek, i);
          const prefix = info.hdrShort ? `${info.hdrShort} ` : '';
          elemType = `${areaTag} ${prefix}${ed.name}`.trim();
          suffix = info.suffix;
          leafName = `${elemType}${A(i)}-${suffix}`;
        } else {
          elemType = `${areaTag} ${ed.name}`.trim();
          suffix = `${ed.name.toLowerCase()} ${String.fromCharCode(97 + i)}`;
          leafName = `${elemType}${A(i)}-${suffix}`;
        }
        const grp = d.groups?.[ed.group];
        const groupName = grp?.name || (ed.role?`${d.name} ${ed.role}s`:`${d.name} Equipment`);
        const leafPath = `${aff} > ${d.name} > ${plantName||a.name} > ${areaLabel}A > ${groupName}A > ${leafName}`;
        pushOptim(ed, elemType, leafPath, i);
      }
    });

    /* Plant-based consumer optimisation rows */
    if (d.key === 'fuel_network' || d.plantConsumer) {
      const fp = a.fuelPlants || {};
      const fe = a.fuelEquip  || {};
      const conEls = d.elementTree.filter(e => e.group === 'con');
      const grpDef = d.groups?.['con'];
      const conGroupName = grpDef?.name || `${d.name} Consumers`;

      Object.keys(fp).forEach(pid => {
        if (!fp[pid]) return;
        const plant = STATE.plants.find(p => p.id === pid);
        if (!plant) return;

        if (d.key === 'fuel_network') {
          const pe = fe[pid] || {};
          conEls.forEach(ed => {
            const cnt = +pe[ed.key] || 0;
            if (cnt <= 0) return;
            for (let i = 0; i < cnt; i++) {
              const elemType = `${plant.name} ${ed.name}`.trim();
              const suffix   = `${ed.name.toLowerCase().replace(/\s+/g,'_')}_${String.fromCharCode(97+i)}`;
              const leafName = `${plant.name} ${ed.name}${A(i)}-${suffix}`;
              const leafPath = `${aff} > ${d.name} > ${plantName||a.name} > ${areaLabel}A > ${conGroupName}A > ${leafName}`;
              pushOptim(ed, elemType, leafPath, i);
            }
          });
        } else {
          conEls.forEach(ed => {
            const elemType = `${plant.name} ${ed.name}`.trim();
            const leafName = `${plant.name} ${ed.name}${A(0)}-consumer`;
            const leafPath = `${aff} > ${d.name} > ${plantName||a.name} > ${areaLabel}A > ${conGroupName}A > ${leafName}`;
            pushOptim(ed, elemType, leafPath, 0);
          });
        }
      });
    }
  });
  return rows;
}

/* 
 *  Export  comprehensive workbook covering all Energy Network data
 *  */
function exportXlsx(){
  /* Check XLSX library availability */
  if (typeof XLSX === 'undefined') {
    toast('XLSX library not loaded. Check your internet connection and try again.', 'warn');
    alert('Export failed: The XLSX library could not be loaded.\n\nPlease ensure you have an internet connection (needed to load the library), then refresh the page and try again.');
    return;
  }
  try {
  _doExportXlsx();
  } catch(err) {
    console.error('Export XLSX error:', err);
    toast('Export failed  see browser console for details', 'error');
    alert('Export XLSX failed:\n\n' + (err.message || String(err)));
  }
}
function _doExportXlsx(){
  /* 
   *  MULTI-SHEET EXPORT
   *    Sheet 1 : "System Config"    affiliate, plants, cost rates
   *    Sheet 2 : "Network Config"   network summary + assignments overview
   *    Sheet 3+ : one per network   plant assignments + element attributes
   *  */
  const _clean = v => {
    if (v === null || v === undefined) return '';
    const s = (typeof v === 'string') ? v : String(v);
    return s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
  };
  const _row = arr => arr.map(_clean);

  if (!STATE.affiliate && !(STATE.plants||[]).length) {
    toast('Nothing to export  complete Case Setup first', 'warn');
    return;
  }

  const wb       = XLSX.utils.book_new();
  const sysLabel = STATE.affiliate || 'Energy Network';
  const hours    = +getSystemCostRate('Annual Operating Hours') || 8000;
  const A        = i => String.fromCharCode(65 + i);
  const now      = new Date().toLocaleString();

  /*  Helper: add a sheet to the workbook  */
  function addSheet(rows, colWidths, merges, name) {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    if (colWidths) ws['!cols'] = colWidths;
    if (merges)    ws['!merges'] = merges;
    /* Excel sheet names: max 31 chars, strip forbidden chars */
    const safeName = name.replace(/[:\\\/\?\*\[\]]/g,'').slice(0,31);
    XLSX.utils.book_append_sheet(wb, ws, safeName);
  }

  /*  Helper: emit attribute rows for one element instance  */
  function pushRows(rows, netKey, areaLabel, groupName, elemType, instIdx, ed, a) {
    const d        = NETWORKS[netKey];
    const attrs    = ensureAttrSet(a, ed, instIdx);
    const meta     = ensureInstanceMeta(a, ed, instIdx);
    const aff      = STATE.affiliate || 'System';
    const leafPath = `${aff} > ${d.name} > ${areaLabel} > ${groupName} > ${elemType}${A(instIdx)}`;
    attrs.forEach(at => {
      const ct         = COST_TYPES[at.costType||''] || COST_TYPES[''];
      const rate       = at.costCoef !== '' ? +at.costCoef : (ct?.rateAttr ? +getSystemCostRate(ct.rateAttr) : 0);
      const dflt       = at.default  !== '' ? +at.default  : 0;
      const inclCost   = (meta.serviceMode === 'in-service' || meta.serviceMode === 'maintenance');
      const annualCost = (inclCost && rate && dflt) ? (rate * dflt * hours).toFixed(2) : '';
      const ctName     = (at.costType && COST_TYPES[at.costType]) ? COST_TYPES[at.costType].name : (at.costType || '');
      rows.push(_row([
        areaLabel, groupName, elemType, leafPath, instIdx + 1,
        at.name    || '',
        at.uom     || '',
        at.default || '',
        at.design  || '',
        at.rated   || '',
        at.varType || 'CV',
        ctName,
        at.costCoef !== '' ? at.costCoef : (rate || ''),
        annualCost,
        meta.piTagBase   || '',
        meta.serviceMode || 'in-service',
        meta.designLoad  || '',
        at.pi      || '',
        at.flagSip ? '1' : '',
        at.sipMin  || '',
        at.sipMax  || '',
        at.formula || '',
      ]));
    });
    /* Electric driver count row */
    if (ed.electricDriver) {
      const drvCount = +(a.elDrivers?.[ed.key] || 0);
      rows.push(_row([
        areaLabel, groupName, elemType, leafPath, instIdx + 1,
        'Electric Drivers / Unit', 'count',
        drvCount || '', '', '', 'CV', '', '', '',
        meta.piTagBase || '', meta.serviceMode || 'in-service', meta.designLoad || '',
        '', '', '', '', '',
      ]));
    }
  }

  /*  Shared column configs  */
  const ATTR_COLS = [
    {wch:28}, /* Plant / Area     */
    {wch:24}, /* Group            */
    {wch:30}, /* Element Type     */
    {wch:68}, /* Element Path     */
    {wch: 7}, /* Inst #           */
    {wch:30}, /* Attribute Name   */
    {wch:14}, /* UOM              */
    {wch:18}, /* NOR              */
    {wch:18}, /* DSN              */
    {wch:18}, /* RTD              */
    {wch:12}, /* Var Type         */
    {wch:20}, /* Cost Type        */
    {wch:16}, /* Cost Coef        */
    {wch:16}, /* Annual Cost      */
    {wch:26}, /* PI Tag Base      */
    {wch:16}, /* Service Mode     */
    {wch:14}, /* Design Load %    */
    {wch:28}, /* PI Sensors       */
    {wch:10}, /* flag_sip         */
    {wch:12}, /* SIP Min %        */
    {wch:12}, /* SIP Max %        */
    {wch:20}, /* Formula          */
  ];
  const ATTR_HDR = [
    'Plant / Area', 'Group', 'Element Type', 'Element Path', 'Inst #',
    'Attribute Name', 'UOM',
    'Default Value (NOR)', 'Design Value (DSN)', 'Rated Value (RTD)',
    'Var Type', 'Cost Type', 'Cost Coef ($/unit)', 'Annual Cost ($/yr)',
    'PI Tag Base', 'Service Mode', 'Design Load %',
    'PI Sensors', 'flag_sip', 'SIP Min %', 'SIP Max %', 'Formula',
  ];

  /* 
   *  SHEET 1  System Config
   *  */
  {
    const rows = [];
    rows.push(['PLANT NETWORK STUDIO  SYSTEM CONFIGURATION']);
    rows.push([`Exported: ${now}`]);
    rows.push([]);
    rows.push(['Affiliate:', sysLabel, '', 'Region:', STATE.region || '']);
    rows.push([]);

    rows.push(['PLANTS', `Total: ${(STATE.plants||[]).length}`]);
    rows.push(['#', 'Plant Name', 'Plant ID']);
    (STATE.plants||[]).forEach((p, i) => rows.push([i + 1, p.name, p.id]));
    rows.push([]);

    rows.push(['SYSTEM COST RATES & PARAMETERS', '', `Annual Op. Hours: ${hours}`]);
    rows.push(['Parameter', 'Value', 'UOM']);
    (SYSTEM_ATTRS||[]).forEach(attr => {
      /* Only export values the user has explicitly entered  skip hardcoded defaults */
      const userVal = (STATE.costRates||{})[attr.name];
      if (userVal === undefined || userVal === null || userVal === '') return;
      rows.push([attr.name, userVal, attr.uom || '']);
    });

    addSheet(rows,
      [{wch:38}, {wch:30}, {wch:14}, {wch:20}, {wch:28}],
      [{s:{r:0,c:0}, e:{r:0,c:4}}, {s:{r:1,c:0}, e:{r:1,c:4}}],
      'System Config');
  }

  /* 
   *  SHEET 2  Network Config
   *  */
  {
    const rows = [];
    rows.push(['NETWORK CONFIGURATION SUMMARY']);
    rows.push([`Exported: ${now}`]);
    rows.push([]);

    /* Network summary table */
    rows.push(['CONFIGURED NETWORKS']);
    rows.push(['Network', 'Network Key', 'Assigned Plants', 'Total Elements']);
    for (const [k, d] of Object.entries(NETWORKS)) {
      if (d.external) continue;
      const net = STATE.nets[k];
      if (!net) continue;
      const assignedPlants = net.areas.map(a => a.name).join(', ') || '';
      let totEl = 0;
      if (d.customUI === 'steam') {
        totEl = net.areas.reduce((s, a) => s + steamAreaTotal(a), 0);
      } else if (d.customUI === 'power') {
        totEl = net.areas.reduce((s, a) => s + (a.powerConsumers||[]).reduce((x,c) => x+(+c.count||0), 0), 0);
      } else {
        net.areas.forEach(a => {
          totEl += getAreaTotalPlaced(a, d);
          if (d.key === 'fuel_network' || d.plantConsumer) {
            const fp = a.fuelPlants || {};
            const fe = a.fuelEquip  || {};
            if (d.key === 'fuel_network') {
              Object.keys(fp).forEach(pid => {
                if (!fp[pid]) return;
                Object.values(fe[pid]||{}).forEach(c => { totEl += +c||0; });
              });
            } else {
              totEl += Object.values(fp).filter(Boolean).length;
            }
          }
        });
      }
      rows.push([d.name, k, assignedPlants, totEl || '']);
    }

    addSheet(rows,
      [{wch:30}, {wch:12}, {wch:30}, {wch:16}],
      [{s:{r:0,c:0}, e:{r:0,c:3}}, {s:{r:1,c:0}, e:{r:1,c:3}}],
      'Network Config');
  }

  /* 
   *  SHEETS 3+  Two sheets per configured network:
   *    [Network] - Assignments   plant assignment summary
   *    [Network] - Attributes    element attributes & EO data
   *  */

  /* Helper: build safe sheet name with suffix, max 31 chars */
  function netSheet(name, suffix) {
    const max = 31 - suffix.length;
    return name.replace(/[:\\\/\?\*\[\]]/g,'').slice(0, max).trim() + suffix;
  }

  /* Shared plant-assignments builder  returns the rows array */
  function buildAssignRows(k, d, net) {
    const isSteam = d.customUI === 'steam';
    const rows = [];
    rows.push([d.name.toUpperCase() + '  PLANT ASSIGNMENTS']);
    rows.push([`${sysLabel}   |   Exported: ${now}`]);
    rows.push([]);
    rows.push(['Plant (Area)', 'Group', 'Element Type', 'Count / Assignment', 'Element Path']);
    net.areas.forEach(a => {
      const areaLabel = `${a.name}${a.tag ? ' ['+a.tag+']' : ''}`;
      if (isSteam) {
        const s = ensureSteam(a);
        STEAM_GEN.forEach(tg => {
          let c = 0; STEAM_HEADERS.forEach(h => c += (s.gen[h.key]?.[tg.key] || 0));
          if (c > 0) rows.push([areaLabel, 'Generators', tg.name, c,
            `${sysLabel} > ${d.name} > ${areaLabel} > Generators > ${tg.name}`]);
        });
        STEAM_CON.forEach(tc => {
          let c = 0; STEAM_HEADERS.forEach(h => c += (s.con[h.key]?.[tc.key] || 0));
          if (c > 0) rows.push([areaLabel, 'Consumers', tc.name, c,
            `${sysLabel} > ${d.name} > ${areaLabel} > Consumers > ${tc.name}`]);
        });
        STEAM_TURBINE.forEach(tt => {
          let c = 0;
          STEAM_HEADERS.forEach(h => {
            Object.entries(s.tbn[h.key]||{}).forEach(([rk, cnt]) => {
              if (trbParse(rk).typeKey === tt.key) c += cnt;
            });
          });
          if (c > 0) rows.push([areaLabel, 'Turbines', tt.name, c,
            `${sysLabel} > ${d.name} > ${areaLabel} > Turbines > ${tt.name}`]);
        });
      } else if (d.customUI === 'power') {
        (a.powerConsumers||[]).forEach(c => {
          if (!c.name || !(+c.count > 0)) return;
          rows.push([areaLabel, 'Power Consumers', c.name, +c.count,
            `${sysLabel} > ${d.name} > ${areaLabel} > Power Consumers > ${c.name}`]);
        });
      } else {
        Object.entries(a.counts||{}).forEach(([ek, v]) => {
          if (+v <= 0) return;
          const ed = d.elementTree.find(x=>x.key===ek);
          if (!ed) return;
          const grp = d.groups?.[ed.group];
          rows.push([areaLabel, grp?.name || ed.group, ed.name, +v,
            `${sysLabel} > ${d.name} > ${areaLabel} > ${grp?.name || ed.group} > ${ed.name}`]);
        });
        if (d.key === 'fuel_network' || d.plantConsumer) {
          const fp = a.fuelPlants || {};
          const fe = a.fuelEquip  || {};
          const grpDef = d.groups?.['con'];
          const conEls = d.elementTree.filter(e => e.group === 'con');
          Object.keys(fp).forEach(pid => {
            if (!fp[pid]) return;
            const plant = STATE.plants.find(p => p.id === pid);
            if (!plant) return;
            if (d.key === 'fuel_network') {
              const pe = fe[pid] || {};
              conEls.forEach(ed => {
                const cnt = +pe[ed.key] || 0;
                if (cnt > 0) rows.push([areaLabel, grpDef?.name || 'Consumers',
                  `${plant.name}  ${ed.name}`, cnt,
                  `${sysLabel} > ${d.name} > ${areaLabel} > ${grpDef?.name || 'Consumers'} > ${plant.name}  ${ed.name}`]);
              });
            } else {
              rows.push([areaLabel, grpDef?.name || 'Consumers', plant.name, 'Selected',
                `${sysLabel} > ${d.name} > ${areaLabel} > ${grpDef?.name || 'Consumers'} > ${plant.name}`]);
            }
          });
        }
      }
    });
    return rows;
  }

  const ASGN_COLS = [
    {wch:28}, /* Plant / Area   */
    {wch:26}, /* Group          */
    {wch:32}, /* Element Type   */
    {wch:20}, /* Count          */
    {wch:68}, /* Element Path   */
  ];

  let totalAttrRows = 0;
  for (const [k, d] of Object.entries(NETWORKS)) {
    if (d.external) continue;
    const net = STATE.nets[k];
    if (!net || !net.areas.length) continue;
    const isSteam = d.customUI === 'steam';

    /*  Sheet A : Plant Assignments  */
    const asgnRows = buildAssignRows(k, d, net);
    addSheet(asgnRows, ASGN_COLS,
      [{s:{r:0,c:0}, e:{r:0,c:4}}, {s:{r:1,c:0}, e:{r:1,c:4}}],
      netSheet(d.name, ' - Assignments'));

    /*  Sheet B : Element Attributes  */
    const attrRows = [];
    attrRows.push([d.name.toUpperCase() + '  ELEMENT ATTRIBUTES & EO OPTIMIZATION DATA',
      '', '', '', '', '', '', '', '', '', '', '', '', '', `Annual Op. Hours: ${hours}`]);
    attrRows.push([`${sysLabel}   |   Exported: ${now}`]);
    attrRows.push([]);
    attrRows.push(ATTR_HDR);

    const attrStart = attrRows.length;
    net.areas.forEach(a => {
      const areaTag      = a.tag || a.name.slice(0, 3).toUpperCase();
      const areaLabel    = `${a.name}${a.tag ? ' ['+a.tag+']' : ''}`;
      const countsSource = buildCountsSource(a, d, isSteam);

      Object.entries(countsSource).forEach(([ek, v]) => {
        if (+v <= 0) return;
        const ed = d.elementTree.find(x => x.key === ek);
        if (!ed) return;
        const grp       = d.groups?.[ed.group];
        const groupName = grp?.name || (ed.role ? `${d.name} ${ed.role}s` : `${d.name} Equipment`);
        for (let i = 0; i < +v; i++) {
          let elemType;
          if (isSteam) {
            const info   = getSteamInstanceInfo(a, ek, i);
            const prefix = info.hdrShort ? `${info.hdrShort} ` : '';
            elemType = `${areaTag} ${prefix}${ed.name}`.trim();
          } else {
            elemType = `${areaTag} ${ed.name}`.trim();
          }
          pushRows(attrRows, k, areaLabel, groupName, elemType, i, ed, a);
        }
      });

      if (d.key === 'fuel_network' || d.plantConsumer) {
        const fp         = a.fuelPlants || {};
        const fe         = a.fuelEquip  || {};
        const conEls     = d.elementTree.filter(e => e.group === 'con');
        const grpDef     = d.groups?.['con'];
        const conGrpName = grpDef?.name || `${d.name} Consumers`;
        Object.keys(fp).forEach(pid => {
          if (!fp[pid]) return;
          const plant = STATE.plants.find(p => p.id === pid);
          if (!plant) return;
          if (d.key === 'fuel_network') {
            const pe = fe[pid] || {};
            conEls.forEach(ed => {
              const cnt = +pe[ed.key] || 0;
              if (cnt <= 0) return;
              for (let i = 0; i < cnt; i++) {
                pushRows(attrRows, k, areaLabel, conGrpName, `${plant.name} ${ed.name}`.trim(), i, ed, a);
              }
            });
          } else {
            conEls.forEach(ed => {
              pushRows(attrRows, k, areaLabel, conGrpName, `${plant.name} ${ed.name}`.trim(), 0, ed, a);
            });
          }
        });
      }
    });

    totalAttrRows += attrRows.length - attrStart;

    addSheet(attrRows, ATTR_COLS,
      [{s:{r:0,c:0}, e:{r:0,c:21}}, {s:{r:1,c:0}, e:{r:1,c:21}}],
      netSheet(d.name, ' - Attributes'));
  }

  /* 
   *  STATUS TAGS SHEET
   *  One row per equipment instance  maps its logical status tag name to
   *  either a PI sensor tag (DCS-published 0/1) or a resolved formula.
   *  Two-column layout matching STATUS-TAGS.xlsx:
   *    Logical Tag Name  |  PI Tag / Formula
   *  */
  {
    const statusInv = buildEquipmentInventory();
    /* Ensure every instance has a status entry (in case the user skipped
       the Inventory pane before exporting). */
    statusInv.forEach(it => { ensureStatusEntry(it); });
    saveState();

    const stRows = [];
    stRows.push(['PLANT NETWORK STUDIO  STATUS TAGS']);
    stRows.push([`Exported: ${now}`, `Total instances: ${statusInv.length}`]);
    stRows.push([]);
    stRows.push(['Logical Tag Name', 'PI Tag / Formula']);

    statusInv.forEach(it => {
      const e      = STATE.equipmentStatus[it.instanceId] || {};
      const logTag = makeLogicalTagName(it, 'Status');
      let   value  = '';
      if (e.dataSource === 'pi_sensor') {
        value = e.piTag || '';
      } else {
        /* calculate  expand [Attr] tokens to resolved PI tags */
        const exp = expandFormulaForInstance(e.formula || '1', it);
        value = 'if( ' + exp + ' , 1, 0 )';
      }
      stRows.push(_row([logTag, value]));
    });

    addSheet(stRows,
      [{wch:58}, {wch:90}],
      [{s:{r:0,c:0}, e:{r:0,c:1}}, {s:{r:1,c:0}, e:{r:1,c:1}}],
      'Status Tags');
  }

  /* 
   *  PYTHON ENGINE MAPPINGS SHEET
   *  One comprehensive row per mapped PI tag across:
   *    - Equipment Attributes (per network element instance)
   *    - System / Master KPIs
   *    - SEU KPIs
   *  Designed for direct consumption by the boiler Python engine.
   *  Columns: Type | Plant | Network | Group | Element | Instance |
   *           Attribute/KPI Name | Unique Identifier | Element Path |
   *           Mapped PI Tag | Data Source | Formula | UOM | Design | Min | Max | Default
   *  */
  {
    const pyInv = buildEquipmentInventory();
    const pyRows = [];
    pyRows.push(['PLANT NETWORK STUDIO  PYTHON ENGINE MAPPINGS']);
    pyRows.push([`Exported: ${now}`]);
    pyRows.push([`Affiliate: ${STATE.affiliate||''} | Region: ${STATE.region||''}`]);
    pyRows.push([]);
    pyRows.push([
      'Type', 'Plant', 'Network', 'Group', 'Element', 'Instance Label',
      'Attribute / KPI Name', 'Unique Identifier', 'Element Path',
      'Mapped PI Tag', 'Data Source', 'Formula', 'UOM',
      'Design Data', 'Min', 'Max', 'Default'
    ]);

    /* --- Section 1: Equipment Attribute PI Tags --- */
    pyInv.forEach(it => {
      const eqStatus = STATE.equipmentStatus?.[it.instanceId] || {};
      const attrTags = eqStatus.attrTags || {};
      (it.attrs || []).forEach(attr => {
        const uid = [it.netKey, it.plantId, it.elemKey, it.index, attr.name]
          .join('__').replace(/\s+/g, '_');
        const elemPath = [it.plantName, it.netName, it.groupLabel || it.elemName, it.instLabel]
          .filter(Boolean).join(' > ');
        let piTag = attrTags[attr.name] || '';
        if (!piTag && it.piTagBase) {
          piTag = it.piTagBase + '.' + makePITagSuffix(attr.name);
        }
        pyRows.push(_row([
          'Equipment Attribute',
          it.plantName, it.netName,
          it.groupLabel || it.elemName, it.elemName, it.instLabel,
          attr.name, uid, elemPath, piTag,
          piTag ? 'PI Tag' : '', '',
          attr.uom || '', attr.designData || '',
          attr.min || '', attr.max || '', attr.defaultVal || ''
        ]));
      });
    });

    /* --- Section 2: System / Master KPIs --- */
    pyRows.push([]);
    pyRows.push(['--- SYSTEM KPIs ---']);
    KPI_MASTER.forEach(kpi => {
      const c = STATE._kpiConfig?.[kpi.id] || {};
      let piTag = '', formula = '', uom = '', design = '', min = '', max = '', def = '', ds = c.dataSource || '';
      if (c.dataSource === 'pi_sensor' && c.piSensor) {
        piTag = c.piSensor.selectedTag || '';
        const p = c.piSensor.props || {};
        uom = p.uom||''; design = p.designData||''; min = p.min||''; max = p.max||''; def = p.defaultVal||'';
      } else if (c.dataSource === 'calculate' && c.calcCfg) {
        const incl = Object.entries(c.calcCfg).filter(([,v]) => v.included);
        piTag = incl.map(([k]) => k).join('; ');
        formula = 'Aggregated from: ' + piTag;
        if (incl.length) { const [,pv] = incl[0]; uom=pv.uom||''; design=pv.designData||''; min=pv.min||''; max=pv.max||''; def=pv.defaultVal||''; }
      } else if (c.dataSource === 'soft_sensor' && c.ssCfg) {
        const m = c.ssCfg.model || {};
        formula = `Soft Sensor: ${m.type||''} ${m.name||''}`.trim();
      }
      const uid = 'SYSTEM_KPI__' + kpi.id;
      const elemPath = 'System > ' + (kpi.category||'') + ' > ' + kpi.name;
      pyRows.push(_row([
        'System KPI', '', '', kpi.category||'', '', '', kpi.name,
        uid, elemPath, piTag, ds, formula, uom, design, min, max, def
      ]));

      // Export System KPI custom attributes
      if (c.dataSource === 'calculate' && c.calcCfg && c.calcCfg.customAttrs) {
        c.calcCfg.customAttrs.forEach((ca, ci) => {
          if (!ca.selected || !ca.piTag) return;
          const attrUid = [uid, (ca.name || ('attr' + ci)).replace(/\s+/g, '_')].join('__');
          pyRows.push(_row([
            'System KPI Attribute', '', '', kpi.category||'', '', '',
            kpi.name + ' - ' + (ca.name || ('Attribute '+(ci+1))),
            attrUid,
            elemPath + ' > ' + (ca.name || ('Attribute '+(ci+1))),
            ca.piTag || '',
            'PI Tag',
            '', // formula is empty
            ca.uom || '', ca.designData || '', ca.min || '', ca.max || '', ca.defaultVal || ''
          ]));
        });
      }
    });

    /* --- Section 3: SEU KPIs --- */
    const seuKeys = Object.keys(STATE._seuConfig || {}).filter(k => STATE._seuConfig[k]?.selected);
    if (seuKeys.length) {
      pyRows.push([]);
      pyRows.push(['--- SEU (Significant Energy User) KPIs ---']);
      pyInv.forEach(it => {
        const seu = STATE._seuConfig?.[it.instanceId];
        if (!seu || !seu.selected) return;
        (seu.kpis || []).forEach((kpi, ki) => {
          const uid = ['SEU', it.netKey, it.plantId, it.elemKey, it.index,
            (kpi.name||('kpi'+ki)).replace(/\s+/g,'_')].join('__');
          const elemPath = [it.plantName, it.netName, it.groupLabel||it.elemName, it.instLabel]
            .filter(Boolean).join(' > ');
          const attrStr = (kpi.customAttrs||[]).map(a => a.name + (a.piTag?'='+a.piTag:'')).join('; ');
          
          // Export the KPI itself
          pyRows.push(_row([
            'SEU KPI',
            it.plantName, it.netName, it.groupLabel||it.elemName, it.elemName, it.instLabel,
            kpi.name || ('KPI '+(ki+1)), uid, elemPath,
            kpi.piTag || attrStr, kpi.dataSource||'', kpi.formula||'',
            kpi.uom||'', kpi.designData||'', kpi.min||'', kpi.max||'', kpi.defaultVal||''
          ]));

          // Export each active custom attribute as its own row
          const activeAttrs = (kpi.customAttrs || []).filter(a => a.selected && a.piTag);
          activeAttrs.forEach((ca, ci) => {
            const attrUid = [uid, (ca.name || ('attr' + ci)).replace(/\s+/g, '_')].join('__');
            pyRows.push(_row([
              'SEU KPI Attribute',
              it.plantName, it.netName, it.groupLabel||it.elemName, it.elemName, it.instLabel,
              (kpi.name || ('KPI '+(ki+1))) + ' - ' + (ca.name || ('Attribute '+(ci+1))),
              attrUid,
              elemPath + ' > ' + (ca.name || ('Attribute '+(ci+1))),
              ca.piTag || '',
              'PI Tag',
              '', // formula is empty
              ca.uom || '', ca.designData || '', ca.min || '', ca.max || '', ca.defaultVal || ''
            ]));
          });
        });
      });
    }

    /* --- Section 4: Plant Production KPIs --- */
    const ppKeys = Object.keys(STATE._plantProdConfig || {}).filter(k => STATE._plantProdConfig[k]?.selected);
    if (ppKeys.length) {
      pyRows.push([]);
      pyRows.push(['--- PLANT PRODUCTION KPIs ---']);
      STATE.plants.forEach(p => {
        const pc = STATE._plantProdConfig?.[p.id];
        if (!pc || !pc.selected) return;
        const kpiName = pc.kpiId || (p.name + ' Production');
        const uid = 'PLANT_PROD__' + p.id;
        const elemPath = 'Plant Production > ' + p.name;
        const attrStr = (pc.customAttrs||[]).map(a => a.name + (a.piTag?'='+a.piTag:'')).join('; ');

        pyRows.push(_row([
          'Plant Production KPI',
          p.name, '', 'Plant Production', '', '',
          kpiName, uid, elemPath,
          pc.piTag || attrStr, pc.dataSource||'', pc.formula||'',
          pc.uom||'', pc.designData||'', pc.min||'', pc.max||'', pc.defaultVal||''
        ]));

        const activeAttrs = (pc.customAttrs || []).filter(a => a.selected && a.piTag);
        activeAttrs.forEach((ca, ci) => {
          const attrUid = [uid, (ca.name || ('attr' + ci)).replace(/\s+/g, '_')].join('__');
          pyRows.push(_row([
            'Plant Production KPI Attribute',
            p.name, '', 'Plant Production', '', '',
            kpiName + ' - ' + (ca.name || ('Attribute '+(ci+1))),
            attrUid,
            elemPath + ' > ' + (ca.name || ('Attribute '+(ci+1))),
            ca.piTag || '',
            'PI Tag',
            '', // formula is empty
            ca.uom || '', ca.designData || '', ca.min || '', ca.max || '', ca.defaultVal || ''
          ]));
        });
      });
    }

    /* --- Section 5: Boiler Calculations (Dynamic PI Tag Substitution) --- */
    const boilerRows = [];
    boilerRows.push(['BOILER CALCULATIONS (PI Tag Substituted)']);
    boilerRows.push([`Exported: ${now}`]);
    boilerRows.push([]);
    
    const boilerInsts = pyInv.filter(it => it.elemKey === 'fuel_fired_boiler');
    if (boilerInsts.length > 0) {
      const BOILER_FORMULAS = [
        { name: 'fuel_lhv_mj_per_nm3', formula: 'Sum((mol_pct / total_mol) * LHV) over all fuel components' },
        { name: 'total_energy_supply_gj_h', formula: '{{Fuel Flow (Nm3/h)}} * {{fuel_lhv_mj_per_nm3}} * 1.0e-3' },
        { name: 'useful_heat_gj_h', formula: '({{Steam Flow (t/h)}} * 1000.0) * (steam_enthalpy({{Steam Pressure (bar)}}, {{Steam Temperature (°C)}}) - steam_enthalpy(max({{Steam Pressure (bar)}}, 1.0), {{Feedwater Temperature (°C)}})) / 1.0e6' },
        { name: 'direct_efficiency_pct', formula: 'safe_div({{useful_heat_gj_h}}, {{total_energy_supply_gj_h}}) * 100.0' },
        { name: 'stack_loss_pct', formula: 'If valid({{Stack Temperature (°C)}}, {{Flue O2 (%)}}, {{Ambient Temperature (°C)}}) Then safe_div(sensible_heat_kj_kmol_fuel, lhv_kj_kmol_fuel) * 100.0 Else NaN' },
        { name: 'excess_air_pct', formula: 'If valid({{Stack Temperature (°C)}}, {{Flue O2 (%)}}, {{Ambient Temperature (°C)}}) Then safe_div({{Flue O2 (%)}}, 21.0 - {{Flue O2 (%)}}) * 100.0 Else NaN' },
        { name: 'indirect_efficiency_pct', formula: '100.0 - {{stack_loss_pct}} - {{Radiation Loss (%)}}' },
        { name: 'boiler_efficiency_pct', formula: 'If use_direct_efficiency == 1.0 Then {{direct_efficiency_pct}} Else {{indirect_efficiency_pct}}' },
        { name: 'radiation_loss_pct', formula: '{{Radiation Loss (%)}}' },
        { name: 'cbd_pct', formula: 'safe_div({{Blowdown Flow (m3/h)}}, {{Feedwater Flow (t/h)}}) * 100.0' },
        { name: 'steam_to_fuel_ratio', formula: 'safe_div({{Steam Flow (t/h)}} * 1000.0, {{Fuel Flow (Nm3/h)}} * 0.78)' },
        { name: 'sec_gj_per_t_steam', formula: 'specific_energy({{total_energy_supply_gj_h}}, {{Steam Flow (t/h)}})' },
        { name: 'co2_t_per_h', formula: '{{total_energy_supply_gj_h}} * co2_emission_factor_kg_per_gj / 1000.0' }
      ];

      boilerRows.push(['Plant', 'Network', 'Boiler Instance', 'Variable_Names', 'Formulas', 'Mapping_Attribute', 'Exclusion_rule', 'index', 'Catch']);
      
      boilerInsts.forEach(it => {
        const eqStatus = STATE.equipmentStatus?.[it.instanceId] || {};
        const attrTags = eqStatus.attrTags || {};
        
        const tagMap = {};
        (it.attrs || []).forEach(attr => {
          let piTag = attrTags[attr.name] || '';
          if (!piTag && it.piTagBase) {
            piTag = it.piTagBase + '.' + makePITagSuffix(attr.name);
          }
          tagMap[attr.name] = piTag ? `[${piTag}]` : `[${attr.name}]`;
        });
        
        BOILER_FORMULAS.forEach((bf, idx) => {
          let resolvedFormula = bf.formula.replace(/\{\{([^}]+)\}\}/g, (match, attrName) => {
            if (tagMap[attrName]) return tagMap[attrName];
            return `[${attrName}]`; 
          });
          
          boilerRows.push(_row([
            it.plantName, it.netName, it.instLabel,
            bf.name, resolvedFormula, '0.0', '0.0', idx + 1, 'NOOUTPUT'
          ]));
        });
        boilerRows.push([]);
      });
      
      addSheet(boilerRows,
        [{wch:14},{wch:16},{wch:20},{wch:26},{wch:90},{wch:16},{wch:14},{wch:8},{wch:10}],
        [{s:{r:0,c:0},e:{r:0,c:8}},{s:{r:1,c:0},e:{r:1,c:8}}],
        'Boiler Calcs');
    }

    addSheet(pyRows,
      [{wch:20},{wch:14},{wch:22},{wch:18},{wch:18},{wch:16},
       {wch:26},{wch:50},{wch:52},{wch:44},
       {wch:16},{wch:36},{wch:10},{wch:12},{wch:10},{wch:10},{wch:10}],
      [{s:{r:0,c:0},e:{r:0,c:16}},{s:{r:1,c:0},e:{r:1,c:16}},{s:{r:2,c:0},e:{r:2,c:16}}],
      'Python Engine Mappings');
  }

  /*  Download  */
  const sheetCount = wb.SheetNames.length;
  const filename   = `plant_network_studio_${new Date().toISOString().slice(0,10)}.xlsx`;
  const wboutB64   = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
  const dataURI    = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + wboutB64;

  const anchor = document.createElement('a');
  anchor.href = dataURI; anchor.download = filename; anchor.style.display = 'none';
  document.body.appendChild(anchor); anchor.click();
  setTimeout(() => document.body.removeChild(anchor), 500);

  toast(` Exported ${sheetCount} sheets (${totalAttrRows} attribute rows)  ${filename}`, 'success');

  /* Fallback button */
  setTimeout(() => {
    const dlBtn = document.createElement('button');
    dlBtn.className = 'btn btn-primary';
    dlBtn.style.cssText = 'position:fixed;bottom:70px;right:20px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.5)';
    dlBtn.innerHTML = ' Click here if file did not download';
    dlBtn.onclick = () => {
      const a2 = document.createElement('a');
      a2.href = dataURI; a2.download = filename;
      document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
      dlBtn.remove();
    };
    document.body.appendChild(dlBtn);
    setTimeout(() => { if (dlBtn.parentNode) dlBtn.remove(); }, 8000);
  }, 1500);
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'plant_network_studio_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('JSON downloaded','success');
}

function downloadStandalone(){
  toast('Preparing standalone file - please wait...', 'info');
  fetch(window.location.href)
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    })
    .then(function(rawHtml){
      _doStandaloneFromSource(rawHtml);
    })
    .catch(function(err){
      console.warn('fetch failed, using outerHTML fallback:', err);
      _doStandaloneFromSource(document.documentElement.outerHTML);
    });
}
function _doStandaloneFromSource(rawHtml){
  try{
    var stateJson = JSON.stringify(STATE);

    var STAG_OPEN  = ['<','s','c','r','i','p','t'].join('');
    var STAG_CLOSE = ['<','/','s','c','r','i','p','t','>'].join('');
    var STAG_ESC   = ['<','\\','/','s','c','r','i','p','t','>'].join('');

    var safeJson = stateJson.split(STAG_CLOSE).join(STAG_ESC);

    var injId    = '__pns_embedded_state__';
    var injOpen  = '<' + STAG_OPEN + ' id="' + injId + '">';
    var injClose = STAG_CLOSE;
    var injected = '\n' + injOpen + '\n' +
      'window.__EMBEDDED_STATE__ = ' + safeJson + ';\n' +
      injClose + '\n';

    var output = rawHtml.replace(/(<head[^>]*>)/i, '$1' + injected);

    var now   = new Date().toISOString();
    var aff   = STATE.affiliate || '';
    var plts  = (STATE.plants||[]).map(function(p){ return p.name; }).join(', ');
    var stamp = '<!-- PLANT NETWORK STUDIO STANDALONE\n' +
      '     Exported  : ' + now  + '\n' +
      '     Affiliate : ' + aff  + '\n' +
      '     Plants    : ' + plts + '\n' +
      '-->\n';
    output = stamp + output;

    var blob = new Blob([output], {type:'text/html;charset=utf-8'});
    var a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = 'plant_network_studio_standalone_' + now.slice(0,10) + '.html';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 500);
    toast('Standalone file downloaded! Share it - anyone who opens it will see your exact config.', 'success');
  } catch(err){
    console.error('Standalone export error:', err);
    toast('Export failed: ' + err.message, 'error');
  }
}
function importJSON(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const loaded = JSON.parse(evt.target.result);
        if (loaded && loaded.nets && loaded.activeNet) {
          Object.assign(STATE, loaded);
          saveState();
          render();
          toast('JSON state loaded successfully!','success');
        } else {
          toast('Invalid JSON file structure','error');
        }
      } catch(err) {
        toast('Failed to parse JSON file','error');
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}

/* ============================================================================
 *  UTILITIES
 * ============================================================================ */
function emptyState(ic,tt,st){ const e=el('div','empty'); e.innerHTML=`<div class="e-ic">${ic}</div><div class="e-tt">${tt}</div><div class="e-st">${st}</div>`; return e; }
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escAttr(s){ return String(s??'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function getActiveWorkflow() {
  /* Guard: if saved activeTab is no longer in WORKFLOW, reset to 'sysconfig' */
  const ids = WORKFLOW.map(w => w.id);
  if (!ids.includes(STATE.activeTab)) STATE.activeTab = 'sysconfig';
  return WORKFLOW;
}
function nextTab(){
  /*  Gate: System Config  validate all three sections  */
  if (STATE.activeTab === 'sysconfig'){
    /* Section A: Case Setup */
    if (!STATE.affiliate && !(STATE.plants||[]).length){
      toast('Complete Section A  add at least one plant in Case Setup','warn'); return;
    }
    /* Section B: Ensure networks are initialized (Model Selection was merged into Network Config) */
    if (!STATE.selectedNetworks || !STATE.selectedNetworks.length){
      STATE.selectedNetworks = Object.keys(NETWORKS).filter(k=>!NETWORKS[k].external);
    }
    /* Section C: Network Config  at least one network configured via modal */
    const anyConfigured = Object.values(STATE.nets || {}).some(n =>
      (n.areas && n.areas.length > 0) || (n.counts && Object.keys(n.counts).length > 0)
    );
    if (!anyConfigured){
      toast('Complete Section C  configure at least one network before proceeding','warn'); return;
    }
    STATE.setupComplete   = true;
    STATE.modelComplete   = true;
    STATE.networkComplete = true;
    toast('System Config complete  proceeding to Review', 'success');
  }
  saveState();
  const wf = getActiveWorkflow();
  const i = wf.findIndex(w=>w.id===STATE.activeTab);
  if(i > -1 && i < wf.length-1){ STATE.activeTab=wf[i+1].id; render(); }
}
function prevTab(){ 
  const wf = getActiveWorkflow();
  const i = wf.findIndex(w=>w.id===STATE.activeTab); 
  if(i > 0){ STATE.activeTab=wf[i-1].id; render(); } 
}

/* ============================================================================
 *  THEME TOGGLE  dark (default) / light
 * ============================================================================ */
function toggleTheme(){
  const isLight = document.body.dataset.theme === 'light';
  const next = isLight ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem('pns_theme', next); } catch(e){}
}
function applyTheme(t){
  if (t === 'light'){
    document.body.dataset.theme = 'light';
    const btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = '';
    if (btn) btn.title = 'Switch to dark mode';
  } else {
    delete document.body.dataset.theme;
    const btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = '';
    if (btn) btn.title = 'Switch to light mode';
  }
}
(function initTheme(){
  let saved = 'dark';
  try { saved = localStorage.getItem('pns_theme') || 'dark'; } catch(e){}
  applyTheme(saved);
})();

/* ============================================================================
 *  MIGRATION FOR STEAM EXCHANGERS (REPLACING COOLANT WITH STEAM)
 * ============================================================================ */
function migrateStateSteamExchangers() {
  let modified = false;

  // 1. Migrate STATE._masterKpis['steam_exchanger']
  if (STATE && STATE._masterKpis && STATE._masterKpis['steam_exchanger']) {
    const shxKpis = STATE._masterKpis['steam_exchanger'];
    if (Array.isArray(shxKpis)) {
      shxKpis.forEach(k => {
        if (k.name === 'Duty Coolant-side (GJ/h)') {
          k.name = 'Duty Steam-side (GJ/h)';
          k.isStandard = true;
          modified = true;
        } else if (k.name === 'Coolant ΔT (°C)') {
          k.name = 'Steam ΔT (°C)';
          k.isStandard = true;
          modified = true;
        }
      });
      // De-duplicate if needed
      const seen = new Set();
      const unique = [];
      shxKpis.forEach(k => {
        if (k.name && !seen.has(k.name)) {
          seen.add(k.name);
          unique.push(k);
        } else {
          modified = true;
        }
      });
      STATE._masterKpis['steam_exchanger'] = unique;
    }
  }

  // 2. Migrate STATE._seuConfig for steam_exchanger instances
  if (STATE && STATE._seuConfig && typeof STATE._seuConfig === 'object') {
    Object.keys(STATE._seuConfig).forEach(instId => {
      const seu = STATE._seuConfig[instId];
      // Check if this SEU is a steam_exchanger
      if (instId.includes('::steam_exchanger::') && seu && Array.isArray(seu.kpis)) {
        seu.kpis.forEach(k => {
          if (k.name) {
            let replaced = false;
            if (k.name.endsWith(' - Duty Coolant-side (GJ/h)')) {
              k.name = k.name.replace(' - Duty Coolant-side (GJ/h)', ' - Duty Steam-side (GJ/h)');
              replaced = true;
            } else if (k.name.endsWith(' - Coolant ΔT (°C)')) {
              k.name = k.name.replace(' - Coolant ΔT (°C)', ' - Steam ΔT (°C)');
              replaced = true;
            }
            if (replaced) {
              modified = true;
              // Re-populate customAttrs for this migrated KPI
              k.customAttrs = getEquipRequiredAttrs('steam_exchanger', k.name);
            }
          }
        });
      }
    });
  }

  if (modified) {
    saveState();
  }
}

/* ============================================================================
 *  INIT
 * ============================================================================ */
window.addEventListener('keydown',(e)=>{
  if (e.target.matches('input,textarea,select')) return;
  if (e.key==='ArrowRight') nextTab();
  if (e.key==='ArrowLeft')  prevTab();
});
migrateStateSteamExchangers();
render();
</script>
