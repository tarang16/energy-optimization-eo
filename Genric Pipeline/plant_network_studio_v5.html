        addKpiRow.appendChild(addKpiBtn);

        /* ── Download / Upload Excel for this equipment ── */
        const xlBtnS = 'padding:6px 12px;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;transition:all .15s;font-family:var(--font);display:inline-flex;align-items:center;gap:5px';
        const dlBtn = el('button');
        dlBtn.innerHTML = '📥 Download Excel';
        dlBtn.style.cssText = xlBtnS + ';border:1px solid var(--green);background:rgba(63,185,80,.08);color:var(--green);margin-left:10px';
        dlBtn.onmouseenter=()=>dlBtn.style.background='rgba(63,185,80,.18)';
        dlBtn.onmouseleave=()=>dlBtn.style.background='rgba(63,185,80,.08)';
        dlBtn.onclick = () => {
          if(typeof XLSX==='undefined'){ toast('XLSX library not loaded','warn'); return; }
          const wb = XLSX.utils.book_new();
          const eqName = (item.instLabel||item.elemName||'Equipment').replace(/[^a-zA-Z0-9 ]/g,'').substring(0,28);
          seu.kpis.forEach((kpi,ki) => {
            const rows = [
              ['Equipment', item.instLabel||item.elemName],
              ['Plant', item.plantName||''],
              ['KPI Name', kpi.name||''],
              [],
              ['✓','Attribute Name','PI Tag','UOM','Design','Min','Max','Default'],
            ];
            (kpi.customAttrs||[]).forEach(ca => {
              rows.push([ca.selected!==false?'Yes':'No', ca.name||'', ca.piTag||'', ca.uom||'', ca.designData||'', ca.min||'', ca.max||'', ca.defaultVal||'']);
            });
            const ws = XLSX.utils.aoa_to_sheet(rows);
            ws['!cols'] = [{wch:6},{wch:28},{wch:32},{wch:10},{wch:12},{wch:10},{wch:10},{wch:12}];
            /* Sheet name: KPI short name (max 31 chars for Excel) */
            const dashIdx = (kpi.name||'').lastIndexOf(' - ');
            let shName = dashIdx>-1 ? kpi.name.substring(dashIdx+3) : (kpi.name||'KPI '+(ki+1));
            shName = shName.substring(0,31).replace(/[\\\/\?\*\[\]]/g,'');
            XLSX.utils.book_append_sheet(wb, ws, shName);
          });
          const out = XLSX.write(wb,{bookType:'xlsx',type:'base64'});
          const a = document.createElement('a');
          a.href = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+out;
          a.download = eqName.replace(/\s+/g,'_') + '_KPI_Attributes.xlsx';
          document.body.appendChild(a); a.click();
          setTimeout(()=>document.body.removeChild(a),500);
          toast('Downloaded: '+a.download,'success');
        };

        const ulBtn = el('button');
        ulBtn.innerHTML = '📤 Upload Excel';
        ulBtn.style.cssText = xlBtnS + ';border:1px solid var(--blue);background:rgba(88,166,255,.08);color:var(--blue);margin-left:6px';
        ulBtn.onmouseenter=()=>ulBtn.style.background='rgba(88,166,255,.18)';
        ulBtn.onmouseleave=()=>ulBtn.style.background='rgba(88,166,255,.08)';
        ulBtn.onclick = () => {
          if(typeof XLSX==='undefined'){ toast('XLSX library not loaded','warn'); return; }
          const fileInp = document.createElement('input');
          fileInp.type='file'; fileInp.accept='.xlsx,.xls,.csv';
          fileInp.onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, {type:'array'});
                let importCount = 0;
                wb.SheetNames.forEach((shName, si) => {
                  const ws = wb.Sheets[shName];
                  const rows = XLSX.utils.sheet_to_json(ws, {header:1});
                  /* Find the KPI by matching sheet index to seu.kpis index,
                     or by matching KPI name from row[2] */
                  let kpi = seu.kpis[si];
                  if(!kpi) return;
                  /* Find header row (row with 'Attribute Name') */
                  let hdrIdx = rows.findIndex(r => r && r.some && r.some(c => String(c||'').toLowerCase().includes('attribute name')));
                  if(hdrIdx < 0) hdrIdx = 4; /* default: row 5 is header */
                  const dataRows = rows.slice(hdrIdx+1);
                  if(!kpi.customAttrs) kpi.customAttrs = [];
                  dataRows.forEach(r => {
                    if(!r || !r[1]) return;
                    const attrName = String(r[1]||'').trim();
                    /* Find matching attribute by name */
                    const ca = kpi.customAttrs.find(a => a.name === attrName);
                    if(ca) {
                      if(r[0]!==undefined) ca.selected = String(r[0]).toLowerCase()!=='no';
                      if(r[2]) ca.piTag = String(r[2]).trim();
                      if(r[3]) ca.uom = String(r[3]).trim();
                      if(r[4]) ca.designData = String(r[4]).trim();
                      if(r[5]) ca.min = String(r[5]).trim();
                      if(r[6]) ca.max = String(r[6]).trim();
                      if(r[7]) ca.defaultVal = String(r[7]).trim();
                      importCount++;
                    }
                  });
                });
                saveState(); renderPanel();
                toast('Imported '+importCount+' attribute mappings from '+file.name,'success');
              } catch(err) {
                console.error('Upload error:', err);
                toast('Upload failed: '+err.message,'warn');
              }
            };
            reader.readAsArrayBuffer(file);
          };
          fileInp.click();
        };

        addKpiRow.appendChild(dlBtn);
        addKpiRow.appendChild(ulBtn);

        panel.appendChild(addKpiRow);
      };

      hdr.onclick = () => {
        chk.checked = !chk.checked;
        seu.selected = chk.checked;
        if(seu.selected && !seu.name) {
            seu.name = item.instLabel || item.elemName || item.header;
        }
        if(seu.selected) {
            initSeuKpis(seu, item);
        }
        saveState();
        applyAndRender(); 
      };

      chk.onchange = (e) => {
        seu.selected = chk.checked;
        if(seu.selected && !seu.name) {
            seu.name = item.instLabel || item.elemName || item.header;
        }
        if(seu.selected) {
            initSeuKpis(seu, item);
        }
        saveState();
        applyAndRender();
      };

      if(isSel) renderPanel();
      card.appendChild(hdr);
      card.appendChild(panel);
      list.appendChild(card);
    });
    
    body.appendChild(list);
  }

  applyAndRender();

  const foot = el('div'); foot.style.cssText = 'margin-top:24px;display:flex;justify-content:flex-end;border-top:1px solid var(--border);padding-top:16px';
  const cBtn = el('button', 'btn-primary');
  cBtn.innerHTML = "Save &amp; Next: Non-SEU KPIs &rarr;";
  cBtn.onclick = ()=>{
    STATE._seuComplete = true;
    saveState();
    toast("SEU KPIs saved - proceeding to Non-SEU KPIs", 'success');
    STATE._kpiSubTab = 'nonseu';
    render();
  };
  foot.appendChild(cBtn);
  w.appendChild(foot);

  return w;
}

function paneNonSeu() {
  const allItems = buildEquipmentInventory();

  const items = allItems.filter(it => {
    if (it.netKey !== 'steam' && it.netKey !== 'power') return false;
    if ((it.plantName || '').trim().toLowerCase() !== 'utility unit') return false;
    if (STATE._nonSecExcluded && STATE._nonSecExcluded[it.instanceId]) return false;
    return true;
  });

  const syncKpisAcrossEquipType = (srcElemKey, srcSeu, srcInstanceId) => {
    if (!STATE._nonSeuConfig) return;

    const getSuffix = (kpiName) => {
      const dashIdx = (kpiName || '').lastIndexOf(' - ');
      return dashIdx > -1 ? kpiName.substring(dashIdx + 3) : (kpiName || '');
    };

    const srcKpis = srcSeu.kpis || [];
    const srcItem = allItems.find(it => it.instanceId === srcInstanceId);
    const srcPrefix = srcItem ? (srcItem.instLabel || srcItem.elemName || '') : '';

    Object.entries(STATE._nonSeuConfig).forEach(([otherInstId, otherSeu]) => {
      if (otherInstId === srcInstanceId) return;

      const otherParts = otherInstId.split('::');
      const otherElemKey = otherParts[2] || '';

      if (otherElemKey !== srcElemKey) return;

      const otherItem = allItems.find(it => it.instanceId === otherInstId);
      if (!otherItem) return;
      const otherPrefix = otherItem.instLabel || otherItem.elemName || '';

      const newKpis = [];

      srcKpis.forEach(srcKpi => {
        const suffix = getSuffix(srcKpi.name);
        const targetName = suffix ? (otherPrefix + ' - ' + suffix) : '';

        const existingKpi = (otherSeu.kpis || []).find(k => getSuffix(k.name) === suffix);

        if (existingKpi) {
          existingKpi.name = targetName;
          existingKpi.dataSource = srcKpi.dataSource || 'calculate';
          existingKpi.formula = srcKpi.formula || '';
          
          if (!existingKpi.customAttrs || existingKpi.customAttrs.length === 0) {
            existingKpi.customAttrs = getEquipRequiredAttrs(otherElemKey, targetName);
          }
          if (srcKpi.customAttrs && existingKpi.customAttrs) {
            srcKpi.customAttrs.forEach(srcAttr => {
              const dstAttr = existingKpi.customAttrs.find(a => a.name === srcAttr.name);
              if (dstAttr) {
                dstAttr.selected = srcAttr.selected;
              }
            });
          }
          newKpis.push(existingKpi);
        } else {
          newKpis.push({
            id: 'KPI_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
            name: targetName,
            hasPiTag: srcKpi.hasPiTag || 'No',
            dataSource: srcKpi.dataSource || 'calculate',
            formula: srcKpi.formula || '',
            customAttrs: getEquipRequiredAttrs(otherElemKey, targetName)
          });
        }
      });

      otherSeu.kpis = newKpis;
    });
  };

  const initNonSeuKpis = (seu, item) => {
    if (seu.kpis && seu.kpis.length > 0) return;
    
    let foundOther = null;
    if (STATE._nonSeuConfig) {
      Object.entries(STATE._nonSeuConfig).forEach(([otherInstId, otherSeu]) => {
        if (otherInstId === item.instanceId) return;
        const parts = otherInstId.split('::');
        if (parts[2] === item.elemKey && otherSeu && otherSeu.kpis && otherSeu.kpis.length > 0) {
          foundOther = otherSeu;
        }
      });
    }

    if (foundOther) {
      seu.kpis = foundOther.kpis.map(srcKpi => {
        const dashIdx = srcKpi.name.lastIndexOf(' - ');
        const suffix = dashIdx > -1 ? srcKpi.name.substring(dashIdx + 3) : srcKpi.name;
        const targetName = suffix ? (item.instLabel + ' - ' + suffix) : '';
        return {
          id: 'KPI_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          name: targetName,
          hasPiTag: srcKpi.hasPiTag || 'No',
          dataSource: srcKpi.dataSource || 'calculate',
          formula: srcKpi.formula || '',
          customAttrs: getEquipRequiredAttrs(item.elemKey, targetName)
        };
      });
    } else if(STATE._masterKpis && (STATE._masterKpis[item.elemKey] || STATE._masterKpis[item.elemName]) && (STATE._masterKpis[item.elemKey] || STATE._masterKpis[item.elemName]).length > 0) {
      seu.kpis = (STATE._masterKpis[item.elemKey] || STATE._masterKpis[item.elemName]).map(k => ({
        id: 'KPI_'+Date.now()+'_'+Math.floor(Math.random()*1000),
        name: k.name ? (item.instLabel + ' - ' + k.name) : '',
        hasPiTag: 'No',
        dataSource: 'calculate',
        formula: k.formula || '',
        customAttrs: getEquipRequiredAttrs(item.elemKey, k.name)
      }));
    } else {
      seu.kpis = [{ id: 'KPI_'+Date.now(), name: '', hasPiTag: 'No', formula:'', customAttrs:[] }];
    }
  };

  const isGlobalSync = (name) => {
    if (!name) return false;
    return name.includes('Ambient Temperature') ||
           ((name.startsWith('Fuel ') || name.startsWith('Fuel Gas ')) && name.includes('(mol%)')) ||
           (name.startsWith('Liquid Fuel ') && (name.includes('Component') || name.includes('(wt%)') || name.includes('(mol%)')));
  };

  const getGlobalMappedAttr = (name, plantId) => {
    if (!STATE._nonSeuConfig) return null;
    let found = null;
    Object.entries(STATE._nonSeuConfig).forEach(([instId, seu]) => {
      const parts = instId.split('::');
      const pId = parts[1] || '';
      if (pId !== plantId) return;

      if (!seu || !seu.kpis) return;
      seu.kpis.forEach(kpi => {
        if (!kpi.customAttrs) return;
        kpi.customAttrs.forEach(attr => {
          if (attr.name === name && attr.piTag) {
            found = attr;
          }
        });
      });
    });
    return found;
  };

  if (!STATE._nonSeuConfig || Array.isArray(STATE._nonSeuConfig)) {
    STATE._nonSeuConfig = {};
  }

  /* Auto-select ALL equipment from plant config as SEUs on first visit.
     Equipment defined in networks is automatically designated as SEU —
     user does not need to manually select each one again. */
  items.forEach(item => {
    const itemParts = (item.instanceId || '').split('::');
    const itemPlantId = itemParts[1] || '';
    if(!STATE._nonSeuConfig[item.instanceId]) {
      STATE._nonSeuConfig[item.instanceId] = { selected: true, kpis: [] };
    }
    const seu = STATE._nonSeuConfig[item.instanceId];
    if(!seu.name) seu.name = item.instLabel || item.elemName || '';
    if(!seu.kpis) seu.kpis = [];
    /* Sync KPIs with Master KPI List — add new selections, remove deselected.
       Runs every render to stay in sync with Master KPI List changes. */
    {
      const mk = STATE._masterKpis && (STATE._masterKpis[item.elemKey] || STATE._masterKpis[item.elemName]);
      if(mk && mk.length > 0) {
        const prefix = (item.instLabel||item.elemName||'') + ' - ';
        /* Add KPIs that are in Master list but missing from SEU */
        mk.forEach(k => {
          const fullName = k.name ? (prefix + k.name) : '';
          if(fullName && !seu.kpis.some(sk => sk.name === fullName)) {
            seu.kpis.push({
              id: 'KPI_'+Date.now()+'_'+Math.floor(Math.random()*1000),
              name: fullName,
              hasPiTag: 'No',
              dataSource: 'calculate',
              formula: k.formula || '',
              customAttrs: getEquipRequiredAttrs(item.elemKey, fullName)
            });
          }
        });
        /* Remove KPIs that were deselected from Master list (only auto-generated ones) */
        const masterNames = new Set(mk.map(k => k.name ? (prefix + k.name) : ''));
        seu.kpis = seu.kpis.filter(sk => {
          /* Keep manually added KPIs (those not matching the prefix+masterName pattern) */
          if(!sk.name || !sk.name.startsWith(prefix)) return true;
          return masterNames.has(sk.name);
        });
      }
    }
    /* Patch existing KPIs: ensure dataSource is set and customAttrs always
       match the current OUTPUT_INPUT_MAP from the Python asset files.
       Re-populate on every render to pick up mapping corrections. */
    seu.kpis.forEach(kpi => {
      if(!kpi.dataSource) kpi.dataSource = 'calculate';
      const freshAttrs = getEquipRequiredAttrs(item.elemKey, kpi.name);
      if(freshAttrs.length > 0) {
        /* Preserve any user-entered PI tags from existing attrs */
        const existingByName = {};
        (kpi.customAttrs||[]).forEach(ca => { if(ca.name) existingByName[ca.name] = ca; });
        kpi.customAttrs = freshAttrs.map(fa => {
          let old = existingByName[fa.name];
          if (isGlobalSync(fa.name)) {
            const globalMapped = getGlobalMappedAttr(fa.name, itemPlantId);
            if (globalMapped) {
              old = {
                ...(old || {}),
                selected: old ? (old.selected !== false) : globalMapped.selected,
                piTag: globalMapped.piTag,
                piTags: globalMapped.piTags ? [...globalMapped.piTags] : undefined,
                tagFunction: globalMapped.tagFunction,
                customFormula: globalMapped.customFormula,
                uom: globalMapped.uom || fa.uom,
                designData: old ? (old.designData || globalMapped.designData) : globalMapped.designData,
                min: old ? (old.min || globalMapped.min) : globalMapped.min,
                max: old ? (old.max || globalMapped.max) : globalMapped.max,
                defaultVal: old ? (old.defaultVal || globalMapped.defaultVal) : globalMapped.defaultVal
              };
            }
          }
          if(old) return { ...fa, piTag: old.piTag||'', uom: old.uom||fa.uom, designData: old.designData||'', min: old.min||'', max: old.max||'', defaultVal: old.defaultVal||'', piTags: old.piTags, tagFunction: old.tagFunction, customFormula: old.customFormula };
          return fa;
        });
      }
    });
  });

  if(!STATE._nonSeuFilter) STATE._nonSeuFilter = {};
  if(!Array.isArray(STATE._nonSeuFilter.plantIds)) STATE._nonSeuFilter.plantIds = [];
  if(typeof STATE._nonSeuFilter.search !== 'string') STATE._nonSeuFilter.search = '';

  /* Auto-select all plants so all equipment shows by default */
  if(STATE._nonSeuFilter.plantIds.length === 0) {
    STATE._nonSeuFilter.plantIds = (STATE.plants||[]).map(p => p.id);
  }
  const plantSel = new Set(STATE._nonSeuFilter.plantIds);

  const w = el('div');
  w.innerHTML = `
    <div class="section-title"><span class="accent"></span>⚡ Non-Significant Energy Consumer KPIs</div>
    <div class="section-hint" style="font-size:12.5px;color:var(--text3);margin-bottom:20px">Define Non-Significant Energy Consumers (Non-SEUs) and their calculation formulas. Select a plant to view its equipment and designate Non-SEUs.</div>
  `;

  if(items.length === 0){
    const empty = el('div');
    empty.style.cssText = 'margin-top:24px';
    empty.appendChild(emptyState('','No equipment placed yet','Go to Plant Config &rarr; Network Config and add equipment to one or more networks first.'));
    w.appendChild(empty);
    return w;
  }

  const fbar = el('div');
  fbar.style.cssText = 'display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 10px';

  const srch = el('input');
  srch.type='text';
  srch.placeholder='Search instances, headers, PI tag bases';
  srch.value = STATE._nonSeuFilter.search || '';
  srch.style.cssText='flex:1;min-width:240px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;outline:none;font-family:var(--font)';
  srch.onfocus=()=>srch.style.borderColor='#F0C040';
  srch.onblur =()=>srch.style.borderColor='var(--border)';
  srch.oninput=()=>{ STATE._nonSeuFilter.search = srch.value; saveState(); applyAndRender(); };
  fbar.appendChild(srch);
  w.appendChild(fbar);

  if ((STATE.plants||[]).length > 1){
    const pbar = el('div');
    pbar.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px';
    const plbl = el('span');
    plbl.style.cssText='font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-right:4px;font-weight:600';
    plbl.textContent = ' Select Plant:';
    pbar.appendChild(plbl);
    /* Count equipment per plant */
    const plantCounts = {};
    items.forEach(it => { plantCounts[it.plantId] = (plantCounts[it.plantId]||0) + 1; });
    (STATE.plants||[]).forEach(p=>{
      const cnt = plantCounts[p.id] || 0;
      if (cnt === 0) return;
      const on = plantSel.has(p.id);
      const chip = el('label');
      chip.style.cssText = 'display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1.5px solid '+(on?'#F0C040':'var(--border)')+';background:'+(on?'rgba(240,192,64,.12)':'var(--bg3)')+';cursor:pointer;font-size:11.5px;color:'+(on?'var(--text)':'var(--text2)')+';user-select:none;transition:all .15s;font-weight:'+(on?'700':'500');
      chip.innerHTML = '<input type="checkbox" '+(on?'checked':'')+' style="accent-color:#F0C040;width:13px;height:13px;cursor:pointer">'
        + '<span style="color:'+(on?'var(--green)':'var(--text3)') +';font-size:8px;margin-right:2px">●</span>'
        + esc(p.name)
        + '<span style="font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;background:'+(on?'var(--green)':'var(--bg4)')+';color:'+(on?'#fff':'var(--text3)')+'">'+cnt+'</span>';
      chip.querySelector('input').onchange = (e)=>{
        if(e.target.checked) { plantSel.add(p.id); }
        else { plantSel.delete(p.id); }
        STATE._nonSeuFilter.plantIds = [...plantSel];
        saveState(); render();
      };
      pbar.appendChild(chip);
    });
    w.appendChild(pbar);
  }

  /* ── Energy Group Sub-tabs (All / Electric / Fuel / Steam) ── */
  if(!STATE._nonSeuFilter.groupKey) STATE._nonSeuFilter.groupKey = 'all';
  const secGroups = {};
  Object.entries(NETWORKS).forEach(([nk, nd]) => {
    if (nk !== 'sec' && !nd.external) {
      secGroups[nk] = { name: nd.name, icon: nd.icon };
    }
  });
  const groupBar = el('div','subtabs');
  groupBar.style.cssText = 'display:flex;gap:0;border-radius:var(--radius2);overflow:hidden;border:1px solid var(--border);margin-bottom:14px';

  /* Count items per group */
  const groupCounts = { all: items.length };
  items.forEach(it => { const g = it.netKey||''; groupCounts[g] = (groupCounts[g]||0) + 1; });

  /* "All" tab */
  const allTab = el('button','subtab'+(STATE._nonSeuFilter.groupKey==='all'?' active':''));
  allTab.innerHTML = `All <span class="scount">${groupCounts.all}</span>`;
  allTab.onclick = () => { STATE._nonSeuFilter.groupKey='all'; saveState(); render(); };
  groupBar.appendChild(allTab);

  Object.entries(secGroups).forEach(([gk, gv]) => {
    const isActive = STATE._nonSeuFilter.groupKey === gk;
    const cnt = groupCounts[gk] || 0;
    const tab = el('button','subtab'+(isActive?' active':''));
    tab.innerHTML = `${gv.icon||'⚙️'} ${gv.name} <span class="scount">${cnt}</span>`;
    tab.onclick = () => { STATE._nonSeuFilter.groupKey = gk; saveState(); render(); };
    groupBar.appendChild(tab);
  });
  w.appendChild(groupBar);

  const counterStrip = el('div');
  counterStrip.style.cssText='display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap';
  w.appendChild(counterStrip);

  const body = el('div');
  w.appendChild(body);

  function applyAndRender(){
    const q = (STATE._nonSeuFilter.search||'').trim().toLowerCase();
    const gk = STATE._nonSeuFilter.groupKey || 'all';
    const visible = items.filter(r=>{
      if ((STATE.plants||[]).length > 1 && plantSel.size === 0) return false;
      if(plantSel.size > 0 && !plantSel.has(r.plantId)) return false;
      /* Energy group filter */
      if(gk !== 'all' && r.netKey !== gk) return false;
      if(!q) return true;
      return [r.instLabel, r.elemName, r.header, r.piTagBase, r.routeLabel, r.plantName, r.netName, r.role]
        .some(s=>(s||'').toLowerCase().includes(q));
    });
    renderCounters(visible);
    renderBody(visible);
  }

  function renderCounters(visible){
    counterStrip.innerHTML = '';
    const total = el('div');
    total.style.cssText='padding:7px 14px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);font-size:12px;color:var(--text);font-weight:700';
    total.innerHTML = '<span style="color:var(--text3);font-weight:500;margin-right:6px">Showing</span>'+visible.length+'<span style="color:var(--text3);font-weight:500;margin-left:4px">equipment</span>';
    counterStrip.appendChild(total);
    
    let seuCount = 0;
    visible.forEach(r => {
      if(STATE._nonSeuConfig[r.instanceId]?.selected) seuCount++;
    });
    
    const seuBadge = el('div');
    seuBadge.style.cssText = 'padding:6px 12px;border-radius:8px;background:rgba(240,192,64,.1);border:1px solid rgba(240,192,64,.5);font-size:11.5px;color:var(--text);font-weight:600';
    seuBadge.innerHTML = ' Selected Non-SEUs <span style="color:#F0C040;margin-left:4px;font-weight:700">'+seuCount+'</span>';
    counterStrip.appendChild(seuBadge);
  }

  function renderBody(visible){
    body.innerHTML = '';
    if(visible.length === 0){
      const msg = plantSel.size === 0 && (STATE.plants||[]).length > 1
        ? emptyState('','No plant selected','Select one or more plants above to view their equipment and designate Non-SEUs.')
        : emptyState('','No matches','Try widening your search filters.');
      body.appendChild(msg);
      return;
    }

    const list = el('div');
    list.style.cssText = 'display:flex;flex-direction:column;gap:12px;margin-bottom:16px';
    
    visible.forEach((item) => {
      if(!STATE._nonSeuConfig[item.instanceId]) {
        STATE._nonSeuConfig[item.instanceId] = { selected: false, kpis: [] };
      }
      const seu = STATE._nonSeuConfig[item.instanceId];
      
      // Migration from old schema to new schema if needed
      if(seu.dataSource || seu.formula || seu.customAttrs) {
        seu.kpis = [{
            name: seu.name || 'KPI 1',
            dataSource: seu.dataSource,
            piTag: seu.piTag,
            formula: seu.formula,
            customAttrs: seu.customAttrs || []
        }];
        delete seu.dataSource;
        delete seu.piTag;
        delete seu.formula;
        delete seu.customAttrs;
        saveState();
      }

      if(!seu.kpis) seu.kpis = [];
      const isSel = !!seu.selected;
      
      const card = el('div');
      card.style.cssText = 'border:2px solid '+(isSel?'#F0C040':'var(--border)')+';border-radius:8px;background:var(--bg3);overflow:hidden;transition:all .2s';

      const hdr = el('div');
      hdr.style.cssText = 'display:flex;align-items:center;gap:12px;padding:12px 16px;background:'+(isSel?'rgba(240,192,64,.06)':'var(--bg2)')+';cursor:pointer;user-select:none;transition:background .2s';
      
      const chk = el('input'); chk.type = 'checkbox'; chk.checked = isSel;
      chk.style.cssText = 'width:18px;height:18px;cursor:pointer;accent-color:#F0C040;flex-shrink:0';
      chk.onclick = e => e.stopPropagation();

      const titleWrap = el('div'); titleWrap.style.cssText = 'flex:1;display:flex;align-items:center;gap:10px';
      
      const eqIcon = el('span');
      eqIcon.style.cssText = 'font-size:18px';
      eqIcon.innerHTML = NETWORKS[item.netKey]?.icon || '';
      
      const eqName = el('span');
      eqName.style.cssText = 'color:var(--text);font-size:14px;font-weight:'+(isSel?'700':'600')+';transition:all .12s';
      eqName.textContent = item.instLabel || item.elemName || item.header || 'Unknown Equipment';
      
      const eqHint = el('span');
      eqHint.style.cssText = 'color:var(--text3);font-size:11px;font-weight:500;margin-left:4px';
      eqHint.textContent = (item.plantName||'') + '  ' + (NETWORKS[item.netKey]?.name||'').replace(' Network','');

      titleWrap.appendChild(eqIcon);
      titleWrap.appendChild(eqName);
      titleWrap.appendChild(eqHint);

      hdr.appendChild(chk);
      hdr.appendChild(titleWrap);

      const panel = el('div');
      panel.style.cssText = 'border-top:1px solid '+(isSel?'#F0C040':'var(--border)')+';display:'+(isSel?'block':'none');

      const renderPanel = () => {
        panel.innerHTML = '';
        
        if (seu.kpis.length === 0) {
            const emptyHint = el('div');
            emptyHint.style.cssText = 'padding:16px;text-align:center;color:var(--text3);font-size:12px;font-style:italic';
            emptyHint.textContent = 'No KPIs defined for this SEU. Click "+ Add KPI" below to create one.';
            panel.appendChild(emptyHint);
        } else {
            seu.kpis.forEach((kpi, kpiIdx) => {
                const kpiBlock = el('div');
                kpiBlock.style.cssText = 'border-bottom:1px solid rgba(255,255,255,.06);background:var(--bg2)';
                
                // KPI Header
                const kpiHdr = el('div');
                kpiHdr.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(255,255,255,.02)';
                
                const kpiIcon = el('span');
                kpiIcon.style.cssText = 'font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:700;flex-shrink:0;width:70px';
                kpiIcon.textContent = 'KPI Name';
                
                const nameInp = el('input');
                nameInp.type = 'text';
                nameInp.placeholder = 'KPI Name (e.g. Efficiency, Power Consumption)';
                nameInp.value = kpi.name || '';
                nameInp.style.cssText = 'flex:1;max-width:300px;padding:5px 8px;border-radius:5px;border:1.5px solid '+(kpi.name?'rgba(240,192,64,.3)':'var(--border)')+';background:var(--bg4);color:var(--text);font-size:12.5px;font-weight:600;outline:none;transition:border-color .12s';
                nameInp.onfocus = () => nameInp.style.borderColor = '#F0C040';
                nameInp.onblur = () => {
                   const trimmedVal = nameInp.value.trim();
                   if (trimmedVal && (!kpi.customAttrs || kpi.customAttrs.length === 0)) {
                      kpi.customAttrs = getEquipRequiredAttrs(item.elemKey, trimmedVal);
                   }
                   kpi.name = trimmedVal;
                   syncKpisAcrossEquipType(item.elemKey, seu, item.instanceId);
                   saveState();
                   applyAndRender();
                 };
                nameInp.onkeydown = e => { if(e.key==='Enter') nameInp.blur(); };
                
                const delBtn = el('span');
                delBtn.innerHTML = '&times;';
                delBtn.style.cssText = 'cursor:pointer;color:#ff6b6b;font-size:18px;line-height:1;opacity:0.6;margin-left:auto';
                delBtn.onmouseenter = () => delBtn.style.opacity = '1';
                delBtn.onmouseleave = () => delBtn.style.opacity = '0.6';
                delBtn.onclick = () => { seu.kpis.splice(kpiIdx, 1); saveState(); renderPanel(); };

                kpiHdr.appendChild(kpiIcon);
                kpiHdr.appendChild(nameInp);
                kpiHdr.appendChild(delBtn);
                kpiBlock.appendChild(kpiHdr);
                // KPI Attributes button — opens popout modal
                const attrCount = (kpi.customAttrs||[]).length;
                const mappedCount = (kpi.customAttrs||[]).filter(a=>a.piTag).length;

                const attrRow = el('div');
                attrRow.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 16px';

                const attrBtn = el('button');
                attrBtn.style.cssText = 'padding:6px 14px;font-size:11.5px;font-weight:600;border-radius:6px;border:1.5px solid '
                  + (mappedCount > 0 ? '#F0C04088' : 'var(--border)') + ';background:'
                  + (mappedCount > 0 ? 'rgba(240,192,64,.08)' : 'var(--bg4)') + ';color:'
                  + (mappedCount > 0 ? '#F0C040' : 'var(--text2)') + ';cursor:pointer;transition:all .15s;font-family:var(--font)';
                attrBtn.innerHTML = '⚙ Attributes <span style="font-family:var(--mono);margin-left:6px;font-size:10px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.08)">'
                  + mappedCount + '/' + attrCount + ' mapped</span>';
                attrBtn.onmouseenter = () => { attrBtn.style.borderColor='#F0C040'; attrBtn.style.background='rgba(240,192,64,.12)'; };
                attrBtn.onmouseleave = () => { attrBtn.style.borderColor = mappedCount>0?'#F0C04088':'var(--border)'; attrBtn.style.background = mappedCount>0?'rgba(240,192,64,.08)':'var(--bg4)'; };
                attrBtn.onclick = () => {
                  const closeAndSaveModal = () => {
                    const isGlobalSync = (name) => {
                      if (!name) return false;
                      return name.includes('Ambient Temperature') ||
                             ((name.startsWith('Fuel ') || name.startsWith('Fuel Gas ')) && name.includes('(mol%)')) ||
                             (name.startsWith('Liquid Fuel ') && (name.includes('Component') || name.includes('(wt%)') || name.includes('(mol%)')));
                    };

                    if (kpi.customAttrs) {
                      kpi.customAttrs.forEach(srcAttr => {
                        if (!srcAttr.name) return;
                        const global = isGlobalSync(srcAttr.name);
                        
                        if (global && STATE._nonSeuConfig) {
                          // Sync globally across all equipment instances belonging to the same plant
                          const srcParts = (item.instanceId || '').split('::');
                          const srcPlantId = srcParts[1] || '';

                          Object.entries(STATE._nonSeuConfig).forEach(([otherInstId, otherSeu]) => {
                            const otherParts = otherInstId.split('::');
                            const otherPlantId = otherParts[1] || '';
                            if (otherPlantId !== srcPlantId) return; // Only sync for the same plant

                            if (!otherSeu || !otherSeu.kpis) return;
                            otherSeu.kpis.forEach(otherKpi => {
                              if (otherKpi === kpi) return;
                              if (!otherKpi.customAttrs) return;
                              otherKpi.customAttrs.forEach(dstAttr => {
                                if (dstAttr.name === srcAttr.name) {
                                  dstAttr.selected = srcAttr.selected;
                                  dstAttr.piTag = srcAttr.piTag;
                                  if (srcAttr.piTags) dstAttr.piTags = [...srcAttr.piTags];
                                  else delete dstAttr.piTags;
                                  dstAttr.tagFunction = srcAttr.tagFunction;
                                  dstAttr.customFormula = srcAttr.customFormula;
                                  dstAttr.uom = srcAttr.uom;
                                  dstAttr.designData = srcAttr.designData;
                                  dstAttr.min = srcAttr.min;
                                  dstAttr.max = srcAttr.max;
                                  dstAttr.defaultVal = srcAttr.defaultVal;
                                }
                              });
                            });
                          });
                        } else if (seu.kpis) {
                          // Sync locally only for this equipment instance
                          seu.kpis.forEach(otherKpi => {
                            if (otherKpi === kpi) return;
                            if (!otherKpi.customAttrs) return;
                            otherKpi.customAttrs.forEach(dstAttr => {
                              if (dstAttr.name === srcAttr.name) {
                                dstAttr.selected = srcAttr.selected;
                                dstAttr.piTag = srcAttr.piTag;
                                if (srcAttr.piTags) dstAttr.piTags = [...srcAttr.piTags];
                                  else delete dstAttr.piTags;
                                dstAttr.tagFunction = srcAttr.tagFunction;
                                dstAttr.customFormula = srcAttr.customFormula;
                                dstAttr.uom = srcAttr.uom;
                                dstAttr.designData = srcAttr.designData;
                                dstAttr.min = srcAttr.min;
                                dstAttr.max = srcAttr.max;
                                dstAttr.defaultVal = srcAttr.defaultVal;
                              }
                            });
                          });
                        }
                      });
                    }
                    if (mask.parentNode) {
                      document.body.removeChild(mask);
                    }
                    saveState();
                    renderPanel();
                  };

                  /* ── Open Attribute Mapping Modal ── */
                  const mask = el('div');
                  mask.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);animation:fade .15s ease';

                  const modal = el('div');
                  modal.style.cssText = 'background:var(--bg2);border:1px solid #F0C04055;border-radius:14px;width:100%;max-width:1100px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.5)';

                  /* Modal header */
                  const mHdr = el('div');
                  mHdr.style.cssText = 'display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0';
                  mHdr.innerHTML = '<span style="font-size:20px">⚙</span>'
                    + '<div style="flex:1"><div style="font-size:14px;font-weight:700;color:var(--text)">' + esc(kpi.name || 'KPI Attributes') + '</div>'
                    + '<div style="font-size:11px;color:var(--text3);margin-top:2px">Map PI tags to required input attributes for this KPI calculation</div></div>';
                  const mClose = el('button');
                  mClose.innerHTML = '✕';
                  mClose.style.cssText = 'width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg3);cursor:pointer;color:var(--text3);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0';
                  mClose.onmouseenter = () => { mClose.style.borderColor='var(--border3)'; mClose.style.color='var(--text)'; };
                  mClose.onmouseleave = () => { mClose.style.borderColor='var(--border)'; mClose.style.color='var(--text3)'; };
                  mClose.onclick = closeAndSaveModal;
                  mHdr.appendChild(mClose);
                  modal.appendChild(mHdr);

                  /* Modal body — scrollable attribute list */
                  const mBody = el('div');
                  mBody.style.cssText = 'flex:1;overflow-y:auto;padding:16px 20px';

                  if(!kpi.customAttrs) kpi.customAttrs = [];

                  if(kpi.customAttrs.length === 0){
                    mBody.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text3);font-size:12px;font-style:italic">No attributes defined for this KPI.</div>';
                  } else {
                    /* Table header */
                    const _thS = 'padding:7px 6px;background:var(--bg4);font-weight:700;color:var(--text3);font-size:9px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)';
                    const tbl = el('div');
                    tbl.style.cssText = 'display:grid;grid-template-columns:28px minmax(130px,1.2fr) minmax(150px,1.5fr) 70px 70px 60px 60px 60px;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:11.5px';
                    const thRow = el('div');
                    thRow.style.cssText = 'display:contents';
                    thRow.innerHTML = `<div style="${_thS};text-align:center">✓</div>`
                      + `<div style="${_thS}">Attribute</div>`
                      + `<div style="${_thS}">PI Tag</div>`
                      + `<div style="${_thS}">UOM</div>`
                      + `<div style="${_thS}">Design</div>`
                      + `<div style="${_thS}">Min</div>`
                      + `<div style="${_thS}">Max</div>`
                      + `<div style="${_thS}">Default</div>`;
                    tbl.appendChild(thRow);

                    const _inpS = 'width:100%;padding:4px 5px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:11px;outline:none;font-family:var(--mono);transition:border-color .12s';
                    const _inpFocus = (inp) => { inp.onfocus=()=>inp.style.borderColor='#F0C040'; inp.onblur=()=>inp.style.borderColor='var(--border)'; };

                    kpi.customAttrs.forEach((ca, ci) => {
                      const row = el('div');
                      row.style.cssText = 'display:contents';
                      const bdStyle = ci < kpi.customAttrs.length-1 ? 'border-bottom:1px solid rgba(255,255,255,.04);' : '';
                      const cellS = 'padding:5px 6px;display:flex;align-items:center;' + bdStyle;

                      /* ✓ Checkbox */
                      const chkCell = el('div');
                      chkCell.style.cssText = cellS + 'justify-content:center;';
                      const chk2 = el('input'); chk2.type='checkbox'; chk2.checked = ca.selected !== false;
                      chk2.style.cssText = 'accent-color:#F0C040;cursor:pointer;width:13px;height:13px';
                      chk2.onchange = () => { ca.selected = chk2.checked; };
                      chkCell.appendChild(chk2);

                      /* Attribute name */
                      const nameCell = el('div');
                      nameCell.style.cssText = cellS + 'font-weight:600;color:var(--text);font-size:11.5px;';
                      nameCell.textContent = ca.name || '(unnamed)';

                      /* PI Tag — structured multi-tag UI */
                      const tagCell = el('div');
                      tagCell.style.cssText = cellS + 'flex-direction:column;gap:2px;align-items:stretch;';

                      /* Initialize multi-tag data if not present */
                      if(!ca.piTags || !Array.isArray(ca.piTags)){
                        ca.piTags = ca.piTag ? [ca.piTag] : [''];
                        ca.tagFunction = 'single';
                      }

                      /* Preview / summary line */
                      const tagPreview = el('div');
                      tagPreview.style.cssText = 'display:flex;align-items:center;gap:4px;min-height:24px';
                      const previewTxt = el('span');
                      previewTxt.style.cssText = 'font-size:10.5px;font-family:var(--mono);color:'+(ca.piTag?'#F0C040':'var(--text3)')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1';
                      previewTxt.textContent = ca.piTag || '(not mapped)';

                      const editTagBtn = el('button');
                      editTagBtn.textContent = '✎';
                      editTagBtn.style.cssText = 'width:22px;height:22px;border-radius:4px;border:1px solid var(--border);background:var(--bg4);color:var(--text3);cursor:pointer;font-size:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center';
                      editTagBtn.title = 'Configure PI tag(s)';
                      editTagBtn.onmouseenter=()=>{editTagBtn.style.borderColor='#F0C040';editTagBtn.style.color='#F0C040';};
                      editTagBtn.onmouseleave=()=>{editTagBtn.style.borderColor='var(--border)';editTagBtn.style.color='var(--text3)';};

                      editTagBtn.onclick = () => {
                        /* ── Multi-Tag Config Popout ── */
                        const tmask = el('div');
                        tmask.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);animation:fade .12s ease';
                        const tmodal = el('div');
                        tmodal.style.cssText = 'background:var(--bg2);border:1px solid #F0C04055;border-radius:12px;width:100%;max-width:520px;box-shadow:0 16px 48px rgba(0,0,0,.5);display:flex;flex-direction:column;max-height:70vh';

                        /* Header */
                        const tmHdr = el('div');
                        tmHdr.style.cssText = 'padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px';
                        tmHdr.innerHTML = '<span style="font-size:16px">🔗</span><div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--text)">'
                          + esc(ca.name||'Attribute') + ' — PI Tag Mapping</div>'
                          + '<div style="font-size:10px;color:var(--text3);margin-top:1px">Map single or multiple PI tags with a combining function</div></div>';
                        const tmClose = el('button');
                        tmClose.innerHTML='✕';
                        tmClose.style.cssText='width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);cursor:pointer;color:var(--text3);font-size:12px;display:flex;align-items:center;justify-content:center';
                        tmClose.onclick=()=>{document.body.removeChild(tmask);};
                        tmHdr.appendChild(tmClose);
                        tmodal.appendChild(tmHdr);

                        /* Body */
                        const tmBody = el('div');
                        tmBody.style.cssText = 'padding:16px 18px;flex:1;overflow-y:auto';

                        function renderTagEditor(){
                          tmBody.innerHTML = '';
                          if(!ca.piTags) ca.piTags = [''];
                          if(!ca.tagFunction) ca.tagFunction = ca.piTags.length > 1 ? 'SUM' : 'single';

                          /* Function selector (only if >1 tag) */
                          if(ca.piTags.length > 1){
                            const fnRow = el('div');
                            fnRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:8px 10px;background:var(--bg4);border-radius:6px;border:1px solid var(--border)';
                            fnRow.innerHTML = '<span style="font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0">Combine using:</span>';
                            const fnSel = el('select');
                            fnSel.style.cssText = 'padding:4px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:11px;font-family:var(--mono);outline:none;cursor:pointer';
                            ['SUM','ADD','SUBTRACT','MULTIPLY','DIVIDE','AVG','AVERAGE','MAX','MIN','CUSTOM'].forEach(fn=>{
                              const opt = el('option'); opt.value=fn; opt.textContent=fn;
                              if(ca.tagFunction===fn) opt.selected=true;
                              fnSel.appendChild(opt);
                            });
                            fnSel.onchange=()=>{ca.tagFunction=fnSel.value; updateFormula(); renderTagEditor();};
                            fnRow.appendChild(fnSel);

                            /* Custom formula input */
                            if(ca.tagFunction==='CUSTOM'){
                              const cfInp = el('input'); cfInp.type='text';
                              cfInp.placeholder='e.g. ([T1]+[T2])/[T3]*100';
                              cfInp.value = ca.customFormula||'';
                              cfInp.style.cssText='flex:1;padding:4px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:#F0C040;font-family:var(--mono);font-size:11px;outline:none;margin-left:6px';
                              cfInp.oninput=()=>{ca.customFormula=cfInp.value; updateFormula();};
                              fnRow.appendChild(cfInp);
                            }
                            tmBody.appendChild(fnRow);
                          }

                          /* Tag rows */
                          const tagList = el('div');
                          tagList.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-bottom:12px';
                          ca.piTags.forEach((tag,ti)=>{
                            const tRow = el('div');
                            tRow.style.cssText = 'display:flex;align-items:center;gap:6px';
                            const tLabel = el('span');
                            tLabel.style.cssText = 'font-size:10px;color:var(--text3);font-family:var(--mono);font-weight:700;width:22px;text-align:center;flex-shrink:0';
                            tLabel.textContent = ca.piTags.length > 1 ? 'T'+(ti+1) : '';
                            const tInp = el('input'); tInp.type='text';
                            tInp.placeholder='e.g. UN.BOIL1.'+((ca.name||'ATTR').replace(/[^A-Za-z0-9]/g,'').substring(0,6).toUpperCase())+'.PV';
                            tInp.value = tag||'';
                            tInp.style.cssText='flex:1;padding:6px 10px;border-radius:5px;border:1.5px solid '+(tag?'#F0C04088':'var(--border)')+';background:var(--bg);color:'+(tag?'#F0C040':'var(--text)')+';font-family:var(--mono);font-size:11.5px;outline:none';
                            tInp.onfocus=()=>tInp.style.borderColor='#F0C040';
                            tInp.onblur=()=>{ca.piTags[ti]=tInp.value.trim();tInp.style.borderColor=ca.piTags[ti]?'#F0C04088':'var(--border)';tInp.style.color=ca.piTags[ti]?'#F0C040':'var(--text)'; updateFormula();};
                            tRow.appendChild(tLabel);
                            tRow.appendChild(tInp);
                            /* Delete button (only if >1 tag) */
                            if(ca.piTags.length > 1){
                              const tDel = el('button');
                              tDel.textContent='✕';
                              tDel.style.cssText='width:22px;height:22px;border-radius:4px;border:1px solid rgba(255,80,80,.3);background:rgba(255,80,80,.08);color:#ff6b6b;cursor:pointer;font-size:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center';
                              tDel.onclick=()=>{ca.piTags.splice(ti,1); if(ca.piTags.length<=1) ca.tagFunction='single'; updateFormula(); renderTagEditor();};
                              tRow.appendChild(tDel);
                            }
                            tagList.appendChild(tRow);
                          });
                          tmBody.appendChild(tagList);

                          /* Add Tag button */
                          const addTagBtn = el('button');
                          addTagBtn.innerHTML='＋ Add Tag';
                          addTagBtn.style.cssText='padding:5px 14px;font-size:11px;font-weight:600;border-radius:5px;border:1.5px dashed #F0C04066;background:rgba(240,192,64,.04);color:#F0C040;cursor:pointer;margin-bottom:14px';
                          addTagBtn.onclick=()=>{ca.piTags.push(''); if(ca.piTags.length>1 && ca.tagFunction==='single') ca.tagFunction='SUM'; updateFormula(); renderTagEditor();};
                          tmBody.appendChild(addTagBtn);

                          /* Formula preview */
                          const prevBox = el('div');
                          prevBox.style.cssText='padding:8px 10px;background:var(--bg4);border:1px solid var(--border);border-radius:6px';
                          prevBox.innerHTML='<div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:4px">Generated Formula</div>'
                            +'<div style="font-family:var(--mono);font-size:11px;color:#F0C040;word-break:break-all">'+ esc(ca.piTag||'(empty)')+'</div>';
                          tmBody.appendChild(prevBox);
                        }

                        function updateFormula(){
                          const tags = (ca.piTags||[]).filter(t=>t);
                          if(tags.length === 0){ ca.piTag = ''; }
                          else if(tags.length === 1){ ca.piTag = tags[0]; ca.tagFunction='single'; }
                          else {
                            const fn = ca.tagFunction || 'SUM';
                            const refs = tags.map((t,i)=>'['+t+']');
                            if(fn==='SUM' || fn==='ADD') ca.piTag = refs.join(' + ');
                            else if(fn==='SUBTRACT') ca.piTag = refs.join(' - ');
                            else if(fn==='MULTIPLY') ca.piTag = refs.join(' * ');
                            else if(fn==='DIVIDE') ca.piTag = refs.join(' / ');
                            else if(fn==='AVG' || fn==='AVERAGE') ca.piTag = '(' + refs.join(' + ') + ') / ' + tags.length;
                            else if(fn==='MAX') ca.piTag = 'MAX(' + refs.join(', ') + ')';
                            else if(fn==='MIN') ca.piTag = 'MIN(' + refs.join(', ') + ')';
                            else if(fn==='CUSTOM') ca.piTag = ca.customFormula || refs.join(' + ');
                          }
                          /* Update preview in parent */
                          previewTxt.textContent = ca.piTag || '(not mapped)';
                          previewTxt.style.color = ca.piTag ? '#F0C040' : 'var(--text3)';
                        }

                        renderTagEditor();
                        tmodal.appendChild(tmBody);

                        /* Footer */
                        const tmFtr = el('div');
                        tmFtr.style.cssText='padding:10px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end';
                        const tmSave = el('button');
                        tmSave.innerHTML='✓ Done';
                        tmSave.style.cssText='padding:7px 18px;border-radius:6px;border:none;background:#F0C040;color:#000;font-size:12px;font-weight:700;cursor:pointer';
                        tmSave.onclick=()=>{updateFormula(); document.body.removeChild(tmask);};
                        tmFtr.appendChild(tmSave);
                        tmodal.appendChild(tmFtr);

                        tmask.appendChild(tmodal);
                        tmask.onclick=(e)=>{if(e.target===tmask){updateFormula();document.body.removeChild(tmask);}};
                        document.body.appendChild(tmask);
                      };

                      tagPreview.appendChild(previewTxt);
                      tagPreview.appendChild(editTagBtn);
                      tagCell.appendChild(tagPreview);

                      /* UOM */
                      const uomCell = el('div');
                      uomCell.style.cssText = cellS;
                      const uomInp = el('input'); uomInp.type='text';
                      uomInp.value = ca.uom||''; uomInp.placeholder='unit';
                      uomInp.style.cssText = _inpS;
                      _inpFocus(uomInp);
                      uomInp.onblur = () => { ca.uom = uomInp.value.trim(); uomInp.style.borderColor='var(--border)'; };
                      uomCell.appendChild(uomInp);

                      /* Design */
                      const desCell = el('div');
                      desCell.style.cssText = cellS;
                      const desInp = el('input'); desInp.type='text';
                      desInp.value = ca.designData||''; desInp.placeholder='—';
                      desInp.style.cssText = _inpS;
                      _inpFocus(desInp);
                      desInp.onblur = () => { ca.designData = desInp.value.trim(); desInp.style.borderColor='var(--border)'; };
                      desCell.appendChild(desInp);

                      /* Min */
                      const minCell = el('div');
                      minCell.style.cssText = cellS;
                      const minInp = el('input'); minInp.type='text';
                      minInp.value = ca.min||''; minInp.placeholder='—';
                      minInp.style.cssText = _inpS;
                      _inpFocus(minInp);
                      minInp.onblur = () => { ca.min = minInp.value.trim(); minInp.style.borderColor='var(--border)'; };
                      minCell.appendChild(minInp);

                      /* Max */
                      const maxCell = el('div');
                      maxCell.style.cssText = cellS;
                      const maxInp = el('input'); maxInp.type='text';
                      maxInp.value = ca.max||''; maxInp.placeholder='—';
                      maxInp.style.cssText = _inpS;
                      _inpFocus(maxInp);
                      maxInp.onblur = () => { ca.max = maxInp.value.trim(); maxInp.style.borderColor='var(--border)'; };
                      maxCell.appendChild(maxInp);

                      /* Default */
                      const defCell = el('div');
                      defCell.style.cssText = cellS;
                      const defInp = el('input'); defInp.type='text';
                      defInp.value = ca.defaultVal||''; defInp.placeholder='—';
                      defInp.style.cssText = _inpS;
                      _inpFocus(defInp);
                      defInp.onblur = () => { ca.defaultVal = defInp.value.trim(); defInp.style.borderColor='var(--border)'; };
                      defCell.appendChild(defInp);

                      row.appendChild(chkCell);
                      row.appendChild(nameCell);
                      row.appendChild(tagCell);
                      row.appendChild(uomCell);
                      row.appendChild(desCell);
                      row.appendChild(minCell);
                      row.appendChild(maxCell);
                      row.appendChild(defCell);
                      tbl.appendChild(row);
                    });
                    mBody.appendChild(tbl);
                  }
                  modal.appendChild(mBody);

                  /* Modal footer */
                  const mFtr = el('div');
                  mFtr.style.cssText = 'display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0';
                  const saveBtn = el('button');
                  saveBtn.innerHTML = '✓ Save & Close';
                  saveBtn.style.cssText = 'padding:8px 20px;border-radius:6px;border:none;background:#F0C040;color:#000;font-size:12px;font-weight:700;cursor:pointer;transition:filter .15s';
                  saveBtn.onmouseenter = () => saveBtn.style.filter='brightness(1.1)';
                  saveBtn.onmouseleave = () => saveBtn.style.filter='none';
                  saveBtn.onclick = closeAndSaveModal;
                  mFtr.appendChild(saveBtn);
                  modal.appendChild(mFtr);

                  mask.appendChild(modal);
                  mask.onclick = (e) => { if(e.target===mask){ closeAndSaveModal(); } };
                  document.body.appendChild(mask);
                };

                attrRow.appendChild(attrBtn);
                kpiBlock.appendChild(attrRow);
                panel.appendChild(kpiBlock);
            });
        }

        // Add KPI button at the bottom of the panel
        const addKpiRow = el('div');
        addKpiRow.style.cssText = 'padding:12px 16px;background:var(--bg3)';
        const addKpiBtn = el('button', 'btn-secondary');
        addKpiBtn.style.cssText = 'padding:6px 14px;font-size:12px;font-weight:600;border-radius:6px;border:1.5px dashed var(--text3);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .15s';
        addKpiBtn.innerHTML = '＋ Add KPI';
        addKpiBtn.onmouseenter = () => { addKpiBtn.style.background='var(--bg4)'; addKpiBtn.style.color='var(--text)'; };
        addKpiBtn.onmouseleave = () => { addKpiBtn.style.background='var(--bg2)'; addKpiBtn.style.color='var(--text2)'; };
        addKpiBtn.onclick = () => {
            seu.kpis.push({ name:'', dataSource:null, formula:'', customAttrs:[] });
            syncKpisAcrossEquipType(item.elemKey, seu, item.instanceId);
            saveState();
            applyAndRender();
        };
        addKpiRow.appendChild(addKpiBtn);

        /* ── Download / Upload Excel for this equipment ── */
        const xlBtnS = 'padding:6px 12px;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;transition:all .15s;font-family:var(--font);display:inline-flex;align-items:center;gap:5px';
        const dlBtn = el('button');
        dlBtn.innerHTML = '📥 Download Excel';
        dlBtn.style.cssText = xlBtnS + ';border:1px solid var(--green);background:rgba(63,185,80,.08);color:var(--green);margin-left:10px';
        dlBtn.onmouseenter=()=>dlBtn.style.background='rgba(63,185,80,.18)';
        dlBtn.onmouseleave=()=>dlBtn.style.background='rgba(63,185,80,.08)';
        dlBtn.onclick = () => {
          if(typeof XLSX==='undefined'){ toast('XLSX library not loaded','warn'); return; }
          const wb = XLSX.utils.book_new();
          const eqName = (item.instLabel||item.elemName||'Equipment').replace(/[^a-zA-Z0-9 ]/g,'').substring(0,28);
          seu.kpis.forEach((kpi,ki) => {
            const rows = [
              ['Equipment', item.instLabel||item.elemName],
              ['Plant', item.plantName||''],
              ['KPI Name', kpi.name||''],
              [],
              ['✓','Attribute Name','PI Tag','UOM','Design','Min','Max','Default'],
            ];
            (kpi.customAttrs||[]).forEach(ca => {
              rows.push([ca.selected!==false?'Yes':'No', ca.name||'', ca.piTag||'', ca.uom||'', ca.designData||'', ca.min||'', ca.max||'', ca.defaultVal||'']);
            });
            const ws = XLSX.utils.aoa_to_sheet(rows);
            ws['!cols'] = [{wch:6},{wch:28},{wch:32},{wch:10},{wch:12},{wch:10},{wch:10},{wch:12}];
            /* Sheet name: KPI short name (max 31 chars for Excel) */
            const dashIdx = (kpi.name||'').lastIndexOf(' - ');
            let shName = dashIdx>-1 ? kpi.name.substring(dashIdx+3) : (kpi.name||'KPI '+(ki+1));
            shName = shName.substring(0,31).replace(/[\\\/\?\*\[\]]/g,'');
            XLSX.utils.book_append_sheet(wb, ws, shName);
          });
          const out = XLSX.write(wb,{bookType:'xlsx',type:'base64'});
          const a = document.createElement('a');
          a.href = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+out;
          a.download = eqName.replace(/\s+/g,'_') + '_KPI_Attributes.xlsx';
          document.body.appendChild(a); a.click();
          setTimeout(()=>document.body.removeChild(a),500);
          toast('Downloaded: '+a.download,'success');
        };

        const ulBtn = el('button');
        ulBtn.innerHTML = '📤 Upload Excel';
        ulBtn.style.cssText = xlBtnS + ';border:1px solid var(--blue);background:rgba(88,166,255,.08);color:var(--blue);margin-left:6px';
        ulBtn.onmouseenter=()=>ulBtn.style.background='rgba(88,166,255,.18)';
        ulBtn.onmouseleave=()=>ulBtn.style.background='rgba(88,166,255,.08)';
        ulBtn.onclick = () => {
          if(typeof XLSX==='undefined'){ toast('XLSX library not loaded','warn'); return; }
          const fileInp = document.createElement('input');
          fileInp.type='file'; fileInp.accept='.xlsx,.xls,.csv';
          fileInp.onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, {type:'array'});
                let importCount = 0;
                wb.SheetNames.forEach((shName, si) => {
                  const ws = wb.Sheets[shName];
                  const rows = XLSX.utils.sheet_to_json(ws, {header:1});
                  /* Find the KPI by matching sheet index to seu.kpis index,
                     or by matching KPI name from row[2] */
                  let kpi = seu.kpis[si];
                  if(!kpi) return;
                  /* Find header row (row with 'Attribute Name') */
                  let hdrIdx = rows.findIndex(r => r && r.some && r.some(c => String(c||'').toLowerCase().includes('attribute name')));
                  if(hdrIdx < 0) hdrIdx = 4; /* default: row 5 is header */
                  const dataRows = rows.slice(hdrIdx+1);
                  if(!kpi.customAttrs) kpi.customAttrs = [];
                  dataRows.forEach(r => {
                    if(!r || !r[1]) return;
                    const attrName = String(r[1]||'').trim();
                    /* Find matching attribute by name */
                    const ca = kpi.customAttrs.find(a => a.name === attrName);
                    if(ca) {
                      if(r[0]!==undefined) ca.selected = String(r[0]).toLowerCase()!=='no';
                      if(r[2]) ca.piTag = String(r[2]).trim();
                      if(r[3]) ca.uom = String(r[3]).trim();
                      if(r[4]) ca.designData = String(r[4]).trim();
                      if(r[5]) ca.min = String(r[5]).trim();
                      if(r[6]) ca.max = String(r[6]).trim();
                      if(r[7]) ca.defaultVal = String(r[7]).trim();
                      importCount++;
                    }
                  });
                });
                saveState(); renderPanel();
                toast('Imported '+importCount+' attribute mappings from '+file.name,'success');
              } catch(err) {
                console.error('Upload error:', err);
                toast('Upload failed: '+err.message,'warn');
              }
            };
            reader.readAsArrayBuffer(file);
          };
          fileInp.click();
        };

        addKpiRow.appendChild(dlBtn);
        addKpiRow.appendChild(ulBtn);

        panel.appendChild(addKpiRow);
      };

      hdr.onclick = () => {
        chk.checked = !chk.checked;
        seu.selected = chk.checked;
        if(seu.selected && !seu.name) {
            seu.name = item.instLabel || item.elemName || item.header;
        }
        if(seu.selected) {
            initNonSeuKpis(seu, item);
        }
        saveState();
        applyAndRender(); 
      };

      chk.onchange = (e) => {
        seu.selected = chk.checked;
        if(seu.selected && !seu.name) {
            seu.name = item.instLabel || item.elemName || item.header;
        }
        if(seu.selected) {
            initNonSeuKpis(seu, item);
        }
        saveState();
        applyAndRender();
      };

      if(isSel) renderPanel();
      card.appendChild(hdr);
      card.appendChild(panel);
      list.appendChild(card);
    });
    
    body.appendChild(list);
  }

  applyAndRender();

  const foot = el('div'); foot.style.cssText = 'margin-top:24px;display:flex;justify-content:flex-end;border-top:1px solid var(--border);padding-top:16px';
  const cBtn = el('button', 'btn-primary');
  cBtn.innerHTML = "Save &amp; Next: System KPI's &rarr;";
  cBtn.onclick = ()=>{
    STATE._nonSeuComplete = true;
    saveState();
    toast("Non-SEU KPIs saved - proceeding to System KPI's", 'success');
    STATE._kpiSubTab = 'kpiconfig';
    render();
  };
  foot.appendChild(cBtn);
  w.appendChild(foot);

  return w;
}
