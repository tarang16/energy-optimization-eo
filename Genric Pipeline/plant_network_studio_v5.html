<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Energy Network  Multi-Utility Builder</title>
<!-- XLSX loaded from CDN with local-file-safe fallback via blob download -->
<script>
/* Minimal XLSX guard  replaced by full lib below; used only if CDN fails */
window._xlsxReady = false;
</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
  onload="window._xlsxReady=true;"
  onerror="console.warn('XLSX CDN failed  trying unpkg fallback');">
</script>
<script>
if(!window._xlsxReady){
  var s=document.createElement('script');
  s.src='https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
  s.onload=function(){window._xlsxReady=true;};
  document.head.appendChild(s);
}
</script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--bg2:#111827;--bg3:#1a2236;--bg4:#232f47;--bg5:#2d3a55;
  --border:#2a3450;--border2:#3a4a6b;--border3:#4a5a80;
  --text:#e6edf3;--text2:#8b949e;--text3:#5a6578;
  --orange:#f0883e;--orange2:#d2691e;--orange3:#ff9f43;--orange-glow:rgba(240,136,62,.3);
  --green:#3fb950;--red:#f85149;--blue:#58a6ff;--purple:#bc8cff;--yellow:#f0c040;--cyan:#56d4dd;--pink:#f778ba;
  --radius:10px;--radius2:8px;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'Cascadia Code','Fira Code',Consolas,monospace;
  --transition:all .25s cubic-bezier(.4,0,.2,1);
  --net-color:var(--orange);
}
/* ====== LIGHT MODE ====== */
body[data-theme="light"]{
  --bg:#ffffff;--bg2:#ffffff;--bg3:#f8fafc;--bg4:#f1f5f9;--bg5:#e2e8f0;
  --border:#e2e8f0;--border2:#cbd5e1;--border3:#94a3b8;
  --text:#0f172a;--text2:#334155;--text3:#64748b;
  --orange:#ea580c;--orange2:#c2410c;--orange3:#f97316;--orange-glow:rgba(234,88,12,.25);
  --green:#16a34a;--red:#dc2626;--blue:#2563eb;--purple:#7c3aed;--yellow:#ca8a04;--cyan:#0891b2;--pink:#db2777;
}
body[data-theme="light"]{background:linear-gradient(135deg,#f8fafc 0%,#e0e7ff 50%,#f0f9ff 100%)}
body[data-theme="light"] .studio{box-shadow:0 4px 24px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);border-color:#e2e8f0}
body[data-theme="light"] .studio-header{background:linear-gradient(180deg,#ffffff,#f8fafc);border-bottom:2px solid #e2e8f0}
body[data-theme="light"] .studio-icon{box-shadow:0 4px 12px rgba(234,88,12,.3)}
body[data-theme="light"] .ufd-svg,body[data-theme="light"] #diagramBox{background:#f8fafc;border-color:#e2e8f0}
body[data-theme="light"] .tree{background:#f8fafc;border-color:#e2e8f0}
body[data-theme="light"] .toast.success{background:#f0fdf4;border-color:#86efac;color:#15803d}
body[data-theme="light"] .toast.info{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
body[data-theme="light"] .toast.warn{background:#fff7ed;border-color:#fdba74;color:#c2410c}

/* Light mode  tabs & navigation */
body[data-theme="light"] .tab-bar{border-bottom:2px solid #e2e8f0;background:#ffffff}
body[data-theme="light"] .tab.active{color:var(--orange);border-bottom-color:var(--orange)}
body[data-theme="light"] .tab .tab-num{background:#f1f5f9;color:#475569}
body[data-theme="light"] .tab.active .tab-num{background:var(--orange);color:#fff}
body[data-theme="light"] .tab.completed .tab-num{background:var(--green);color:#fff}

/* Light mode  network bar & cards */
body[data-theme="light"] .netbar{background:#ffffff;border-bottom:2px solid #e2e8f0}
body[data-theme="light"] .netbtn{background:#ffffff;border:1.5px solid #e2e8f0;color:#475569}
body[data-theme="light"] .netbtn:hover{border-color:#94a3b8;color:#0f172a;background:#f8fafc}
body[data-theme="light"] .netbtn.active{background:rgba(234,88,12,.06);border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 3px rgba(234,88,12,.1)}
body[data-theme="light"] .netbtn .nb-count{background:#f1f5f9;color:#475569}
body[data-theme="light"] .netbtn.active .nb-count{background:var(--orange);color:#fff}

/* Light mode  affiliate bar */
body[data-theme="light"] .affbar{background:#ffffff;border-bottom:2px solid #e2e8f0}
body[data-theme="light"] .affbar input.aff-input{background:#ffffff;border-color:#cbd5e1;color:#0f172a}
body[data-theme="light"] .affbar .plant-chip{background:#f8fafc;border-color:#cbd5e1}

/* Light mode  buttons */
body[data-theme="light"] .btn-primary{background:var(--orange);box-shadow:0 2px 8px rgba(234,88,12,.25)}
body[data-theme="light"] .btn-primary:hover{box-shadow:0 4px 16px rgba(234,88,12,.35)}
body[data-theme="light"] .btn-secondary{border-color:#cbd5e1;color:#475569;background:#ffffff}
body[data-theme="light"] .btn-secondary:hover{border-color:#94a3b8;color:#0f172a;background:#f8fafc}
body[data-theme="light"] .btn-ghost{color:#475569}
body[data-theme="light"] .btn-ghost:hover{color:#0f172a;background:#f1f5f9}
body[data-theme="light"] .btn-success{background:var(--green);box-shadow:0 2px 8px rgba(22,163,74,.25)}

/* Light mode  forms */
body[data-theme="light"] .form-input{background:#ffffff;border-color:#cbd5e1;color:#0f172a}
body[data-theme="light"] .form-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(234,88,12,.12)}
body[data-theme="light"] .form-label{color:#475569}

/* Light mode  cards & panels */
body[data-theme="light"] .area-card{background:#ffffff;border-color:#e2e8f0}
body[data-theme="light"] .area-card:hover{border-color:#cbd5e1;box-shadow:0 2px 8px rgba(0,0,0,.04)}
body[data-theme="light"] .area-card.active{border-color:var(--orange);background:rgba(234,88,12,.03);box-shadow:0 0 0 3px rgba(234,88,12,.08)}
body[data-theme="light"] .eq-card{background:#ffffff;border-color:#e2e8f0}
body[data-theme="light"] .eq-card:hover{border-color:#cbd5e1}
body[data-theme="light"] .eq-card.has-items{border-color:var(--orange);background:rgba(234,88,12,.03)}
body[data-theme="light"] .eq-card .e-count{background:#f8fafc;border-color:#cbd5e1}

/* Light mode  pills */
body[data-theme="light"] .pill{background:#ffffff;border-color:#e2e8f0;color:#475569}
body[data-theme="light"] .pill:hover{border-color:#94a3b8;color:#0f172a;background:#f8fafc}
body[data-theme="light"] .pill.active{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 3px 12px rgba(234,88,12,.35)}
body[data-theme="light"] .pill .pill-count{background:#f1f5f9;color:#475569}
body[data-theme="light"] .pill.active .pill-count{background:rgba(0,0,0,.18);color:#fff}
body[data-theme="light"] .pill.done:not(.active){border-color:var(--green);background:rgba(22,163,74,.05)}

/* Light mode  net-config cards */
body[data-theme="light"] .net-config-card{background:#ffffff;border-color:#e2e8f0}
body[data-theme="light"] .net-config-card:hover{border-color:#cbd5e1;box-shadow:0 4px 16px rgba(0,0,0,.06)}
body[data-theme="light"] .netmod-card{background:#ffffff;border-color:#e2e8f0}
body[data-theme="light"] .netmod-card:hover{border-color:#cbd5e1;background:#f8fafc}
body[data-theme="light"] .netmod-card.nm-on{background:rgba(234,88,12,.04)}

/* Light mode  review stats */
body[data-theme="light"] .rs{background:#ffffff;border-color:#e2e8f0}
body[data-theme="light"] .rs:hover{border-color:var(--orange);box-shadow:0 4px 12px rgba(0,0,0,.06)}

/* Light mode  attr table */
body[data-theme="light"] .attr-table{background:#ffffff}
body[data-theme="light"] .attr-table thead{background:#f8fafc}
body[data-theme="light"] .attr-table th{color:#475569;border-bottom:2px solid #e2e8f0}
body[data-theme="light"] .attr-table td{border-bottom:1px solid #f1f5f9}
body[data-theme="light"] .attr-table tbody tr:hover{background:#f8fafc}
body[data-theme="light"] .attr-table input,body[data-theme="light"] .attr-table select{background:#ffffff;border-color:#cbd5e1}

/* Light mode  footer */
body[data-theme="light"] .footer{background:#ffffff;border-top:2px solid #e2e8f0}

/* Light mode  modals */
body[data-theme="light"] .modal{background:#ffffff;border-color:#e2e8f0;box-shadow:0 24px 64px rgba(0,0,0,.12)}
body[data-theme="light"] .net-modal{background:#ffffff;border-color:#e2e8f0;box-shadow:0 24px 64px rgba(0,0,0,.12)}
body[data-theme="light"] .net-modal-steps{background:#f8fafc}
body[data-theme="light"] .net-modal-ftr{background:#f8fafc}

/* Light mode  badges */
body[data-theme="light"] .badge-net{background:rgba(234,88,12,.1);color:#c2410c}
body[data-theme="light"] .badge-green{background:rgba(22,163,74,.1);color:#15803d}
body[data-theme="light"] .badge-blue{background:rgba(37,99,235,.1);color:#1d4ed8}

/* Light mode  empty state */
body[data-theme="light"] .empty{background:#f8fafc;border-color:#cbd5e1}

/* Light mode  sub-tabs */
body[data-theme="light"] .subtabs{border-color:#e2e8f0}
body[data-theme="light"] .subtab{background:#ffffff;color:#475569}
body[data-theme="light"] .subtab:hover{background:#f8fafc}
body[data-theme="light"] .subtab.active{background:#f8fafc;color:var(--orange);border-bottom:2px solid var(--orange)}

/* Light mode  scrollbar */
body[data-theme="light"] ::-webkit-scrollbar-thumb{background:#cbd5e1}
body[data-theme="light"] ::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* Light mode  warn boxes */
body[data-theme="light"] .warn.error{background:#fef2f2;border-color:#fecaca;color:#dc2626}
body[data-theme="light"] .warn.warning{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
body[data-theme="light"] .warn.ok{background:#f0fdf4;border-color:#86efac;color:#15803d}

/* Light mode  route cards */
body[data-theme="light"] .route-card{background:#ffffff;border-color:#e2e8f0}
body[data-theme="light"] .route-card:hover{border-color:#cbd5e1}
body[data-theme="light"] .route-card select{background:#ffffff;border-color:#cbd5e1}

/* Light mode  section titles */
body[data-theme="light"] .section-title{border-bottom-color:#e2e8f0}

/* Light mode  element hierarchy */
body[data-theme="light"] .eh-wrap{background:#ffffff;border-color:#e2e8f0}
body[data-theme="light"] .eh-node:hover{background:#f1f5f9}
body[data-theme="light"] .eh-node.selected{background:rgba(234,88,12,.06)}
body[data-theme="light"] .eh-children{border-left-color:#cbd5e1}

/* Light mode  pc-subtabs */
body[data-theme="light"] .pc-subtab-bar{background:#f1f5f9;border-color:#e2e8f0}
body[data-theme="light"] .pc-subtab.pc-active{background:#ffffff;color:var(--orange);box-shadow:0 2px 6px rgba(0,0,0,.06)}

/*  Theme toggle button  */
.theme-btn{
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);
  background:var(--bg3);color:var(--text2);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:var(--transition);
  flex-shrink:0;
}
.theme-btn:hover{border-color:var(--net-color);color:var(--net-color);background:var(--bg4);transform:scale(1.1)}

html{font-size:14px}
body{font-family:var(--font);background:radial-gradient(ellipse at top,#10182a 0%,var(--bg) 60%);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:14px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--border3)}

.studio{width:100%;max-width:1480px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;box-shadow:0 32px 96px rgba(0,0,0,.55);display:flex;flex-direction:column;min-height:94vh;overflow:hidden}

/* ====== HEADER ====== */
.studio-header{padding:16px 26px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(240,136,62,.04),transparent)}
.studio-icon{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--net-color),var(--orange2));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:var(--transition)}
.studio-title h1{font-size:18px;font-weight:700;letter-spacing:.2px}
.studio-title p{font-size:12px;color:var(--text2);margin-top:2px}
.studio-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ====== AFFILIATE + PLANTS STRIP ====== */
.affbar{display:flex;align-items:center;gap:14px;padding:10px 26px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(240,136,62,.025),transparent);flex-wrap:wrap}
.affbar .aff-block{display:flex;align-items:center;gap:6px}
.affbar .aff-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px}
.affbar input.aff-input{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12.5px;font-family:var(--font);outline:none;transition:var(--transition);min-width:140px}
.affbar input.aff-input:focus{border-color:var(--net-color);box-shadow:0 0 0 2px rgba(240,136,62,.12)}
.affbar .plant-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.affbar .plant-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 4px 5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:14px;font-size:11.5px;font-weight:600;transition:var(--transition)}
.affbar .plant-chip:hover{border-color:var(--border2)}
.affbar .plant-chip input{background:transparent;border:none;color:var(--text);font-size:11.5px;font-family:var(--font);font-weight:600;outline:none;width:54px;padding:0;text-align:center}
.affbar .plant-chip .pc-del{width:18px;height:18px;border-radius:50%;background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:13px;line-height:1;opacity:.55;transition:var(--transition)}
.affbar .plant-chip:hover .pc-del{opacity:1}
.affbar .plant-chip .pc-del:hover{background:rgba(248,81,73,.2);color:var(--red)}
.affbar .plant-add{padding:5px 10px;background:transparent;border:1px dashed var(--border2);border-radius:14px;color:var(--text3);font-size:11.5px;font-weight:600;cursor:pointer;transition:var(--transition)}
.affbar .plant-add:hover{border-color:var(--net-color);color:var(--net-color)}

/* ====== NETWORK SWITCHER ====== */
.netbar{display:flex;gap:6px;padding:10px 26px;border-bottom:1px solid var(--border);background:var(--bg);overflow-x:auto}
.netbtn{padding:9px 16px;border-radius:10px;background:var(--bg3);border:1.5px solid var(--border);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:var(--transition);font-family:var(--font)}
.netbtn:hover{border-color:var(--border3);color:var(--text)}
.netbtn .nb-ic{font-size:16px}
.netbtn .nb-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.netbtn.active{border-color:var(--net-color);color:var(--net-color);background:rgba(240,136,62,.06);box-shadow:0 0 0 3px rgba(240,136,62,.08)}
.netbtn.active .nb-dot{opacity:1;box-shadow:0 0 8px currentColor}
.netbtn .nb-count{font-size:10px;font-family:var(--mono);background:var(--bg);padding:1px 6px;border-radius:8px;color:var(--text2)}
.netbtn.active .nb-count{background:var(--net-color);color:#fff}

/* ====== WORKFLOW TABS ====== */
.tab-bar{display:flex;gap:0;padding:12px 26px 0;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:10px 16px 12px;font-size:12.5px;font-weight:500;color:var(--text3);cursor:pointer;transition:var(--transition);border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font)}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--net-color);border-bottom-color:var(--net-color);font-weight:600}
.tab.completed{color:var(--green)}
.tab.locked{opacity:.38;cursor:not-allowed;pointer-events:none}
.tab.locked .tab-num{background:var(--bg4);color:var(--text3)}
/* connector arrow between tabs */
.tab-sep{display:flex;align-items:center;padding:0 2px 2px;color:var(--border3);font-size:14px;user-select:none;line-height:1}
.tab .tab-num{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--bg3);color:var(--text3);transition:var(--transition)}
.tab.active .tab-num{background:var(--net-color);color:#fff}
.tab.completed .tab-num{background:var(--green);color:#fff}

/* ====== NETWORK CONFIG MODAL ====== */
.net-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.net-modal{background:var(--bg2);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;width:100%;max-width:960px;max-height:90vh;overflow:hidden;border:1px solid var(--border)}
.net-modal-hdr{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.net-modal-hdr .nm-icon{font-size:28px;flex-shrink:0}
.net-modal-hdr .nm-title{font-size:17px;font-weight:700;color:var(--text)}
.net-modal-hdr .nm-sub{font-size:12px;color:var(--text3);margin-top:2px}
.net-modal-close{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text3);transition:all .15s;flex-shrink:0}
.net-modal-close:hover{background:var(--bg4);color:var(--text);border-color:var(--border3)}
/* Step progress bar inside modal */
.net-modal-steps{display:flex;align-items:center;padding:14px 24px;border-bottom:1px solid var(--border);gap:0;flex-shrink:0;background:var(--bg3)}
.nm-step{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text3);padding:6px 14px;border-radius:20px;transition:all .2s;white-space:nowrap}
.nm-step.active{background:var(--net-color);color:#fff}
.nm-step.done{color:var(--green)}
.nm-step .nm-snum{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.nm-step.done .nm-snum{background:var(--green);color:#fff}
.nm-step-sep{flex:1;height:1px;background:var(--border);min-width:20px}
/* Modal body and footer */
.net-modal-body{flex:1;overflow-y:auto;padding:24px}
.net-modal-ftr{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg3)}

/* ====== MODEL SELECTION PAGE ====== */
.model-page{display:flex;flex-direction:column;gap:28px}
.model-section-hd{font-size:14px;font-weight:700;color:var(--text);margin-bottom:18px;display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.ms-num{width:28px;height:28px;border-radius:8px;background:var(--net-color);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ms-sub{font-size:11px;color:var(--text3);font-weight:400;margin-left:auto}
/* Network module toggle cards */
.netmod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.netmod-card{position:relative;border:2px solid var(--border);border-radius:var(--radius);padding:20px 16px 16px;cursor:pointer;transition:all .2s;background:var(--bg3);display:flex;flex-direction:column;align-items:center;text-align:center;user-select:none}
.netmod-card:hover{border-color:var(--border3);background:var(--bg4)}
.netmod-card.nm-on{border-color:var(--nm-col,var(--net-color));background:var(--nm-bg,rgba(240,136,62,.08));box-shadow:0 0 0 3px var(--nm-sh,rgba(240,136,62,.08))}
.netmod-card .nm-check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;transition:.2s;color:transparent}
.netmod-card.nm-on .nm-check{background:var(--nm-col,var(--net-color));border-color:var(--nm-col,var(--net-color));color:#fff}
.netmod-card .nm-ic{font-size:34px;margin-bottom:12px}
.netmod-card .nm-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px}
.netmod-card .nm-sub{font-size:11px;color:var(--text3);line-height:1.45}
.optim-card .oc-radio{position:absolute;top:14px;right:14px;width:18px;height:18px;border-radius:50%;border:2px solid var(--border2);background:var(--bg);transition:.2s;flex-shrink:0}
.optim-card.oc-on .oc-radio{border-color:var(--net-color);background:var(--net-color)}
.optim-card.oc-on .oc-radio::after{content:'';display:block;width:6px;height:6px;border-radius:50%;background:#fff;margin:4px auto}

/* ====== PLANT CONFIG SUB-TABS ====== */
.pc-subtab-bar{display:flex;gap:2px;margin-top:20px;background:var(--bg3);border-radius:12px;padding:4px;border:1px solid var(--border)}
.pc-subtab{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:9px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:all .18s;white-space:nowrap;flex:1;justify-content:center}
.pc-subtab:hover:not(:disabled){background:var(--bg4);color:var(--text)}
.pc-subtab.pc-active{background:var(--bg);color:var(--net-color);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12);border:1px solid var(--border)}
.pc-subtab.pc-done{color:var(--green)}
.pc-subtab:disabled{opacity:0.38;cursor:not-allowed}
.pc-subtab .pc-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0}
.pc-subtab.pc-active .pc-badge{background:rgba(240,136,62,.15);color:var(--net-color)}
.pc-subtab.pc-done .pc-badge{background:rgba(63,185,80,.15);color:var(--green)}
.pc-subtab:disabled .pc-badge{background:var(--bg4);color:var(--text3)}
.pc-subtab:not(.pc-active):not(.pc-done):not(:disabled) .pc-badge{background:var(--bg4);color:var(--text3)}
/* Sub-tab content panel */
.pc-panel{margin-top:24px;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* Internal next/back bar */
.pc-nav-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:28px;padding-top:16px;border-top:1.5px solid var(--border)}
/* Network config cards  improved */
.net-config-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:4px}
.net-config-card{border:1.5px solid var(--border);border-radius:14px;padding:24px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;transition:all .2s;background:var(--bg3);position:relative;user-select:none}
.net-config-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.net-config-card.nc-done{border-width:2px}
.net-config-card .nc-check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700}
.net-config-card .nc-icon{font-size:38px;margin-bottom:14px}
.net-config-card .nc-name{font-size:14px;font-weight:700;margin-bottom:6px}
.net-config-card .nc-sub{font-size:11px;color:var(--text3);line-height:1.4;margin-bottom:14px}
.net-config-card .nc-badge{font-size:11px;font-weight:700;padding:3px 12px;border-radius:8px;margin-top:auto}
.net-config-card .nc-cta{font-size:11px;color:var(--text3);font-style:italic;margin-top:8px}

.body{flex:1;overflow-y:auto;padding:24px 28px;min-height:480px}
.pane{display:none;animation:fade .25s ease}
.pane.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.footer{padding:13px 26px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.footer-info{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:8px}
.footer-info .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(63,185,80,.6)}
.footer-actions{display:flex;gap:8px}

/* ====== BUTTONS ====== */
.btn{padding:9px 18px;border-radius:var(--radius2);font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);border:none;display:inline-flex;align-items:center;gap:8px;font-family:var(--font)}
.btn-primary{background:var(--net-color);color:#fff}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 4px 20px var(--orange-glow);transform:translateY(-1px)}
.btn-secondary{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--text2);color:var(--text)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{box-shadow:0 4px 20px rgba(63,185,80,.4);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text2);border:none}
.btn-ghost:hover{color:var(--text);background:var(--bg3)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-xs{padding:4px 8px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* ====== FORMS ====== */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.7px}
.form-hint{font-size:11px;color:var(--text3);margin-bottom:8px;line-height:1.5}
.form-input{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);color:var(--text);font-size:13px;font-family:var(--font);transition:var(--transition);outline:none}
.form-input:focus{border-color:var(--net-color);box-shadow:0 0 0 3px rgba(240,136,62,.12)}
.form-input::placeholder{color:var(--text3)}
.form-input.small{padding:6px 10px;font-size:12px}
.form-row{display:grid;gap:10px}
.form-row-2{grid-template-columns:1fr 1fr}
.form-row-3{grid-template-columns:1fr 1fr 1fr}
.form-row-4{grid-template-columns:repeat(4,1fr)}

.section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.section-title .accent{width:4px;height:14px;background:var(--net-color);border-radius:2px}
.section-hint{font-size:11px;color:var(--text3);margin-bottom:14px;line-height:1.6}

/* ====== ELEMENT TREE (hierarchy view) ====== */
.eh-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.eh-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.eh-head .eh-ic{font-size:20px}
.eh-head h3{font-size:14px;font-weight:700;flex:1}
.eh-head .eh-tag{font-family:var(--mono);font-size:10px;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:8px}

.eh-tree{font-family:var(--font);font-size:12.5px}
.eh-node{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;transition:var(--transition);cursor:pointer;position:relative}
.eh-node:hover{background:var(--bg4)}
.eh-node.selected{background:rgba(240,136,62,.08);border-left:3px solid var(--net-color)}
.eh-node .eh-twist{width:14px;color:var(--text3);font-size:10px;display:inline-flex;justify-content:center}
.eh-node .eh-dot{width:8px;height:8px;border-radius:50%;background:var(--net-color);opacity:.55;flex-shrink:0}
.eh-node .eh-nm{font-weight:600;color:var(--text)}
.eh-node .eh-key{font-family:var(--mono);font-size:10.5px;color:var(--text2);background:var(--bg);padding:2px 7px;border-radius:6px}
.eh-node .eh-cnt{font-family:var(--mono);font-size:11px;color:var(--text3);margin-left:auto}
.eh-node .eh-cnt.has{color:var(--net-color);font-weight:700}
.eh-children{margin-left:18px;border-left:1px dashed var(--border2);padding-left:8px}

/* ====== AREA / UNIT CARDS ====== */
.area-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;transition:var(--transition)}
.area-card:hover{border-color:var(--border2)}
.area-card.active{border-color:var(--net-color);background:rgba(240,136,62,.04);box-shadow:0 0 0 3px rgba(240,136,62,.06)}
.area-card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.area-card-head .ac-ic{font-size:18px}
.area-card-head input.ac-name{flex:1;background:transparent;border:1px solid transparent;color:var(--text);font-size:13.5px;font-weight:700;padding:4px 8px;border-radius:6px;font-family:var(--font);outline:none}
.area-card-head input.ac-name:focus{border-color:var(--net-color);background:var(--bg)}
.area-card-head .ac-tag{font-family:var(--mono);font-size:10.5px;color:var(--text2);background:var(--bg);padding:3px 8px;border-radius:7px}
.area-card-head .ac-del{width:26px;height:26px;border-radius:6px;background:transparent;border:none;color:var(--text3);cursor:pointer;opacity:.4;transition:var(--transition)}
.area-card:hover .ac-del{opacity:1}
.area-card-head .ac-del:hover{background:rgba(248,81,73,.15);color:var(--red)}
.area-card-meta{font-size:11px;color:var(--text3);font-family:var(--mono)}

/* ====== EQUIPMENT GRID ====== */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:8px 0}
.eq-card{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius2);border:1px solid var(--border);background:var(--bg3);transition:var(--transition);position:relative}
.eq-card:hover{border-color:var(--border2)}
.eq-card.has-items{border-color:var(--net-color);background:rgba(240,136,62,.04);box-shadow:0 0 0 2px rgba(240,136,62,.05)}
.eq-card .e-icon{font-size:20px;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;color:var(--net-color)}
.eq-isa-svg{display:inline-block;vertical-align:middle;color:var(--net-color)}
.eq-emoji{display:inline-block;font-size:1em;line-height:1}
.eh-node .eh-nm .eq-isa-svg{color:var(--net-color);margin-right:2px;vertical-align:-4px}
.eh-node .eh-nm .eq-emoji{margin-right:4px}
.tnode .eq-isa-svg{color:var(--net-color);vertical-align:-3px;margin-right:4px}
.eq-isa-svg-on-bg{color:#0d1117}
body[data-theme="light"] .eq-isa-svg{filter:none}
.eq-card .e-body{flex:1;min-width:0}
.eq-card .e-name{font-size:12.5px;font-weight:600;line-height:1.3}
.eq-card .e-key{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:2px}
.eq-card .e-count{width:56px;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:var(--mono);text-align:center;outline:none;transition:var(--transition);font-weight:700}
.eq-card .e-count:focus{border-color:var(--net-color);box-shadow:0 0 0 2px rgba(240,136,62,.15)}

/* ====== SUB-TABS (within an area) ====== */
.subtabs{display:flex;gap:0;border-radius:var(--radius2);overflow:hidden;border:1px solid var(--border);margin-bottom:14px}
.subtab{flex:1;padding:9px 14px;background:var(--bg3);border:none;color:var(--text2);font-size:12.5px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:8px}
.subtab:hover{background:var(--bg4)}
.subtab.active{background:var(--bg4);color:var(--text);border-bottom:2px solid var(--net-color)}
.subtab .scount{font-size:11px;font-weight:700;font-family:var(--mono);background:var(--bg);padding:1px 7px;border-radius:8px;color:var(--text3)}
.subtab.active .scount{background:var(--net-color);color:#fff}

/* ====== PILL ROW (area / header selector) ====== */
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

/* Default  unselected: muted so active state pops */
.pill{
  display:flex;align-items:center;gap:8px;padding:9px 14px;
  border-radius:var(--radius2);border:1.5px solid var(--border);
  background:var(--bg3);cursor:pointer;transition:var(--transition);
  font-family:var(--font);color:var(--text2);
}
.pill:hover{border-color:var(--border3);color:var(--text);background:var(--bg4)}

/* ACTIVE  solid filled: unmistakably selected */
.pill.active{
  border-color:var(--net-color);
  background:var(--net-color);
  color:#fff;
  font-weight:700;
  box-shadow:0 3px 14px rgba(240,136,62,.45);
}
.pill.active .pill-dot{background:rgba(255,255,255,.85)!important;box-shadow:none}
.pill.active .pill-name{color:#fff}
.pill.active:hover{filter:brightness(1.08)}

/* Dot */
.pill .pill-dot{width:10px;height:10px;border-radius:50%;background:var(--net-color);flex-shrink:0}

/* Name */
.pill .pill-name{font-size:12.5px;font-weight:600}

/* Count badge */
.pill .pill-count{
  font-size:10px;font-weight:700;font-family:var(--mono);
  background:var(--bg);padding:1px 7px;border-radius:8px;
  color:var(--text2);min-width:18px;text-align:center;
}
.pill.active .pill-count{background:rgba(0,0,0,.22);color:#fff}

/* Done (has elements) but NOT currently active */
.pill.done:not(.active){border-color:var(--green);background:rgba(63,185,80,.06);color:var(--text)}
.pill.done:not(.active) .pill-dot{background:var(--green)}
.pill.done:not(.active) .pill-count{background:var(--green);color:#fff}

/* ====== ADD ROW ====== */
.add-row{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border:1.5px dashed var(--border);border-radius:var(--radius2);color:var(--text3);font-size:13px;cursor:pointer;transition:var(--transition);margin-top:8px;font-weight:600}
.add-row:hover{border-color:var(--net-color);color:var(--net-color);background:rgba(240,136,62,.04)}

/* ====== ATTR TABLE ====== */
.attr-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;background:var(--bg3);border-radius:var(--radius2);overflow:hidden}
.attr-table thead{background:var(--bg4)}
.attr-table th{text-align:left;font-weight:600;color:var(--text2);padding:9px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.attr-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.attr-table tbody tr:hover{background:var(--bg4)}
.attr-table input,.attr-table select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:5px;font-size:12px;font-family:var(--mono);outline:none;width:100%;transition:var(--transition)}
.attr-table input:focus,.attr-table select:focus{border-color:var(--net-color);box-shadow:0 0 0 2px rgba(240,136,62,.15)}
.attr-table .num{font-family:var(--mono);font-size:11px;color:var(--text3);text-align:center}

/* ====== ROUTING CARD (connections) ====== */
.route-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);margin-bottom:8px;transition:var(--transition)}
.route-card:hover{border-color:var(--border2)}
.route-card .rc-from,.route-card .rc-to{flex:1;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.route-card .rc-arrow{color:var(--net-color);font-size:18px;font-weight:bold}
.route-card .rc-qty{width:60px}
.route-card select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:12px;font-family:var(--font);outline:none;flex:1;transition:var(--transition)}
.route-card select:focus{border-color:var(--net-color)}
.route-card .rc-del{width:26px;height:26px;border-radius:6px;background:transparent;border:none;color:var(--text3);cursor:pointer;opacity:.5}
.route-card .rc-del:hover{opacity:1;background:rgba(248,81,73,.15);color:var(--red)}

/* ====== REVIEW ====== */
.review-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
.rs{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:14px 10px;text-align:center;transition:var(--transition)}
.rs:hover{border-color:var(--net-color);transform:translateY(-1px)}
.rs .val{font-size:26px;font-weight:800;font-family:var(--mono);color:var(--net-color);line-height:1}
.rs .lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:5px}

.tree{font-family:var(--mono);font-size:11.5px;color:var(--text2);background:var(--bg);padding:16px;border-radius:var(--radius2);border:1px solid var(--border);max-height:480px;overflow:auto;line-height:1.8}
.tree .tnode{color:var(--text)}
.tree .tlevel{color:var(--net-color);font-weight:600}
.tree .tcount{color:var(--text3);font-size:10px}
.tree .tarea{color:var(--cyan);font-weight:700}

.warn{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:6px;font-size:12px;margin-bottom:6px;line-height:1.5}
.warn.error{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.2);color:var(--red)}
.warn.warning{background:rgba(240,136,62,.08);border:1px solid rgba(240,136,62,.2);color:var(--orange)}
.warn.ok{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.25);color:var(--green)}

/* ====== TOASTS ====== */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 16px;border-radius:8px;font-size:12px;font-weight:500;animation:slide .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:340px}
.toast.success{background:rgba(63,185,80,.15);border:1px solid rgba(63,185,80,.3);color:var(--green)}
.toast.info{background:rgba(88,166,255,.15);border:1px solid rgba(88,166,255,.3);color:var(--blue)}
.toast.warn{background:rgba(240,136,62,.15);border:1px solid rgba(240,136,62,.3);color:var(--orange)}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;font-family:var(--mono)}
.badge-net{background:rgba(240,136,62,.15);color:var(--net-color)}
.badge-green{background:rgba(63,185,80,.15);color:var(--green)}
.badge-blue{background:rgba(88,166,255,.15);color:var(--blue)}
.badge-cyan{background:rgba(86,212,221,.15);color:var(--cyan)}

/* ====== DIAGRAM ====== */
#diagramBox{background:#0d1117;border:1px solid var(--border);border-radius:var(--radius);min-height:520px;position:relative;overflow:hidden}
.ufd-svg{background:#0d1117;display:block;font-family:'Cascadia Code',monospace}
.ufd-node{fill:#161b22;stroke:var(--net-color);stroke-width:1.5px;transition:var(--transition);cursor:pointer}
.ufd-node:hover{fill:#1a2236;stroke-width:2px}
.ufd-link{fill:none;stroke:var(--net-color);stroke-width:1.6px;opacity:.7;stroke-dasharray:5 4;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.ufd-label{fill:var(--text);font-size:11px;font-weight:600;text-anchor:middle;pointer-events:none}
.ufd-sub{fill:var(--text3);font-size:9px;text-anchor:middle;pointer-events:none}
.ufd-qty{fill:var(--net-color);font-size:10px;font-weight:700;text-anchor:middle;pointer-events:none}
.ufd-tooltip{position:absolute;z-index:99999;pointer-events:none;background:rgba(13,17,23,.97);border:1px solid var(--border3);color:var(--text);padding:10px 14px;border-radius:8px;font-family:var(--mono);font-size:11px;line-height:1.5;min-width:200px;max-width:340px;box-shadow:0 12px 36px rgba(0,0,0,.7);opacity:0;transition:opacity .1s linear}
.ufd-tooltip .ttl{font-weight:700;color:var(--net-color);margin-bottom:4px;font-size:12px}
.ufd-tooltip .row{display:flex;justify-content:space-between;gap:12px;padding:1px 0;color:var(--text2)}
.ufd-tooltip .row b{color:var(--yellow)}

/* ====== EMPTY STATE ====== */
.empty{padding:40px 20px;text-align:center;color:var(--text3);background:var(--bg3);border:1px dashed var(--border);border-radius:var(--radius);margin:8px 0}
.empty .e-ic{font-size:38px;margin-bottom:8px;opacity:.5}
.empty .e-tt{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}
.empty .e-st{font-size:11px}

/* ====== MODAL ====== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9998;animation:fade .2s}
.modal-mask.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:22px;width:90%;max-width:540px;box-shadow:0 32px 96px rgba(0,0,0,.7)}
.modal h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

@media(max-width:1100px){.review-stats{grid-template-columns:repeat(3,1fr)}.form-row-3,.form-row-4{grid-template-columns:1fr 1fr}}

<body>
<div class="studio">
  <div class="studio-header">
    <div class="studio-icon" id="studioIcon"></div>
    <div class="studio-title">
      <h1 id="studioTitle">Energy Network</h1>
      <p id="studioSubtitle">Multi-utility network builder</p>
    </div>
    <div class="studio-actions">
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle dark / light mode"></button>
      <button class="btn btn-ghost btn-sm" onclick="resetCurrentNetwork()"> Reset</button>
      <button class="btn btn-sm" onclick="manualSave(this)" style="background:var(--green,#10b981);color:#fff;border:none"> Save</button>
      <button class="btn btn-secondary btn-sm" onclick="exportJSON()">&#128228; JSON</button>
      <button class="btn btn-secondary btn-sm" onclick="importJSON()">&#128229; Import JSON</button>
      <button class="btn btn-primary btn-sm" onclick="exportXlsx()" title="Export all Energy Network data - Case Setup, Plant Assignments, all networks + Python Engine Mappings">&#128202; Export All (XLSX)</button>
      <button class="btn btn-sm" onclick="downloadStandalone()" style="background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600" title="Download a self-contained HTML file with all current configuration embedded - share with anyone!">&#128279; Share / Standalone</button>
    </div>
  </div>



  <!-- WORKFLOW TABS -->
  <div class="tab-bar" id="tabBar"></div>

  <div class="body" id="body"></div>

  <div class="footer">
    <div class="footer-info"><span class="dot"></span><span id="ftStatus">Ready</span></div>
    <div class="footer-actions">
      <button class="btn btn-ghost btn-sm" onclick="prevTab()"> Back</button>
      <button class="btn btn-primary btn-sm" onclick="nextTab()">Next </button>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<div class="modal-mask" id="modalMask"><div class="modal" id="modalBody"></div></div>

function getEquipMatchingSecItem(it, secItems) {
  return secItems.find(s => {
    if (s.plantId !== it.plantId) return false;
    if (it.piTagBase && s.piTagBase && it.piTagBase === s.piTagBase) return true;
    
    let typeMatch = false;
    const ik = it.elemKey;
    const sk = s.elemKey;
    
    if (ik === sk) {
      typeMatch = true;
    } else if ((ik === 'fuel_fired_boiler' || ik === 'boiler') && sk === 'fh_boiler') {
      typeMatch = true;
    } else if (ik === 'furnace' && sk === 'fh_furnace') {
      typeMatch = true;
    } else if (ik === 'reformer' && sk === 'fh_reformer') {
      typeMatch = true;
    } else if ((ik === 'fired_heater' || ik === 'feed_preheater') && sk === 'fh_feed_preheater') {
      typeMatch = true;
    } else if (ik === 'backpressure_turbine' && sk === 'sec_backpressure_turbine') {
      typeMatch = true;
    } else if (ik === 'extraction_turbine' && sk === 'sec_extraction_turbine') {
      typeMatch = true;
    } else if (ik === 'extraction_cond_turbine' && sk === 'sec_extraction_cond_turbine') {
      typeMatch = true;
    } else if (ik === 'condensing_turbine' && sk === 'sec_condensing_turbine') {
      typeMatch = true;
    } else if (it.electricDriver && sk.startsWith('electric_drivers')) {
      const parts = sk.split('|');
      const subcat = parts[1] || '';
      if (ik === 'instrument_air_compressor' && subcat === 'compressor') typeMatch = true;
      else if ((ik === 'cw_pump' || ik === 'sw_pump') && subcat === 'pump') typeMatch = true;
      else if (ik === 'ct_fan' && subcat === 'fans') typeMatch = true;
      else if (subcat === '' || subcat === 'generic') typeMatch = true;
    }
    
    if (!typeMatch) return false;
    if (s.areaTag !== it.areaTag) return false;
    return s.index === it.index;
  });
}

/* Returns SVG icon markup for an element (size in px). Falls back to ed.icon emoji. */
function isaSVG(key, size){
  const svg = EQUIPMENT_ICONS[key];
  if (!svg) return '';
  const s = size || 22;
  return svg.replace('<svg ', `<svg width="${s}" height="${s}" class="eq-isa-svg" `);
}
function eqIcon(ed, size){
  const ikey = ICON_MAP[ed && ed.key];
  if (ikey && EQUIPMENT_ICONS[ikey]) return isaSVG(ikey, size);
  return `<span class="eq-emoji">${ed && ed.icon ? ed.icon : ''}</span>`;
}

/* Steam area data shape:
   a.steam = { gen:{hdrKey:{elKey:n}}, con:{hdrKey:{elKey:n}},
               tbn:{srcHdrKey:{routeKey:n}}, let:{srcHdrKey:{dstHdrKey:n}} }
   routeKey = `${typeKey}|${dst1}|${dst2}` (dsts are header keys) */
function ensureSteam(a){
  if (!a.steam) a.steam = {};
  ['gen','con','tbn','exch','let'].forEach(k=>{ if(!a.steam[k]) a.steam[k]={}; });
  return a.steam;
}
function steamHdrByKey(k){ return STEAM_HEADERS.find(h=>h.key===k); }
function steamLowerHeaders(hk, area){
  const headers = area && area.activeHeaders ? STEAM_HEADERS.filter(h=>area.activeHeaders.includes(h.key)) : STEAM_HEADERS;
  const i = headers.findIndex(h=>h.key===hk);
  return i<0 ? [] : headers.slice(i+1).filter(h=>h.key!=='cnd');
}
/* For routed consumers (exchangers): destination pool = lower headers + condensate header */
function steamCondHeaders(hk, area){
  const headers = area && area.activeHeaders ? STEAM_HEADERS.filter(h=>area.activeHeaders.includes(h.key)) : STEAM_HEADERS;
  const i = headers.findIndex(h=>h.key===hk);
  return i<0 ? [] : headers.slice(i+1); /* includes 'cnd' */
}
function trbRouteKey(typeKey, dsts, subcat){ 
  return [typeKey + (subcat ? ':' + subcat : ''), ...(dsts||[])].join('|'); 
}
function trbParse(rk){ 
  const p=String(rk||'').split('|'); 
  const idx = p[0].indexOf(':');
  if(idx > -1) {
    return {typeKey: p[0].substring(0, idx), subcat: p[0].substring(idx+1), dsts: p.slice(1)};
  }
  return {typeKey:p[0], subcat:'', dsts:p.slice(1)}; 
}
function steamAreaTotal(a){
  const s=ensureSteam(a); let t=0;
  ['gen','con','tbn','exch','let'].forEach(g=> Object.values(s[g]).forEach(m=> Object.values(m).forEach(v=>t+=(+v||0))));
  return t;
}

function getElementCountInArea(a, ek, def) {
  const d = def || curDef();
  const isSteam = d && d.customUI === 'steam';
  if (!isSteam) {
    if (ek === 'electric_drivers') {
      let c = 0;
      Object.entries(a.counts||{}).forEach(([k, cnt]) => {
        if(k.startsWith('electric_drivers|')) c += (+cnt || 0);
      });
      return c;
    }
    return +a.counts[ek] || 0;
  }
  const s = ensureSteam(a);
  if (ek.startsWith('steam_header_') || ek === 'condensate_header') return 1;
  if (STEAM_GEN.some(tg => tg.key === ek)) {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.gen[h.key]?.[ek] || 0));
    return c;
  }
  if (STEAM_CON.some(tc => tc.key === ek)) {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.con[h.key]?.[ek] || 0));
    return c;
  }
  if (STEAM_TURBINE.some(tt => tt.key === ek)) {
    let c = 0; STEAM_HEADERS.forEach(h => {
      Object.entries(s.tbn[h.key] || {}).forEach(([rk, cnt]) => {
        if (trbParse(rk).typeKey === ek) c += cnt;
      });
    });
    return c;
  }
  if (ek === 'steam_exchanger') {
    let c = 0;
    STEAM_HEADERS.forEach(h => {
      c += (s.con[h.key]?.[ek] || 0);
      Object.values(s.exch[h.key] || {}).forEach(cnt => c += cnt);
    });
    return c;
  }
  if (ek === 'letdown_station') {
    let c = 0;
    STEAM_HEADERS.forEach(h => {
      Object.values(s.let[h.key] || {}).forEach(cnt => c += cnt);
    });
    return c;
  }
  return 0;
}

function getAreaTotalPlaced(a, def) {
  if (!a) return 0;
  if (!def) return 0;
  if (def.customUI === 'steam') return steamAreaTotal(a);
  if (def.customUI === 'power') return (a.powerConsumers||[]).reduce((x,c)=>x+(+c.count||0),0);
  if (def.elementTree) {
    let tot = 0;
    def.elementTree.forEach(e => {
      tot += getElementCountInArea(a, e.key, def);
    });
    return tot;
  }
  return Object.values(a.counts || {}).reduce((x,c)=>x+(+c||0),0);
}

function buildCountsSource(a, d, isSteam) {
  if (!isSteam) return a.counts;
  const countsSource = {};
  const s = ensureSteam(a);
  
  // Headers: always 1 of each
  STEAM_HEADERS.forEach(h => {
    const key = h.key === 'cnd' ? 'condensate_header' : 'steam_header_' + h.key;
    countsSource[key] = 1;
  });
  
  // Generators
  STEAM_GEN.forEach(tg => {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.gen[h.key]?.[tg.key] || 0));
    if (c > 0) countsSource[tg.key] = c;
  });
  
  // Consumers
  STEAM_CON.forEach(tc => {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.con[h.key]?.[tc.key] || 0));
    if (c > 0) countsSource[tc.key] = c;
  });
  
  // Turbines
  STEAM_TURBINE.forEach(tt => {
    let c = 0; STEAM_HEADERS.forEach(h => {
      Object.entries(s.tbn[h.key] || {}).forEach(([rk, cnt]) => {
        if (trbParse(rk).typeKey === tt.key) c += cnt;
      });
    });
    if (c > 0) countsSource[tt.key] = c;
  });
  
  // Exchangers
  let exchC = 0; STEAM_HEADERS.forEach(h => {
    Object.values(s.exch[h.key] || {}).forEach(cnt => exchC += cnt);
  });
  if (exchC > 0) {
    countsSource['steam_exchanger'] = (countsSource['steam_exchanger'] || 0) + exchC;
  }
  
  // Letdowns
  let letC = 0; STEAM_HEADERS.forEach(h => {
    Object.values(s.let[h.key] || {}).forEach(cnt => letC += cnt);
  });
  if (letC > 0) countsSource['letdown_station'] = letC;
  
  return countsSource;
}

function getSteamElementHeader(a, ek, i) {
  const s = ensureSteam(a);
  let accumulated = 0;
  if (ek.startsWith('steam_header_') || ek === 'condensate_header') return '';
  
  if (STEAM_GEN.some(tg => tg.key === ek)) {
    for (const h of STEAM_HEADERS) {
      const c = (s.gen[h.key]?.[ek] || 0);
      if (i < accumulated + c) return h.short;
      accumulated += c;
    }
  }
  if (STEAM_CON.some(tc => tc.key === ek)) {
    for (const h of STEAM_HEADERS) {
      const c = (s.con[h.key]?.[ek] || 0);
      if (i < accumulated + c) return h.short;
      accumulated += c;
    }
  }
  if (STEAM_TURBINE.some(tt => tt.key === ek)) {
    for (const h of STEAM_HEADERS) {
      let c = 0;
      Object.entries(s.tbn[h.key] || {}).forEach(([rk, cnt]) => {
        if (trbParse(rk).typeKey === ek) c += cnt;
      });
      if (i < accumulated + c) return h.short;
      accumulated += c;
    }
  }
  if (ek === 'steam_exchanger') {
    for (const h of STEAM_HEADERS) {
      const c = (s.con[h.key]?.[ek] || 0);
      if (i < accumulated + c) return h.short;
      accumulated += c;
    }
    for (const h of STEAM_HEADERS) {
      let c = 0;
      Object.values(s.exch[h.key] || {}).forEach(cnt => c += cnt);
      if (i < accumulated + c) return h.short;
      accumulated += c;
    }
  }
  if (ek === 'letdown_station') {
    for (const h of STEAM_HEADERS) {
      let c = 0;
      Object.values(s.let[h.key] || {}).forEach(cnt => c += cnt);
      if (i < accumulated + c) return h.short;
      accumulated += c;
    }
  }
  return '';
}

function getSteamInstanceInfo(a, ek, i) {
  const s = ensureSteam(a);
  let accumulated = 0;
  /* Use steam network's own elementTree  NOT curDef() which depends on the active network tab.
     This prevents crashes when exporting while a non-steam network is selected. */
  const steamElemName = (key) => {
    const el = NETWORKS.steam?.elementTree?.find(e => e.key === key);
    return el?.name || key;
  };

  if (ek.startsWith('steam_header_') || ek === 'condensate_header') {
    return {
      hdrShort: '',
      suffix: ek === 'condensate_header' ? 'condensate header a' : 'steam header a'
    };
  }

  if (STEAM_GEN.some(tg => tg.key === ek)) {
    const edName = steamElemName(ek);
    for (const h of STEAM_HEADERS) {
      const c = (s.gen[h.key]?.[ek] || 0);
      if (i < accumulated + c) {
        const subIndex = i - accumulated;
        const suffix = `${edName.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
        return { hdrShort: h.short, suffix };
      }
      accumulated += c;
    }
  }

  if (STEAM_CON.some(tc => tc.key === ek)) {
    const edName = steamElemName(ek);
    for (const h of STEAM_HEADERS) {
      const c = (s.con[h.key]?.[ek] || 0);
      if (i < accumulated + c) {
        const subIndex = i - accumulated;
        const suffix = `${edName.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
        return { hdrShort: h.short, suffix };
      }
      accumulated += c;
    }
  }

  if (STEAM_TURBINE.some(tt => tt.key === ek)) {
    const edName = steamElemName(ek);
    for (const h of STEAM_HEADERS) {
      let c = 0;
      const tbnRoutes = Object.entries(s.tbn[h.key] || {}).filter(([rk]) => trbParse(rk).typeKey === ek);
      for (const [rk, cnt] of tbnRoutes) {
        if (i < accumulated + cnt) {
          const subIndex = i - accumulated;
          const parsed = trbParse(rk);
          const sc = TURBINE_SUBCATS.find(x => x.id === parsed.subcat);
          let scLabel = sc ? sc.label : (parsed.subcat === 'other' ? 'Other' : parsed.subcat);
          if (!scLabel || scLabel === '(Generic)') scLabel = edName;
          const suffix = `${scLabel.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
          return { hdrShort: h.short, suffix };
        }
        accumulated += cnt;
      }
    }
  }

  if (ek === 'steam_exchanger') {
    const edName = steamElemName(ek);
    for (const h of STEAM_HEADERS) {
      const c = (s.con[h.key]?.[ek] || 0);
      if (i < accumulated + c) {
        const subIndex = i - accumulated;
        const suffix = `${edName.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
        return { hdrShort: h.short, suffix };
      }
      accumulated += c;
    }
    for (const h of STEAM_HEADERS) {
      let c = 0;
      const exchRoutes = Object.entries(s.exch[h.key] || {});
      for (const [rk, cnt] of exchRoutes) {
        if (i < accumulated + cnt) {
          const subIndex = i - accumulated;
          const suffix = `${edName.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
          return { hdrShort: h.short, suffix };
        }
        accumulated += cnt;
      }
    }
  }
  
  if (ek === 'letdown_station') {
    const edName = steamElemName(ek);
    for (const h of STEAM_HEADERS) {
      let c = 0;
      const letRoutes = Object.entries(s.let[h.key] || {});
      for (const [dst, cnt] of letRoutes) {
        if (i < accumulated + cnt) {
          const subIndex = i - accumulated;
          const suffix = `${edName.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
          return { hdrShort: h.short, suffix };
        }
        accumulated += cnt;
      }
    }
  }
  
  return { hdrShort: '', suffix: '' };
}

function netTotalRoutes(net){
  const def = NETWORKS[Object.keys(NETWORKS).find(k=>STATE.nets[k]===net)] || {};
  if (def.customUI==='steam') {
    let t = 0;
    net.areas.forEach(a=>{
      const s = ensureSteam(a);
      STEAM_HEADERS.forEach(h=>{
        Object.entries(s.tbn[h.key]||{}).forEach(([rk,v])=>{ if(+v>0) t++; });
        Object.entries(s.exch[h.key]||{}).forEach(([rk,v])=>{ if(+v>0) t++; });
        Object.entries(s.let[h.key]||{}).forEach(([dst,v])=>{ if(+v>0) t++; });
      });
    });
    return t;
  }
  return net.routing.length;
}

function getAreaPlacedElementsSummary(a, isSteam) {
  if (!isSteam) {
    return Object.entries(a.counts).filter(([,v])=>+v>0).map(([k,v])=>{
      const ed=elemDef(k); return { ed, count: v };
    });
  }
  const s = ensureSteam(a);
  const summary = [];
  
  STEAM_GEN.forEach(tg => {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.gen[h.key]?.[tg.key] || 0));
    if (c > 0) summary.push({ ed: elemDef(tg.key), count: c });
  });
  
  STEAM_CON.forEach(tc => {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.con[h.key]?.[tc.key] || 0));
    if (c > 0) summary.push({ ed: elemDef(tc.key), count: c });
  });
  
  STEAM_TURBINE.forEach(tt => {
    let c = 0; STEAM_HEADERS.forEach(h => {
      Object.entries(s.tbn[h.key] || {}).forEach(([rk, cnt]) => {
        if (trbParse(rk).typeKey === tt.key) c += cnt;
      });
    });
    if (c > 0) summary.push({ ed: elemDef(tt.key), count: c });
  });
  
  let exchC = 0; STEAM_HEADERS.forEach(h => {
    Object.values(s.exch[h.key] || {}).forEach(cnt => exchC += cnt);
  });
  if (exchC > 0) {
    const existing = summary.find(x => x.ed?.key === 'steam_exchanger');
    if (existing) {
      existing.count += exchC;
    } else {
      summary.push({ ed: elemDef('steam_exchanger'), count: exchC });
    }
  }
  
  let letC = 0; STEAM_HEADERS.forEach(h => {
    Object.values(s.let[h.key] || {}).forEach(cnt => letC += cnt);
  });
  if (letC > 0) summary.push({ ed: elemDef('letdown_station'), count: letC });

  return summary;
}

function getStatusDefault(elemKey, electricDriver){
  if(elemKey && String(elemKey).startsWith('power_consumer:')){
    return { dataSource:'calculate', formula:'[Power Demand] > 5' };
  }
  if(STATUS_DEFAULTS[elemKey]) return STATUS_DEFAULTS[elemKey];
  if(electricDriver) return { dataSource:'calculate', formula:'[Driver Power] > 5' };
  /* Fallback: assume always-on. User can override per instance. */
  return { dataSource:'calculate', formula:'1' };
}

/* Auto-applies the per-element default if no entry exists for this instance.
   Also migrates legacy entries that used the retired always_on / none modes
   to the simplified two-mode model (pi_sensor | calculate).
   Returns the (possibly newly-created) entry. */
function ensureStatusEntry(item){
  if(!STATE.equipmentStatus) STATE.equipmentStatus = {};
  let entry = STATE.equipmentStatus[item.instanceId];
  if(entry){
    /* Migrate legacy modes */
    if(entry.dataSource === 'always_on'){
      entry.dataSource = 'calculate';
      entry.formula    = '1';
      entry.piTag      = '';
      entry.isDefault  = true;
    } else if(entry.dataSource === 'none'){
      entry.dataSource = 'calculate';
      entry.formula    = '0';
      entry.piTag      = '';
      entry.isDefault  = true;
    }
    /* Drop legacy statusTag  no longer used */
    if('statusTag' in entry) delete entry.statusTag;
    /* Ensure valid mode (anything unrecognized  calculate) */
    if(entry.dataSource !== 'pi_sensor' && entry.dataSource !== 'calculate'){
      entry.dataSource = 'calculate';
      entry.formula    = entry.formula || '1';
      entry.isDefault  = true;
    }
    /* Backfill attrTags map if missing (added in later revision) */
    if(!entry.attrTags) entry.attrTags = {};
    return entry;
  }
  const def = getStatusDefault(item.elemKey, item.electricDriver);
  entry = {
    dataSource: def.dataSource,
    piTag:      '',
    formula:    def.formula || '',
    isDefault:  true,
    attrTags:   {},   /* keyed by attribute name  user-supplied PI tag */
  };
  STATE.equipmentStatus[item.instanceId] = entry;
  return entry;
}

/* Substitute [Attribute Name]  resolved PI tag reference.
   Resolution order:
     1. User-supplied attrTags[name] from the status entry  (explicit mapping)
     2. Auto-generated  piTagBase + '.' + makePITagSuffix(name)  (fallback)
   Tokens that already contain a '.' are passed through unchanged (already a raw PI tag). */
function expandFormulaForInstance(formula, item){
  if(!formula) return formula||'';
  const userTags = STATE.equipmentStatus?.[item?.instanceId]?.attrTags || {};
  return String(formula).replace(/\[([^\]]+)\]/g, (m, name)=>{
    const trimmed = (name||'').trim();
    if(trimmed.indexOf('.') !== -1) return m;          // already a PI tag path
    if(userTags[trimmed]) return '[' + userTags[trimmed] + ']';  // explicit mapping
    if(!item || !item.piTagBase) return m;              // no base  leave as-is
    const sfx = makePITagSuffix(trimmed);
    return '[' + item.piTagBase + '.' + sfx + ']';
  });
}

/**
 * makeLogicalTagName(item, attrName)
 * Builds a human-readable, underscore-separated logical tag name for an
 * equipment instance attribute, matching the STATUS-TAGS.xlsx convention:
 *   {PlantArea}_{Element_Type}_{InstChar}_{Attr_Name}
 * e.g.:  UB_Fuel_Fired_Boiler_A_Steam_Output
 *        OLF_Cw_Pump_A_Driver_Power
 *        UB_Backpressure_Turbine_A_Status
 */
function makeLogicalTagName(item, attrName){
  function toTagPart(str){
    return (str||'').replace(/[\/\(\)\.]+/g,' ').trim()
                    .replace(/[\s\-]+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
  }
  const area    = (item.areaTag || item.plantName || '').replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
  const etypeRaw = toTagPart(item.elemName || '');
  const etype   = etypeRaw.split('_')
                    .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
                    .join('_');
  const inst    = (item.index||0) < 26
                    ? String.fromCharCode(65 + (item.index||0))
                    : String((item.index||0) + 1);
  const attrRaw = toTagPart(attrName || '');
  const attr    = attrRaw.split('_')
                    .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
                    .join('_');
  return [area, etype, inst, attr].filter(Boolean).join('_');
}

/*  KPI  Equipment-status linking helpers 
   These parse `[X_Status]` references out of KPI formulas and resolve them
   against STATE.equipmentStatus (the registry populated by Status Mapping). */
function extractStatusRefs(formula){
  if(!formula) return [];
  const out = new Set();
  const re = /\[([A-Za-z_][A-Za-z0-9_]*_Status)\]/g;
  let m;
  while((m = re.exec(formula)) !== null){ out.add(m[1]); }
  return [...out];
}

/* For a given KPI, return { required:[], bound:[], missing:[] } status-tag names.
   "bound" means at least one studio equipment instance has its output statusTag set
   to that name and is not in 'none' mode. */
function kpiStatusCoverage(kpi){
  const required = extractStatusRefs(kpi && kpi.formula);
  if(!required.length) return { required:[], bound:[], missing:[] };
  const boundTags = new Set();
  Object.values(STATE.equipmentStatus || {}).forEach(e => {
    if(e && e.statusTag && e.dataSource && e.dataSource !== 'none'){
      boundTags.add(e.statusTag);
    }
  });
  const bound   = required.filter(r => boundTags.has(r));
  const missing = required.filter(r => !boundTags.has(r));
  return { required, bound, missing };
}

/* Inverse: for a given status tag name, find which KPI definitions reference it. */
function kpisUsingStatus(statusTag){
  if(!statusTag) return [];
  return (KPI_MASTER || []).filter(k => extractStatusRefs(k && k.formula).includes(statusTag));
}

/* Find all equipment instances whose output statusTag matches this name. */
function instancesProvidingStatus(statusTag){
  const matches = [];
  Object.entries(STATE.equipmentStatus || {}).forEach(([id, e])=>{
    if(e && e.statusTag === statusTag && e.dataSource !== 'none') matches.push({instanceId:id, ...e});
  });
  return matches;
}

/* Renders the colored pill that summarizes an instance's status binding. */
function renderStatusPill(entry){
  const ds = entry && getStatusDSObj(entry.dataSource);
  if(!ds){
    return '<span style="display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;background:rgba(139,148,158,.12);border:1px dashed #5a6578;font-size:10.5px;font-weight:600;color:#8b949e">Unset</span>';
  }
  const dot = entry.isDefault
    ? '<span title="Studio default" style="margin-left:6px;font-size:10px;color:#3FB950">\u{1F7E2}</span>'
    : '<span title="Customized" style="margin-left:6px;font-size:10px;color:#58A6FF">\u{1F535}</span>';
  return '<span style="display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;background:'+ds.bg+';border:1px solid '+ds.color+'66;font-size:10.5px;font-weight:700;color:'+ds.color+'">'+ds.icon+' '+ds.label+'</span>' + dot;
}


/* ============================================================================
 *  EQUIPMENT INVENTORY
 *  Flat walker that emits one row per equipment instance across all 6 networks.
 *  Output is consumed by the Inventory sub-tab inside KPI Config and (in later
 *  increments) by Status Mapping to drive per-instance status formulas.
 *
 *  Returns: Array of rows. Each row carries:
 *    instanceId        stable unique key for this instance
 *    netKey, netName, netColor, netIcon
 *    plantId, plantName, areaTag
 *    elemKey, elemName, elemIcon
 *    groupKey, groupLabel, role
 *    header            short header label for steam (e.g. 'VHP'); '' otherwise
 *    routeKey, routeLabel   for routed equipment (turbines, exchangers, letdowns)
 *    driverKind        'motor' | 'turbine' | null (for electricDriver elements)
 *    index             0-based instance number within its (plant, element) sequence
 *    instLabel         display name like 'Fuel Fired Boiler a'
 *    attrs             array of {name, uom} from elementTree
 *    piTagBase         e.g. 'UB.UB.BLR-101'
 *    electricDriver    boolean flag from elementTree
 * ============================================================================ */
function buildEquipmentInventory(){
  const rows = [];
  const plantById = Object.fromEntries((STATE.plants||[]).map(p=>[p.id, p]));

  Object.entries(NETWORKS).forEach(([netKey, def])=>{
    const net = STATE.nets[netKey];
    if(!net) return;
    const netMeta = { netKey, netName:def.name, netColor:def.color, netIcon:def.icon };
    (net.areas||[]).forEach(area=>{
      const plant = plantById[area.plantId] || { name: area.name||'', id: area.plantId||'' };
      const areaMeta = { plantId: plant.id, plantName: plant.name||area.name||'', areaTag: area.tag||'' };

      if(def.customUI === 'steam'){
        _invWalkSteamArea(rows, netMeta, areaMeta, area, def);
      } else if(def.customUI === 'power'){
        _invWalkPowerArea(rows, netMeta, areaMeta, area, def);
      } else {
        _invWalkStandardArea(rows, netMeta, areaMeta, area, def);
        /* Also pick up plant-consumer entries that live in fuelPlants/fuelEquip,
           not in area.counts (applies to fuel_network consumers and any network
           with the plantConsumer:true flag, e.g. Air Network). */
        if(def.key === 'fuel_network' || def.plantConsumer){
          _invWalkPlantConsumerArea(rows, netMeta, areaMeta, area, def);
        }
      }
    });
  });

  if (STATE._customNonSecItems && Array.isArray(STATE._customNonSecItems)) {
    rows.push(...STATE._customNonSecItems);
  }

  // Override pump networks to Power Distribution Network!
  rows.forEach(it => {
    const isPump = (it.elemKey && (it.elemKey.includes('pump') || it.elemKey.includes('CWP') || it.elemKey.includes('SWP'))) || 
                   (it.instLabel && it.instLabel.toLowerCase().includes('pump')) ||
                   (it.elemName && it.elemName.toLowerCase().includes('pump'));
    if (isPump && it.netKey !== 'sec') {
      it.netKey = 'power';
      it.netName = 'Power Distribution Network';
      it.netColor = '#F0C040';
      it.netIcon = '⚡';
    }
  });

  return rows;
}

function _invWalkStandardArea(rows, netMeta, areaMeta, area, def){
  /* For non-steam/power networks: area.counts[elemKey] = N instances */
  const counts = area.counts || {};
  const grouped = {};
  Object.entries(counts).forEach(([elemKey, count]) => {
    let baseKey = elemKey;
    if(elemKey.startsWith('electric_drivers|')) baseKey = 'electric_drivers';
    if(!grouped[baseKey]) grouped[baseKey] = [];
    grouped[baseKey].push({ elemKey, count: +count||0 });
  });

  Object.entries(grouped).forEach(([baseElemKey, items]) => {
    const ed = (def.elementTree||[]).find(e=>e.key===baseElemKey);
    if(!ed) return;
    const grpInfo = def.groups?.[ed.group] || {};
    
    let cum = 0;
    items.forEach(item => {
      const {elemKey, count} = item;
      if(count <= 0) return;
      
      let customSubLabel = '';
      if(elemKey.startsWith('electric_drivers|')) {
         const parts = elemKey.split('|');
         const scId = parts[1];
         const scName = parts[2] || '';
         const sc = ELECTRIC_DRIVER_SUBCATS.find(x=>x.id===scId);
         customSubLabel = sc ? sc.label : (scId==='other' ? (scName || 'Other') : scId);
         if(customSubLabel === '(Generic)' || !customSubLabel) customSubLabel = ed.name;
      }

      for(let i=0; i<count; i++){
        const overallIdx = cum + i;
        const piTagBase = makePITagBase(areaMeta.plantName, areaMeta.areaTag, ed, overallIdx);
        rows.push({
          instanceId: `${netMeta.netKey}::${areaMeta.plantId}::${elemKey}::::${overallIdx}`,
          ...netMeta, ...areaMeta,
          elemKey: baseElemKey, elemName: customSubLabel || ed.name, elemIcon: ed.icon,
          groupKey: ed.group||'', groupLabel: grpInfo.name||'',
          role: ed.role || (ed.electricDriver ? 'Driver' : ''),
          header: '', routeKey: '', routeLabel: '',
          driverKind: ed.electricDriver ? 'motor' : null,
          index: overallIdx,
          instLabel: `${customSubLabel || ed.name} ${String.fromCharCode(97+overallIdx)}`,
          attrs: ed.attrs || [],
          piTagBase,
          electricDriver: !!ed.electricDriver,
        });
      }
      cum += count;
    });
  });
}

function _invWalkSteamArea(rows, netMeta, areaMeta, area, def){
  const s = ensureSteam(area);
  const elFromTree = (k) => (def.elementTree||[]).find(e=>e.key===k) || null;

  /*  Generators (header-rooted)  */
  STEAM_GEN.forEach(tg=>{
    const ed = elFromTree(tg.key) || { key:tg.key, name: tg.name, icon:'⚙️', attrs:[], group:'gen' };
    const grpInfo = def.groups?.[ed.group] || {};
    let cum = 0;
    STEAM_HEADERS.forEach(h=>{
      if (area.activeHeaders && !area.activeHeaders.includes(h.key)) return;
      const c = s.gen[h.key]?.[tg.key] || 0;
      for(let i=0; i<c; i++){
        const overallIdx = cum + i;
        const piTagBase = makePITagBase(areaMeta.plantName, areaMeta.areaTag, ed, overallIdx);
        rows.push({
          instanceId: `steam::${areaMeta.plantId}::${tg.key}::${h.key}::${overallIdx}`,
          ...netMeta, ...areaMeta,
          elemKey: tg.key, elemName: ed.name, elemIcon: ed.icon,
          groupKey: ed.group||'gen', groupLabel: grpInfo.name||'',
          role: ed.role || 'Generator',
          header: h.short, routeKey:'', routeLabel:'',
          driverKind: null,
          index: overallIdx,
          instLabel: `${ed.name} ${String.fromCharCode(97+overallIdx)}`,
          attrs: ed.attrs || [],
          piTagBase,
          electricDriver: !!ed.electricDriver,
        });
      }
      cum += c;
    });
  });

  /*  Consumers (header-rooted)  skip steam_exchanger here; handled below in unified sequence  */
  STEAM_CON.filter(tc=>tc.key!=='steam_exchanger').forEach(tc=>{
    const ed = elFromTree(tc.key) || { key:tc.key, name: tc.name, icon:'⚙️', attrs:[], group:'con' };
    const grpInfo = def.groups?.[ed.group] || {};
    let cum = 0;
    STEAM_HEADERS.forEach(h=>{
      if (area.activeHeaders && !area.activeHeaders.includes(h.key)) return;
      const c = s.con[h.key]?.[tc.key] || 0;
      for(let i=0; i<c; i++){
        const overallIdx = cum + i;
        const piTagBase = makePITagBase(areaMeta.plantName, areaMeta.areaTag, ed, overallIdx);
        rows.push({
          instanceId: `steam::${areaMeta.plantId}::${tc.key}::${h.key}::${overallIdx}`,
          ...netMeta, ...areaMeta,
          elemKey: tc.key, elemName: ed.name, elemIcon: ed.icon,
          groupKey: ed.group||'con', groupLabel: grpInfo.name||'',
          role: ed.role || 'Consumer',
          header: h.short, routeKey:'', routeLabel:'',
          driverKind: null,
          index: overallIdx,
          instLabel: `${ed.name} ${String.fromCharCode(97+overallIdx)}`,
          attrs: ed.attrs || [],
          piTagBase,
          electricDriver: !!ed.electricDriver,
        });
      }
      cum += c;
    });
  });

  /*  Steam exchangers: header-rooted (s.con) AND routed (s.exch) share one index sequence  */
  {
    const ed = elFromTree('steam_exchanger') || { key:'steam_exchanger', name:'Steam Exchanger', icon:'&#128260;', attrs:[], group:'con' };
    const grpInfo = def.groups?.[ed.group] || {};
    let exchIdx = 0;
    STEAM_HEADERS.forEach(h=>{
      if (area.activeHeaders && !area.activeHeaders.includes(h.key)) return;
      const cnt = s.con[h.key]?.['steam_exchanger'] || 0;
      for(let i=0; i<cnt; i++){
        const piTagBase = makePITagBase(areaMeta.plantName, areaMeta.areaTag, ed, exchIdx);
        rows.push({
          instanceId: `steam::${areaMeta.plantId}::steam_exchanger::${h.key}::${exchIdx}`,
          ...netMeta, ...areaMeta,
          elemKey:'steam_exchanger', elemName: ed.name, elemIcon: ed.icon,
          groupKey: ed.group||'con', groupLabel: grpInfo.name||'',
          role: ed.role || 'Consumer',
          header: h.short, routeKey:'', routeLabel:'',
          driverKind: null,
          index: exchIdx,
          instLabel: `${ed.name} ${String.fromCharCode(97+exchIdx)}`,

        });

      }

      const routes = Object.entries(s.exch[h.key]||{});
      routes.forEach(([dstKey, cnt])=>{
        const dstShort = steamHdrByKey(dstKey)?.short || dstKey;

            instanceId: `steam::${areaMeta.plantId}::steam_exchanger::${h.key}::${dstKey}::${exchIdx}`,
            ...netMeta, ...areaMeta,
            elemKey:'steam_exchanger', elemName: ed.name, elemIcon: ed.icon,

            role: 'Consumer (Routed)',

            driverKind: null,
            index: exchIdx,
            instLabel: `${ed.name} ${String.fromCharCode(97+exchIdx)}`,
            attrs: ed.attrs || [],
            piTagBase,
            electricDriver: false,
          });
          exchIdx++;
        }
      });
    });

  /*  Turbines (routed, per turbine type)  */
  STEAM_TURBINE.forEach(tt=>{
    const ed = elFromTree(tt.key) || { key:tt.key, name: tt.name, icon:'⚙️', attrs:[], group:'gen' };
    const grpInfo = def.groups?.[ed.group] || {};

    STEAM_HEADERS.forEach(h=>{
      if (area.activeHeaders && !area.activeHeaders.includes(h.key)) return;
      const routes = Object.entries(s.tbn[h.key]||{}).filter(([rk])=>trbParse(rk).typeKey === tt.key);
      routes.forEach(([rk, cnt])=>{
        const parsed = trbParse(rk);
        const sc = TURBINE_SUBCATS.find(x=>x.id===parsed.subcat);
        const subLabel = sc ? sc.label : (parsed.subcat==='other' ? 'Other' : parsed.subcat);
        const dstShorts = (parsed.dsts||[]).map(dk => steamHdrByKey(dk)?.short || dk).join('  ');
        const routeLabel = `${h.short}  ${dstShorts || 'condenser'}${subLabel && subLabel!=='(Generic)' ? ' ('+subLabel+')' : ''}`;
        for(let i=0; i<cnt; i++){
          const overallIdx = cum + i;
          const piTagBase = makePITagBase(areaMeta.plantName, areaMeta.areaTag, ed, overallIdx);
          const displayBase = (subLabel && subLabel!=='(Generic)') ? subLabel : ed.name;
          rows.push({
            instanceId: `steam::${areaMeta.plantId}::${tt.key}::${h.key}::${rk}::${overallIdx}`,
            ...netMeta, ...areaMeta,
            elemKey: tt.key, elemName: ed.name, elemIcon: ed.icon,
            groupKey: ed.group||'gen', groupLabel: grpInfo.name||'',
            role: 'Generator (Turbine)',
            header: h.short, routeKey: rk, routeLabel,
            driverKind: null,
            index: overallIdx,
            instLabel: `${displayBase} ${String.fromCharCode(97+overallIdx)}`,
            attrs: ed.attrs || [],
            piTagBase,
            electricDriver: false,
          });
        }
        cum += cnt;
      });
    });
  });

  /*  Letdowns  */
  {
    const ed = elFromTree('letdown_station') || { key:'letdown_station', name:'Letdown Station', icon:'⏬', attrs:[], group:'dist' };
    const grpInfo = def.groups?.[ed.group] || {};
    let letIdx = 0;
    STEAM_HEADERS.forEach(h=>{
      if (area.activeHeaders && !area.activeHeaders.includes(h.key)) return;
      const routes = Object.entries(s.let[h.key]||{});
      routes.forEach(([dstKey, cnt])=>{
        const dstShort = steamHdrByKey(dstKey)?.short || dstKey;
        const routeLabel = `${h.short}  ${dstShort}`;
        for(let i=0; i<cnt; i++){
          const piTagBase = makePITagBase(areaMeta.plantName, areaMeta.areaTag, ed, letIdx);
          rows.push({
            instanceId: `steam::${areaMeta.plantId}::letdown_station::${h.key}::${dstKey}::${letIdx}`,
            ...netMeta, ...areaMeta,
            elemKey:'letdown_station', elemName: ed.name, elemIcon: ed.icon,
            groupKey: ed.group||'dist', groupLabel: grpInfo.name||'',
            role: ed.role || 'Distribution',
            header: h.short, routeKey: dstKey, routeLabel,
            driverKind: null,
            index: letIdx,
            instLabel: `${ed.name} ${String.fromCharCode(97+letIdx)}`,
            attrs: ed.attrs || [],
            piTagBase,
            electricDriver: false,
          });
          letIdx++;
        }
      });
    });
  }

  /* Steam headers (VHP, HP2, HP1, MP2, MP1, LP1, LP2, CND) are infrastructure
     pressure levels, not metered equipment. They are excluded from the inventory
     so equipment counts match the plant assignment data. */
}

function _invWalkPowerArea(rows, netMeta, areaMeta, area, def){

    for(let i=0; i<cnt; i++){
