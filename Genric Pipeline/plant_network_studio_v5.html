  return w;
}
/* Ensure a.attrs[el][idx] exists as an array. On first creation, seeded from
   ed.attrs template and auto-classified (varType, costType inferred from name).
   After creation, the array is user-owned: removed rows stay removed, added
   customs stay added. Only seeds once. */
function ensureAttrSet(area, ed, idx){
  if(!area.attrs[ed.key]) area.attrs[ed.key]={};
  let cur = area.attrs[ed.key][idx];
  if (!Array.isArray(cur)){
    cur = ed.attrs.map(at=>({
      name:at.name, uom:at.uom||'',
      pi:'', flagSip:0, sipMin:'', sipMax:'', formula:'',
      /* Three operating conditions  mirrors datasheet practice */
      default:'',   /* NOR  Normal Operating (DCS day-to-day; drives cost roll-up) */
      design:'',    /* DSN  Design (equipment sizing basis, typically +1015% of NOR) */
      rated:'',     /* RTD  Rated / Nameplate maximum */
      /* EO optimization fields  auto-inferred on creation */
      varType:   inferVarType(at.name, ed),
      designMin: '', designMax:'',
      costCoef:  '',
      costType:  inferCostType(at.name, ed),
    }));
    area.attrs[ed.key][idx] = cur;
  } else {
    /* Migrate older entries that lack fields */
    cur.forEach(at=>{
      if(at.varType===undefined)   at.varType   = inferVarType(at.name, ed);
      if(at.designMin===undefined) at.designMin = '';
      if(at.designMax===undefined) at.designMax = '';
      if(at.costCoef===undefined)  at.costCoef  = '';
      if(at.costType===undefined)  at.costType  = inferCostType(at.name, ed);
      if(at.design===undefined)    at.design    = '';
      if(at.rated===undefined)     at.rated     = '';
    });
  }
  return cur;
}

/* Ensure a.meta[ed.key][idx] exists  per-instance operational metadata */
function ensureInstanceMeta(area, ed, idx){
  if(!area.meta) area.meta={};
  if(!area.meta[ed.key]) area.meta[ed.key]={};
  if(!area.meta[ed.key][idx]){
    const plantName = STATE.plants.find(p=>p.id===area.plantId)?.name || area.tag || area.name;
    area.meta[ed.key][idx] = {
      serviceMode:'in-service',  /* in-service | spare | maintenance | out */
      designLoad: '',            /* % of design capacity */
      piTagBase:  makePITagBase(plantName, area.tag||area.name, ed, idx),
      notes:      '',
    };
  }
  return area.meta[ed.key][idx];
}

/* ============================================================================
 *  PANE 5a  FUEL NETWORK REVIEW + DIAGRAM
 * ============================================================================ */
function paneFuelReview(){
  const n=curNet(), d=curDef();
  const w=el('div');
  const FUEL_EQ = d.elementTree.filter(e => e.group === 'con');

  /* Aggregate fuel data across all areas */
  let totalSources = 0, totalPlants = 0, totalEquip = 0;
  const plantSummary = [];
  n.areas.forEach(a => {
    totalSources += +(a.counts?.fuel_import || 0);
    if (!a.fuelPlants) return;
    STATE.plants.forEach(p => {
      if (!a.fuelPlants[p.id]) return;
      totalPlants++;
      const pe = (a.fuelEquip && a.fuelEquip[p.id]) || {};
      const eqItems = [];
      FUEL_EQ.forEach(eq => {
        const c = +(pe[eq.key] || 0);
        if (c > 0) { totalEquip += c; eqItems.push({ eq, count: c }); }
      });
      plantSummary.push({ plant: p, area: a, equipment: eqItems });
    });
  });

  w.innerHTML = `
    <div class="section-title"><span class="accent"></span> Review ${d.name}</div>
    <div class="review-stats">
      <div class="rs"><div class="val">${n.areas.length}</div><div class="lbl">Plant Areas</div></div>
      <div class="rs"><div class="val">${totalSources}</div><div class="lbl">Fuel Imports</div></div>
      <div class="rs"><div class="val">${totalPlants}</div><div class="lbl">Consumer Plants</div></div>
      <div class="rs"><div class="val">${totalEquip}</div><div class="lbl">Equipment</div></div>
    </div>`;

  /* Fuel Network Diagram */
  const diagBox = el('div'); diagBox.id = 'fuelDiagramBox'; diagBox.style.cssText = 'margin:16px 0; min-height:400px;';
  w.appendChild(diagBox);
  setTimeout(() => drawFuelDiagram(diagBox, n, d, plantSummary), 50);

  /* Tree view */
  const tree = el('div','tree');
  let html = `<div class="tlevel">  Fuel Network</div>`;
  n.areas.forEach(a => {
    html += `\n  <div class="tarea">  ${esc(a.name)} ${a.tag ? '<span class="tcount">['+esc(a.tag)+']</span>' : ''}</div>`;
    const srcCount = +(a.counts?.fuel_import || 0);
    if (srcCount > 0) html += `\n    <div class="tnode">  Fuel Import <span class="tcount"> ${srcCount}</span></div>`;
    if (a.fuelPlants) {
      STATE.plants.forEach(p => {
        if (!a.fuelPlants[p.id]) return;
        const pe = (a.fuelEquip && a.fuelEquip[p.id]) || {};
        html += `\n    <div class="tnode" style="border-left:2px solid #f0883e;padding-left:8px;margin-left:4px">  <b>${esc(p.name)}</b></div>`;
        FUEL_EQ.forEach(eq => {
          const c = +(pe[eq.key] || 0);
          if (c > 0) html += `\n      <div class="tnode" style="margin-left:20px"> ${eq.icon||''} ${esc(eq.name.replace('Specific ',''))} <span class="tcount"> ${c}</span></div>`;
        });
      });
    }
  });
  tree.innerHTML = html;
  w.appendChild(tree);
  return w;
}

function drawFuelDiagram(box, net, def, plantSummary) {
  box.innerHTML = '';
  if (typeof d3 === 'undefined' || !window.d3) { box.innerHTML = '<div style="padding:20px;color:var(--text3)">D3 unavailable</div>'; return; }

  const FUEL_EQ = def.elementTree.filter(e => e.group === 'con');
  const W = Math.max(box.clientWidth || 1100, 900);
  const TOP = 60, HEADER_Y = 50, PLANT_GAP = 200;
  const consumerPlants = plantSummary.filter(ps => ps.equipment.length > 0 || true);
  const H = Math.max(480, TOP + 120 + consumerPlants.length * PLANT_GAP + 80);

  const svg = d3.select(box).append('svg').attr('class','ufd-svg').attr('width', W).attr('height', H);
  const defs = svg.append('defs');
  const grad = defs.append('linearGradient').attr('id','fuel-shell-grad').attr('x1','0').attr('y1','0').attr('x2','0').attr('y2','1');
  grad.append('stop').attr('offset','0%').attr('stop-color','#1f2940');
  grad.append('stop').attr('offset','100%').attr('stop-color','#0a0e17');
  defs.append('marker').attr('id','fuel-arrow').attr('viewBox','0 -5 10 10').attr('refX',8).attr('refY',0)
    .attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto')
    .append('path').attr('d','M0,-4L8,0L0,4Z').attr('fill','#f0c040');
  defs.append('marker').attr('id','fuel-arrow-orange').attr('viewBox','0 -5 10 10').attr('refX',8).attr('refY',0)
    .attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto')
    .append('path').attr('d','M0,-4L8,0L0,4Z').attr('fill','#f0883e');

  /* Count total fuel imports */
  let totalImports = 0;
  net.areas.forEach(a => { totalImports += +(a.counts?.fuel_import || 0); });

  /*  Fuel Import node (left side)  */
  const importX = 100, importY = H / 2;
  const gi = svg.append('g').attr('transform', `translate(${importX},${importY})`);
  gi.append('rect').attr('x', -55).attr('y', -25).attr('width', 110).attr('height', 50).attr('rx', 8)
    .attr('fill', 'url(#fuel-shell-grad)').attr('stroke', '#bc8cff').attr('stroke-width', 2);
  gi.append('text').attr('text-anchor', 'middle').attr('y', -4).attr('fill', '#bc8cff')
    .attr('font-size', '11px').attr('font-weight', '700').text(' Fuel Import');
  gi.append('text').attr('text-anchor', 'middle').attr('y', 14).attr('fill', '#8899aa')
    .attr('font-size', '10px').text(totalImports > 0 ? ' ' + totalImports : '');

  /*  Fuel Header (central vertical line)  */
  const headerX = 300;
  const headerTop = TOP + 40;
  const headerBot = H - 40;
  svg.append('line').attr('x1', headerX).attr('y1', headerTop).attr('x2', headerX).attr('y2', headerBot)
    .attr('stroke', '#f0c040').attr('stroke-width', 4).attr('opacity', 0.8);
  svg.append('text').attr('x', headerX).attr('y', headerTop - 12).attr('text-anchor', 'middle')
    .attr('fill', '#f0c040').attr('font-size', '12px').attr('font-weight', '700').text('Fuel Header');

  /* Import  Header line */
  svg.append('path')
    .attr('d', `M${importX + 55},${importY} L${headerX - 6},${importY}`)
    .attr('stroke', '#f0c040').attr('stroke-width', 2).attr('stroke-dasharray', '5 3')
    .attr('marker-end', 'url(#fuel-arrow)').attr('opacity', 0.8);

  /*  Consumer plants (right side)  */
  if (consumerPlants.length === 0) {
    svg.append('text').attr('x', W / 2 + 80).attr('y', H / 2).attr('text-anchor', 'middle')
      .attr('fill', '#556677').attr('font-size', '13px').text('No consumer plants selected yet');
    return;
  }

  const plantStartY = TOP + 80;
  const plantSpacing = Math.min(PLANT_GAP, (H - plantStartY - 40) / Math.max(consumerPlants.length, 1));
  const plantX = 500;
  const eqStartX = 700;

  consumerPlants.forEach((ps, pi) => {
    const py = plantStartY + pi * plantSpacing;

    /* Header  Plant line */
    svg.append('path')
      .attr('d', `M${headerX + 4},${py} L${plantX - 60},${py}`)
      .attr('stroke', '#f0883e').attr('stroke-width', 1.8).attr('stroke-dasharray', '5 3')
      .attr('marker-end', 'url(#fuel-arrow-orange)').attr('opacity', 0.7);

    /* Plant node */
    const gp = svg.append('g').attr('transform', `translate(${plantX},${py})`);
    gp.append('rect').attr('x', -55).attr('y', -22).attr('width', 110).attr('height', 44).attr('rx', 8)
      .attr('fill', 'url(#fuel-shell-grad)').attr('stroke', '#f0883e').attr('stroke-width', 2);
    const pName = ps.plant.name.length > 12 ? ps.plant.name.slice(0, 11) + '' : ps.plant.name;
    gp.append('text').attr('text-anchor', 'middle').attr('y', -2).attr('fill', '#f0883e')
      .attr('font-size', '11px').attr('font-weight', '700').text(' ' + pName);
    const eqCount = ps.equipment.reduce((s, e) => s + e.count, 0);
    gp.append('text').attr('text-anchor', 'middle').attr('y', 14).attr('fill', '#8899aa')
      .attr('font-size', '10px').text(eqCount > 0 ? eqCount + ' equip' : 'whole plant');

    /* Equipment nodes */
    if (ps.equipment.length > 0) {
      const eqSpacing = Math.min(50, 44);
      const eqTopY = py - (ps.equipment.length - 1) * eqSpacing / 2;
      ps.equipment.forEach((eqItem, ei) => {
        const ey = eqTopY + ei * eqSpacing;
        const ex = eqStartX + 40;

        /* Plant  Equipment line */
        svg.append('path')
          .attr('d', `M${plantX + 55},${py} C${plantX + 90},${py} ${ex - 60},${ey} ${ex - 35},${ey}`)
          .attr('stroke', '#556677').attr('stroke-width', 1.2).attr('stroke-dasharray', '3 3')
          .attr('fill', 'none').attr('opacity', 0.6);

        const ge = svg.append('g').attr('transform', `translate(${ex},${ey})`);
        ge.append('rect').attr('x', -30).attr('y', -15).attr('width', 130).attr('height', 30).attr('rx', 6)
          .attr('fill', 'url(#fuel-shell-grad)').attr('stroke', '#556677').attr('stroke-width', 1.4);
        const eqName = eqItem.eq.name.replace('Specific ', '');
        ge.append('text').attr('x', 35).attr('y', 1).attr('text-anchor', 'middle')
          .attr('fill', '#aabbcc').attr('font-size', '10px').attr('font-weight', '600')
          .text((eqItem.eq.icon || '') + ' ' + eqName);
        ge.append('text').attr('x', 35).attr('y', 13).attr('text-anchor', 'middle')
          .attr('fill', '#667788').attr('font-size', '9px').text(' ' + eqItem.count);
      });
    }
  });
}

function paneNonSec() {
  const allItems = buildEquipmentInventory();
  const items = allItems.filter(it => {
    if (it.netKey !== 'steam' && it.netKey !== 'power') return false;
    if ((it.plantName || '').trim().toLowerCase() !== 'utility unit') return false;
    return true;
  });

  if(!STATE._nonSecFilter) STATE._nonSecFilter = { search: '', plantIds: [] };
  if(!Array.isArray(STATE._nonSecFilter.plantIds)) STATE._nonSecFilter.plantIds = [];
  if(typeof STATE._nonSecFilter.search !== 'string') STATE._nonSecFilter.search = '';

  if(STATE._nonSecFilter.plantIds.length === 0) {
    STATE._nonSecFilter.plantIds = (STATE.plants||[]).map(p => p.id);
  }
  const plantSel = new Set(STATE._nonSecFilter.plantIds);

  const w = el('div');
  w.innerHTML = `
    <div class="section-title"><span class="accent"></span> Non Significant Energy Users</div>
    <div class="section-hint" style="font-size:12.5px;color:var(--text3);margin-bottom:20px">
      This inventory lists all equipment instances configured in utility networks that have NOT been designated as Significant Energy Users.
    </div>
  `;

  if(items.length === 0){
    const empty = el('div');
    empty.style.cssText = 'margin-top:24px';
    empty.appendChild(emptyState('','No Non Significant Energy Users','All equipment has been designated as Significant Energy Users, or no equipment is configured.'));
    w.appendChild(empty);
    return w;
  }

  const fbar = el('div');
  fbar.style.cssText = 'display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 10px';

  const srch = el('input');
  srch.type='text';
  srch.placeholder='Search non-SEC instances, plants, or networks...';
  srch.value = STATE._nonSecFilter.search || '';
  srch.style.cssText='flex:1;min-width:240px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;outline:none;font-family:var(--font)';
  srch.onfocus=()=>srch.style.borderColor='#F0C040';
  srch.onblur =()=>srch.style.borderColor='var(--border)';
  srch.oninput=()=>{ STATE._nonSecFilter.search = srch.value; saveState(); applyAndRender(); };
  fbar.appendChild(srch);

  const addBtn = el('button');
  addBtn.textContent = '+ Add Custom Equipment';
  addBtn.style.cssText = 'background:#F0C040;color:#1E1E2E;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px;font-family:var(--font);transition:all 0.15s;outline:none';
  addBtn.onmouseover = () => { addBtn.style.background = '#f2cb65'; };
  addBtn.onmouseout = () => { addBtn.style.background = '#F0C040'; };
  addBtn.onclick = () => { openAddCustomNonSecModal(); };
  fbar.appendChild(addBtn);

  w.appendChild(fbar);

  if ((STATE.plants||[]).length > 1){
    const pbar = el('div');
    pbar.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px';
    const plbl = el('span');
    plbl.style.cssText='font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-right:4px;font-weight:600';
    plbl.textContent = ' Select Plant:';
    pbar.appendChild(plbl);
    
    const plantCounts = {};
    items.forEach(it => { plantCounts[it.plantId] = (plantCounts[it.plantId]||0) + 1; });
    (STATE.plants||[]).forEach(p=>{
      const cnt = plantCounts[p.id] || 0;
      if (cnt === 0) return;
      const on = plantSel.has(p.id);
      const chip = el('label');
      chip.style.cssText = 'display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1.5px solid '+(on?'#F0C040':'var(--border)')+';background:'+(on?'rgba(240,192,64,.12)':'var(--bg3)')+';cursor:pointer;font-size:11.5px;color:'+(on?'var(--text)':'var(--text2)')+';user-select:none;transition:all .15s;font-weight:'+(on?'700':'500');
      chip.innerHTML = '<input type="checkbox" '+(on?'checked':'')+' style="accent-color:#F0C040;width:13px;height:13px;cursor:pointer">'
        + '<span style="color:'+(on?'var(--green)':'var(--text3)') +';font-size:8px;margin-right:2px">●</span>'
        + esc(p.name)
        + '<span style="font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;background:'+(on?'var(--green)':'var(--bg4)')+';color:'+(on?'#fff':'var(--text3)')+'">'+cnt+'</span>';
      chip.querySelector('input').onchange = (e)=>{
        if(e.target.checked) { plantSel.add(p.id); }
        else { plantSel.delete(p.id); }
        STATE._nonSecFilter.plantIds = [...plantSel];
        saveState(); render();
      };
      pbar.appendChild(chip);
    });
    w.appendChild(pbar);
  }

  const tableContainer = el('div');
  tableContainer.style.cssText = 'background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:10px';
  w.appendChild(tableContainer);

  function applyAndRender() {
    tableContainer.innerHTML = '';
    const q = (STATE._nonSecFilter.search||'').trim().toLowerCase();
    const visible = items.filter(r => {
      if ((STATE.plants||[]).length > 1 && plantSel.size === 0) return false;
      if (plantSel.size > 0 && !plantSel.has(r.plantId)) return false;
      if (!q) return true;
      return [r.instLabel, r.elemName, r.header, r.piTagBase, r.routeLabel, r.plantName, r.netName, r.role]
        .some(s => (s||'').toLowerCase().includes(q));
    });

    if (visible.length === 0) {
      tableContainer.appendChild(emptyState('', 'No matching instances found', 'Refine your search query or plant filters.'));
      return;
    }

    if(!STATE._nonSecExcluded) STATE._nonSecExcluded = {};

    const table = el('table');
    table.style.cssText = 'width:100%;border-collapse:collapse;font-size:13px;text-align:left;color:var(--text2)';
    
    const thStyle = 'padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--border);font-weight:700;color:var(--text);font-size:11px;text-transform:uppercase;letter-spacing:0.5px';
    table.innerHTML = `
      <thead>
        <tr>
          <th style="${thStyle};text-align:center;width:80px">Include</th>
          <th style="${thStyle}">Plant</th>
          <th style="${thStyle}">Area</th>
          <th style="${thStyle}">Network</th>
          <th style="${thStyle}">Group / Role</th>
          <th style="${thStyle}">Equipment / Label</th>
          <th style="${thStyle}">Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;
    
    const tbody = table.querySelector('tbody');
    visible.forEach((it, idx) => {
      const tr = el('tr');
      tr.style.cssText = `border-bottom:1px solid var(--border);background:${idx % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.015)'}`;
      
      const isExcluded = !!(STATE._nonSecExcluded && STATE._nonSecExcluded[it.instanceId]);
      const tdStyle = 'padding:10px 14px;vertical-align:middle;';
      
      const chkCell = el('td');
      chkCell.style.cssText = tdStyle + 'text-align:center;';
      const rowChk = el('input');
      rowChk.type = 'checkbox';
      rowChk.checked = !isExcluded;
      rowChk.style.cssText = 'width:16px;height:16px;cursor:pointer;accent-color:#F0C040;vertical-align:middle';
      rowChk.onchange = () => {
        if (!STATE._nonSecExcluded) STATE._nonSecExcluded = {};
        if (rowChk.checked) {
          delete STATE._nonSecExcluded[it.instanceId];
        } else {
          STATE._nonSecExcluded[it.instanceId] = true;
        }
        saveState();
        applyAndRender();
      };
      chkCell.appendChild(rowChk);

      tr.innerHTML = `
        <td style="${tdStyle}">${esc(it.plantName)}</td>
        <td style="${tdStyle}"><span class="badge" style="font-family:var(--mono);background:var(--bg4);color:var(--text3);font-size:10px">${esc(it.areaTag)}</span></td>
        <td style="${tdStyle}"><span style="color:${it.netColor};font-weight:600">${it.netIcon} ${esc(it.netName)}</span></td>
        <td style="${tdStyle}"><span style="color:var(--text3);font-size:11px">${esc(it.groupLabel || it.role || '')}</span></td>
        <td style="${tdStyle}">
          <div style="font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px">
            <span>${it.elemIcon}</span>
            <span>${esc(it.instLabel)}</span>
            ${it.custom ? `<button class="custom-del-btn" style="background:none;border:none;color:#ff5555;cursor:pointer;font-size:12px;padding:2px 4px;margin-left:8px;" title="Delete custom equipment">🗑️</button>` : ''}
          </div>
        </td>
        <td style="${tdStyle}">
          <span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;background:${isExcluded ? 'rgba(255,255,255,0.04)' : 'rgba(63,185,80,0.08)'};color:${isExcluded ? 'var(--text3)' : '#3fb950'};font-size:11px;font-weight:600">
            ● ${isExcluded ? 'Excluded' : 'Non-Significant'}
          </span>
        </td>
      `;
      tr.insertBefore(chkCell, tr.firstChild);

      if (it.custom) {
        const delBtn = tr.querySelector('.custom-del-btn');
        if (delBtn) {
          delBtn.onclick = (e) => {
            e.stopPropagation();
            if (confirm(`Are you sure you want to delete custom item "${it.instLabel}"?`)) {
              STATE._customNonSecItems = (STATE._customNonSecItems || []).filter(x => x.instanceId !== it.instanceId);
              if (STATE._nonSeuConfig) {
                delete STATE._nonSeuConfig[it.instanceId];
              }
              if (STATE._nonSecExcluded) {
                delete STATE._nonSecExcluded[it.instanceId];
              }
              saveState();

              // Refresh items array
              items.length = 0;
              const freshAll = buildEquipmentInventory();
              const freshFiltered = freshAll.filter(x => {
                if (x.netKey !== 'steam') return false;
                if ((x.plantName || '').trim().toLowerCase() !== 'utility unit') return false;
                return true;
              });
              freshFiltered.forEach(x => items.push(x));

              applyAndRender();
            }
          };
        }
      }

      tbody.appendChild(tr);
    });
    tableContainer.appendChild(table);
  }

  applyAndRender();
  return w;
}

/* ============================================================================
 *  PANE 5  REVIEW HUB (network selector + per-network review)
 * ============================================================================ */
function paneReviewHub(){
  const w = el('div');

  /* Available networks to review  only non-external ones that have data */
  const reviewable = Object.entries(NETWORKS)
    .filter(([k, def]) => !def.external)
    .map(([k, def]) => ({ k, def, net: STATE.nets[k] }));

  /* Default to current active network on first visit */
  if (!STATE.reviewNet || !NETWORKS[STATE.reviewNet] || NETWORKS[STATE.reviewNet].external) {
    STATE.reviewNet = STATE.activeNet;
  }

  /*  Network selector bar  */
  const selectorWrap = el('div');
  selectorWrap.style.cssText = 'margin-bottom:18px;';
  selectorWrap.innerHTML = `<div class="section-title" style="margin-bottom:10px;"><span class="accent"></span> Review Network</div>`;

  const btnRow = el('div');
  btnRow.style.cssText = 'display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;';

  reviewable.forEach(({ k, def, net }) => {
    const totalEl = netTotalElements(net);
    const isActive = STATE.reviewNet === k;
    const btn = el('button');
    btn.style.cssText = `display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:8px; border:2px solid ${isActive ? def.color : 'var(--border)'}; background:${isActive ? 'var(--bg3)' : 'var(--bg2)'}; cursor:pointer; font-size:13px; font-weight:${isActive ? '700' : '500'}; color:${isActive ? def.color : 'var(--text2)'};`;
    btn.innerHTML = `<span>${def.icon}</span><span>${def.name}</span><span style="background:${isActive?def.color:'var(--bg4)'};color:${isActive?'#000':'var(--text3)'};border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;">${totalEl}</span>`;
    btn.onclick = () => { STATE.reviewNet = k; saveState(); renderBody(); };
    btnRow.appendChild(btn);
  });
  selectorWrap.appendChild(btnRow);
  w.appendChild(selectorWrap);

  /*  Render selected network's review  */
  const selKey = STATE.reviewNet;
  const selDef = NETWORKS[selKey];
  const selNet = STATE.nets[selKey];

  /* Temporarily swap active net so review functions use the right context */
  const prevNet = STATE.activeNet;
  STATE.activeNet = selKey;

  const reviewPane = el('div');
  if (selDef.customUI === 'steam') {
    reviewPane.appendChild(paneSteamReview());
  } else if (selKey === 'fuel_network') {
    reviewPane.appendChild(paneFuelReview());
  } else {
    reviewPane.appendChild(paneReview());
  }

  STATE.activeNet = prevNet;   /* restore */
  w.appendChild(reviewPane);
  return w;
}

/* ============================================================================
 *  PANE 5  REVIEW + DIAGRAM
 * ============================================================================ */
function paneReview(){
  const n=curNet(), d=curDef();
  const w=el('div');
  const totalInst = netTotalElements(n);
  const distinctTypes = new Set();
  n.areas.forEach(a=>Object.entries(a.counts).forEach(([k,v])=>{ if(+v>0) distinctTypes.add(k); }));
  const routes = n.routing.length;
  const incomplete = [];

  /* Aggregate stats across all instances for EO summary */
  const vCount = {MV:0,CV:0,DV:0,PV:0};
  const costAgg = {};   /* costType  totalCost (rate  default  hours) */
  const flowAgg = {fuel:0, electricity:0, steam:0, cooling_water:0};   /* for balance check */
  const hours = +getSystemCostRate('Annual Operating Hours') || 8000;
  let inService = 0, spare = 0, maintenance = 0, outOfService = 0;
  let attrsWithPI = 0, attrsWithDefault = 0, attrsWithSIP = 0, attrsWithLimits = 0, totalAttrs = 0;

  n.areas.forEach(a=>{
    Object.entries(a.counts).forEach(([k,v])=>{
      if(+v<=0) return;
      const ed=elemDef(k); if(!ed) return;
      for(let i=0;i<v;i++){
        const arr = ensureAttrSet(a, ed, i);
        const meta= ensureInstanceMeta(a, ed, i);
        if(meta.serviceMode==='in-service') inService++;
        else if(meta.serviceMode==='spare') spare++;
        else if(meta.serviceMode==='maintenance') maintenance++;
        else if(meta.serviceMode==='out') outOfService++;

        const filled = arr.filter(at=>(at.default??'')!==''||(at.pi??'')!=='').length;
        if (filled < ed.attrs.length) incomplete.push(`${a.name}  ${ed.name} #${i+1} (${filled}/${ed.attrs.length})`);

        /* Skip spare/out from cost & balance aggregation */
        const include = meta.serviceMode==='in-service'||meta.serviceMode==='maintenance';

        arr.forEach(at=>{
          totalAttrs++;
          if(at.pi)       attrsWithPI++;
          if(at.default!=='') attrsWithDefault++;
          if(at.flagSip)  attrsWithSIP++;
          if(at.designMin!=='' || at.designMax!=='') attrsWithLimits++;
          vCount[at.varType||'CV'] = (vCount[at.varType||'CV']||0)+1;

          if(include && at.costType && at.default!==''){
            const ct = COST_TYPES[at.costType];
            if(!ct) return;
            const rate = at.costCoef!=='' ? +at.costCoef : (ct.rateAttr ? +getSystemCostRate(ct.rateAttr) : 0);
            const flow = +at.default || 0;
            const cost = rate * flow * hours;
            costAgg[at.costType] = (costAgg[at.costType]||0) + cost;
            if(at.costType==='fuel') flowAgg.fuel += flow;
            else if(at.costType==='electricity') flowAgg.electricity += flow;
            else if(/^steam_/.test(at.costType)) flowAgg.steam += flow;
            else if(at.costType==='cooling_water') flowAgg.cooling_water += flow;
          }
        });
      }
    });
  });

  const totalCost = Object.values(costAgg).reduce((s,v)=>s+v,0);
  const fmt = (n)=> n>=1e6 ? (n/1e6).toFixed(2)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : n.toFixed(1);
  const fmtUSD = (n)=> '$'+fmt(n);

  w.innerHTML = `
    <div class="section-title"><span class="accent"></span> Review ${d.name}</div>
    <div class="review-stats">
      <div class="rs"><div class="val">${n.areas.length}</div><div class="lbl">Plant Areas</div></div>
      <div class="rs"><div class="val">${distinctTypes.size}</div><div class="lbl">Element Types</div></div>
      <div class="rs"><div class="val">${totalInst}</div><div class="lbl">SEU's</div></div>
      <div class="rs"><div class="val">${inService}</div><div class="lbl"> In-Service</div></div>
      <div class="rs"><div class="val" style="color:var(--cyan)">${spare}</div><div class="lbl"> Spare</div></div>
      <div class="rs"><div class="val" style="color:var(--yellow)">${fmtUSD(totalCost)}</div><div class="lbl">/yr OpEx</div></div>
    </div>
  `;

  /* EO Optimization Readiness and Mass/Energy Balance sections removed */

  /* Validation strip */
  const val = el('div'); val.style.marginBottom='14px';
  if(totalInst===0) val.appendChild(warnLine('warning','No elements placed yet.'));
  if(d.routing?.enabled && routes===0 && totalInst>0) val.appendChild(warnLine('warning','No connections defined  the optimizer needs sourcedestination links.'));
  if(incomplete.length>0) val.appendChild(warnLine('warning',`${incomplete.length} instance(s) have missing design attributes.`));
  if(totalInst>0 && incomplete.length===0 && (!d.routing?.enabled || routes>0)) val.appendChild(warnLine('ok','Network is complete and ready to export.'));
  w.appendChild(val);

  /* Tree */
  const tree = el('div','tree');
  let html = `<div class="tlevel"> ${d.icon} ${d.name}</div>`;
  n.areas.forEach(a=>{
    const cnt = getAreaTotalPlaced(a, d);
    html += `\n  <div class="tarea">  ${esc(a.name)} ${a.tag?'<span class="tcount">['+esc(a.tag)+']</span>':''} <span class="tcount">${cnt} element(s)</span></div>`;
    Object.entries(a.counts).forEach(([k,v])=>{
      if(+v<=0) return;
      const ed = elemDef(k); if(!ed) return;
      const label = getElementLabel(k, ed);
      html += `\n    <div class="tnode"> ${eqIcon(ed,14)} ${esc(label)} <span class="tcount"> ${v}</span></div>`;
    });
  });
  if (n.routing.length){
    html += `\n  <div class="tlevel">  Connections</div>`;
    n.routing.forEach(r=>{
      const ar = n.areas.find(x=>x.id===r.area)?.name||'?';
      const fr = elemDef(r.from), to = elemDef(r.to);
      html += `\n    <div class="tnode"> ${esc(ar)}: ${fr?.icon||''}${esc(fr?.name||r.from)}  ${to?.icon||''}${esc(to?.name||r.to)} <span class="tcount"> ${r.count}</span></div>`;
    });
  }
  tree.innerHTML = html;
  w.appendChild(tree);

  /* Diagram */
  const diag = el('div'); diag.id='diagramBox'; diag.style.marginTop='16px';
  w.appendChild(diag);
  setTimeout(()=>drawDiagram(diag), 50);
  return w;
}
function warnLine(kind,msg){ const e=el('div','warn '+kind,(kind==='ok'?' ':kind==='error'?' ':' ')+msg); return e; }

/* ============================================================================
 *  DIAGRAM (D3 force-directed)
 * ============================================================================ */
function drawDiagram(box){
  const n=curNet(), d=curDef();
  box.innerHTML='';
  const W = box.clientWidth || 1100, H = 520;
  const svg = d3.select(box).append('svg').attr('class','ufd-svg').attr('width',W).attr('height',H);
  const tipEl = el('div','ufd-tooltip'); box.appendChild(tipEl); const tip = d3.select(tipEl);

  /* Build nodes: one per area, plus one per element-instance grouped under area */
  const nodes = [];
  const links = [];
  n.areas.forEach((a,ai)=>{
    nodes.push({ id:'area:'+a.id, type:'area', label:a.name, tag:a.tag, _area:a, fx: 80 + ai*180, fy: 60 });
    Object.entries(a.counts).forEach(([k,v])=>{
      if(+v<=0) return;
      const ed = elemDef(k); if(!ed) return;
      const nid = 'el:'+a.id+':'+k;
      const grp = d.groups ? d.groups[ed.group] : null;
      nodes.push({ id:nid, type:'el', label:ed.name, icon:ed.icon, edKey:ed.key, qty:v, area:a.name, color: grp?.color || d.color });
      links.push({ source:'area:'+a.id, target:nid, kind:'place' });
    });
  });
  /* Cross-area routing */
  if (d.routing?.enabled){
    n.routing.forEach(r=>{
      const fr = 'el:'+r.area+':'+r.from, to='el:'+r.area+':'+r.to;
      if (nodes.find(x=>x.id===fr) && nodes.find(x=>x.id===to)){
        links.push({ source:fr, target:to, kind:'route', count:r.count });
      }
    });
  }
  if (!nodes.length){
    svg.append('text').attr('x',W/2).attr('y',H/2).attr('text-anchor','middle').attr('class','ufd-sub').text('No nodes  add areas & elements to see the diagram.');
    return;
  }

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(x=>x.id).distance(l=>l.kind==='route'?150:90).strength(.7))
    .force('charge', d3.forceManyBody().strength(-380))
    .force('center', d3.forceCenter(W/2,H/2+30))
    .force('collide', d3.forceCollide(46));

  const gLinks = svg.append('g');
  const gNodes = svg.append('g');

  const link = gLinks.selectAll('path').data(links).join('path')
    .attr('class','ufd-link')
    .attr('stroke', l=>l.kind==='route'?d.color:'#3a4a6b')
    .attr('stroke-dasharray', l=>l.kind==='route'?'5 4':'2 3')
    .attr('opacity', l=>l.kind==='route'?.85:.4);

  const node = gNodes.selectAll('g').data(nodes).join('g').style('cursor','grab');
  node.call(d3.drag()
    .on('start', (ev,n2)=>{ if(!ev.active) sim.alphaTarget(.3).restart(); n2.fx=n2.x; n2.fy=n2.y; })
    .on('drag',  (ev,n2)=>{ n2.fx=ev.x; n2.fy=ev.y; })
    .on('end',   (ev,n2)=>{ if(!ev.active) sim.alphaTarget(0); if(n2.type!=='area'){ n2.fx=null; n2.fy=null; } })
  );

  /* Area nodes  bigger rect */
  node.filter(n2=>n2.type==='area').each(function(n2){
    const g=d3.select(this);
    g.append('rect').attr('x',-72).attr('y',-22).attr('width',144).attr('height',44).attr('rx',8)
     .attr('fill','#1a2236').attr('stroke',d.color).attr('stroke-width',2);
    g.append('text').attr('class','ufd-label').attr('y',-2).text(n2.label.length>16?n2.label.slice(0,15)+'':n2.label);
    g.append('text').attr('class','ufd-sub').attr('y',12).text(n2.tag||'AREA');
  });
  /* Element nodes  circle with embedded ISA-5.1 SVG icon (or emoji fallback) */
  node.filter(n2=>n2.type==='el').each(function(n2){
    const g=d3.select(this);
    g.append('circle').attr('class','ufd-node').attr('r',26).attr('fill','#0f1626').attr('stroke',n2.color);
    const ikey = ICON_MAP[n2.edKey];
    const rawSvg = ikey ? EQUIPMENT_ICONS[ikey] : null;
    if (rawSvg){
      /* Extract inner geometry from the 3232 viewBox icon and inject scaled & centered.
         Color inherits from the group via stroke="currentColor". */
      const innerMatch = rawSvg.match(/<svg[^>]*>([\s\S]*)<\/svg>/);
      if (innerMatch){
        const size=26, scale=size/32;
        const ig = g.append('g')
          .attr('transform', `translate(${-size/2},${-(size/2)-2}) scale(${scale})`)
          .attr('color', n2.color)
          .style('color', n2.color);
        ig.node().innerHTML = innerMatch[1];
      }
    } else {
      g.append('text').attr('y',-3).attr('text-anchor','middle').attr('font-size','16').text(n2.icon);
    }
    g.append('text').attr('class','ufd-qty').attr('y',14).text(' '+n2.qty);
    g.append('text').attr('class','ufd-sub').attr('y',42).text(n2.label.length>18?n2.label.slice(0,17)+'':n2.label);
  });

  node.on('mouseenter', (ev,n2)=>{
    const r = box.getBoundingClientRect();
    const x = ev.clientX - r.left + 12, y = ev.clientY - r.top + 12;
    let html;
    if(n2.type==='area'){
      const a=n2._area, total=getAreaTotalPlaced(a, d);
      html = `<div class="ttl"> ${esc(a.name)}</div>
        <div class="row"><span>Tag</span><b>${esc(a.tag||'')}</b></div>
        <div class="row"><span>Elements</span><b>${total}</b></div>`;
    } else {
      const _ik = ICON_MAP[n2.edKey];
      const _ic = _ik ? isaSVG(_ik,16) : `<span class="eq-emoji">${n2.icon}</span>`;
      html = `<div class="ttl">${_ic} ${esc(n2.label)}</div>
        <div class="row"><span>Area</span><b>${esc(n2.area)}</b></div>
        <div class="row"><span>Quantity</span><b> ${n2.qty}</b></div>`;
    }
    tip.html(html).style('left',x+'px').style('top',y+'px').style('opacity','1');
  });
  node.on('mousemove', (ev)=>{
    const r = box.getBoundingClientRect();
    tip.style('left',(ev.clientX-r.left+12)+'px').style('top',(ev.clientY-r.top+12)+'px');
  });
  node.on('mouseleave', ()=> tip.style('opacity','0'));

  sim.on('tick',()=>{
    link.attr('d', l=>{
      const x1=l.source.x, y1=l.source.y, x2=l.target.x, y2=l.target.y;
      const mx=(x1+x2)/2;
      return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
    });
    node.attr('transform', n2=>`translate(${n2.x},${n2.y})`);
  });
}

/* ============================================================================
 *  KPI CONFIG PANE
 * ============================================================================ */
function paneOptConfig(){
  if (!STATE._optSubTab) STATE._optSubTab = 'objfunc';

  const SUB_TABS = [
    { id:'objfunc',   label:'Objective function',  icon:'🎯', done: () => false },
    { id:'vars',      label:'Variables',           icon:'✖️', done: () => false },
    { id:'derived',   label:'Derived equations',   icon:'🧮', done: () => false },
    { id:'constraints',label:'Constraints',        icon:'⚖️', done: () => false },
  ];

  const w = el('div');
  const hdr = el('div');
  hdr.style.cssText = 'display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:4px';
  hdr.innerHTML = `
    <div>
      <div class="section-title"><span class="accent"></span> Optimizer Config</div>
      <div class="section-hint">Configure optimizer objectives, variables, derived equations, and constraints.</div>
    </div>
  `;
  w.appendChild(hdr);

  const subBar = el('div','pc-subtab-bar');
  SUB_TABS.forEach(st => {
    const isActive = STATE._optSubTab === st.id;
    const cls = ['pc-subtab', isActive?'pc-active':''].filter(Boolean).join(' ');
    const btn = el('button', cls);
    btn.innerHTML = `
      <span>${st.icon}</span>
      <span>${st.label}</span>
    `;
    btn.onclick = () => { STATE._optSubTab = st.id; render(); };
    subBar.appendChild(btn);
  });
  w.appendChild(subBar);

  const panel = el('div','pc-panel');
  if (STATE._optSubTab === 'objfunc') {
    panel.innerHTML = '<div class="empty"><div class="e-ic">🎯</div><div class="e-tt">Objective Function</div><div class="e-st">Configure your optimization objective function here.</div></div>';
  } else if (STATE._optSubTab === 'vars') {
    if (!STATE.optVars)           STATE.optVars = [];
    if (!STATE._optVarsFilter)    STATE._optVarsFilter = 'all';
    if (!STATE._optVarsExpanded)  STATE._optVarsExpanded = [];
    if (!STATE._optVarAttrs)      STATE._optVarAttrs = {};

    /* ── Pre-build data ──────────────────────────────────────────────── */
    const _globalKpis = [];
    KPI_MASTER.forEach(kpi => _globalKpis.push({
      id: kpi.id, label: kpi.label, category: 'Global',
      details: kpi.formula || (kpi.tags ? kpi.tags.map(t=>t.p).join(', ') : '')
    }));
    if (STATE._masterKpis) {
      Object.keys(STATE._masterKpis).forEach(gk => {
        const kpis = STATE._masterKpis[gk];
        if (Array.isArray(kpis)) kpis.forEach(kpi => _globalKpis.push({
          id: kpi.id, label: kpi.name, category: gk,
          details: kpi.formula || kpi.customAttrs || ''
        }));
      });
    }

    const _allNetItems = buildEquipmentInventory().filter(it => it.netKey==='steam' || it.netKey==='power');
    const _netGroups   = {};
    _allNetItems.forEach(it => {
      if (!_netGroups[it.netKey]) _netGroups[it.netKey] = { label:it.netName, icon:it.netIcon, color:it.netColor, plants:{} };
      const pk = it.plantName || 'Unassigned';
      if (!_netGroups[it.netKey].plants[pk]) _netGroups[it.netKey].plants[pk] = [];
      _netGroups[it.netKey].plants[pk].push(it);
    });
    const _steamCount  = _netGroups['steam']  ? Object.values(_netGroups['steam'].plants).flat().length  : 0;
    const _powerCount  = _netGroups['power']  ? Object.values(_netGroups['power'].plants).flat().length  : 0;
    const _totalCount  = _globalKpis.length + _steamCount + _powerCount;
    const _selCount    = STATE.optVars.length;

    /* helper: IDs visible in current filter (used by bulk buttons) */
    const _getVisibleIds = (fKey) => {
      const ids = [];
      if (fKey==='all'||fKey==='global') _globalKpis.forEach(k => ids.push(k.id));
      if (fKey==='all'||fKey==='steam')  (_netGroups['steam'] ? Object.values(_netGroups['steam'].plants).flat() : []).forEach(it => ids.push(it.instanceId));
      if (fKey==='all'||fKey==='power')  (_netGroups['power'] ? Object.values(_netGroups['power'].plants).flat() : []).forEach(it => ids.push(it.instanceId));
      if (fKey==='selected')             ids.push(...STATE.optVars);
      return ids;
    };

    /* ── Filter tab definitions ──────────────────────────────────────── */
    const FILTER_TABS = [
      { id:'all',      label:'All',               icon:'☰',  color:'var(--text2)',   count:_totalCount  },
      { id:'global',   label:'Global KPIs',       icon:'🌐', color:'var(--blue)',    count:_globalKpis.length },
      { id:'steam',    label:'Steam Network',     icon:'♨️', color:'var(--orange)', count:_steamCount  },
      { id:'power',    label:'Power Distribution',icon:'⚡', color:'var(--yellow)', count:_powerCount  },
      { id:'selected', label:'Selected',          icon:'✓',  color:'var(--green)',   count:_selCount    },
    ];

    /* ── Outer wrapper ───────────────────────────────────────────────── */
    const tableWrap = el('div');

    /* hint */
    const hintTxt = document.createElement('div');
    hintTxt.style.cssText = 'font-size:12px;color:var(--text3);margin-bottom:12px';
    hintTxt.textContent   = 'Select variables from Global KPIs and Steam / Power Distribution network elements to include in the Optimizer.';
    tableWrap.appendChild(hintTxt);

    /* ── Top row: filter tabs + bulk action buttons ──────────────────── */
    const topRow = document.createElement('div');
    topRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px';

    /* filter pills */
    const filterBar = document.createElement('div');
    filterBar.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;align-items:center';

    FILTER_TABS.forEach(ft => {
      const isActive = STATE._optVarsFilter === ft.id;
      const btn = document.createElement('button');
      btn.style.cssText = [
        'display:inline-flex;align-items:center;gap:5px',
        'padding:5px 13px;border-radius:20px;cursor:pointer',
        'font-size:12px;font-weight:600;font-family:var(--font)',
        'transition:var(--transition)',
        'border:1.5px solid '+(isActive ? ft.color : 'var(--border2)'),
        'background:'+(isActive ? 'rgba(255,255,255,.06)' : 'transparent'),
        'color:'+(isActive ? ft.color : 'var(--text2)'),
        isActive ? ('box-shadow:0 0 0 3px '+ft.color+';') : '',
      ].filter(Boolean).join(';');
      const badge = `<span style="padding:1px 7px;border-radius:10px;font-size:11px;`
        +`background:${isActive ? ft.color : 'var(--bg4)'};`
        +`color:${isActive ? '#fff' : 'var(--text3)'}">${ft.count}</span>`;
      btn.innerHTML = `<span>${ft.icon}</span><span>${ft.label}</span>${badge}`;
      btn.addEventListener('click', () => { STATE._optVarsFilter = ft.id; saveState(); render(); });
      filterBar.appendChild(btn);
    });

    /* bulk action buttons */
    const actionBar = document.createElement('div');
    actionBar.style.cssText = 'display:flex;gap:6px;align-items:center;flex-shrink:0';

    const mkBulkBtn = (label, bg, border, color) => {
      const b = document.createElement('button');
      b.style.cssText = `padding:5px 13px;border-radius:6px;border:1.5px solid ${border};`
        +`background:${bg};color:${color};font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font)`;
      b.textContent = label;
      return b;
    };

    const inclAllBtn = mkBulkBtn('✓ Include All Visible','rgba(63,185,80,.1)','var(--green)','var(--green)');
    inclAllBtn.title = 'Check all rows visible in the current tab';
    inclAllBtn.addEventListener('click', () => {
      const ids = _getVisibleIds(STATE._optVarsFilter);
      ids.forEach(id => { if (!STATE.optVars.includes(id)) STATE.optVars.push(id); });
      saveState(); render();
    });

    const exclAllBtn = mkBulkBtn('✕ Exclude All Visible','rgba(248,81,73,.1)','var(--red)','var(--red)');
    exclAllBtn.title = 'Uncheck all rows visible in the current tab';
    exclAllBtn.addEventListener('click', () => {
      const idSet = new Set(_getVisibleIds(STATE._optVarsFilter));
      STATE.optVars = STATE.optVars.filter(id => !idSet.has(id));
      saveState(); render();
    });

    actionBar.appendChild(inclAllBtn);
    actionBar.appendChild(exclAllBtn);
    topRow.appendChild(filterBar);
    topRow.appendChild(actionBar);
    tableWrap.appendChild(topRow);

    /* ── Table HTML helpers ──────────────────────────────────────────── */
    /* section row with per-section Include/Exclude All */
    const sectionHdr = (icon, label, color, sectionIds) => {
      const allSel = sectionIds.length > 0 && sectionIds.every(id => STATE.optVars.includes(id));
      const idsAttr = escAttr(JSON.stringify(sectionIds));
      return `<tr><td colspan="4" style="background:var(--bg3);padding:5px 14px;`
        +`border-top:2px solid ${color};border-bottom:1px solid var(--border2)">`
        +`<span style="display:flex;align-items:center;justify-content:space-between">`
        +`<span style="font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text2)">`
        +`<span style="color:${color}">${icon}</span>&nbsp;${label.toUpperCase()}`
        +`&nbsp;<span style="font-size:10px;font-weight:400;color:var(--text3)">${sectionIds.length} items</span></span>`
        +`<span style="display:flex;gap:6px">`
        +`<button class="opt-sec-incl" data-ids='${idsAttr}' `
        +`style="padding:2px 10px;border-radius:10px;font-size:10px;cursor:pointer;`
        +`border:1px solid var(--green);background:rgba(63,185,80,.12);color:var(--green);font-weight:600">`
        +`${allSel ? '✓ All Included' : '+ Include All'}</button>`
        +`<button class="opt-sec-excl" data-ids='${idsAttr}' `
        +`style="padding:2px 10px;border-radius:10px;font-size:10px;cursor:pointer;`
        +`border:1px solid var(--red);background:rgba(248,81,73,.12);color:var(--red);font-weight:600">`
        +`− Exclude All</button>`
        +`</span></span></td></tr>`;
    };

    const plantHdr = name =>
      `<tr><td colspan="4" style="background:var(--bg4);padding:4px 12px 4px 28px;`
      +`font-size:11px;color:var(--text2);border-bottom:1px solid var(--border)">`
      +`&#127981;&nbsp;${esc(name)}</td></tr>`;

    const netRow = (id, category, kpiLabel, details, attrs) => {
      const chk    = STATE.optVars.includes(id) ? 'checked' : '';
      const elemBg = STATE.optVars.includes(id) ? 'background:rgba(63,185,80,.06)' : '';
      const isExp  = STATE._optVarsExpanded.includes(id);
      const hasA   = Array.isArray(attrs) && attrs.length > 0;
      const selCnt = hasA ? attrs.filter(a => STATE.optVars.includes(`${id}::${a.name}`)).length : 0;

      /* Element row */
      let html = `<tr class="var-elem-row" style="${elemBg}">
        <td style="text-align:center">
          <input type="checkbox" class="opt-var-cb" data-id="${escAttr(id)}" ${chk}>
        </td>
        <td>${esc(category)}</td>
        <td>
          ${hasA ? `<button class="var-expand-btn" data-instid="${escAttr(id)}"
            style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
            background:var(--bg4);border:1px solid var(--border2);border-radius:3px;cursor:pointer;
            color:var(--text2);font-size:9px;margin-right:6px;vertical-align:middle;flex-shrink:0">
            ${isExp ? '▾' : '▸'}</button>` : ''}
          ${esc(kpiLabel)}
          ${hasA ? `<span style="font-size:10px;margin-left:8px;padding:1px 6px;border-radius:8px;
            background:var(--bg4);color:${selCnt>0?'var(--green)':'var(--text3)'}">${selCnt}/${attrs.length} attrs</span>` : ''}
        </td>
        <td style="font-family:var(--mono);font-size:10px;color:var(--text3);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escAttr(details)}">${esc(details)}</td>
      </tr>`;

      /* Attribute sub-rows */
      if (hasA) {
        attrs.forEach(attr => {
          const attrId    = `${id}::${attr.name}`;
          const isAttrSel = STATE.optVars.includes(attrId);
          const attrBg    = isAttrSel ? 'background:rgba(63,185,80,.04)' : '';
          const showStyle = isExp ? '' : 'display:none';
          const savedVt   = (STATE._optVarAttrs[attrId] && STATE._optVarAttrs[attrId].varType)
                            || inferVarType(attr.name, null);
          const vtInfo    = VAR_TYPE_INFO[savedVt] || VAR_TYPE_INFO['CV'];
          html += `<tr class="var-attr-row" data-instid="${escAttr(id)}" style="${showStyle};${attrBg}">
            <td style="text-align:center;border-left:3px solid var(--border2)">
              <input type="checkbox" class="opt-var-cb" data-id="${escAttr(attrId)}" ${isAttrSel?'checked':''}>
            </td>
            <td style="padding-left:26px">
              <span style="font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;
                background:${vtInfo.color}22;color:${vtInfo.color};border:1px solid ${vtInfo.color}44">
                ${savedVt}
              </span>
            </td>
            <td style="padding-left:6px">
              <span style="font-size:12px;color:var(--text)">${esc(attr.name)}</span>
              ${attr.uom ? `<span style="font-size:10px;color:var(--text3);margin-left:4px">(${esc(attr.uom)})</span>` : ''}
            </td>
            <td>
              <select class="opt-attr-vtype" data-attrid="${escAttr(attrId)}"
                style="background:var(--bg3);border:1px solid var(--border2);color:var(--text);
                font-size:10px;padding:2px 6px;border-radius:4px;font-family:var(--font);cursor:pointer">
                ${VAR_TYPES.map(v=>`<option value="${v}" ${v===savedVt?'selected':''}>${v} — ${VAR_TYPE_INFO[v].name}</option>`).join('')}
              </select>
            </td>
          </tr>`;
        });
      }
      return html;
    };

    /* ── Build table HTML ────────────────────────────────────────────── */
    let varsHtml = '<table class="attr-table"><thead><tr>'
      +'<th style="width:40px;text-align:center">Select</th>'
      +'<th>Category</th><th>KPI Label</th><th>Formula / Details</th>'
      +'</tr></thead><tbody>';

    const f = STATE._optVarsFilter;

    /* ── Global KPIs ────── */
    if (f==='all' || f==='global') {
      varsHtml += sectionHdr('🌐','Global KPIs','var(--blue)', _globalKpis.map(k=>k.id));
      if (_globalKpis.length===0) {
        varsHtml += `<tr><td colspan="4" style="padding:12px;text-align:center;color:var(--text3);font-size:12px">No Global KPIs found.</td></tr>`;
      } else {
        _globalKpis.forEach(kpi => {
          varsHtml += netRow(kpi.id, kpi.category, kpi.label, kpi.details, null);
        });
      }
    }

    /* ── Steam Network ──── */
    if (f==='all' || f==='steam') {
      const grp = _netGroups['steam'];
      if (grp) {
        const steamIds = Object.values(grp.plants).flat().map(it=>it.instanceId);
        varsHtml += sectionHdr(grp.icon, grp.label, grp.color||'var(--orange)', steamIds);

        /* Element-type category lookup (mirrors plant config steam UI grouping) */
        const _steamCatOf = (elemKey) => {
          const gen = STEAM_GEN.find(x=>x.key===elemKey);
          if (gen) return { label: gen.cat || 'Generator', color:'var(--orange)', icon:'⚙️', order:0 };
          /* Turbines stored under STEAM_TURBINE */
          const tbn = STEAM_TURBINE.find(x=>x.key===elemKey);
          if (tbn) return { label:'Turbine', color:'var(--purple)', icon:'&#127000;', order:1 };
          const con = STEAM_CON.find(x=>x.key===elemKey);
          if (con) {
            const catColors = { Process:'var(--cyan)', Export:'var(--blue)', Vent:'var(--red)', Deaerator:'var(--green)' };
            const catIcons  = { Process:'&#128260;', Export:'&#128682;', Vent:'&#128168;', Deaerator:'&#128167;' };
            const catOrder  = { Process:3, Export:4, Vent:5, Deaerator:6 };
            return { label: con.cat||'Consumer', color: catColors[con.cat]||'var(--green)',
                     icon: catIcons[con.cat]||'&#127981;', order: catOrder[con.cat]||3 };
          }
          if (elemKey==='letdown_station') return { label:'Letdown (PRDS)', color:'var(--cyan)', icon:'⏬', order:2 };
          return { label:'Other', color:'var(--text3)', icon:'⚙️', order:99 };
        };

        const elemTypeSubHdr = (label, color, icon, typeIds) => {
          const allSel = typeIds.length>0 && typeIds.every(id=>STATE.optVars.includes(id));
          const idsAttr = escAttr(JSON.stringify(typeIds));
          return `<tr><td colspan="4" style="background:var(--bg4);padding:3px 12px 3px 42px;`
            +`font-size:10px;font-weight:700;letter-spacing:.05em;`
            +`color:${color};border-bottom:1px solid var(--border)">`
            +`<span style="display:flex;align-items:center;justify-content:space-between">`
            +`<span>${icon}&nbsp;${esc(label).toUpperCase()}`
            +`&nbsp;<span style="font-weight:400;color:var(--text3)">${typeIds.length}</span></span>`
            +`<span style="display:flex;gap:5px">`
            +`<button class="opt-sec-incl" data-ids='${idsAttr}' `
            +`style="padding:1px 8px;border-radius:8px;font-size:10px;cursor:pointer;`
            +`border:1px solid var(--green);background:rgba(63,185,80,.1);color:var(--green);font-weight:600">`
            +`${allSel?'✓ All':'+ All'}</button>`
            +`<button class="opt-sec-excl" data-ids='${idsAttr}' `
            +`style="padding:1px 8px;border-radius:8px;font-size:10px;cursor:pointer;`
            +`border:1px solid var(--red);background:rgba(248,81,73,.1);color:var(--red);font-weight:600">`
            +`− All</button>`
            +`</span></span></td></tr>`;
        };

        Object.entries(grp.plants).forEach(([plantName, items]) => {
          varsHtml += plantHdr(plantName);

          /* Group items by elemKey category, sorted by display order */
          const byElemKey = {};
          items.forEach(it => {
            if (!byElemKey[it.elemKey]) byElemKey[it.elemKey] = [];
            byElemKey[it.elemKey].push(it);
          });

          /* Sort elem-key groups by display order (Boiler → Turbine → Letdown → Consumer types → Vent last in consumers) */
          const sortedKeys = Object.keys(byElemKey).sort((a,b) => {
            const oa = _steamCatOf(a).order;
            const ob = _steamCatOf(b).order;
            if (oa !== ob) return oa - ob;
            return a.localeCompare(b);
          });

          sortedKeys.forEach(elemKey => {
            const catInfo = _steamCatOf(elemKey);
            const typeItems = byElemKey[elemKey];
            const typeIds   = typeItems.map(it=>it.instanceId);

            /* Find the human-readable name for this element key */
            const elemDef = STEAM_GEN.find(x=>x.key===elemKey)
              || STEAM_CON.find(x=>x.key===elemKey)
              || STEAM_TURBINE.find(x=>x.key===elemKey)
              || { key:elemKey, name: elemKey==='letdown_station' ? 'Letdown Station (PRDS)' : elemKey };
            const typeLabel = elemDef.name;

            varsHtml += elemTypeSubHdr(typeLabel, catInfo.color, catInfo.icon, typeIds);

            typeItems.forEach(it => {
              const details = [it.role, it.header, it.routeLabel].filter(Boolean).join(' | ');
              varsHtml += netRow(it.instanceId, catInfo.label,
                it.instLabel+(it.header?' ['+it.header+']':''), details, it.attrs);
            });
          });
        });

      } else if (f==='steam') {
        varsHtml += `<tr><td colspan="4" style="padding:28px;text-align:center;color:var(--text3);font-size:12px">
          <div style="font-size:28px;margin-bottom:8px">♨️</div>No Steam Network elements configured yet.<br>
          Add them in <strong style="color:var(--text2)">Plant Config → Network Setup</strong>.</td></tr>`;
      }
    }

    /* ── Power Distribution ─ */
    if (f==='all' || f==='power') {
      const grp = _netGroups['power'];
      if (grp) {
        const powerIds = Object.values(grp.plants).flat().map(it=>it.instanceId);
        varsHtml += sectionHdr(grp.icon, grp.label, grp.color||'var(--yellow)', powerIds);
        Object.entries(grp.plants).forEach(([plantName, items]) => {
          varsHtml += plantHdr(plantName);
          items.forEach(it => {
            const details = [it.role, it.header, it.routeLabel].filter(Boolean).join(' | ');
            varsHtml += netRow(it.instanceId, it.netName,
              it.instLabel+(it.header?' ['+it.header+']':''), details, it.attrs);
          });
        });
      } else if (f==='power') {
        varsHtml += `<tr><td colspan="4" style="padding:28px;text-align:center;color:var(--text3);font-size:12px">
          <div style="font-size:28px;margin-bottom:8px">⚡</div>No Power Distribution elements configured yet.<br>
          Add them in <strong style="color:var(--text2)">Plant Config → Network Setup</strong>.</td></tr>`;
      }
    }

    /* ── Selected only ───── */
    if (f==='selected') {
      const selGlobal = _globalKpis.filter(k => STATE.optVars.includes(k.id));
      const selNet    = _allNetItems.filter(it => STATE.optVars.includes(it.instanceId));
      const selIds    = [...selGlobal.map(k=>k.id), ...selNet.map(it=>it.instanceId)];
      varsHtml += sectionHdr('✓','Selected Variables','var(--green)', selIds);
      if (selIds.length===0) {
        varsHtml += `<tr><td colspan="4" style="padding:28px;text-align:center;color:var(--text3);font-size:12px">
          <div style="font-size:24px;margin-bottom:8px">✓</div>No variables selected yet.<br>
          Use the other tabs to include variables.</td></tr>`;
      } else {
        selGlobal.forEach(kpi => {
          varsHtml += netRow(kpi.id, kpi.category, kpi.label, kpi.details, null);
        });
        selNet.forEach(it => {
          const details = [it.role, it.header, it.routeLabel].filter(Boolean).join(' | ');
          varsHtml += netRow(it.instanceId, it.netName,
            it.instLabel+(it.header?' ['+it.header+']':''), details, it.attrs);
        });
      }
    }

    varsHtml += '</tbody></table>';

    /* ── Mount table in a separate DOM node to preserve filterBar handlers ── */
    const tableDom = document.createElement('div');
    tableDom.innerHTML = varsHtml;
    tableWrap.appendChild(tableDom);

    /* ── change: checkbox toggle + varType dropdown ─────────────────── */
    tableDom.addEventListener('change', e => {
      /* Checkbox: element-level or attribute-level */
      if (e.target.classList.contains('opt-var-cb')) {
        const id = e.target.dataset.id;
        if (e.target.checked) { if (!STATE.optVars.includes(id)) STATE.optVars.push(id); }
        else                  { STATE.optVars = STATE.optVars.filter(v => v !== id); }
        const row = e.target.closest('tr');
        const bg  = e.target.checked ? (row && row.classList.contains('var-attr-row') ? 'rgba(63,185,80,.04)' : 'rgba(63,185,80,.06)') : '';
        if (row) row.style.background = bg;
        saveState();
        return;
      }

      /* varType dropdown: save new type and update badge colour */
      if (e.target.classList.contains('opt-attr-vtype')) {
        const attrId = e.target.dataset.attrid;
        const newVt  = e.target.value;
        if (!STATE._optVarAttrs[attrId]) STATE._optVarAttrs[attrId] = {};
        STATE._optVarAttrs[attrId].varType = newVt;
        saveState();
        /* Update the colour badge in the same row without re-render */
        const row   = e.target.closest('tr');
        const badge = row && row.querySelector('td:nth-child(2) span');
        const vtI   = VAR_TYPE_INFO[newVt] || VAR_TYPE_INFO['CV'];
        if (badge) {
          badge.textContent = newVt;
          badge.style.background = vtI.color + '22';
          badge.style.color      = vtI.color;
          badge.style.border     = '1px solid ' + vtI.color + '44';
        }
      }
    });

    /* ── click: expand toggle + section Include/Exclude All ─────────── */
    tableDom.addEventListener('click', e => {
      /* Expand / collapse element row */
      const expandBtn = e.target.closest('.var-expand-btn');
      if (expandBtn) {
        const id  = expandBtn.dataset.instid;
        const idx = STATE._optVarsExpanded.indexOf(id);
        const open = idx < 0;
        if (open) STATE._optVarsExpanded.push(id);
        else      STATE._optVarsExpanded.splice(idx, 1);
        /* Toggle attr sub-rows without full re-render */
        tableDom.querySelectorAll('.var-attr-row').forEach(r => {
          if (r.dataset.instid === id) r.style.display = open ? '' : 'none';
        });
        expandBtn.textContent = open ? '▾' : '▸';
        /* Update attrs-selected badge count on parent row */
        const parentRow = expandBtn.closest('tr');
        const badge = parentRow && parentRow.querySelector('td:nth-child(3) span:last-child');
        if (badge) {
          const total = tableDom.querySelectorAll(`.var-attr-row[data-instid="${CSS.escape(id)}"]`).length;
          const sel   = [...tableDom.querySelectorAll(`.var-attr-row[data-instid="${CSS.escape(id)}"] .opt-var-cb`)]
                          .filter(cb => cb.checked).length;
          badge.textContent = `${sel}/${total} attrs`;
          badge.style.color = sel > 0 ? 'var(--green)' : 'var(--text3)';
        }
        saveState();
        return;
      }

      /* Per-section Include All / Exclude All */
      const inclBtn = e.target.closest('.opt-sec-incl');
      const exclBtn = e.target.closest('.opt-sec-excl');
      if (!inclBtn && !exclBtn) return;
      const ids = JSON.parse((inclBtn||exclBtn).dataset.ids || '[]');
      if (inclBtn) ids.forEach(id => { if (!STATE.optVars.includes(id)) STATE.optVars.push(id); });
      else         STATE.optVars = STATE.optVars.filter(v => !ids.includes(v));
      saveState(); render();
    });

    panel.appendChild(tableWrap);

  } else if (STATE._optSubTab === 'derived') {
    panel.innerHTML = '<div class="empty"><div class="e-ic">🧮</div><div class="e-tt">Derived Equations</div><div class="e-st">Define derived equations here.</div></div>';
  } else if (STATE._optSubTab === 'constraints') {
    panel.innerHTML = '<div class="empty"><div class="e-ic">⚖️</div><div class="e-tt">Constraints</div><div class="e-st">Define optimization constraints here.</div></div>';
  }
  
  w.appendChild(panel);
  return w;
}

function paneKpiConfig(){
  if(!STATE._kpiConfig)  STATE._kpiConfig={};
  if(!STATE._kpiSubTab)  STATE._kpiSubTab='inventory';
  KPI_MASTER.forEach(k=>{ if(!STATE._kpiConfig[k.id]) STATE._kpiConfig[k.id]={dataSource:null}; });

  const kpiConfigured = KPI_MASTER.filter(k=>STATE._kpiConfig[k.id]?.dataSource).length;
  const kpiDone       = kpiConfigured === KPI_MASTER.length;
  const inventoryCount = buildEquipmentInventory().length;

  const KPI_SUB_TABS = [
    { id:'masterkpi', label:'Master KPI List', icon:'&#128221;', done: () => !!STATE._masterKpiComplete },
    { id:'inventory', label:'Equipment Status',  icon:'&#128203;', done: () => STATE._kpiSubTab!=='inventory' && inventoryCount>0 },
    { id:'plantprod', label:'Plant Production',  icon:'⚙️',       done: () => !!STATE._plantProdComplete },
    { id:'seu',       label:'SEU KPIs',          icon:'⚙️',       done: () => !!STATE._seuComplete },
    { id:'nonseu',    label:'Non-SEU KPIs',      icon:'⚙️',       done: () => !!STATE._nonSeuComplete },
    { id:'kpiconfig', label:"System KPI's", icon:'&#128202;', done: () => kpiDone },
    { id:'review',    label:'Review',     icon:'✅',   done: () => STATE._kpiSubTab==='export' },
    { id:'export',    label:'Export',     icon:'&#128228;', done: () => false },
  ];

  function buildSubBar(){
    const bar = el('div','pc-subtab-bar'); bar.style.cssText='margin-bottom:16px';
    KPI_SUB_TABS.forEach(st=>{
      const isA=STATE._kpiSubTab===st.id, isDone=st.done();
      const btn=el('button',['pc-subtab',isA?'pc-active':'',isDone&&!isA?'pc-done':''].filter(Boolean).join(' '));
      btn.innerHTML=(isDone&&!isA?'✅':st.icon)+' <span>'+st.label+'</span><span class="pc-badge">'+(isDone?'✓ Done':isA?'Active':'Pending')+'</span>';
      btn.onclick=()=>{ STATE._kpiSubTab=st.id; saveState(); render(); };
      bar.appendChild(btn);
    });
    /* Add Export Excel button for the active tab (only for data tabs, not review/export) */
    var _exportableTabs = ['masterkpi','inventory','plantprod','seu','nonseu','kpiconfig'];
    if(_exportableTabs.indexOf(STATE._kpiSubTab) !== -1){
      var _expBtn = el('button');
      _expBtn.innerHTML = '&#128202; Export Excel';
      _expBtn.title = 'Download this tab data as an Excel file';
      _expBtn.style.cssText = 'margin-left:auto;padding:6px 14px;border-radius:6px;border:1.5px solid #238636;'
        + 'background:rgba(35,134,54,.12);color:#3fb950;font-size:12px;font-weight:600;cursor:pointer;'
        + 'font-family:var(--font);display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0';
      _expBtn.onmouseenter = function(){ _expBtn.style.background='rgba(35,134,54,.25)'; };
      _expBtn.onmouseleave = function(){ _expBtn.style.background='rgba(35,134,54,.12)'; };
      _expBtn.onclick = function(e){ e.stopPropagation(); exportTabXlsx(STATE._kpiSubTab); };
      bar.style.cssText = 'margin-bottom:16px;display:flex;align-items:center;flex-wrap:wrap;gap:6px';
      bar.appendChild(_expBtn);
    }
    return bar;
  }

  if(STATE._kpiSubTab==='masterkpi'){
    const wrap=el('div'); wrap.appendChild(buildSubBar()); wrap.appendChild(paneMasterKpiList()); return wrap;
  }
  if(STATE._kpiSubTab==='inventory'){
    const wrap=el('div'); wrap.appendChild(buildSubBar()); wrap.appendChild(paneInventory()); return wrap;
  }
  if(STATE._kpiSubTab==='plantprod'){
    const wrap=el('div'); wrap.appendChild(buildSubBar()); wrap.appendChild(panePlantProd()); return wrap;
  }
  if(STATE._kpiSubTab==='seu'){
    const wrap=el('div'); wrap.appendChild(buildSubBar()); wrap.appendChild(paneSeu()); return wrap;
  }
  if(STATE._kpiSubTab==='nonseu'){
    const wrap=el('div'); wrap.appendChild(buildSubBar()); wrap.appendChild(paneNonSeu()); return wrap;
  }
  if(STATE._kpiSubTab==='review'){
    const wrap=el('div'); wrap.appendChild(buildSubBar()); wrap.appendChild(paneKpiReview()); return wrap;
  }
  if(STATE._kpiSubTab==='export'){
    const wrap=el('div'); wrap.appendChild(buildSubBar()); wrap.appendChild(paneKpiExport()); return wrap;
  }
  /*  Category definitions  */
  const CATS={
    performance:{
      label:'Business KPIs', icon:'⚙️', color:'#F0883E',
      bg:'rgba(240,136,62,.13)', border:'rgba(240,136,62,.38)',
      desc:'Top-level business & energy efficiency metrics',

      if(!c.calcCfg[t.p])        c.calcCfg[t.p]        = {included:true,uom:'',designData:'',min:'',max:'',defaultVal:''};
      if(!c.ssCfg.xAttrs[t.p])   c.ssCfg.xAttrs[t.p]   = {included:true,uom:'',designData:'',min:'',max:'',defaultVal:''};

    /*  Helper: build tag table (Calculate / SS X or Y)  */
    function buildTagTable(container, tags, tagCfgObj, accent, allowAddCustom) {
      container.innerHTML = '';
      if(tags.length === 0 && Object.keys(tagCfgObj).length === 0){
        const empty = el('div');
        empty.style.cssText='padding:14px;text-align:center;color:#8b949e;font-size:12px;background:#1e2436;border-radius:8px;border:1px dashed #2d3448';
        empty.textContent='No tags yet. Use " Add Custom Tag" below.';
        container.appendChild(empty);
      }

      /* column header */
      const chRow = el('div');
      chRow.style.cssText='display:grid;grid-template-columns:32px 1fr 160px;gap:0;padding:0 4px;margin-bottom:4px';
      const chBlanks = ['',''];
      const chFields = el('div'); chFields.style.cssText='display:flex;gap:6px';
      FIELD_DEFS.forEach(f=>{
        const lh=el('div'); lh.style.cssText='flex:1;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#8b949e;text-align:center';
        lh.textContent=f.label; chFields.appendChild(lh);
      });

      /* build all tags (existing + custom keys) */
      const allKeys = [...tags.map(t=>t.p)];
      Object.keys(tagCfgObj).forEach(k=>{ if(!allKeys.includes(k) && k!=='formula' && k!=='customAttrs') allKeys.push(k); });
      const allTagObjs = allKeys.map(k => tags.find(t=>t.p===k) || {d:'Custom Tag', p:k});

      allTagObjs.forEach(t => {
        if(!tagCfgObj[t.p]) tagCfgObj[t.p]={included:true,uom:'',designData:'',min:'',max:'',defaultVal:''};
        const tc = tagCfgObj[t.p];

        const row = el('div');
        row.style.cssText='border-radius:7px;overflow:hidden;margin-bottom:6px;border:1.5px solid '+(tc.included?accent+'55':'#2d3448');
        row.style.transition='border-color .15s';

        /* header */
        const rh = el('div'); rh.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1e2436;cursor:pointer;user-select:none';
        const chk=el('input'); chk.type='checkbox'; chk.checked=tc.included;
        chk.style.cssText='width:14px;height:14px;cursor:pointer;flex-shrink:0;accent-color:'+accent;
        chk.onclick=e=>e.stopPropagation();
        const depLbl=el('span'); depLbl.style.cssText='flex:1;font-size:11.5px;color:#c9d1d9;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'; depLbl.textContent=t.d; depLbl.title=t.d;
        const piTag=el('span'); piTag.style.cssText='font-family:monospace;font-size:10px;padding:2px 7px;border-radius:4px;flex-shrink:0;background:'+accent+'18;color:'+accent+';border:1px solid '+accent+'35'; piTag.textContent=t.p;
        const tog=el('span'); tog.style.cssText='font-size:9px;color:#8b949e;flex-shrink:0;margin-left:4px;transition:transform .18s;line-height:1'; tog.textContent='';
        rh.appendChild(chk); rh.appendChild(depLbl); rh.appendChild(piTag); rh.appendChild(tog);

        /* fields strip */
        const fs = el('div');
        fs.style.cssText='display:'+(tc.included?'flex':'none')+';gap:6px;padding:10px 10px 12px;background:#111827;align-items:flex-end';
        FIELD_DEFS.forEach(fd=>{
          const cell=el('div'); cell.style.cssText='flex:1;min-width:0';
          const inp=el('input'); inp.type='text'; inp.value=tc[fd.key]||''; inp.placeholder=fd.ph;
          inp.style.cssText='width:100%;box-sizing:border-box;padding:6px 7px;border-radius:5px;border:1px solid #2d3448;background:#1a1f2e;color:#e6edf3;font-size:11.5px;outline:none;font-family:inherit';
          inp.onfocus=()=>inp.style.borderColor=accent; inp.onblur=()=>inp.style.borderColor='#2d3448'; inp.oninput=()=>tc[fd.key]=inp.value;
          cell.appendChild(inp); fs.appendChild(cell);
        });

        chk.onchange=()=>{ tc.included=chk.checked; row.style.borderColor=chk.checked?accent+'55':'#2d3448'; fs.style.display=chk.checked?'flex':'none'; };
        let open=true;
        rh.addEventListener('click',e=>{ if(e.target===chk) return; open=!open; fs.style.display=(open&&tc.included)?'flex':'none'; tog.style.transform=open?'':'rotate(-90deg)'; });
        row.appendChild(rh); row.appendChild(fs); container.appendChild(row);
      });

      if(allowAddCustom){
        const addBtn=el('button');
        addBtn.style.cssText='width:100%;padding:8px;border-radius:7px;border:1.5px dashed '+accent+'45;background:'+accent+'08;color:'+accent+';font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:2px;transition:background .15s;box-sizing:border-box';
        addBtn.textContent=' Add Custom Tag';
        addBtn.onmouseenter=()=>addBtn.style.background=accent+'18'; addBtn.onmouseleave=()=>addBtn.style.background=accent+'08';
        addBtn.onclick=()=>{ const k='CUSTOM_'+Date.now(); tagCfgObj[k]={included:true,uom:'',designData:'',min:'',max:'',defaultVal:''}; buildTagTable(container,tags,tagCfgObj,accent,true); };
        container.appendChild(addBtn);
      }
    }
