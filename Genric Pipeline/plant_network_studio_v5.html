    head.style.cssText = 'padding:14px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;background:var(--bg3)';

    const icn = el('span');
    icn.style.fontSize='16px';
    icn.innerHTML = type.icon;

    const title = el('div');
    title.style.cssText = 'flex:1;font-weight:600;font-size:14px';
    title.textContent = type.label;

    const badge = el('span');
    badge.style.cssText = 'font-size:11px;padding:2px 8px;border-radius:12px;background:rgba(255,255,255,.05);color:var(--text3)';
    badge.textContent = STATE._masterKpis[type.key].length + ' Templates';

    const expandIcn = el('span');
    expandIcn.innerHTML = '▾';
    expandIcn.style.transition = 'transform .2s';

    head.append(icn, title, badge, expandIcn);

    const body = el('div');
    body.style.cssText = 'padding:0;display:none;border-top:1px solid var(--border)';

    let expanded = false;
    head.onclick = ()=>{
      expanded = !expanded;
      body.style.display = expanded ? 'block' : 'none';
      expandIcn.style.transform = expanded ? 'rotate(180deg)' : 'none';
    };

    function renderBody(){
      body.innerHTML = '';
      const kpis = STATE._masterKpis[type.key];
      const stdKpisList = _resolvedStdKpis || [];

      // Migrate: mark standard flag + purge stale standard KPIs no longer in the list
      for(let ki = kpis.length - 1; ki >= 0; ki--){
        const k = kpis[ki];
        if(k.isStandard === undefined) k.isStandard = stdKpisList.includes(k.name);
        if(k.isStandard && !stdKpisList.includes(k.name)){
          kpis.splice(ki, 1);
        }
      }

      if(stdKpisList.length > 0){
      const stdSection = el('div');
      stdSection.style.cssText = 'padding:16px;border-bottom:1px solid var(--border)';
      stdSection.innerHTML = '<div style="font-size:12px;font-weight:600;margin-bottom:12px;color:var(--text2)">Standard KPIs</div>';

      stdKpisList.forEach(stdName => {
        const existingKpi = kpis.find(k => k.name === stdName && k.isStandard);
        const isChecked = !!existingKpi;

        const row = el('div');
        row.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-bottom:12px;background:var(--bg3);padding:12px;border-radius:6px;border:1px solid '+(isChecked?'var(--net-color)':'var(--border)');
        
        const chkRow = el('label');
        chkRow.style.cssText = 'display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text)';
        const chk = el('input');
        chk.type = 'checkbox';
        chk.checked = isChecked;
        chk.style.cssText = 'accent-color:var(--net-color);cursor:pointer;width:14px;height:14px';
        
        chk.onchange = (e) => {
          if(e.target.checked) {
            kpis.push({ id: 'T_'+Date.now()+'_'+Math.floor(Math.random()*1000), name: stdName, formula: '', isStandard: true, customAttrs: [] });
          } else {
            const idx = kpis.findIndex(k => k.name === stdName && k.isStandard);
            if(idx > -1) kpis.splice(idx, 1);
          }
          STATE._masterKpiComplete = true; saveState(); badge.textContent = kpis.length + ' Templates'; renderBody();
        };
        
        chkRow.append(chk, document.createTextNode(stdName));
        row.appendChild(chkRow);

        stdSection.appendChild(row);
      });
      body.appendChild(stdSection);
      } /* end if stdKpisList.length > 0 */

      const customKpis = kpis.filter(k => !k.isStandard);
      if(customKpis.length > 0) {
        const custSection = el('div');
        custSection.style.cssText = 'padding:16px;border-bottom:1px solid var(--border)';
        custSection.innerHTML = '<div style="font-size:12px;font-weight:600;margin-bottom:12px;color:var(--text2)">Custom KPIs</div>';
        
        customKpis.forEach((kpi) => {
          const kBlock = el('div');
          kBlock.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-bottom:12px;background:var(--bg3);padding:12px;border-radius:6px;border:1px solid var(--border)';
          
          const r1 = el('div');
          r1.style.cssText = 'display:flex;gap:12px;align-items:flex-end';
          
          const nGrp = el('div'); nGrp.style.flex='1';
          nGrp.innerHTML = '<div style="font-size:11px;color:var(--text3);margin-bottom:4px">Template Name</div>';
          const nInp = el('input');
          nInp.type='text'; nInp.value=kpi.name||''; nInp.placeholder='e.g. Efficiency';
          nInp.style.cssText = 'width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px';
          nInp.oninput = e => { kpi.name = e.target.value; STATE._masterKpiComplete=true; saveState(); };
          nGrp.appendChild(nInp);

          const dBtn = el('button');
          dBtn.innerHTML = '&#128465;';
          dBtn.title = 'Delete Custom KPI';
          dBtn.style.cssText = 'padding:8px;background:none;border:none;color:var(--red);cursor:pointer;border-radius:6px';
          dBtn.onmouseover = ()=>dBtn.style.background='rgba(248,81,73,.1)';
          dBtn.onmouseout = ()=>dBtn.style.background='none';
          dBtn.onclick = ()=>{
            const idx = kpis.indexOf(kpi);
            if(idx > -1) kpis.splice(idx, 1);
            STATE._masterKpiComplete=true; saveState(); renderBody(); badge.textContent = kpis.length + ' Templates';
          };

          r1.append(nGrp, dBtn);

          kBlock.append(r1);
          custSection.appendChild(kBlock);
        });
        body.appendChild(custSection);
      }

      const addBtn = el('button');
      addBtn.innerHTML = '+ Add Custom KPI';
      addBtn.style.cssText = 'margin:16px;padding:8px 16px;background:rgba(255,255,255,.05);border:1px dashed var(--border3);color:var(--text);border-radius:6px;cursor:pointer;font-size:12px';
      addBtn.onclick = ()=>{
        kpis.push({ id: "T_"+Date.now()+"_"+Math.floor(Math.random()*1000), name:"", formula:"", customAttrs:[], isStandard:false });
        STATE._masterKpiComplete=true; saveState(); renderBody(); badge.textContent = kpis.length + ' Templates';
      };
      body.appendChild(addBtn);
    }
    
    renderBody();
    card.append(head, body);
    list.appendChild(card);
  });

  const nextBtn = el('button', 'primary-btn');
  nextBtn.textContent = 'Save & Next';
  nextBtn.onclick = () => { STATE._masterKpiComplete = true; STATE._kpiSubTab = "inventory"; saveState(); render(); };
  container.appendChild(nextBtn);

  return container;
}

function paneInventory(){
  const items = buildEquipmentInventory();

  /* Silent default application  every instance gets a status entry on first view.
     Pre-populates from STATUS_DEFAULTS keyed by elemKey. User can customize via
     the Status modal (click any row). isDefault:true flips to false on edit. */
  if(!STATE.equipmentStatus){ STATE.equipmentStatus = {}; }
  /* Always run ensureStatusEntry  it is idempotent for valid entries and
     migrates legacy always_on / none entries so they never show as "Unset". */
  items.forEach(it=>{ ensureStatusEntry(it); });
  saveState();

  /* Filter state  stored as arrays so JSON round-trip is clean. Sets are used in-memory. */
  if(!STATE._invFilter) STATE._invFilter = {};
  if(!Array.isArray(STATE._invFilter.netKeys))  STATE._invFilter.netKeys  = Object.keys(NETWORKS);
  if(!Array.isArray(STATE._invFilter.plantIds)) STATE._invFilter.plantIds = []; /* default: none selected  user picks a plant */
  if(typeof STATE._invFilter.search !== 'string') STATE._invFilter.search = '';
  if(!STATE._invOpen) STATE._invOpen = {};
  /* Backfill any new network that wasn't in the saved filter (but never auto-add plants) */
  Object.keys(NETWORKS).forEach(k => { if(!STATE._invFilter.netKeys.includes(k)) STATE._invFilter.netKeys.push(k); });

  const netSel   = new Set(STATE._invFilter.netKeys);
  const plantSel = new Set(STATE._invFilter.plantIds);

  const w = el('div');
  w.innerHTML = `
    <div class="section-title"><span class="accent"></span>&#128203; Equipment Status</div>
    <div class="section-hint">All equipment instances placed across your networks. This is the source-of-truth list that will drive Status Mapping (next sub-tab) and KPI calculation.</div>
  `;

  /* ── Plant Status Calculation Section ── */
  if(!STATE._plantStatus) STATE._plantStatus = {};
  const psCard = el('div');
  psCard.style.cssText = 'background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;padding:16px;margin-bottom:18px';
  psCard.innerHTML = '<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px">🏭 Plant Status Calculation</div>'
    + '<div style="font-size:11px;color:var(--text3);margin-bottom:14px;line-height:1.5">Define how each plant\'s running status is calculated. Use equipment status tags in the formula (e.g. <code style="background:var(--bg4);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:10px">[Boiler_A_Status] + [Boiler_B_Status] >= 1</code>).</div>';

  const psGrid = el('div');
  psGrid.style.cssText = 'display:flex;flex-direction:column;gap:10px';
  (STATE.plants||[]).forEach(p => {
    if(!STATE._plantStatus[p.id]) STATE._plantStatus[p.id] = { formula:'', piTag:'', dataSource:'calculate' };
    const ps = STATE._plantStatus[p.id];

    const row = el('div');
    row.style.cssText = 'display:grid;grid-template-columns:120px 100px 1fr 200px;gap:10px;align-items:center;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px';

    /* Plant name */
    const nameD = el('div');
    nameD.style.cssText = 'font-weight:700;font-size:12px;color:var(--text)';
    nameD.textContent = p.name;

    /* Data source toggle */
    const dsD = el('div');
    dsD.style.cssText = 'display:flex;gap:4px';
    const mkDsBtn = (lbl, val) => {
      const on = ps.dataSource === val;
      const b = el('button');
      b.textContent = lbl;
      b.style.cssText = 'padding:3px 8px;font-size:10px;font-weight:600;border-radius:4px;cursor:pointer;border:1px solid '+(on?'var(--net-color)':'var(--border)')+';background:'+(on?'rgba(240,136,62,.12)':'var(--bg4)')+';color:'+(on?'var(--net-color)':'var(--text3)')+';font-family:var(--font)';
      b.onclick = () => { ps.dataSource = val; saveState(); render(); };
      return b;
    };
    dsD.appendChild(mkDsBtn('PI Tag','pi_sensor'));
    dsD.appendChild(mkDsBtn('Calculate','calculate'));

    /* Formula or PI Tag input */
    const valD = el('div');
    if(ps.dataSource === 'pi_sensor') {
      const inp = el('input'); inp.type='text'; inp.placeholder='e.g. UN.PLANT1.STATUS.PV';
      inp.value = ps.piTag||'';
      inp.style.cssText = 'width:100%;padding:5px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--mono);font-size:11px;outline:none';
      inp.onfocus=()=>inp.style.borderColor='var(--net-color)';
      inp.onblur=()=>{ ps.piTag=inp.value.trim(); inp.style.borderColor='var(--border)'; saveState(); };
      valD.appendChild(inp);
    } else {
      const inp = el('input'); inp.type='text'; inp.placeholder='e.g. [Boiler_A_Status] + [Boiler_B_Status] >= 1';
      inp.value = ps.formula||'';
      inp.style.cssText = 'width:100%;padding:5px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--mono);font-size:11px;outline:none';
      inp.onfocus=()=>inp.style.borderColor='var(--net-color)';
      inp.onblur=()=>{ ps.formula=inp.value.trim(); inp.style.borderColor='var(--border)'; saveState(); };
      valD.appendChild(inp);
    }

    /* KPI Name */
    const kpiD = el('div');
    const kpiInp = el('input'); kpiInp.type='text'; kpiInp.placeholder='KPI Name (e.g. Plant Running)';
    kpiInp.value = ps.kpiName||'';
    kpiInp.style.cssText = 'width:100%;padding:5px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:11px;outline:none;font-family:var(--font)';
    kpiInp.onfocus=()=>kpiInp.style.borderColor='var(--net-color)';
    kpiInp.onblur=()=>{ ps.kpiName=kpiInp.value.trim(); kpiInp.style.borderColor='var(--border)'; saveState(); };
    kpiD.appendChild(kpiInp);

    row.appendChild(nameD);
    row.appendChild(dsD);
    row.appendChild(valD);
    row.appendChild(kpiD);
    psGrid.appendChild(row);
  });

  /* Column labels */
  const psLabels = el('div');
  psLabels.style.cssText = 'display:grid;grid-template-columns:120px 100px 1fr 200px;gap:10px;padding:0 10px;margin-bottom:4px';
  psLabels.innerHTML = '<div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:700">Plant</div>'
    + '<div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:700">Data Source</div>'
    + '<div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:700">PI Tag / Formula</div>'
    + '<div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:700">KPI Name</div>';
  psCard.appendChild(psLabels);
  psCard.appendChild(psGrid);
  w.appendChild(psCard);

  /*  Empty-network short-circuit  */
  if(items.length === 0){
    const empty = el('div');
    empty.style.cssText = 'margin-top:24px';
    empty.appendChild(emptyState('','No equipment placed yet','Go to Plant Config &rarr; Network Config and add equipment to one or more networks first.'));
    w.appendChild(empty);
    return w;
  }

  /*  Filter bar (search + network chips)  */
  const fbar = el('div');
  fbar.style.cssText = 'display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 10px';

  const srch = el('input');
  srch.type='text';
  srch.placeholder='Search instances, headers, PI tag bases';
  srch.value = STATE._invFilter.search || '';
  srch.style.cssText='flex:1;min-width:240px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;outline:none;font-family:var(--font)';
  srch.onfocus=()=>srch.style.borderColor='var(--net-color)';
  srch.onblur =()=>srch.style.borderColor='var(--border)';
  srch.oninput=()=>{ STATE._invFilter.search = srch.value; saveState(); applyAndRender(); };
  fbar.appendChild(srch);


  w.appendChild(fbar);

  /*  Plant filter bar  */
  if ((STATE.plants||[]).length > 1){
    const pbar = el('div');
    pbar.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px';
    const plbl = el('span');
    plbl.style.cssText='font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-right:4px;font-weight:600';
    plbl.textContent = ' Select Plant:';
    pbar.appendChild(plbl);
    (STATE.plants||[]).forEach(p=>{
      const on = plantSel.has(p.id);
      const chip = el('label');
      chip.style.cssText = 'display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid '+(on?'var(--net-color)':'var(--border)')+';background:'+(on?'rgba(240,136,62,.10)':'var(--bg3)')+';cursor:pointer;font-size:11px;color:var(--text);user-select:none;transition:all .15s';
      chip.innerHTML = '<input type="checkbox" '+(on?'checked':'')+' style="accent-color:var(--net-color);width:12px;height:12px;cursor:pointer">'+esc(p.name);
      chip.querySelector('input').onchange = (e)=>{
        if(e.target.checked) plantSel.add(p.id); else plantSel.delete(p.id);
        STATE._invFilter.plantIds = [...plantSel];
        saveState(); applyAndRender();
      };
      pbar.appendChild(chip);
    });
    w.appendChild(pbar);
  }

  /*  Counter strip  */
  const counterStrip = el('div');
  counterStrip.style.cssText='display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap';
  w.appendChild(counterStrip);

  /*  Body  */
  const body = el('div');
  w.appendChild(body);

  function applyAndRender(){
    const q = (STATE._invFilter.search||'').trim().toLowerCase();
    const visible = items.filter(r=>{
      if(!netSel.has(r.netKey)) return false;
      if(!plantSel.has(r.plantId)) return false;
      if(!q) return true;
      return [r.instLabel, r.elemName, r.header, r.piTagBase, r.routeLabel, r.plantName, r.netName, r.role]
        .some(s=>(s||'').toLowerCase().includes(q));
    });
    renderCounters(visible);
    renderBody(visible);
  }

  function renderCounters(visible){
    counterStrip.innerHTML = '';
    const total = el('div');
    total.style.cssText='padding:7px 14px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);font-size:12px;color:var(--text);font-weight:700';
    total.innerHTML = '<span style="color:var(--text3);font-weight:500;margin-right:6px">Showing</span>'+visible.length+'<span style="color:var(--text3);font-weight:500;margin-left:4px">of '+items.length+'</span>';
    counterStrip.appendChild(total);

    const byNet = {};
    visible.forEach(r=>{ byNet[r.netKey] = (byNet[r.netKey]||0) + 1; });
    Object.entries(NETWORKS).forEach(([nk, nd])=>{
      if(!byNet[nk]) return;
      const shortName = nd.name.replace(' Network','').replace('Distribution Network','Power').replace('Significant Energy Consumers','SEC');
      const pill = el('div');
      pill.style.cssText = 'padding:6px 12px;border-radius:8px;background:'+nd.color+'1A;border:1px solid '+nd.color+'55;font-size:11.5px;color:var(--text);font-weight:600';
      pill.innerHTML = nd.icon+' '+esc(shortName)+' <span style="color:'+nd.color+';margin-left:4px;font-weight:700">'+byNet[nk]+'</span>';
      counterStrip.appendChild(pill);
    });
  }

  function renderBody(visible){
    body.innerHTML = '';
    if(visible.length === 0){
      const msg = plantSel.size === 0
        ? emptyState('','No plant selected','Select one or more plants above to view their equipment status.')
        : emptyState('','No matches','Try widening your filters or clearing the search box.');
      body.appendChild(msg);
      return;
    }
    /* Group: netKey  plantId  [rows] */
    const groups = {};
    visible.forEach(r=>{
      if(!groups[r.netKey]) groups[r.netKey] = {};
      if(!groups[r.netKey][r.plantId]) groups[r.netKey][r.plantId] = [];
      groups[r.netKey][r.plantId].push(r);
    });
    /* Render in NETWORKS order, then STATE.plants order */
    Object.keys(NETWORKS).forEach(nk=>{
      if(!groups[nk]) return;
      const nd = NETWORKS[nk];
      const netCnt = Object.values(groups[nk]).reduce((s,a)=>s+a.length, 0);

      const netSec = el('div');
      netSec.style.cssText = 'margin-bottom:14px;border:1.5px solid '+nd.color+'33;border-radius:10px;overflow:hidden;background:var(--bg2)';

      const openKey = 'net_'+nk;
      if(STATE._invOpen[openKey] === undefined) STATE._invOpen[openKey] = true;
      const isOpen = STATE._invOpen[openKey];

      const netHdr = el('div');
      netHdr.style.cssText = 'padding:10px 14px;background:'+nd.color+'1A;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;border-bottom:'+(isOpen?'1px solid '+nd.color+'33':'none');
      netHdr.innerHTML = '<span style="font-size:13px;color:var(--text2);transition:transform .15s">'+(isOpen?'':'')+'</span>'
        + '<span style="font-size:15px">'+nd.icon+'</span>'
        + '<span style="font-weight:700;color:var(--text);font-size:13px">'+esc(nd.name)+'</span>'
        + '<span style="margin-left:auto;font-size:11px;color:var(--text3)">'+netCnt+' instance'+(netCnt!==1?'s':'')+'</span>';
      netHdr.onclick = ()=>{
        STATE._invOpen[openKey] = !STATE._invOpen[openKey];
        saveState(); applyAndRender();
      };
      netSec.appendChild(netHdr);

      if(isOpen){
        const plantsBox = el('div');
        plantsBox.style.cssText = 'padding:6px 14px 12px';
        (STATE.plants||[]).forEach(p=>{
          const plantRows = groups[nk][p.id];
          if(!plantRows || !plantRows.length) return;
          const plantHd = el('div');
          plantHd.style.cssText = 'margin:12px 0 6px;font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:700';
          plantHd.innerHTML = ' '+esc(p.name)+' <span style="color:var(--text2);margin-left:6px"> '+plantRows.length+'</span>';
          plantsBox.appendChild(plantHd);
          plantsBox.appendChild(renderTable(plantRows, nd));
        });
        netSec.appendChild(plantsBox);
      }
      body.appendChild(netSec);
    });
  }

  function renderTable(rowsIn, nd){
    const tbl = el('table');
    tbl.style.cssText = 'width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px';
    const thS = 'text-align:left;padding:7px 10px;font-size:9.5px;color:var(--text3);'
      + 'text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);font-weight:700';
    tbl.innerHTML = `<thead><tr style="background:var(--bg4)">
      <th style="${thS};width:28px">#</th>
      <th style="${thS}">Instance</th>
      <th style="${thS}">Header / Route</th>
      <th style="${thS}">Attribute</th>
      <th style="${thS}">Status / Formula</th>
      <th style="${thS};text-align:center;width:52px">Config</th>
    </tr></thead><tbody></tbody>`;
    const tb = tbl.querySelector('tbody');

    rowsIn.forEach((r, gi)=>{
      const entry  = ensureStatusEntry(r);
      const atTags = entry.attrTags;          /* guaranteed by ensureStatusEntry */
      const attrs  = r.attrs || [];
      const openKey = 'item_' + r.instanceId;

      /* helpers */
      const safeId = r.instanceId.replace(/[^a-zA-Z0-9]/g,'_');
      function countMapped(){ return attrs.filter(a => !!atTags[a.name]).length; }
      function isOpen(){ return !!STATE._invOpen[openKey]; }

      function headerPillHtml(){
        if(!r.header) return '<span style="color:var(--text3)"></span>';
        return '<span style="display:inline-block;padding:1.5px 7px;border-radius:99px;background:'
          +nd.color+'22;color:'+nd.color+';font-weight:700;font-size:10px;font-family:var(--mono)">'
          +esc(r.header)+'</span>'
          +(r.routeLabel?'<span style="color:var(--text2);font-size:10px;margin-left:5px">'+esc(r.routeLabel)+'</span>':'');
      }
      function badgeHtml(){
        const mc = countMapped(), tot = attrs.length;
        const col = (mc===tot&&tot>0) ? '#56d364' : (mc>0 ? '#e3b341' : 'var(--text3)');
        return '<span class="ab_'+safeId+'" style="font-size:10.5px;color:'+col+';font-weight:700">'
          +mc+'/'+tot+' attrs</span>';
      }

      /*  Group header row  */
      const grpTr = el('tr');
      const baseBg = gi%2 ? 'rgba(255,255,255,.015)' : 'transparent';
      grpTr.style.cssText = 'border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;'
        +'transition:background .12s;background:'+(isOpen()?nd.color+'0d':baseBg);
      grpTr.onmouseenter = ()=>{ grpTr.style.background = nd.color+'1c'; };
      grpTr.onmouseleave = ()=>{ grpTr.style.background = isOpen()?nd.color+'0d':baseBg; };
      const statusEntry = STATE.equipmentStatus[r.instanceId];
      const statusPill  = renderStatusPill(statusEntry);
      grpTr.innerHTML =
        '<td style="padding:8px 10px;color:var(--text3);font-size:10px;font-family:var(--mono)">'+(gi+1)+'</td>'
        +'<td style="padding:8px 10px;color:var(--text);font-weight:600">'
        +  '<span style="font-size:13px;margin-right:5px">'+(isOpen()?'':'')+'</span>'
        +  '<span style="margin-right:5px">'+(r.elemIcon||'')+'</span>'
        +  esc(r.instLabel)
        +  (r.electricDriver?'<span title="Electric driver" style="margin-left:5px;font-size:10px;color:var(--yellow)"></span>':'')
        +'</td>'
        +'<td style="padding:8px 10px">'+headerPillHtml()+'</td>'
        +'<td style="padding:8px 10px">'+badgeHtml()+'</td>'
        +'<td style="padding:8px 10px">'+statusPill+'</td>'
        +'<td style="padding:8px 10px;text-align:center">'
        +  '<button class="st_edit_'+safeId+'" style="padding:3px 9px;border-radius:5px;border:1px solid '
        +  nd.color+'55;background:'+nd.color+'18;color:'+nd.color+';font-size:10.5px;cursor:pointer;font-weight:600"></button>'
        +'</td>';
      grpTr.querySelector('.st_edit_'+safeId).onclick = e=>{
        e.stopPropagation(); openStatusModal(r);
      };
      grpTr.onclick = ()=>{
        STATE._invOpen[openKey] = !STATE._invOpen[openKey];
        saveState(); applyAndRender();
      };
      tb.appendChild(grpTr);

      /* Always show status config rows (PI Tag/Calculate/Formula) inline */
      if(!isOpen()) { /* auto-expand to show status config */
        STATE._invOpen[openKey] = true;
      }

      /*  PI tag available? Yes / No row  */
      const stE = STATE.equipmentStatus[r.instanceId];
      const isYes = stE?.dataSource === 'pi_sensor';
      const isNo  = stE?.dataSource === 'calculate';

      function fmtFormula(formula){
        if(!formula) return '<span style="color:var(--text3)"></span>';
        return formula.replace(/\[([^\]]+)\]/g,
          (_,v)=>'<span style="background:'+nd.color+'22;color:'+nd.color+
                 ';padding:1px 5px;border-radius:3px;font-weight:700;font-size:10px">['+esc(v)+']</span>');
      }

      /* helper to rebuild from this row onwards after Yes/No change */
      /* All inserted rows carry data-sinst for reliable removal */
      function rebuildStatusRows(){
        let nx = grpTr.nextSibling;
        while(nx){ const tmp=nx.nextSibling; if(nx.nodeType===1&&nx.dataset&&nx.dataset.sinst===safeId) nx.remove(); nx=tmp; }
        insertStatusRows();
        if(typeof refreshReviewFooter==='function') refreshReviewFooter();
      }

      function insertStatusRows(){
        const stECur = STATE.equipmentStatus[r.instanceId];
        const yesNow = stECur?.dataSource==='pi_sensor';
        const noNow  = stECur?.dataSource==='calculate';

        /*  PI tag available? row  */
        const qTr = el('tr'); qTr.dataset.sinst=safeId;
        qTr.style.cssText = 'background:'+nd.color+'0a;border-bottom:1px solid rgba(255,255,255,.04)';

        /* build radio group inline */
        const qCell = el('td');
        qCell.colSpan = 6;
        qCell.style.cssText = 'padding:8px 12px 8px 32px';

        const qWrap = el('div');
        qWrap.style.cssText = 'display:flex;align-items:center;gap:14px;flex-wrap:wrap';

        const qLbl = el('span');
        qLbl.style.cssText = 'font-size:12px;font-weight:600;color:var(--text2);flex-shrink:0';
        qLbl.textContent = 'PI tag available?';
        qWrap.appendChild(qLbl);

        ['yes','no'].forEach(val=>{
          const lbl=el('label');
          lbl.style.cssText='display:inline-flex;align-items:center;gap:5px;cursor:pointer;'
            +'font-size:12px;color:var(--text2);user-select:none;padding:4px 10px;border-radius:6px;'
            +'border:1.5px solid '+((val==='yes'&&yesNow)||(val==='no'&&noNow)?nd.color:'var(--border)')+';'
            +'background:'+((val==='yes'&&yesNow)||(val==='no'&&noNow)?nd.color+'18':'var(--bg4)')+';'
            +'transition:all .15s';
          const rdo=el('input'); rdo.type='radio';
          rdo.name='pitag_av_'+safeId; rdo.value=val;
          rdo.style.cssText='accent-color:'+nd.color+';cursor:pointer;width:13px;height:13px';
          if((val==='yes'&&yesNow)||(val==='no'&&noNow)) rdo.checked=true;
          rdo.onchange=()=>{
            if(!rdo.checked) return;
            const ne=ensureStatusEntry(r);
            ne.dataSource = val==='yes' ? 'pi_sensor' : 'calculate';
            if(val==='yes'){ if(!ne.piTag) ne.piTag=''; }
            saveState(); rebuildStatusRows();
          };
          lbl.appendChild(rdo);
          lbl.append(' '+(val==='yes'?'Yes':'No'));
          qWrap.appendChild(lbl);
        });

        const clrBtn=el('button');
        clrBtn.style.cssText='padding:3px 10px;font-size:11px;border-radius:6px;'
          +'border:1px solid rgba(255,80,80,.3);background:rgba(255,80,80,.07);'
          +'color:#ff6b6b;cursor:pointer;font-family:var(--font);margin-left:4px';
        clrBtn.textContent='Clear';
        clrBtn.onclick=e=>{
          e.stopPropagation();
          const ne=STATE.equipmentStatus[r.instanceId];
          if(ne){ ne.dataSource=null; delete ne.piTag; delete ne.attrTags; }
          saveState(); rebuildStatusRows();
        };
        qWrap.appendChild(clrBtn);

        /* Edit advanced button */
        const advBtn=el('button');
        advBtn.style.cssText='margin-left:auto;padding:3px 9px;font-size:10px;border-radius:5px;'
          +'border:1px solid '+nd.color+'55;background:'+nd.color+'18;'
          +'color:'+nd.color+';cursor:pointer;font-weight:600;font-family:var(--font)';
        advBtn.textContent=' Edit Formula';
        advBtn.onclick=e=>{ e.stopPropagation(); openStatusModal(r); };
        qWrap.appendChild(advBtn);

        qCell.appendChild(qWrap);
        qTr.appendChild(qCell);
        grpTr.after(qTr);
        let lastInserted = qTr;

        /*  Yes: direct PI tag input row  */
        if(yesNow){
          const yTr=el('tr'); yTr.dataset.sinst=safeId;
          yTr.style.cssText='background:rgba(88,166,255,.05);border-bottom:1px solid rgba(255,255,255,.04)';
          const yCell=el('td'); yCell.colSpan=6;
          yCell.style.cssText='padding:7px 12px 7px 32px';
          const curTag=stECur?.piTag||'';
          const yWrap=el('div'); yWrap.style.cssText='display:flex;align-items:center;gap:8px';
          const yLbl=el('span'); yLbl.style.cssText='font-size:11px;color:var(--text3);flex-shrink:0;width:110px';
          yLbl.textContent='Status PI Tag:';
          const yInp=el('input'); yInp.type='text';
          yInp.placeholder='PI tag or formula, e.g. [TAG1]+[TAG2]';
          yInp.value=curTag;
          yInp.style.cssText='flex:1;padding:6px 10px;border-radius:6px;border:1.5px solid '
            +(curTag?'#58A6FF88':'var(--border)')+';background:var(--bg4);color:var(--text);'
            +'font-family:var(--mono);font-size:11.5px;outline:none;transition:border-color .15s';
          yInp.onfocus=()=>yInp.style.borderColor='#58A6FF';
          const yDone=el('span'); yDone.style.cssText='font-size:14px;flex-shrink:0';
          yDone.textContent=curTag?'':'';
          yInp.onblur=()=>{
            const v=yInp.value.trim();
            STATE.equipmentStatus[r.instanceId].piTag=v; saveState();
            yInp.style.borderColor=v?'#58A6FF88':'var(--border)';
            yDone.textContent=v?'':'';
            if(typeof refreshReviewFooter==='function') refreshReviewFooter();
          };
          yInp.onkeydown=e=>{ if(e.key==='Enter') yInp.blur(); };
          yInp.onclick=e=>e.stopPropagation();
          yWrap.appendChild(yLbl); yWrap.appendChild(yInp); yWrap.appendChild(yDone);
          yCell.appendChild(yWrap); yTr.appendChild(yCell);
          lastInserted.after(yTr); lastInserted=yTr;
        }

        /* -- No: custom formula + user-selected attribute PI tags -- */
        if(noNow){
          const se = STATE.equipmentStatus[r.instanceId];
          if(!se.attrTags)      se.attrTags={};
          if(!se.selectedAttrs) se.selectedAttrs={};
          /* clear any system-default formula so user starts fresh */
          if(se.isDefault){ se.formula=''; se.isDefault=false; }

          /* -- Custom Formula input row -- */
          const fTr=el('tr'); fTr.dataset.sinst=safeId;
          fTr.style.cssText='background:'+nd.color+'07;border-bottom:1px solid rgba(255,255,255,.04)';
          const fCell=el('td'); fCell.colSpan=6; fCell.style.cssText='padding:8px 12px 8px 32px';
          const fWrap=el('div'); fWrap.style.cssText='display:flex;align-items:center;gap:10px;flex-wrap:wrap';
          const fLbl=el('span');
          fLbl.style.cssText='font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:700;flex-shrink:0;width:110px';
          fLbl.textContent='Custom Formula';
          const fInp=el('input'); fInp.type='text';
          fInp.placeholder='e.g. [Demand Flow] > 0   or   [Driver Power] > 5';
          fInp.value=se.formula||'';
          fInp.style.cssText='flex:1;padding:6px 10px;border-radius:6px;border:1.5px solid '
            +(se.formula?nd.color+'88':'var(--border)')+';background:var(--bg4);color:var(--text);'
            +'font-family:var(--mono);font-size:11.5px;outline:none;transition:border-color .15s';
          fInp.onfocus=()=>fInp.style.borderColor=nd.color;
          fInp.onblur=()=>{ se.formula=fInp.value.trim(); saveState(); fInp.style.borderColor=fInp.value.trim()?nd.color+'88':'var(--border)'; };
          fInp.onkeydown=e=>{ if(e.key==='Enter') fInp.blur(); };
          fInp.onclick=e=>e.stopPropagation();
          const fHint=el('span');
          fHint.style.cssText='font-size:10px;color:var(--text3);flex-shrink:0';
          fHint.innerHTML='<em>Tip: use [Attribute Name] tokens</em>';
          fWrap.appendChild(fLbl); fWrap.appendChild(fInp); fWrap.appendChild(fHint);
          fCell.appendChild(fWrap); fTr.appendChild(fCell);
          lastInserted.after(fTr); lastInserted=fTr;

          /* -- Select Attributes header -- */
          const aHdrTr=el('tr'); aHdrTr.dataset.sinst=safeId;
          aHdrTr.style.cssText='background:var(--bg4);border-bottom:1px solid rgba(255,255,255,.06)';
          const aHdrCell=el('td'); aHdrCell.colSpan=6;
          aHdrCell.style.cssText='padding:5px 12px 5px 32px';
          aHdrCell.innerHTML='<span style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;font-weight:700">Select Attributes &amp; Assign PI Tags</span>'
            +'<span style="font-size:9px;color:var(--text3);margin-left:10px">ⓘ Check each attribute required for the formula</span>';
          aHdrTr.appendChild(aHdrCell);
          lastInserted.after(aHdrTr); lastInserted=aHdrTr;

          /* -- Per-attribute rows -- */
          attrs.forEach((attr,ai)=>{
            const isSel  = !!se.selectedAttrs[attr.name];
            const curTag = se.attrTags[attr.name]||'';

            const atr=el('tr'); atr.dataset.sinst=safeId;
            atr.style.cssText='background:'+(isSel?nd.color+'10':ai%2?nd.color+'04':'transparent')
              +';border-bottom:1px solid rgba(255,255,255,.015);transition:background .12s';

            /* checkbox */
            const chkCell=el('td'); chkCell.style.cssText='padding:7px 6px 7px 32px;width:32px';
            const chk=el('input'); chk.type='checkbox'; chk.checked=isSel;
            chk.style.cssText='accent-color:'+nd.color+';width:14px;height:14px;cursor:pointer';
            chkCell.appendChild(chk);

            /* name */
            const nmCell=el('td'); nmCell.colSpan=2;
            nmCell.style.cssText='padding:7px 10px;font-size:12px;color:'+(isSel?'var(--text)':'var(--text3)')
              +';font-weight:'+(isSel?'600':'400')+';cursor:pointer';
            nmCell.innerHTML=esc(attr.name)+(attr.uom?'<span style="color:var(--text3);font-size:9.5px;margin-left:5px">('+esc(attr.uom)+')</span>':'');
            nmCell.onclick=()=>{ chk.checked=!chk.checked; chk.dispatchEvent(new Event('change')); };

            /* PI tag input - only visible when checked */
            const tagCell=el('td'); tagCell.style.cssText='padding:4px 10px 4px 4px;width:46%';
            const tagInp=el('input'); tagInp.type='text';
            tagInp.placeholder='Enter PI tag...';
            tagInp.value=curTag;
            tagInp.style.cssText='width:100%;padding:5px 8px;border-radius:5px;border:1.5px solid '
              +(curTag?nd.color+'99':'var(--border)')+';background:var(--bg4);color:'
              +(curTag?'var(--cyan)':'var(--text2)')+';font-family:var(--mono);font-size:11px;'
              +'outline:none;box-sizing:border-box;transition:all .12s;display:'+(isSel?'block':'none');
            tagInp.onfocus=()=>tagInp.style.borderColor=nd.color;

            const doneCell=el('td');
            doneCell.style.cssText='padding:5px 10px;text-align:center;font-size:13px';
            doneCell.textContent=(isSel&&curTag)?'\u2705':'';

            tagInp.onblur=()=>{
              se.attrTags[attr.name]=tagInp.value.trim();
              atTags[attr.name]=tagInp.value.trim();
              saveState();
              tagInp.style.borderColor=tagInp.value.trim()?nd.color+'99':'var(--border)';
              tagInp.style.color=tagInp.value.trim()?'var(--cyan)':'var(--text2)';
              doneCell.textContent=tagInp.value.trim()?'\u2705':'\u2610';
              const badge=tbl.querySelector('.ab_'+safeId);
              if(badge){ const mc=countMapped(),tot=attrs.length;
                const col=(mc===tot&&tot>0)?'#56d364':(mc>0?'#e3b341':'var(--text3)');
                badge.style.color=col; badge.textContent=mc+'/'+tot+' attrs'; }
              if(typeof refreshReviewFooter==='function') refreshReviewFooter();
            };
            tagInp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); tagInp.blur(); } };
            tagInp.onclick=e=>e.stopPropagation();
            tagCell.appendChild(tagInp);

            chk.onchange=()=>{
              se.selectedAttrs[attr.name]=chk.checked;
              if(!chk.checked){ se.attrTags[attr.name]=''; atTags[attr.name]=''; tagInp.value=''; }
              saveState();
              atr.style.background=chk.checked?nd.color+'10':ai%2?nd.color+'04':'transparent';
              nmCell.style.color=chk.checked?'var(--text)':'var(--text3)';
              nmCell.style.fontWeight=chk.checked?'600':'400';
              tagInp.style.display=chk.checked?'block':'none';
              doneCell.textContent='';
            };

            atr.appendChild(chkCell); atr.appendChild(nmCell);
            atr.appendChild(tagCell); atr.appendChild(doneCell);
            lastInserted.after(atr); lastInserted=atr;
          });

          /*  Add custom attribute button & rows  */
          if(!se.customAttrs) se.customAttrs=[];

          function renderCustomAttrs(){
            tbl.querySelectorAll('[data-custattr="'+safeId+'"]').forEach(n=>n.remove());
            se.customAttrs.forEach((ca,ci)=>{
              const catr=el('tr'); catr.dataset.sinst=safeId; catr.dataset.custattr=safeId;
              catr.style.cssText='background:'+nd.color+'08;border-bottom:1px solid rgba(255,255,255,.015)';

              const cChkCell=el('td'); cChkCell.style.cssText='padding:7px 6px 7px 32px;width:32px';
              const cChk=el('input'); cChk.type='checkbox'; cChk.checked=!!ca.selected;
              cChk.style.cssText='accent-color:'+nd.color+';width:14px;height:14px;cursor:pointer';
              cChkCell.appendChild(cChk);

              const cNmCell=el('td'); cNmCell.colSpan=2; cNmCell.style.cssText='padding:4px 10px';
              const cNmInp=el('input'); cNmInp.type='text';
              cNmInp.placeholder='Attribute name (e.g. Outlet Temperature)';
              cNmInp.value=ca.name||'';
              cNmInp.style.cssText='width:100%;padding:5px 8px;border-radius:5px;border:1.5px solid '
                +(ca.name?nd.color+'55':'var(--border)')+';background:var(--bg4);color:var(--text);'
                +'font-size:11.5px;font-weight:600;outline:none;box-sizing:border-box;transition:border-color .12s';
              cNmInp.onfocus=()=>cNmInp.style.borderColor=nd.color;
              cNmInp.onblur=()=>{ ca.name=cNmInp.value.trim(); saveState();
                cNmInp.style.borderColor=cNmInp.value.trim()?nd.color+'55':'var(--border)'; };
              cNmInp.onkeydown=e=>{ if(e.key==='Enter') cNmInp.blur(); };
              cNmInp.onclick=e=>e.stopPropagation();
              cNmCell.appendChild(cNmInp);

              const cTagCell=el('td'); cTagCell.style.cssText='padding:4px 10px 4px 4px;width:46%';
              const cTagInp=el('input'); cTagInp.type='text';
              cTagInp.placeholder='Enter PI tag...';
              cTagInp.value=ca.piTag||'';
              cTagInp.style.cssText='width:100%;padding:5px 8px;border-radius:5px;border:1.5px solid '
                +(ca.piTag?nd.color+'99':'var(--border)')+';background:var(--bg4);color:'
                +(ca.piTag?'var(--cyan)':'var(--text2)')+';font-family:var(--mono);font-size:11px;'
                +'outline:none;box-sizing:border-box;transition:all .12s;display:'+(ca.selected?'block':'none');
              cTagInp.onfocus=()=>cTagInp.style.borderColor=nd.color;
              const cDoneCell=el('td'); cDoneCell.style.cssText='padding:5px 6px;text-align:center;font-size:13px';
              cDoneCell.textContent=(ca.selected&&ca.piTag)?'':'';

              cTagInp.onblur=()=>{ ca.piTag=cTagInp.value.trim(); saveState();
                cTagInp.style.borderColor=cTagInp.value.trim()?nd.color+'99':'var(--border)';
                cTagInp.style.color=cTagInp.value.trim()?'var(--cyan)':'var(--text2)';
                cDoneCell.textContent=cTagInp.value.trim()?'':'';
                if(typeof refreshReviewFooter==='function') refreshReviewFooter();
              };
              cTagInp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); cTagInp.blur(); } };
              cTagInp.onclick=e=>e.stopPropagation();
              cTagCell.appendChild(cTagInp);

              const cDelCell=el('td'); cDelCell.style.cssText='padding:5px 6px;text-align:center;width:28px';
              const cDelBtn=el('button');
              cDelBtn.style.cssText='width:22px;height:22px;border-radius:4px;border:1px solid rgba(255,80,80,.35);'
                +'background:rgba(255,80,80,.08);color:#ff6b6b;cursor:pointer;font-size:13px;line-height:1;font-family:var(--font)';
              cDelBtn.textContent='';
              cDelBtn.onclick=e=>{ e.stopPropagation(); se.customAttrs.splice(ci,1); saveState(); renderCustomAttrs(); };
              cDelCell.appendChild(cDelBtn);

              cChk.onchange=()=>{ ca.selected=cChk.checked; if(!cChk.checked) ca.piTag=''; saveState();
                cTagInp.style.display=cChk.checked?'block':'none'; cDoneCell.textContent=''; };

              catr.appendChild(cChkCell); catr.appendChild(cNmCell);
              catr.appendChild(cTagCell); catr.appendChild(cDoneCell); catr.appendChild(cDelCell);
              const addRow=tbl.querySelector('[data-addattr="'+safeId+'"]');
              if(addRow) addRow.before(catr); else tb.appendChild(catr);
            });
          }

          const addTr=el('tr'); addTr.dataset.sinst=safeId; addTr.dataset.addattr=safeId;
          addTr.style.cssText='background:transparent';
          const addCell=el('td'); addCell.colSpan=6; addCell.style.cssText='padding:8px 12px 8px 32px';
          const addBtn=el('button');
          addBtn.style.cssText='padding:5px 14px;font-size:11.5px;font-weight:600;border-radius:6px;'
            +'border:1.5px dashed '+nd.color+';background:'+nd.color+'0a;color:'+nd.color+';'
            +'cursor:pointer;font-family:var(--font);transition:background .15s';
          addBtn.innerHTML='＋ Add Attribute';
          addBtn.onmouseenter=()=>addBtn.style.background=nd.color+'1a';
          addBtn.onmouseleave=()=>addBtn.style.background=nd.color+'0a';
          addBtn.onclick=e=>{ e.stopPropagation(); se.customAttrs.push({name:'',piTag:'',selected:true}); saveState(); renderCustomAttrs(); };
          addCell.appendChild(addBtn); addTr.appendChild(addCell);
          lastInserted.after(addTr); lastInserted=addTr;
          renderCustomAttrs();
        }

        /* separator */
        const sep2=el('tr'); sep2.dataset.sinst=safeId;
        sep2.innerHTML='<td colspan="6" style="height:4px;background:var(--bg4)"></td>';
        lastInserted.after(sep2);
      }

      insertStatusRows();
    });

    return tbl;
  }

  /*  Review & Complete footer  */
  const reviewFooter = el('div');
  reviewFooter.style.cssText = 'margin-top:24px;padding:16px 20px;border-radius:12px;'
    + 'border:1.5px solid var(--border);background:var(--bg2);display:none';

  function refreshReviewFooter(){
    /* Count fully-mapped instances across currently visible plant selection */
    const visItems = items.filter(r => plantSel.size === 0 ? false : plantSel.has(r.plantId));
    if(visItems.length === 0){ reviewFooter.style.display='none'; return; }

    const total  = visItems.length;
    const done   = visItems.filter(r=>{
      const e = STATE.equipmentStatus[r.instanceId];
      if(!e) return false;
      const attrs = r.attrs||[];
      if(!attrs.length) return true;
      return attrs.every(a => !!(e.attrTags&&e.attrTags[a.name]));
    }).length;

    if(done === 0){ reviewFooter.style.display='none'; return; }

    reviewFooter.style.display = 'block';
    const pct = Math.round(done/total*100);
    const allDone = done === total;

    reviewFooter.innerHTML = ''
      + '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">'
      +   '<div style="flex:1;min-width:200px">'
      +     '<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px">'
      +       (allDone ? ' All instances configured' : ' Configuration in progress')
      +     '</div>'
      +     '<div style="height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;margin-bottom:6px">'
      +       '<div style="height:100%;border-radius:3px;background:'+(allDone?'#3FB950':'#F0C040')+';width:'+pct+'%;transition:width .3s"></div>'
      +     '</div>'
      +     '<div style="font-size:11px;color:var(--text3)">'
      +       done+' of '+total+' instances fully mapped'
      +       (allDone ? '' : '  map remaining PI tags to complete')
      +     '</div>'
      +   '</div>'
      +   '<div style="display:flex;gap:8px;flex-shrink:0">'
      +     (allDone
          ? '<button id="inv-complete-btn" style="padding:9px 20px;border-radius:8px;border:none;'
            + 'background:#3FB950;color:#fff;font-size:13px;font-weight:700;cursor:pointer;'
            + 'font-family:var(--font)"> Mark Complete &amp; Proceed</button>'
          : '<button id="inv-review-btn" style="padding:9px 20px;border-radius:8px;'
            + 'border:1px solid var(--net-color);background:var(--bg3);color:var(--net-color);'
            + 'font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)"> Review Progress</button>')
      +   '</div>'
      + '</div>';

    const cBtn = reviewFooter.querySelector('#inv-complete-btn');
    if(cBtn) cBtn.onclick = ()=>{
      STATE._invComplete = true;
      saveState();
      toast('Equipment Status complete  proceeding to System KPI\'s','success');
      /* Switch to KPI Config sub-tab */
      STATE._kpiSubTab = 'kpiconfig';
      render();
    };

    const rBtn = reviewFooter.querySelector('#inv-review-btn');
    if(rBtn) rBtn.onclick = ()=>{
      /* Expand all instances in the current plant selection */
      items.filter(r=>plantSel.has(r.plantId)).forEach(r=>{
        STATE._invOpen['item_'+r.instanceId] = true;
      });
      saveState(); applyAndRender();
    };
  }

  w.appendChild(reviewFooter);

  /* Patch applyAndRender to also refresh the footer */
  const _origApply = applyAndRender;
  /* eslint-disable no-func-assign */
  applyAndRender = function(){
    _origApply();
    refreshReviewFooter();
  };

  applyAndRender();
  return w;
}


/* ============================================================================
 *  STATUS CONFIGURATION MODAL
 *  Mirrors the KPI Config detail-modal pattern: color bar, header with
 *  element meta, step-1 data-source selector (4 modes), step-2 configure
 *  form (varies by mode), symbolic PI-tag preview, Save/Cancel/Reset.
 * ============================================================================ */
function openStatusModal(item){
  const entry = ensureStatusEntry(item);
  let pendingDS      = entry.dataSource;
  let pendingFormula = entry.formula || '';
  let pendingPiTag   = entry.piTag   || '';

  /*  Overlay + panel  */
  const ov = el('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:9100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)';
  ov.onclick = (e)=>{ if(e.target===ov) ov.remove(); };

  const panel = el('div');
  panel.style.cssText = 'display:flex;flex-direction:column;width:100%;max-width:720px;max-height:90vh;border-radius:12px;overflow:hidden;box-shadow:0 28px 72px rgba(0,0,0,.7);background:#1a1f2e;border:1.5px solid #2d3448';
  ov.appendChild(panel);

  const cbar = el('div');
  cbar.style.cssText = 'height:4px;flex-shrink:0;background:linear-gradient(90deg,'+item.netColor+','+item.netColor+'44)';
  panel.appendChild(cbar);

  /*  Header  */
  const mhdr = el('div');
  mhdr.style.cssText = 'display:flex;align-items:flex-start;gap:14px;padding:16px 20px 14px;border-bottom:1px solid #2d3448;flex-shrink:0;background:#1a1f2e';
  const hIco = el('span'); hIco.style.cssText='font-size:28px;line-height:1;flex-shrink:0'; hIco.textContent = item.elemIcon || '';
  const hMid = el('div'); hMid.style.cssText='flex:1;min-width:0';
  const hNm  = el('div'); hNm.style.cssText='font-size:15px;font-weight:700;color:#e6edf3;margin-bottom:6px';
  hNm.textContent = item.instLabel;
  const hSub = el('div'); hSub.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap';
  const netShort = item.netName.replace(' Network','').replace('Distribution Network','Power').replace('Significant Energy Consumers','SEC');
  const hCat = el('span');
  hCat.style.cssText='font-size:10px;padding:2px 9px;border-radius:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:'+item.netColor+'22;color:'+item.netColor+';border:1px solid '+item.netColor+'66';
  hCat.textContent = netShort + (item.role ? '  '+item.role : '');
  hSub.appendChild(hCat);
  if(item.header){
    const hHdr = el('span'); hHdr.style.cssText='font-size:11px;color:#8b949e';
    hHdr.textContent = 'Header: '+item.header + (item.routeLabel ? '  ('+item.routeLabel+')' : '');
    hSub.appendChild(hHdr);
  }
  if(item.plantName){
    const hP = el('span'); hP.style.cssText='font-size:11px;color:#8b949e';
    hP.textContent = ' '+item.plantName;
    hSub.appendChild(hP);
  }
  hMid.appendChild(hNm); hMid.appendChild(hSub);
  const xBtn = el('button');
  xBtn.style.cssText='flex-shrink:0;width:28px;height:28px;border-radius:6px;border:1px solid #2d3448;background:#252b3b;color:#8b949e;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px';
  xBtn.textContent = '';
  xBtn.onmouseenter=()=>{ xBtn.style.background='#313850'; xBtn.style.color='#e6edf3'; };
  xBtn.onmouseleave=()=>{ xBtn.style.background='#252b3b'; xBtn.style.color='#8b949e'; };
  xBtn.onclick = ()=>ov.remove();
  mhdr.appendChild(hIco); mhdr.appendChild(hMid); mhdr.appendChild(xBtn);
  panel.appendChild(mhdr);

  /*  Scrollable body  */
  const mbody = el('div');
  mbody.style.cssText = 'flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px;background:#151b2b';
  panel.appendChild(mbody);

  /*  Section 0  Attribute PI Tag Mapping  */
  /* Each measurement attribute maps to a physical PI sensor tag.
     These are referenced by [Attribute Name] tokens in the status formula. */
  const modalAttrs = item.attrs || [];
  if(modalAttrs.length > 0){
    const atSec = el('div');
    atSec.style.cssText = 'border:1px solid #2d3448;border-radius:10px;overflow:hidden;background:#1e2436';

    const atSecHd = el('div');
    atSecHd.style.cssText = 'padding:10px 14px;background:#252b3b;border-bottom:1px solid #2d3448;'
      + 'display:flex;align-items:center;gap:8px';
    atSecHd.innerHTML = '<span style="font-size:10px;font-weight:700;text-transform:uppercase;'
      + 'letter-spacing:.8px;color:#8b949e"> Attribute PI Tags</span>'
      + '<span style="font-size:10px;color:#8b949e;margin-left:4px"> map each measurement to its PI sensor</span>';
    atSec.appendChild(atSecHd);

    const atTbl = el('table');
    atTbl.style.cssText = 'width:100%;border-collapse:collapse;font-size:12px';
    const atTbody = el('tbody');

    modalAttrs.forEach((attr, ai)=>{
      const curVal   = entry.attrTags[attr.name] || '';
      const isMapped = !!curVal;

      const aRow = el('tr');
      aRow.style.cssText = 'border-bottom:1px solid #232940';
      aRow.innerHTML =
        '<td style="padding:8px 14px;width:36%;color:'+(isMapped?'#e6edf3':'#8b949e')+';font-size:11.5px;font-weight:'+(isMapped?'600':'400')+'">'
        +  esc(attr.name)
        +  (attr.uom?'<span style="color:#8b949e;font-size:9.5px;margin-left:5px">('+esc(attr.uom)+')</span>':'')
        +'</td>'
        +'<td style="padding:6px 14px 6px 6px;">'
        +  '<input type="text" value="'+esc(curVal)+'" placeholder="PI tag, e.g. UN.UO.FUE101.STEAMOUTPUT"'
        +  ' style="width:100%;padding:6px 10px;border-radius:6px;border:1.5px solid '+(isMapped?item.netColor+'88':'#2d3448')+';'
        +  'background:#1a1f2e;color:'+(isMapped?'var(--cyan,#56b6c2)':'#c9d1d9')+';'
        +  'font-family:var(--mono,monospace);font-size:11px;outline:none;box-sizing:border-box;transition:border-color .12s">'
        +'</td>'
        +'<td style="padding:6px 10px 6px 0;width:28px;text-align:center;font-size:13px">'
        +(isMapped?'':'')+'</td>';

      const inp  = aRow.querySelector('input');
      const doneTd = aRow.querySelector('td:last-child');
      const labelTd = aRow.querySelector('td:first-child');

      function saveAttr(){
        const v = inp.value.trim();
        entry.attrTags[attr.name] = v;
        saveState();
        const mapped = !!v;
        inp.style.borderColor = mapped ? item.netColor+'88' : '#2d3448';
        inp.style.color       = mapped ? 'var(--cyan,#56b6c2)' : '#c9d1d9';
        doneTd.textContent    = mapped ? '' : '';
        labelTd.style.color   = mapped ? '#e6edf3' : '#8b949e';
        labelTd.style.fontWeight = mapped ? '600' : '400';
        /* also refresh the resolved-formula preview (renderPreview is hoisted) */
        if(pendingDS === 'calculate') renderPreview();
      }
      inp.onblur   = saveAttr;
      inp.onkeydown= e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } };
      inp.onfocus  = ()=>{ inp.style.borderColor = item.netColor; };

      atTbody.appendChild(aRow);
    });

    atTbl.appendChild(atTbody);
    atSec.appendChild(atTbl);

    const atNote = el('div');
    atNote.style.cssText = 'padding:8px 14px;font-size:10px;color:#8b949e;border-top:1px solid #2d3448;background:#1a1f2e';
    atNote.innerHTML = ' Use <span style="font-family:var(--mono);color:#79c0ff">[Attribute Name]</span> in the formula below  it will resolve to the PI tag mapped above.';
    atSec.appendChild(atNote);
    mbody.appendChild(atSec);
  }

  /* Step 2  DS selector  */
  const s1Hd = el('div');
  s1Hd.style.cssText='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#8b949e;margin-bottom:2px';
  s1Hd.innerHTML = (modalAttrs.length > 0 ? '\u{2461}' : '\u{2460}') + ' Select Status Source';
  mbody.appendChild(s1Hd);

  const dsGrid = el('div');
  dsGrid.style.cssText = 'display:grid;grid-template-columns:repeat(2,1fr);gap:10px';
  const dsBtnEls = [];
  STATUS_DS.forEach(d=>{
    const b = el('button');
    b.style.cssText = 'display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-radius:10px;cursor:pointer;font-family:inherit;text-align:left;transition:all .15s;border:2px solid #2d3448;background:#1e2436;color:#8b949e';
    const ico = el('span'); ico.style.cssText='font-size:20px;line-height:1;flex-shrink:0;margin-top:1px'; ico.textContent = d.icon;
    const tx  = el('div');  tx.style.cssText='flex:1;min-width:0';
    const lab = el('div');  lab.style.cssText='font-size:12px;font-weight:700;margin-bottom:3px'; lab.textContent = d.label;
    const sub = el('div');  sub.style.cssText='font-size:10px;color:#8b949e;line-height:1.3'; sub.textContent = d.desc;
    tx.appendChild(lab); tx.appendChild(sub);
    b.appendChild(ico); b.appendChild(tx);
    b.onclick = ()=>{ pendingDS = d.id; sync(); };
    dsGrid.appendChild(b);
    dsBtnEls.push({el:b, d});
  });
  mbody.appendChild(dsGrid);

  /* Step 2  Configure (dynamic per DS mode) */
  const s2Hd = el('div');
  s2Hd.style.cssText='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#8b949e;margin-bottom:2px;margin-top:4px';
  s2Hd.innerHTML = '\u{2461} Configure';
  mbody.appendChild(s2Hd);

  const cfgBox = el('div');
  cfgBox.style.cssText = 'display:flex;flex-direction:column;gap:12px';
  mbody.appendChild(cfgBox);

  /* helpers (closure-local) */
  function mkInput(value, ph){
    const i = el('input');
    i.type='text'; i.value = value || ''; i.placeholder = ph || '';
    i.style.cssText = 'width:100%;padding:7px 11px;border-radius:6px;border:1px solid #2d3448;background:#1e2436;color:#e6edf3;font-size:12px;font-family:var(--mono);outline:none;transition:border-color .15s';
    i.onfocus=()=>{ i.style.borderColor='#F0C040'; };
    i.onblur =()=>{ i.style.borderColor='#2d3448'; };
    return i;
  }
  function field(label, hintHTML, inputEl){
    const wrap = el('div');
    const lab = el('label'); lab.style.cssText='display:block;font-size:11px;color:#e6edf3;margin-bottom:5px;font-weight:600'; lab.textContent = label;
    wrap.appendChild(lab);
    wrap.appendChild(inputEl);
    if(hintHTML){
      const h = el('div'); h.style.cssText='font-size:10.5px;color:#8b949e;margin-top:5px;line-height:1.45';
      h.innerHTML = hintHTML;
      wrap.appendChild(h);
    }
    return wrap;
  }

  let previewBoxEl = null;
  function attachPreview(parent){
    previewBoxEl = el('div');
    previewBoxEl.style.cssText = 'padding:10px 12px;border-radius:8px;background:#1e2436;border:1px solid #2d3448;font-family:var(--mono);font-size:11px;color:#56D4DD;word-break:break-all;line-height:1.6';
    parent.appendChild(previewBoxEl);
    renderPreview();
  }
  function renderPreview(){
    if(!previewBoxEl) return;
    let expanded = '';
    if(pendingDS === 'pi_sensor'){
      expanded = pendingPiTag
        ? 'if(['+pendingPiTag+'] > 0.5, 1, 0)'
        : '(enter a PI tag above)';
    } else if(pendingDS === 'calculate'){
      const sym = (pendingFormula||'').trim();
      if(!sym){ expanded = '(enter a formula above)'; }
      else { expanded = 'if( '+expandFormulaForInstance(sym, item)+' , 1, 0 )'; }
    }
    previewBoxEl.innerHTML = '<div style="font-size:9.5px;color:#8b949e;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-family:var(--font);font-weight:700"> Status value resolved at export to</div>'+esc(expanded);
  }

  function renderCfg(){
    cfgBox.innerHTML = '';

    if(pendingDS === 'pi_sensor'){
      const piInp = mkInput(pendingPiTag, 'e.g. UB.UB.BLR-101.RUN.PV');
      piInp.oninput = (e)=>{ pendingPiTag = e.target.value; renderPreview(); };
      cfgBox.appendChild(field(
        'Source PI Tag (DCS boolean)',
        'The 0/1 status value comes directly from this DCS tag. Use this when your control system already publishes a running indicator.',
        piInp
      ));
      attachPreview(cfgBox);
    }
    else if(pendingDS === 'calculate'){
      const fInp = mkInput(pendingFormula, '[Attribute] > value');
      fInp.oninput = (e)=>{ pendingFormula = e.target.value; renderPreview(); };
      const fWrap = field(
        'Formula',
        'Composite boolean expression. Operators: <code style="background:#1e2436;padding:1px 5px;border-radius:4px">&gt; &gt;= &lt; &lt;= == != &amp;&amp; ||</code> arithmetic, and <code style="background:#1e2436;padding:1px 5px;border-radius:4px">if(c,t,e)</code>, <code style="background:#1e2436;padding:1px 5px;border-radius:4px">min</code>, <code style="background:#1e2436;padding:1px 5px;border-radius:4px">max</code>, <code style="background:#1e2436;padding:1px 5px;border-radius:4px">ceil</code>. Reference this instance\'s attributes by name in <code style="background:#1e2436;padding:1px 5px;border-radius:4px">[brackets]</code>.',
        fInp
      );
      cfgBox.appendChild(fWrap);

      /* Attribute insert chips */
      if((item.attrs||[]).length){
        const chipsRow = el('div');
        chipsRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center';
        const chipLbl = el('span');
        chipLbl.style.cssText='font-size:10px;color:#8b949e;margin-right:6px;font-weight:600';
        chipLbl.textContent=' Insert attribute:';
        chipsRow.appendChild(chipLbl);
        item.attrs.forEach(a=>{
          const c = el('button');
          c.style.cssText = 'padding:3px 9px;border-radius:99px;border:1px solid #2d3448;background:#1e2436;color:#e6edf3;font-size:10.5px;cursor:pointer;font-family:var(--mono);transition:all .12s';
          c.textContent = a.name;
          c.onmouseenter = ()=>{ c.style.background='#252b3b'; c.style.borderColor='#F0C040'; };
          c.onmouseleave = ()=>{ c.style.background='#1e2436'; c.style.borderColor='#2d3448'; };
          c.onclick = (ev)=>{
            ev.preventDefault();
            const insert = '['+a.name+']';
            const start = fInp.selectionStart || fInp.value.length;
            const end   = fInp.selectionEnd   || fInp.value.length;
            fInp.value  = fInp.value.slice(0,start) + insert + fInp.value.slice(end);
            pendingFormula = fInp.value;
            fInp.focus();
            const pos = start + insert.length;
            try { fInp.setSelectionRange(pos, pos); } catch(_){}
            renderPreview();
          };
          chipsRow.appendChild(c);
        });
        fWrap.appendChild(chipsRow);
      }

      /* Default-applied hint */
      const def = getStatusDefault(item.elemKey, item.electricDriver);
      if(def.dataSource === 'calculate' && def.formula){
        const dhint = el('div');
        dhint.style.cssText = 'font-size:10.5px;color:#8b949e;margin-top:8px;padding:6px 10px;border-radius:6px;background:rgba(63,185,80,.08);border-left:2px solid #3FB950;line-height:1.45';
        dhint.innerHTML = '\u{1F4A1} Default for <strong>'+esc(item.elemName)+'</strong>: <code style="background:#1e2436;padding:1px 5px;border-radius:4px;color:#F0C040">'+esc(def.formula)+'</code>';
        cfgBox.appendChild(dhint);
      }
      attachPreview(cfgBox);
    }
  }

  function sync(){
    dsBtnEls.forEach(({el:b, d})=>{
      const on = pendingDS === d.id;
      b.style.borderColor = on ? d.color : '#2d3448';
      b.style.background  = on ? d.bg    : '#1e2436';
      b.style.color       = on ? '#e6edf3' : '#8b949e';
    });
    renderCfg();
  }

  /*  Footer  */
  const mfoot = el('div');
  mfoot.style.cssText = 'display:flex;gap:8px;padding:14px 20px;border-top:1px solid #2d3448;background:#1a1f2e;flex-shrink:0;align-items:center';

  const resetBtn = el('button');
  resetBtn.style.cssText = 'padding:8px 14px;border-radius:7px;border:1px solid #2d3448;background:transparent;color:#8b949e;font-size:12px;cursor:pointer;font-weight:600;transition:all .12s';
  resetBtn.textContent = ' Reset to default';
  resetBtn.title = 'Restore the studio default for this element type';
  resetBtn.onmouseenter=()=>{ resetBtn.style.background='#252b3b'; resetBtn.style.color='#e6edf3'; };
  resetBtn.onmouseleave=()=>{ resetBtn.style.background='transparent'; resetBtn.style.color='#8b949e'; };
  resetBtn.onclick = ()=>{
    const def = getStatusDefault(item.elemKey, item.electricDriver);
    pendingDS      = def.dataSource;
    pendingFormula = def.formula || '';
    pendingPiTag   = '';
    sync();
  };
  mfoot.appendChild(resetBtn);

  const spacer = el('div'); spacer.style.cssText='flex:1';
  mfoot.appendChild(spacer);

  /*  Apply-to-all button (only shown when >1 instance of this element type)  */
  const _applyAllInv   = buildEquipmentInventory();
  const _sameTypeItems = _applyAllInv.filter(
    it => it.elemKey === item.elemKey && it.netKey === item.netKey
  );
  if (_sameTypeItems.length > 1) {
    const applyAllBtn = el('button');
    applyAllBtn.style.cssText = 'padding:8px 14px;border-radius:7px;border:1px solid #3a4468;'
      + 'background:#252b3b;color:#f0883e;font-size:12px;cursor:pointer;font-weight:600;'
      + 'transition:all .12s;white-space:nowrap';
    applyAllBtn.textContent = ' Apply to all ' + _sameTypeItems.length + '  ' + item.elemName;
    applyAllBtn.title = 'Save this configuration to every instance of ' + item.elemName
      + ' in the ' + item.netLabel + ' network (' + _sameTypeItems.length + ' total)';
    applyAllBtn.onmouseenter = () => {
      applyAllBtn.style.background    = '#2d3448';
      applyAllBtn.style.borderColor   = '#f0883e';
    };
    applyAllBtn.onmouseleave = () => {
      applyAllBtn.style.background    = '#252b3b';
      applyAllBtn.style.borderColor   = '#3a4468';
    };
    applyAllBtn.onclick = () => {
      const def2       = getStatusDefault(item.elemKey, item.electricDriver);
      const wasDefault2 = (pendingDS === def2.dataSource)
        && ((pendingDS !== 'calculate') || (pendingFormula === (def2.formula || '')))
        && ((pendingDS !== 'pi_sensor') || (pendingPiTag === ''));
      _sameTypeItems.forEach(it => {
        STATE.equipmentStatus[it.instanceId] = {
          dataSource: pendingDS,
          piTag:      pendingDS === 'pi_sensor' ? pendingPiTag : '',
          formula:    pendingDS === 'calculate' ? pendingFormula : '',
          isDefault:  wasDefault2,
        };
      });
      saveState();
      ov.remove();
      render();
    };
    mfoot.appendChild(applyAllBtn);
  }

  const cancelBtn = el('button');
  cancelBtn.style.cssText = 'padding:8px 16px;border-radius:7px;border:1px solid #2d3448;background:#252b3b;color:#e6edf3;font-size:12px;cursor:pointer;font-weight:600';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = ()=>ov.remove();
  mfoot.appendChild(cancelBtn);

  const saveBtn = el('button');
  saveBtn.style.cssText = 'padding:8px 20px;border-radius:7px;border:none;background:'+item.netColor+';color:#fff;font-size:12px;cursor:pointer;font-weight:700';
  saveBtn.textContent = 'Save Status';
  saveBtn.onclick = ()=>{
    const def = getStatusDefault(item.elemKey, item.electricDriver);
    const wasDefault = (pendingDS === def.dataSource)
      && ((pendingDS !== 'calculate') || (pendingFormula === (def.formula||'')))
      && ((pendingDS !== 'pi_sensor') || (pendingPiTag === ''));
    STATE.equipmentStatus[item.instanceId] = {
      dataSource: pendingDS,
      piTag:      pendingDS === 'pi_sensor' ? pendingPiTag : '',
      formula:    pendingDS === 'calculate' ? pendingFormula : '',
      isDefault:  wasDefault,
    };
    saveState();
    ov.remove();
    render();
  };
  mfoot.appendChild(saveBtn);

  panel.appendChild(mfoot);
  document.body.appendChild(ov);
  sync();
}


/* ============================================================================
 *  PLANT PRODUCTION PANE
 * ============================================================================ */
function panePlantProd(){
  const w = el('div');
  w.innerHTML = `
    <div class="section-title"><span class="accent"></span> Plant Production</div>
    <div class="section-hint">Select the plants for which production calculation is required and define their calculation formulas.</div>
  `;

  const plants = STATE.plants || [];
  if(!plants.length) {
    const empty = el('div');
    empty.style.cssText = 'text-align:center;padding:48px;color:var(--text3);font-size:13px';
    empty.innerHTML = '<i>No plants defined. Please complete Case Setup first.</i>';
    w.appendChild(empty);
  } else {
    const list = el('div');
    list.style.cssText = 'display:flex;flex-direction:column;gap:16px;margin-top:16px';

    const LOCAL_FIELDS = [
      {key:'uom',        label:'UOM',        ph:'t/hr'},
      {key:'designData', label:'Design Data', ph:'100'},
      {key:'min',        label:'Min',         ph:'0'},
      {key:'max',        label:'Max',         ph:'200'},
      {key:'defaultVal', label:'Default',     ph:'50'}
    ];

    plants.forEach((p,i) => {
      if(!STATE._plantProdConfig[p.id]) STATE._plantProdConfig[p.id] = { selected: false, formula: '', customAttrs: [] };
      const c = STATE._plantProdConfig[p.id];
      if(!c.customAttrs) c.customAttrs = [];
      const isSel = !!c.selected;

      const card = el('div');
      card.style.cssText = 'border:2px solid '+(isSel?'var(--net-color)':'var(--border)')+';border-radius:8px;background:var(--bg3);overflow:hidden;transition:all .2s';

      const hdr = el('div');
      hdr.style.cssText = 'display:flex;align-items:center;padding:12px 16px;background:'+(isSel?'rgba(240,136,62,.06)':'var(--bg2)')+';cursor:pointer';
      
      const chk = el('input'); chk.type='checkbox'; chk.checked=isSel;
      chk.style.cssText = 'width:16px;height:16px;accent-color:var(--net-color);cursor:pointer;margin-right:12px';
      chk.onclick=e=>e.stopPropagation();

      const title = el('div');
      title.style.cssText = 'flex:1;font-size:13.5px;font-weight:'+(isSel?'700':'600')+';color:'+(isSel?'var(--text)':'var(--text2)')+';display:flex;flex-direction:column;gap:2px';
      title.innerHTML = esc(p.name) + '<span style="font-size:10.5px;color:var(--text3);font-weight:400">ID: '+esc(p.id)+'</span>';

      hdr.appendChild(chk); hdr.appendChild(title);
      card.appendChild(hdr);

      const panel = el('div');
      panel.style.cssText = 'border-top:1px solid '+(isSel?'var(--net-color)':'var(--border)')+';display:'+(isSel?'block':'none');

      const renderPanel = () => {
        panel.innerHTML='';

        const isYes = c.dataSource==='pi_sensor';
        const isNo  = c.dataSource==='calculate';

        /* PI tag available? row */
        const qRow = el('div');
        qRow.style.cssText = 'display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid rgba(255,255,255,.04);flex-wrap:wrap;background:var(--bg2)';
        const ql = el('span'); 
        ql.style.cssText='font-size:12px;color:var(--text2);flex-shrink:0';
        ql.textContent='PI tag available?';
        qRow.appendChild(ql);

        ['yes','no'].forEach(val=>{
          const lbl=el('label');
          lbl.style.cssText='display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--text2);user-select:none;padding:4px 10px;border-radius:6px;border:1.5px solid '+((val==='yes'&&isYes)||(val==='no'&&isNo)?'var(--net-color)':'var(--border)')+';background:'+((val==='yes'&&isYes)||(val==='no'&&isNo)?'rgba(240,136,62,.15)':'var(--bg4)')+';transition:all .15s';
          const rdo=el('input'); rdo.type='radio'; rdo.name='pp_pita_'+p.id; rdo.value=val;
          rdo.style.cssText='accent-color:var(--net-color);cursor:pointer;width:13px;height:13px';
          if((val==='yes'&&isYes)||(val==='no'&&isNo)) rdo.checked=true;
          rdo.onchange=()=>{
            if(!rdo.checked) return;
            c.dataSource=val==='yes'?'pi_sensor':'calculate';
            if(val==='yes'){ if(c.piTag===undefined) c.piTag=''; }
            saveState();
            renderPanel();
          };
          lbl.appendChild(rdo); lbl.append(' '+(val==='yes'?'Yes':'No'));
          qRow.appendChild(lbl);
        });

        const clrBtn=el('button');
        clrBtn.style.cssText='padding:3px 8px;font-size:10px;border-radius:4px;border:1px solid #ff6b6b55;background:#ff6b6b15;color:#ff6b6b;cursor:pointer;margin-left:8px;text-transform:uppercase;letter-spacing:.5px';
        clrBtn.textContent='Clear';
        clrBtn.onclick=()=>{ c.dataSource=null; saveState(); renderPanel(); };
        qRow.appendChild(clrBtn);
        
        panel.appendChild(qRow);

        if(isYes){
          const yRow=el('div');
          yRow.style.cssText='display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg3)';
          const pLbl=el('span');
          pLbl.style.cssText='font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:700;flex-shrink:0;width:110px';
          pLbl.textContent='PI Tag';
          const pInp=el('input'); pInp.type='text';
          pInp.placeholder='e.g. FI-101.PV';
          pInp.value=c.piTag||'';
          pInp.style.cssText='flex:1;max-width:300px;padding:6px 10px;border-radius:6px;border:1.5px solid '+(c.piTag?'var(--net-color)':'var(--border)')+';background:var(--bg4);color:var(--text);font-family:var(--mono);font-size:11.5px;outline:none;transition:border-color .15s';
          pInp.onfocus=()=>pInp.style.borderColor='var(--net-color)';
          pInp.onblur=()=>{ c.piTag=pInp.value.trim(); saveState(); pInp.style.borderColor=c.piTag?'var(--net-color)':'var(--border)'; };
          pInp.onkeydown=e=>{ if(e.key==='Enter') pInp.blur(); };
          yRow.appendChild(pLbl); yRow.appendChild(pInp);
          panel.appendChild(yRow);
        } else if(isNo) {
          /* Custom Formula input row */
          const fRow=el('div');
          fRow.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 16px;background:rgba(240,136,62,.07);border-bottom:1px solid rgba(255,255,255,.04);flex-wrap:wrap';
          const fLbl=el('span');
          fLbl.style.cssText='font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:700;flex-shrink:0;width:110px';
          fLbl.textContent='Custom Formula';
          const fInp=el('input'); fInp.type='text';
          fInp.placeholder='e.g. [Total Production] * 1.5';
          fInp.value=c.formula||'';
          fInp.style.cssText='flex:1;padding:6px 10px;border-radius:6px;border:1.5px solid '
            +(c.formula?'#F0883E88':'var(--border)')+';background:var(--bg4);color:var(--text);'
            +'font-family:var(--mono);font-size:11.5px;outline:none;transition:border-color .15s';
          fInp.onfocus=()=>fInp.style.borderColor='#F0883E';
          fInp.onblur=()=>{ c.formula=fInp.value.trim(); saveState(); fInp.style.borderColor=fInp.value.trim()?'#F0883E88':'var(--border)'; };
          fInp.onkeydown=e=>{ if(e.key==='Enter') fInp.blur(); };
          const fHint=el('span');
          fHint.style.cssText='font-size:10px;color:var(--text3);flex-shrink:0';
          fHint.innerHTML='<em>Tip: use [Attribute Name] tokens</em>';
          fRow.appendChild(fLbl); fRow.appendChild(fInp); fRow.appendChild(fHint);
          panel.appendChild(fRow);
        }

        if(isYes || isNo) {
          const kpiProps = renderPropertiesStrip(c, '#F0883E', () => { saveState(); renderPanel(); }, 'Flow');
          panel.appendChild(kpiProps);
        }

        if(isNo) {
          /* Select Attributes Header */
          const aHdrRow=el('div');
          aHdrRow.style.cssText='padding:8px 16px;background:var(--bg4);border-bottom:1px solid rgba(255,255,255,.06)';
          aHdrRow.innerHTML='<span style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;font-weight:700">Select Attributes &amp; Assign PI Tags</span>'
            +'<span style="font-size:9px;color:var(--text3);margin-left:10px">ⓘ Check each attribute required for the formula</span>';
          panel.appendChild(aHdrRow);

          /* Custom Attributes List */
          c.customAttrs.forEach((ca,ci)=>{
            const atr = renderCustomAttributeElement(ca, ci, '#F0883E', () => { saveState(); renderPanel(); }, () => { c.customAttrs.splice(ci,1); saveState(); renderPanel(); }, 'Flow');
            panel.appendChild(atr);
          });

          /* add attribute button */
          const addRow=el('div');
          addRow.style.cssText='padding:8px 16px 12px 60px';
          const addBtn=el('button');
          addBtn.style.cssText='padding:5px 14px;font-size:11.5px;font-weight:600;border-radius:6px;border:1.5px dashed #F0883E88;background:rgba(240,136,62,.04);color:#F0883E;cursor:pointer;transition:background .15s';
          addBtn.innerHTML='＋ Add Attribute';
          addBtn.onmouseenter=()=>addBtn.style.background='rgba(240,136,62,.1)';
          addBtn.onmouseleave=()=>addBtn.style.background='rgba(240,136,62,.04)';
          addBtn.onclick=()=>{
            c.customAttrs.push({name:'', selected:true, piTag:'', uom:'', designData:'', min:'', max:'', defaultVal:''}); saveState();
            renderPanel();
          };
          addRow.appendChild(addBtn);
          panel.appendChild(addRow);
        }
      };

      hdr.onclick = () => {
        chk.checked = !chk.checked;
        c.selected = chk.checked;
        saveState();
        card.style.borderColor = c.selected ? 'var(--net-color)' : 'var(--border)';
        hdr.style.background = c.selected ? 'rgba(240,136,62,.06)' : 'var(--bg2)';
        title.style.fontWeight = c.selected ? '700' : '600';
        title.style.color = c.selected ? 'var(--text)' : 'var(--text2)';
        panel.style.display = c.selected ? 'block' : 'none';
        panel.style.borderTopColor = c.selected ? 'var(--net-color)' : 'var(--border)';
      };

      chk.onchange = (e) => {
        c.selected = chk.checked;
        saveState();
        card.style.borderColor = c.selected ? 'var(--net-color)' : 'var(--border)';
        hdr.style.background = c.selected ? 'rgba(240,136,62,.06)' : 'var(--bg2)';
        title.style.fontWeight = c.selected ? '700' : '600';
        title.style.color = c.selected ? 'var(--text)' : 'var(--text2)';
        panel.style.display = c.selected ? 'block' : 'none';
        panel.style.borderTopColor = c.selected ? 'var(--net-color)' : 'var(--border)';
      };

      renderPanel();
      card.appendChild(panel);
      list.appendChild(card);
    });

    w.appendChild(list);

    const foot = el('div'); foot.style.cssText = 'margin-top:24px;display:flex;justify-content:flex-end;border-top:1px solid var(--border);padding-top:16px';
    const cBtn = el('button', 'btn-primary');
    cBtn.innerHTML = 'Save &amp; Next: SEU KPIs &rarr;';
    cBtn.onclick = ()=>{
      STATE._plantProdComplete = true;
      saveState();
      toast('Plant Production saved - proceeding to SEU KPIs','success');
      STATE._kpiSubTab = 'seu';
      render();
    };
    foot.appendChild(cBtn);
    w.appendChild(foot);
  }

  return w;
}
