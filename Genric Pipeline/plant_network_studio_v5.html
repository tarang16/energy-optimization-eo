/* ============================================================================
 *  KPI REVIEW PANE
 * ============================================================================ */
function paneKpiReview(){
  const CATS={
    performance:{ label:'Business KPIs',   icon:'⚙️', color:'#F0883E', bg:'rgba(240,136,62,.13)', border:'rgba(240,136,62,.38)',
      ids:new Set(['Total_Products','Total_Energy_Consumption','Total_Energy_Bill','Total_Fuel_For_Boilers','Total_Power_For_Drives','Total_Fuel_Demand','Total_BLR_HPS_Generation','Total_DMW_Demand']) },
    keyops:{ label:'Key KPIs',       icon:'⚙️', color:'#F0C040', bg:'rgba(240,192,64,.12)', border:'rgba(240,192,64,.38)',
      ids:new Set(['Total_Steam_Turbines_Running','Total_Boilers_Running','Total_CW_Motors_Header_1_Running','Total_CW_Motors_Header_2_Running','Total_CW_Running','Total_Steam_To_Regenerator_EG1','Total_Steam_To_Regenerator_EG2','Total_Steam_To_Regenerator_EG3','Total_Steam_To_Stripping_Column_EG1','Total_Steam_To_Stripping_Column_EG2','Total_Reboiler_Steam_flow_C_2620','Total_Reboiler_Steam_flow_C_4620','Total_Reboiler_Steam_flow_C_6620','Total_Flow_to_Deareator_A_t_hr','Total_Flow_to_Deareator_B_t_hr']) },
    monitoring:{ label:'Monitoring KPIs', icon:'⚙️', color:'#56D6FF', bg:'rgba(86,214,255,.09)', border:'rgba(86,214,255,.32)', ids:null }
  };
  function getCat(id){ if(CATS.performance.ids.has(id)) return 'performance'; if(CATS.keyops.ids.has(id)) return 'keyops'; return 'monitoring'; }

  const DS_MAP={
    pi_sensor:  { label:'PI Sensor',  icon:'⚙️', color:'#58A6FF', bg:'rgba(88,166,255,.15)' },
    calculate:  { label:'Calculate',  icon:'⚙️',  color:'#F0C040', bg:'rgba(240,192,64,.15)' },
    soft_sensor:{ label:'Soft Sensor / ML', icon:'⚙️', color:'#BC8CFF', bg:'rgba(188,140,255,.15)' }  /* kept for display of legacy saved data */
  };

  const cfg = id => STATE._kpiConfig?.[id] || {};

  const w = el('div');
  w.innerHTML = `<div class="section-title" style="margin-bottom:6px"><span class="accent"></span>✅ KPI Configuration Review</div>
    <div style="font-size:12.5px;color:var(--text3);margin-bottom:20px">Summary of all KPI data-source assignments. Use System KPI\'s tab to make changes.</div>`;

  /*  Summary stat cards  */
  const total   = KPI_MASTER.length;
  const cfgd    = KPI_MASTER.filter(k=>cfg(k.id).dataSource).length;
  const pending = total - cfgd;
  const byDS    = { pi_sensor:0, calculate:0 };
  KPI_MASTER.forEach(k=>{ const ds=cfg(k.id).dataSource; if(ds && byDS[ds]!==undefined) byDS[ds]++; });

  const statGrid = el('div');
  statGrid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:22px';
  const statCards = [
    { label:'Total KPIs',      val:total,           color:'var(--text)',   bg:'var(--bg3)',              border:'var(--border)' },
    { label:'Configured',      val:cfgd,            color:'#3FB950',       bg:'rgba(63,185,80,.1)',       border:'rgba(63,185,80,.3)' },
    { label:'Pending',         val:pending,         color:pending?'#F0883E':'#3FB950', bg:pending?'rgba(240,136,62,.1)':'rgba(63,185,80,.1)', border:pending?'rgba(240,136,62,.3)':'rgba(63,185,80,.3)' },
    { label:'PI Sensor',  val:byDS.pi_sensor, color:'#58A6FF', bg:'rgba(88,166,255,.1)',  border:'rgba(88,166,255,.3)' },
    { label:'Calculate',  val:byDS.calculate, color:'#F0C040', bg:'rgba(240,192,64,.1)',  border:'rgba(240,192,64,.3)' },
  ];
  statCards.forEach(s=>{
    const c=el('div');
    c.style.cssText=`padding:14px 16px;border-radius:10px;background:${s.bg};border:1.5px solid ${s.border};text-align:center`;
    c.innerHTML=`<div style="font-size:26px;font-weight:700;color:${s.color};line-height:1.1">${s.val}</div>
      <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-top:5px">${s.label}</div>`;
    statGrid.appendChild(c);
  });
  w.appendChild(statGrid);

  /*  Progress bar  */
  const pct = total ? Math.round(cfgd/total*100) : 0;
  const progWrap = el('div');
  progWrap.style.cssText = 'margin-bottom:22px;padding:14px 18px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap';
  progWrap.innerHTML = `
    <span style="font-size:12px;color:var(--text3);flex-shrink:0">Overall completion:</span>
    <div style="flex:1;min-width:120px;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${pct===100?'#3FB950':'var(--net-color)'};border-radius:4px;transition:width .4s"></div>
    </div>
    <span style="font-size:14px;font-weight:700;color:${pct===100?'#3FB950':'var(--net-color)'};flex-shrink:0">${pct}%</span>
    <span style="font-size:11px;color:var(--text3);flex-shrink:0">${cfgd} / ${total} KPIs assigned</span>`;
  w.appendChild(progWrap);

  /*  Filter toolbar  */
  const toolbar = el('div');
  toolbar.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap';
  let filterCat = 'all', filterDS = 'all';

  const catPills = {}; const dsPills = {};
  const pillStyle = (on,color) => `padding:5px 12px;font-size:11px;border-radius:14px;cursor:pointer;border:1.5px solid ${on?color:'var(--border)'};background:${on?color+'22':'var(--bg3)'};color:${on?color:'var(--text3)'};font-weight:${on?'700':'500'};transition:all .15s;font-family:var(--font)`;

  const sep = el('span'); sep.style.cssText='color:var(--border2);font-size:12px;flex-shrink:0'; sep.textContent='|';

  [{ id:'all',label:'All Categories',icon:'⚙️',color:'var(--text2)'},
   {id:'performance',label:'Business',icon:'⚙️',color:'#F0883E'},
   {id:'keyops',label:'Key KPIs',icon:'⚙️',color:'#F0C040'},
   {id:'monitoring',label:'Monitoring',icon:'⚙️',color:'#56D6FF'}
  ].forEach(c=>{
    const b=el('button'); b.style.cssText=pillStyle(filterCat===c.id,c.color); b.textContent=c.icon+' '+c.label;
    b.onclick=()=>{ filterCat=c.id; applyFilter(); refreshPills(); }; catPills[c.id]=b; toolbar.appendChild(b);
  });
  toolbar.appendChild(sep);
  [{id:'all',label:'All Status',icon:'⚙️',color:'var(--text2)'},
   {id:'configured',label:'Configured',icon:'⚙️',color:'#3FB950'},
   {id:'pending',label:'Pending',icon:'⚙️',color:'#F0883E'},
   {id:'pi_sensor',label:'PI Sensor',icon:'⚙️',color:'#58A6FF'},
   {id:'calculate',label:'Calculate',icon:'⚙️',color:'#F0C040'}
  ].forEach(d=>{
    const b=el('button'); b.style.cssText=pillStyle(filterDS===d.id,d.color); b.textContent=d.icon+' '+d.label;
    b.onclick=()=>{ filterDS=d.id; applyFilter(); refreshPills(); }; dsPills[d.id]=b; toolbar.appendChild(b);
  });
  w.appendChild(toolbar);

  function refreshPills(){
    Object.entries(catPills).forEach(([id,b])=>{ const c={all:'var(--text2)',performance:'#F0883E',keyops:'#F0C040',monitoring:'#56D6FF'}[id]; b.style.cssText=pillStyle(filterCat===id,c); });
    Object.entries(dsPills).forEach(([id,b])=>{ const c={all:'var(--text2)',configured:'#3FB950',pending:'#F0883E',pi_sensor:'#58A6FF',calculate:'#F0C040'}[id]; b.style.cssText=pillStyle(filterDS===id,c); });
  }

  /*  KPI accordion (interactive per-KPI Yes/No rows)  */
  const accordWrap = el('div');
  accordWrap.style.cssText = 'display:flex;flex-direction:column;gap:16px';
  w.appendChild(accordWrap);

  /* helper: get/init per-KPI config */
  function kpiCfgOf(id){
    if(!STATE._kpiConfig[id]) STATE._kpiConfig[id]={dataSource:null};
    return STATE._kpiConfig[id];
  }

  /* helper: extract [TagName] tokens from formula */
  function kpiFormulaRefs(formula){
    return [...(formula||'').matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]);
  }

  /* refresh progress bar & pct text */
  function refreshKpiProgress(){
    const cfgdN = KPI_MASTER.filter(k=>{
      const c=kpiCfgOf(k.id);
      if(c.dataSource==='pi_sensor') return !!c.piTag;
      if(c.dataSource==='calculate') {
        if(!c.calcCfg) return false;
        const tags = kpiFormulaRefs(k.formula||c.calcCfg.formula||'');
        const allIncluded = tags.every(t=>c.calcCfg[t] && c.calcCfg[t].included && c.calcCfg[t].piTag) 
                         && c.calcCfg.customAttrs.every(ca=>!ca.selected || (ca.piTag));
        return allIncluded;
      }
      return false;
    }).length;
    const pN = KPI_MASTER.length ? Math.round(cfgdN/KPI_MASTER.length*100) : 0;
    const pb = w.querySelector('.kpi-prog-bar');
    const pt = w.querySelector('.kpi-prog-pct');
    if(pb){ pb.style.width=pN+'%'; pb.style.background=pN===100?'#3FB950':'var(--net-color)'; }
    if(pt){ pt.textContent=pN+'%'; pt.style.color=pN===100?'#3FB950':'var(--net-color)'; }
  }

  /*  Build one KPI accordion item  */
  function buildKpiItem(kpi){
    const c     = kpiCfgOf(kpi.id);
    const catId = getCatId(kpi.id);
    const cat   = CATS[catId];
    const isYes = c.dataSource === 'pi_sensor';
    const isNo  = c.dataSource === 'calculate';
    const isDone= isYes ? !!c.piTag
                : isNo  ? !!(c.calcCfg && Object.values(c.calcCfg).some(t=>t.piTag))
                : false;

    const item = el('div');
    item.style.cssText = 'border:1.5px solid '+(isDone?'rgba(63,185,80,.35)':'var(--border)')
      +';border-radius:10px;overflow:hidden;background:var(--bg2);transition:border-color .2s';

    /* name row */
    const nmRow = el('div');
    nmRow.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg3)';
    nmRow.innerHTML = '<div style="flex:1;min-width:0">'
      +'<div style="font-size:13px;font-weight:600;color:var(--text)">'+esc(kpi.label)+'</div>'
      +'<div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:1px">'+esc(kpi.id)+'</div>'
      +'</div>'
      +(isDone
        ? '<span style="font-size:10px;font-weight:700;padding:2px 9px;border-radius:6px;background:rgba(63,185,80,.15);color:#3FB950;border:1px solid rgba(63,185,80,.3)">✓ Configured</span>'
        : '<span style="font-size:10px;font-weight:700;padding:2px 9px;border-radius:6px;background:rgba(240,136,62,.1);color:#F0883E;border:1px solid rgba(240,136,62,.28)">⏳ Pending</span>');
    item.appendChild(nmRow);

    /* PI tag available? row */
    const qRow = el('div');
    qRow.style.cssText = 'display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--border);flex-wrap:wrap;background:var(--bg2)';
    const ql = el('span'); ql.style.cssText='font-size:12px;color:var(--text2);flex-shrink:0';
    ql.textContent='PI tag available?';
    qRow.appendChild(ql);

    ['yes','no'].forEach(val=>{
      const lbl=el('label');
      lbl.style.cssText='display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--text2);user-select:none';
      const rdo=el('input'); rdo.type='radio'; rdo.name='kpi_pita_'+kpi.id; rdo.value=val;
      rdo.style.cssText='accent-color:var(--net-color);cursor:pointer;width:13px;height:13px';
      if((val==='yes'&&isYes)||(val==='no'&&isNo)) rdo.checked=true;
      rdo.onchange=()=>{
        if(!rdo.checked) return;
        const nc=kpiCfgOf(kpi.id);
        nc.dataSource=val==='yes'?'pi_sensor':'calculate';
        if(val==='yes'){ if(nc.piTag===undefined) nc.piTag=''; delete nc.calcCfg; }
        else           { if(!nc.calcCfg) nc.calcCfg={formula:kpi.formula||'', customAttrs:[]}; delete nc.piTag; }
        saveState();
        const fresh=buildKpiItem(kpi); item.replaceWith(fresh);
        refreshKpiProgress();
      };
      lbl.appendChild(rdo); lbl.append(' '+(val==='yes'?'Yes':'No'));
      qRow.appendChild(lbl);
    });

    const clr=el('button');
    clr.style.cssText='padding:2px 9px;font-size:11px;border-radius:6px;border:1px solid rgba(255,80,80,.3);'
      +'background:rgba(255,80,80,.07);color:#ff6b6b;cursor:pointer;font-family:var(--font);margin-left:4px';
    clr.textContent='Clear';
    clr.onclick=()=>{
      const nc=kpiCfgOf(kpi.id); nc.dataSource=null; delete nc.piTag; delete nc.calcCfg;
      saveState(); const fresh=buildKpiItem(kpi); item.replaceWith(fresh); refreshKpiProgress();
    };
    qRow.appendChild(clr);
    item.appendChild(qRow);

    /*  Yes: single PI tag input  */
    if(isYes){
      const yRow=el('div');
      yRow.style.cssText='display:flex;align-items:center;gap:8px;padding:9px 16px;border-top:1px solid var(--border);flex-wrap:wrap';
      const ti=el('input'); ti.type='text';
      ti.placeholder='Enter PI tag, e.g. UN.UO.71FI1001.PV';
      ti.value=c.piTag||'';
      ti.style.cssText='flex:1;min-width:240px;padding:7px 11px;border-radius:6px;border:1.5px solid '
        +(c.piTag?'#58A6FF88':'var(--border)')+';background:var(--bg4);color:var(--text);'
        +'font-family:var(--mono);font-size:12px;outline:none;transition:border-color .15s';
      ti.onfocus=()=>ti.style.borderColor='#58A6FF';
      const doneSpan=el('span'); doneSpan.style.fontSize='15px'; doneSpan.textContent=c.piTag?'':'';
      ti.onblur=()=>{
        const v=ti.value.trim(); kpiCfgOf(kpi.id).piTag=v; saveState();
        ti.style.borderColor=v?'#58A6FF88':'var(--border)';
        doneSpan.textContent=v?'':'';
        const badge=nmRow.querySelector('span:last-child');
        if(badge) badge.outerHTML=v
          ? '<span style="font-size:10px;font-weight:700;padding:2px 9px;border-radius:6px;background:rgba(63,185,80,.15);color:#3FB950;border:1px solid rgba(63,185,80,.3)">✓ Configured</span>'
          : '<span style="font-size:10px;font-weight:700;padding:2px 9px;border-radius:6px;background:rgba(240,136,62,.1);color:#F0883E;border:1px solid rgba(240,136,62,.28)">⏳ Pending</span>';
        refreshKpiProgress();
      };
      ti.onkeydown=e=>{ if(e.key==='Enter') ti.blur(); };
      yRow.appendChild(ti); yRow.appendChild(doneSpan);
      item.appendChild(yRow);
    }

    /*  No: Configure KPI Inputs  */
    if(isNo){
      const noWrap=el('div'); noWrap.style.cssText='border-top:1px solid var(--border)';
      if(!c.calcCfg) c.calcCfg={formula:kpi.formula||'', customAttrs:[]};
      const openKey='_kpiInpOpen_'+kpi.id;
      if(STATE[openKey]===undefined) STATE[openKey]=true;

      const tagsToShow = kpi.tags && kpi.tags.length ? kpi.tags : kpiFormulaRefs(kpi.formula||'').map(r=>({d:r,p:''}));
      const totTags = () => tagsToShow.length + c.calcCfg.customAttrs.filter(ca=>ca.selected).length;
      const tagCnt  = () => tagsToShow.filter(tag=>{
          const key=tag.d||tag;
          return c.calcCfg[key] && c.calcCfg[key].included && c.calcCfg[key].piTag;
      }).length + c.calcCfg.customAttrs.filter(ca=>ca.selected&&ca.piTag).length;

      /* toggle button row */
      const togRow=el('div');
      togRow.style.cssText='padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap';
      const togBtn=el('button');
      togBtn.style.cssText='display:inline-flex;align-items:center;gap:6px;padding:6px 14px;'
        +'border-radius:6px;border:1.5px solid '+cat.color+';background:'+cat.color+'15;'
        +'color:'+cat.color+';font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)';
      togBtn.innerHTML='⚙ Configure KPI Inputs';
      const cntLbl=el('span');
      const getTot = totTags();
      cntLbl.style.cssText='font-size:10.5px;color:'+(tagCnt()===getTot&&getTot>0?'#3FB950':'var(--text3)');
      cntLbl.textContent=tagCnt()+' / '+getTot+' tags configured';
      togRow.appendChild(togBtn); togRow.appendChild(cntLbl);
      noWrap.appendChild(togRow);

      /* expandable panel */
      const panel=el('div');
      panel.style.cssText='display:'+(STATE[openKey]?'block':'none')+';background:var(--bg)';
      
      const renderPanel = () => {
        panel.innerHTML='';

        /* Custom Formula input row */
        const fRow=el('div');
        fRow.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 16px;background:'+cat.color+'07;border-bottom:1px solid rgba(255,255,255,.04);flex-wrap:wrap';
        const fLbl=el('span');
        fLbl.style.cssText='font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:700;flex-shrink:0;width:110px';
        fLbl.textContent='Custom Formula';
        const fInp=el('input'); fInp.type='text';
        fInp.placeholder='e.g. [Total Production] * 1.5';
        fInp.value=c.calcCfg.formula||'';
        fInp.style.cssText='flex:1;padding:6px 10px;border-radius:6px;border:1.5px solid '
          +(c.calcCfg.formula?cat.color+'88':'var(--border)')+';background:var(--bg4);color:var(--text);'
          +'font-family:var(--mono);font-size:11.5px;outline:none;transition:border-color .15s';
        fInp.onfocus=()=>fInp.style.borderColor=cat.color;
        fInp.onblur=()=>{ c.calcCfg.formula=fInp.value.trim(); saveState(); fInp.style.borderColor=fInp.value.trim()?cat.color+'88':'var(--border)'; };
        fInp.onkeydown=e=>{ if(e.key==='Enter') fInp.blur(); };
        const fHint=el('span');
        fHint.style.cssText='font-size:10px;color:var(--text3);flex-shrink:0';
        fHint.innerHTML='<em>Tip: use [Attribute Name] tokens</em>';
        fRow.appendChild(fLbl); fRow.appendChild(fInp); fRow.appendChild(fHint);
        panel.appendChild(fRow);

        const updateCnt = () => {
          const tot = totTags();
          const cfgd = tagCnt();
          cntLbl.textContent=cfgd+' / '+tot+' tags configured';
          cntLbl.style.color=cfgd===tot&&tot>0?'#3FB950':'var(--text3)';
          refreshKpiProgress();
        };

        const LOCAL_FIELDS = [
          {key:'uom',        label:'UOM',        ph:'t/hr'},
          {key:'designData', label:'Design Data', ph:'100'},
          {key:'min',        label:'Min',         ph:'0'},
          {key:'max',        label:'Max',         ph:'200'},
          {key:'defaultVal', label:'Default',     ph:'50'}
        ];

        panel.appendChild(chRow);

        /* per-tag predefined rows */
        tagsToShow.forEach((tag,ti)=>{
          const key=tag.d||tag;
          if(c.calcCfg[key]===undefined) c.calcCfg[key]={included:true,uom:'',designData:'',min:'',max:'',defaultVal:''};
          const tc=c.calcCfg[key];
          const isSel=!!tc.included;
          const atr=el('div');
          atr.style.cssText='margin:0 16px 6px;border-radius:7px;overflow:hidden;border:1.5px solid '+(isSel?cat.color+'55':'#2d3448')+';transition:border-color .15s';
          
          /* header */
          const rh = el('div'); rh.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1e2436;cursor:pointer;user-select:none';
          const chk=el('input'); chk.type='checkbox'; chk.checked=isSel;
          chk.style.cssText='width:14px;height:14px;cursor:pointer;flex-shrink:0;accent-color:'+cat.color;
          chk.onclick=e=>e.stopPropagation();

          const depLbl=el('span'); depLbl.style.cssText='flex:1;font-size:11.5px;color:#c9d1d9;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'; depLbl.textContent=key; depLbl.title=key;
          const piTag=el('span'); piTag.style.cssText='font-family:monospace;font-size:10px;padding:2px 7px;border-radius:4px;flex-shrink:0;background:'+cat.color+'18;color:'+cat.color+';border:1px solid '+cat.color+'35'; piTag.textContent=tag.p||key;
          const tog=el('span'); tog.style.cssText='font-size:9px;color:#8b949e;flex-shrink:0;margin-left:4px;transition:transform .18s;line-height:1'; tog.textContent='';
          
          rh.appendChild(chk); rh.appendChild(depLbl); rh.appendChild(piTag); rh.appendChild(tog);

          /* fields strip */
          const fs = el('div');
          fs.style.cssText='display:'+(isSel?'flex':'none')+';gap:6px;padding:10px 10px 12px;background:#111827;align-items:flex-end';
          LOCAL_FIELDS.forEach(fd=>{
            const cell=el('div'); cell.style.cssText='flex:1;min-width:0';
            if (fd.key === 'uom') {
              const sel = el('select');
              sel.style.cssText='width:100%;box-sizing:border-box;padding:6px 7px;border-radius:5px;border:1px solid #2d3448;background:#1a1f2e;color:#e6edf3;font-size:11.5px;outline:none;font-family:inherit';
              sel.innerHTML = `<option value="">-- Unit --</option>` + 
                Object.entries(UOM_CONVERSIONS).map(([cName, cData]) => `
                  <optgroup label="${cName}">
                    ${Object.keys(cData.units).map(u => `<option value="${u}" ${u===tc.uom?'selected':''}>${u}</option>`).join('')}
                  </optgroup>
                `).join('');
              sel.onchange = () => {
                const oldUom = tc.uom;
                const newUom = sel.value;
                const keys = ['designData', 'min', 'max', 'defaultVal'];
                keys.forEach(k => {
                  if (tc[k] !== undefined && tc[k] !== '') {
                    tc[k] = convertUom(tc[k], oldUom, newUom);
                  }
                });
                tc.uom = newUom;
                saveState();
                renderPanel();
              };
              cell.appendChild(sel);
            } else {
              const inp=el('input'); inp.type='text'; inp.value=tc[fd.key]||''; inp.placeholder=fd.ph;
              inp.style.cssText='width:100%;box-sizing:border-box;padding:6px 7px;border-radius:5px;border:1px solid #2d3448;background:#1a1f2e;color:#e6edf3;font-size:11.5px;outline:none;font-family:inherit';
              inp.onfocus=()=>inp.style.borderColor=cat.color; inp.onblur=()=>inp.style.borderColor='#2d3448'; 
              inp.oninput=()=>{ tc[fd.key]=inp.value; saveState(); updateCnt(); };
              cell.appendChild(inp);
            }
            fs.appendChild(cell);
          });

          chk.onchange=()=>{ 
            tc.included=chk.checked; 
            if(!chk.checked){ tc.uom=''; tc.designData=''; tc.min=''; tc.max=''; tc.defaultVal=''; }
            saveState(); 
            atr.style.borderColor=chk.checked?cat.color+'55':'#2d3448'; 
            fs.style.display=chk.checked?'flex':'none'; 
            updateCnt(); 
          };
          
          let open=true;
          rh.addEventListener('click',e=>{ if(e.target===chk || e.target.tagName==='INPUT') return; open=!open; fs.style.display=(open&&tc.included)?'flex':'none'; tog.style.transform=open?'':'rotate(-90deg)'; });
          
          atr.appendChild(rh); atr.appendChild(fs); panel.appendChild(atr);
        });

        /* custom tags */
        c.calcCfg.customAttrs.forEach((ca,ci)=>{
          const atr=el('div');
          atr.style.cssText='margin:0 16px 6px;border-radius:7px;overflow:hidden;border:1.5px solid '+(ca.selected?cat.color+'55':'#2d3448')+';transition:border-color .15s';
          
          const rh = el('div'); rh.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1e2436;cursor:pointer;user-select:none';
          const chk=el('input'); chk.type='checkbox'; chk.checked=!!ca.selected;
          chk.style.cssText='width:14px;height:14px;cursor:pointer;flex-shrink:0;accent-color:'+cat.color;
          chk.onclick=e=>e.stopPropagation();

          const tNm=el('div'); tNm.style.cssText='flex:1';
          const cNmInp=el('input'); cNmInp.type='text';
          cNmInp.placeholder='Attribute name...';
          cNmInp.value=ca.name||'';
          cNmInp.style.cssText='width:90%;padding:3px 6px;border-radius:4px;border:1px solid '+(ca.name?cat.color+'55':'#2d3448')+';background:transparent;color:var(--text);font-size:11.5px;font-weight:600;outline:none;transition:border-color .12s';
          cNmInp.onfocus=()=>cNmInp.style.borderColor=cat.color;
          cNmInp.onblur=()=>{ ca.name=cNmInp.value.trim(); saveState(); cNmInp.style.borderColor=cNmInp.value.trim()?cat.color+'55':'#2d3448'; };
          cNmInp.onkeydown=e=>{ if(e.key==='Enter') cNmInp.blur(); };
          cNmInp.onclick=e=>e.stopPropagation();
          tNm.appendChild(cNmInp);

          const piTagWrap = el('div'); piTagWrap.style.cssText='flex-shrink:0;display:flex;align-items:center;gap:6px';
          const piInp=el('input'); piInp.type='text'; piInp.placeholder='PI Tag'; piInp.value=ca.piTag||'';
          piInp.style.cssText='width:140px;padding:3px 6px;border-radius:4px;border:1px solid '+(ca.piTag?cat.color+'99':'#2d3448')+';background:#0d1117;color:'+(ca.piTag?cat.color:'#e6edf3')+';font-size:10.5px;font-family:monospace;outline:none;display:'+(ca.selected?'block':'none');
          piInp.onfocus=()=>piInp.style.borderColor=cat.color;
          piInp.onblur=()=>{ ca.piTag=piInp.value.trim(); saveState(); piInp.style.borderColor=ca.piTag?cat.color+'99':'#2d3448'; piInp.style.color=ca.piTag?cat.color:'#e6edf3'; updateCnt(); };
          piInp.onkeydown=e=>{ if(e.key==='Enter') piInp.blur(); };
          piInp.onclick=e=>e.stopPropagation();
          
          const tDone=el('div'); tDone.style.cssText='width:16px;text-align:center;font-size:12px;flex-shrink:0';
          tDone.textContent=(ca.selected&&ca.piTag)?'':'';
          piInp.oninput=()=>{ tDone.textContent=(ca.selected&&piInp.value.trim())?'':''; };

          piTagWrap.appendChild(piInp); piTagWrap.appendChild(tDone);

          const tog=el('span'); tog.style.cssText='font-size:9px;color:#8b949e;flex-shrink:0;margin-left:4px;transition:transform .18s;line-height:1'; tog.textContent='';
          
          rh.appendChild(chk); rh.appendChild(tNm); rh.appendChild(piTagWrap); rh.appendChild(tog);

          /* fields strip */
          const fs = el('div');
          fs.style.cssText='display:'+(ca.selected?'flex':'none')+';gap:6px;padding:10px 10px 12px;background:#111827;align-items:flex-end';
          LOCAL_FIELDS.forEach(fd=>{
            const cell=el('div'); cell.style.cssText='flex:1;min-width:0';
            if (fd.key === 'uom') {
              const sel = el('select');
              sel.style.cssText='width:100%;box-sizing:border-box;padding:6px 7px;border-radius:5px;border:1px solid #2d3448;background:#1a1f2e;color:#e6edf3;font-size:11.5px;outline:none;font-family:inherit';
              sel.innerHTML = `<option value="">-- Unit --</option>` + 
                Object.entries(UOM_CONVERSIONS).map(([cName, cData]) => `
                  <optgroup label="${cName}">
                    ${Object.keys(cData.units).map(u => `<option value="${u}" ${u===ca.uom?'selected':''}>${u}</option>`).join('')}
                  </optgroup>
                `).join('');
              sel.onchange = () => {
                const oldUom = ca.uom;
                const newUom = sel.value;
                const keys = ['designData', 'min', 'max', 'defaultVal'];
                keys.forEach(k => {
                  if (ca[k] !== undefined && ca[k] !== '') {
                    ca[k] = convertUom(ca[k], oldUom, newUom);
                  }
                });
                ca.uom = newUom;
                saveState();
                renderPanel();
              };
              cell.appendChild(sel);
            } else {
              const inp=el('input'); inp.type='text'; inp.value=ca[fd.key]||''; inp.placeholder=fd.ph;
              inp.style.cssText='width:100%;box-sizing:border-box;padding:6px 7px;border-radius:5px;border:1px solid #2d3448;background:#1a1f2e;color:#e6edf3;font-size:11.5px;outline:none;font-family:inherit';
              inp.onfocus=()=>inp.style.borderColor=cat.color; inp.onblur=()=>inp.style.borderColor='#2d3448'; 
              inp.oninput=()=>{ ca[fd.key]=inp.value; saveState(); updateCnt(); };
              cell.appendChild(inp);
            }
            fs.appendChild(cell);
          });

          const cDelBtn=el('button');
          cDelBtn.style.cssText='padding:5px 8px;border-radius:5px;border:1px solid #ff6b6b55;background:#ff6b6b15;color:#ff6b6b;cursor:pointer;margin-left:8px;font-size:11px';
          cDelBtn.textContent='Remove';
          cDelBtn.onclick=e=>{ e.stopPropagation(); c.calcCfg.customAttrs.splice(ci,1); saveState(); renderPanel(); updateCnt(); };
          fs.appendChild(cDelBtn);

          chk.onchange=()=>{
            ca.selected=chk.checked; if(!chk.checked){ ca.piTag=''; ca.uom=''; ca.designData=''; ca.min=''; ca.max=''; ca.defaultVal=''; piInp.value=''; } 
            saveState();
            piInp.style.display=chk.checked?'block':'none';
            atr.style.borderColor=chk.checked?cat.color+'55':'#2d3448';
            fs.style.display=chk.checked?'flex':'none';
            tDone.textContent='';
            updateCnt();
          };

          let open=true;
          rh.addEventListener('click',e=>{ if(e.target===chk || e.target===piInp || e.target===cNmInp) return; open=!open; fs.style.display=(open&&ca.selected)?'flex':'none'; tog.style.transform=open?'':'rotate(-90deg)'; });

          atr.appendChild(rh); atr.appendChild(fs); panel.appendChild(atr);
        });

        /* add attribute button */
        const addRow=el('div');
        addRow.style.cssText='padding:9px 16px;background:transparent';
        const addBtn=el('button');
        addBtn.style.cssText='padding:7px 14px;font-size:11.5px;font-weight:600;border-radius:6px;border:1.5px dashed '+cat.color+'88;background:transparent;color:'+cat.color+';cursor:pointer;transition:all .12s';
        addBtn.innerHTML='<span style="font-size:14px;vertical-align:-1px;margin-right:4px">+</span> Add Custom Tag';
        addBtn.onmouseenter=()=>addBtn.style.background=cat.color+'11';
        addBtn.onmouseleave=()=>addBtn.style.background='transparent';
        addBtn.onclick=()=>{
          c.calcCfg.customAttrs.push({name:'', selected:true, piTag:'', uom:'', designData:'', min:'', max:'', defaultVal:''}); saveState();
          renderPanel(); updateCnt();
        };
        addRow.appendChild(addBtn);
        panel.appendChild(addRow);
      };
      
      renderPanel();

      togBtn.onclick=()=>{
        STATE[openKey]=!STATE[openKey]; saveState();
        panel.style.display=STATE[openKey]?'block':'none';
      };

      noWrap.appendChild(panel);
      item.appendChild(noWrap);
    }

    return item;
  }

  /*  Build category sections  */
  const catSecEls={};
  let filterCatAcc='all';

  Object.entries(CATS).forEach(([catId,cat])=>{
    const kpisInCat=KPI_MASTER.filter(k=>getCatId(k.id)===catId);
    if(!kpisInCat.length) return;

    const sec=el('div'); sec.dataset.catSec=catId;
    const openKey='_kpiCatOpen_'+catId;
    if(STATE[openKey]===undefined) STATE[openKey]=true;

    /* count configured in this category */
    const cfgdCnt=()=>kpisInCat.filter(k=>{
      const c=kpiCfgOf(k.id);
      return c.dataSource==='pi_sensor'?!!c.piTag
        : c.dataSource==='calculate'?!!(c.calcCfg&&(Object.keys(c.calcCfg).some(k=>k!=='formula'&&k!=='customAttrs'&&c.calcCfg[k]&&c.calcCfg[k].included)||(c.calcCfg.customAttrs&&c.calcCfg.customAttrs.some(ca=>ca.piTag))))
        : false;
    }).length;

    const secHdr=el('div');
    secHdr.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 16px;'
      +'background:'+cat.bg+';border:1.5px solid '+cat.border+';border-radius:10px;cursor:pointer;user-select:none;margin-bottom:8px';
    function refreshSecHdr(){
      const cc=cfgdCnt(), tot=kpisInCat.length;
      secHdr.innerHTML='<span style="font-size:15px">'+cat.icon+'</span>'
        +'<span style="font-size:13px;font-weight:700;color:'+cat.color+'">'+cat.label+'</span>'
        +'<span style="font-size:11px;color:var(--text3)">'+cat.desc+'</span>'
        +'<span style="margin-left:auto;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;'
        +'background:'+(cc===tot?'rgba(63,185,80,.15)':cat.bg)+';'
        +'color:'+(cc===tot?'#3FB950':cat.color)+';border:1px solid '+(cc===tot?'rgba(63,185,80,.3)':cat.border)+';">'
        +cc+'/'+tot+' configured</span>'
        +'<span style="font-size:12px;color:'+cat.color+'">'+(STATE[openKey]?'':'')+'</span>';
    }
    refreshSecHdr();
    sec.appendChild(secHdr);

    const secBody=el('div');
    secBody.style.cssText='display:'+(STATE[openKey]?'flex':'none')+';flex-direction:column;gap:8px;margin-bottom:8px';
    kpisInCat.forEach(kpi=>secBody.appendChild(buildKpiItem(kpi)));
    sec.appendChild(secBody);

    secHdr.onclick=()=>{
      STATE[openKey]=!STATE[openKey]; saveState();
      secBody.style.display=STATE[openKey]?'flex':'none';
      refreshSecHdr();

  /*  Category filter pills  */

  ].forEach(c=>{
    const b=el('button'); b.style.cssText=pillStA(filterCatAcc===c.id,c.color); b.textContent=c.icon+' '+c.label;
    b.onclick=()=>{

      Object.entries(catPillA).forEach(([id,btn])=>btn.style.cssText=pillStA(filterCatAcc===id,
        {all:'var(--text2)',performance:'#F0883E',keyops:'#F0C040',monitoring:'#56D6FF'}[id]));

/* ============================================================================

function paneKpiExport(){

    <div style="font-size:12.5px;color:var(--text3);margin-bottom:22px">Download the complete KPI configuration  data sources, PI tag assignments, engineering properties, and ML model definitions.</div>`;

  const cardGrid = el('div');
  cardGrid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:28px';

  function makeExportCard(icon, title, subtitle, btnLabel, btnColor, clickFn){

    c.style.cssText = 'padding:20px 22px;border-radius:12px;background:var(--bg3);border:1.5px solid var(--border);display:flex;flex-direction:column;gap:10px';

    btn.textContent = btnLabel;

    btn.onclick = clickFn;
    c.innerHTML = `<div style="font-size:26px;line-height:1">${icon}</div>
      <div style="font-size:13.5px;font-weight:700;color:var(--text)">${title}</div>
      <div style="font-size:12px;color:var(--text3);line-height:1.55">${subtitle}</div>`;
    c.appendChild(btn);
    return c;
  }

  cardGrid.appendChild(makeExportCard('','XLSX Export',
    'One row per KPI. Columns: Category, KPI Name, Data Source, PI Tag, UOM, Design Data, Min, Max, Default, Model Type, Model Name, Model Version, Notes.',
    " Export System KPI's (XLSX)", '#238636', exportKpiXlsx));

  cardGrid.appendChild(makeExportCard('','JSON Export',
    'Full machine-readable KPI configuration. Includes all assigned data sources, tag properties, calculation setups and ML model definitions.',
    " Export System KPI's (JSON)", '#1f6feb', exportKpiJson));

  w.appendChild(cardGrid);

  /*  Preview table  */
  const prevHd = el('div');
  prevHd.style.cssText = 'font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px';
  prevHd.innerHTML = '&#128204; Preview &mdash; <span style="font-size:11px;color:var(--text3);font-weight:400">first 15 configured KPIs shown</span>';
  w.appendChild(prevHd);

  const CATS_DS = {
    pi_sensor:  '#58A6FF', calculate: '#F0C040', soft_sensor: '#BC8CFF'
  };
  const DS_LBL = { pi_sensor:'PI Sensor', calculate:'Calculate', soft_sensor:'Soft Sensor / ML' };

  const cols = ['Category','KPI Name','Data Source','PI Tag / Detail','UOM','Design','Min','Max','Default'];
  const table = el('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;font-size:11.5px';
  table.innerHTML = '<thead><tr>'
    + cols.map(c=>`<th style="text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--border);color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap">${c}</th>`).join('')
    + '</tr></thead>';
  const tbody = el('tbody');

  const cfgKpis = KPI_MASTER.filter(k=>STATE._kpiConfig?.[k.id]?.dataSource).slice(0,15);
  if(cfgKpis.length === 0){
    const tr = el('tr');
    tr.innerHTML = `<td colspan="${cols.length}" style="padding:18px;text-align:center;color:var(--text3);font-style:italic">No KPIs configured yet  go to System KPI's tab to assign data sources.</td>`;
    tbody.appendChild(tr);
  } else {
    cfgKpis.forEach((kpi,i)=>{
      const c   = STATE._kpiConfig[kpi.id];
      const cat = (()=>{ if(['Total_Products','Total_Energy_Consumption','Total_Energy_Bill','Total_Fuel_For_Boilers','Total_Power_For_Drives','Total_Fuel_Demand','Total_BLR_HPS_Generation','Total_DMW_Demand'].includes(kpi.id)) return 'Business'; if(['Total_Steam_Turbines_Running','Total_Boilers_Running','Total_CW_Running'].includes(kpi.id)) return 'Key KPIs'; return 'Monitoring'; })();
      const dsColor = CATS_DS[c.dataSource] || 'var(--text3)';
      let detail='', uom='', design='', min='', max='', def='';
      if(c.dataSource==='pi_sensor' && c.piSensor){
        detail = c.piSensor.selectedTag || '';
        const p = c.piSensor.props || {};
        uom=p.uom||''; design=p.designData||''; min=p.min||''; max=p.max||''; def=p.defaultVal||'';
      } else if(c.dataSource==='calculate' && c.calcCfg){
        const incl = Object.entries(c.calcCfg).filter(([,v])=>v.included);
        detail = incl.length+' tag'+(incl.length!==1?'s':'');
        if(incl.length){ const [,pv]=incl[0]; uom=pv.uom||''; design=pv.designData||''; min=pv.min||''; max=pv.max||''; def=pv.defaultVal||''; }
      } else if(c.dataSource==='soft_sensor' && c.ssCfg){
        detail = (c.ssCfg.model?.name||'')+(c.ssCfg.model?.type?' ('+c.ssCfg.model.type+')':'');
      }
      const tr = el('tr');
      tr.style.background = i%2?'transparent':'rgba(255,255,255,.018)';
      tr.innerHTML = [cat, esc(kpi.label),
        `<span style="color:${dsColor};font-weight:700">${DS_LBL[c.dataSource]||c.dataSource}</span>`,
        `<span style="font-family:monospace;font-size:10.5px;color:var(--text2)">${esc(detail)}</span>`,
        esc(uom), esc(design), esc(min), esc(max), esc(def)
      ].map(v=>`<td style="padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v}</td>`).join('');
      tbody.appendChild(tr);
    });
  }
  table.appendChild(tbody);
  const tableBox = el('div'); tableBox.style.cssText='border:1px solid var(--border);border-radius:10px;overflow:hidden';
  tableBox.appendChild(table);
  w.appendChild(tableBox);
  return w;
}

/*  KPI XLSX export helper  */

/* ============================================================================
 *  PER-TAB EXCEL EXPORT  called from each KPI sub-tab pane header
 * ============================================================================ */
function exportTabXlsx(tabId){
  if(typeof XLSX==='undefined'){ toast('XLSX library not loaded - check internet connection','warn'); return; }
  try{
    var wb   = XLSX.utils.book_new();
    var now  = new Date().toISOString().slice(0,16).replace('T',' ');
    var aff  = (STATE.affiliate||'') + (STATE.region ? ' | ' + STATE.region : '');
    var rows, cols;

    /* Export ALL tabs into separate worksheets regardless of which tab triggered it */
    var filename = 'system_kpis_all';

    /* helper */
    function hdr(){ return [['Exported: '+now], ['Affiliate: '+aff], []]; }
    function ao(r){ return XLSX.utils.aoa_to_sheet(r); }
    function addS(ws,name,c){ if(c) ws['!cols']=c; XLSX.utils.book_append_sheet(wb,ws,name); }

    /* ── Sheet 1: System Config ── */
    {
      var sysLabel = STATE.affiliate || 'Energy Network';
      var hours    = 8000;
      if (typeof getSystemCostRate === 'function') {
        hours = +getSystemCostRate('Annual Operating Hours') || 8000;
      }
      var sysRows = [];
      sysRows.push(['PLANT NETWORK STUDIO  SYSTEM CONFIGURATION']);
      sysRows.push(['Exported: ' + now]);
      sysRows.push([]);
      sysRows.push(['Affiliate:', sysLabel, '', 'Region:', STATE.region || '']);
      sysRows.push([]);

      sysRows.push(['PLANTS', 'Total: ' + ((STATE.plants||[]).length)]);
      sysRows.push(['#', 'Plant Name', 'Plant ID']);
      (STATE.plants||[]).forEach((p, i) => sysRows.push([i + 1, p.name, p.id]));
      sysRows.push([]);

      sysRows.push(['SYSTEM COST RATES & PARAMETERS', '', 'Annual Op. Hours: ' + hours]);
      sysRows.push(['Parameter', 'Value', 'UOM']);
      (SYSTEM_ATTRS||[]).forEach(attr => {
        var userVal = (STATE.costRates||{})[attr.name];
        if (userVal === undefined || userVal === null || userVal === '') return;
        sysRows.push([attr.name, userVal, attr.uom || '']);
      });

      var sysWs = ao(sysRows);
      sysWs['!merges'] = [{s:{r:0,c:0}, e:{r:0,c:4}}, {s:{r:1,c:0}, e:{r:1,c:4}}];
      addS(sysWs, 'System Config', [{wch:38}, {wch:30}, {wch:14}, {wch:20}, {wch:28}]);
    }

    /* ── Sheet 2: Master KPI List ── */
    {
      rows = hdr().concat([['Element Type','KPI Name','Selected','Network(s)']]);
      var inv = buildEquipmentInventory();
      /* Build deduplicated type list (same logic as paneMasterKpiList) */
      var _typeMap = {};
      inv.forEach(function(it){
        var ek = it.elemKey || it.elemName;
        if(!ek) return;
        var eDef = null;
        var nd = NETWORKS[it.netKey];
        if(nd && nd.elementTree) eDef = nd.elementTree.find(function(e){return e.key===ek;});
        var label = (eDef && eDef.name) || it.elemName || ek;
        if(!_typeMap[label]){
          _typeMap[label] = { key:ek, label:label, aliasKeys:[ek], networks:[it.netName] };
        } else {
          if(_typeMap[label].aliasKeys.indexOf(ek)===-1) _typeMap[label].aliasKeys.push(ek);
          if(_typeMap[label].networks.indexOf(it.netName)===-1) _typeMap[label].networks.push(it.netName);
        }
      });
      /* Exclude infrastructure elements */
      var _kpiExclude = ['letdown_station','steam_export','steam_vent','fuel_import',
        'steam_header_vhp','steam_header_hp2','steam_header_hp1','steam_header_mp2','steam_header_mp1',
        'steam_header_lp1','steam_header_lp2','condensate_header','cw_supply_header','cw_return_header',
        'sw_supply_header','sw_return_header','service_water_header','steam_import','air_consumer'];
      Object.keys(_typeMap).sort().forEach(function(label){
        var t = _typeMap[label];
        var dominated = t.aliasKeys.every(function(ak){ return _kpiExclude.indexOf(ak)!==-1; });
        if(dominated) return;
        /* Find selected KPIs from STATE._masterKpis (check all alias keys) */
        var kpis = null;
        for(var ai=0;ai<t.aliasKeys.length;ai++){
          var mk = STATE._masterKpis && STATE._masterKpis[t.aliasKeys[ai]];
          if(mk && mk.length > 0){ kpis = mk; break; }
        }
        var nets = t.networks.join(', ');
        if(kpis && kpis.length > 0){
          kpis.forEach(function(k){
            rows.push([label, k.name||'', 'Yes', nets]);
          });
        } else {
          rows.push([label, '(no KPIs selected)', 'No', nets]);
        }
      });
      cols=[{wch:28},{wch:36},{wch:10},{wch:36}];
      addS(ao(rows),'Master KPI List',cols);
    }

    /* ── Sheet 3: Equipment Status ── */
    {
      rows = hdr().concat([['Plant','Network','Group','Element','Instance','PI Tag Base','Status Source','PI Tag / Formula','Attr Tags Mapped']]);
      buildEquipmentInventory().forEach(function(it){
        var es = STATE.equipmentStatus && STATE.equipmentStatus[it.instanceId] || {};
        var attrCount = Object.keys(es.attrTags||{}).length;
        rows.push([
          it.plantName, it.netName, it.groupLabel||it.elemName, it.elemName, it.instLabel,
          it.piTagBase||'', es.dataSource||'', es.piTag||es.formula||'', attrCount
        ]);
      });
      cols=[{wch:14},{wch:22},{wch:18},{wch:18},{wch:16},{wch:36},{wch:14},{wch:40},{wch:16}];
      addS(ao(rows),'Equipment Status',cols);
    }

    /* ── Sheet 4: Plant Production ── */
    {
      rows = hdr().concat([['Plant','Formula','KPI ID','PI Tag','UOM','Design','Min','Max','Default','Attribute Name']]);
      (STATE.plants||[]).forEach(function(p){
        var pc = STATE._plantProdConfig && STATE._plantProdConfig[p.id] || {};
        rows.push([
          p.name, pc.formula||'', pc.kpiId||'', pc.piTag||'',
          pc.uom||'', pc.designData||'', pc.min||'', pc.max||'', pc.defaultVal||'',
          ''
        ]);
        if (pc.selected) {
          var customAttrs = pc.customAttrs || [];
          var activeAttrs = customAttrs.filter(function(a){ return a.selected; });
          activeAttrs.forEach(function(attr){
            rows.push([
              p.name, '', pc.kpiId||'', attr.piTag||'',
              attr.uom||'', attr.designData||'', attr.min||'', attr.max||'', attr.defaultVal||'',
              attr.name||''
            ]);
          });
        }
      });
      cols=[{wch:16},{wch:50},{wch:28},{wch:36},{wch:10},{wch:12},{wch:10},{wch:10},{wch:10},{wch:20}];
      addS(ao(rows),'Plant Production',cols);
    }

    /* ── Sheet 5: SEU KPIs ── */
    {
      rows = hdr().concat([['Plant','Network','Element','Instance','KPI Name','Data Source','PI Tag','Formula','UOM','Design','Min','Max','Default','Attribute Name']]);
      buildEquipmentInventory().forEach(function(it){
        var seu = STATE._seuConfig && STATE._seuConfig[it.instanceId];
        if(!seu||!seu.selected) return;
        (seu.kpis||[]).forEach(function(kpi){
          var attrs = kpi.customAttrs || [];
          var activeAttrs = attrs.filter(function(a){ return a.selected; });
          if(activeAttrs.length === 0){
            rows.push([
              it.plantName, it.netName, it.elemName, it.instLabel,
              kpi.name||'', kpi.dataSource||'', kpi.piTag||'', kpi.formula||'',
              kpi.uom||'', kpi.designData||'', kpi.min||'', kpi.max||'', kpi.defaultVal||'',
              ''
            ]);
          } else {
            activeAttrs.forEach(function(attr){
              rows.push([
                it.plantName, it.netName, it.elemName, it.instLabel,
                kpi.name||'', kpi.dataSource||'', attr.piTag||'', kpi.formula||'',
                attr.uom||'', attr.designData||'', attr.min||'', attr.max||'', attr.defaultVal||'',
                attr.name||''
              ]);
            });
          }
        });
      });
      cols=[{wch:14},{wch:22},{wch:18},{wch:16},{wch:24},{wch:14},{wch:36},{wch:36},{wch:10},{wch:12},{wch:10},{wch:10},{wch:10},{wch:20}];
      addS(ao(rows),'SEU KPIs',cols);
    }

    /* ── Sheet 6: Non-SEU KPIs ── */
    {
      rows = hdr().concat([['Plant','Network','Element','Instance','KPI Name','Data Source','PI Tag','Formula','UOM','Design','Min','Max','Default','Attribute Name']]);
      buildEquipmentInventory().forEach(function(it){
        if (it.netKey !== 'steam' && it.netKey !== 'power') return;
        if ((it.plantName || '').trim().toLowerCase() !== 'utility unit') return;
        if (STATE._nonSecExcluded && STATE._nonSecExcluded[it.instanceId]) return;

        var nonseu = STATE._nonSeuConfig && STATE._nonSeuConfig[it.instanceId];
        if(!nonseu||!nonseu.selected) return;
        (nonseu.kpis||[]).forEach(function(kpi){
          var attrs = kpi.customAttrs || [];
          var activeAttrs = attrs.filter(function(a){ return a.selected; });
          if(activeAttrs.length === 0){
            rows.push([
              it.plantName, it.netName, it.elemName, it.instLabel,
              kpi.name||'', kpi.dataSource||'', kpi.piTag||'', kpi.formula||'',
              kpi.uom||'', kpi.designData||'', kpi.min||'', kpi.max||'', kpi.defaultVal||'',
              ''
            ]);
          } else {
            activeAttrs.forEach(function(attr){
              rows.push([
                it.plantName, it.netName, it.elemName, it.instLabel,
                kpi.name||'', kpi.dataSource||'', attr.piTag||'', kpi.formula||'',
                attr.uom||'', attr.designData||'', attr.min||'', attr.max||'', attr.defaultVal||'',
                attr.name||''
              ]);
            });
          }
        });
      });
      cols=[{wch:14},{wch:22},{wch:18},{wch:16},{wch:24},{wch:14},{wch:36},{wch:36},{wch:10},{wch:12},{wch:10},{wch:10},{wch:10},{wch:20}];
      addS(ao(rows),'Non-SEU KPIs',cols);
    }

    /* ── Sheet 7: System KPIs ── */
    {
      rows = hdr().concat([['Category','KPI ID','KPI Name','Data Source','PI Tag','UOM','Design','Min','Max','Default','Formula/Model','Attribute Name']]);
      KPI_MASTER.forEach(function(kpi){
        var c = STATE._kpiConfig && STATE._kpiConfig[kpi.id] || {};
        var piTag='', uom='', design='', min='', max='', def='', extra='', ds=c.dataSource||'';
        if(ds==='pi_sensor'&&c.piSensor){
          piTag=c.piSensor.selectedTag||''; var p=c.piSensor.props||{}; uom=p.uom||''; design=p.designData||''; min=p.min||''; max=p.max||''; def=p.defaultVal||'';
          rows.push([kpi.category||'', kpi.id, kpi.name, ds, piTag, uom, design, min, max, def, extra, '']);
        }
        else if(ds==='calculate'&&c.calcCfg){
          var incl=Object.entries(c.calcCfg).filter(function(e){return e[1].included;});
          piTag=incl.map(function(e){return e[0];}).join('; '); extra='Calculated';
          if(incl.length){ var [,pv]=incl[0]; uom=pv.uom||''; design=pv.designData||''; min=pv.min||''; max=pv.max||''; def=pv.defaultVal||''; }
          rows.push([kpi.category||'', kpi.id, kpi.name, ds, piTag, uom, design, min, max, def, extra, '']);
          
          var customAttrs = c.calcCfg.customAttrs || [];
          customAttrs.forEach(function(ca){
            if(!ca.selected) return;
            rows.push([
              kpi.category||'', kpi.id, kpi.name, ds, ca.piTag||'', ca.uom||'', ca.designData||'', ca.min||'', ca.max||'', ca.defaultVal||'',
              'Attribute Mapping', ca.name||''
            ]);
          });
        }
        else if(ds==='soft_sensor'&&c.ssCfg){
          var m=c.ssCfg.model||{}; extra=(m.type||'')+(m.name?' - '+m.name:'');
          rows.push([kpi.category||'', kpi.id, kpi.name, ds, piTag, uom, design, min, max, def, extra, '']);
        }
        else {
          rows.push([kpi.category||'', kpi.id, kpi.name, ds, piTag, uom, design, min, max, def, extra, '']);
        }
      });
      cols=[{wch:18},{wch:30},{wch:32},{wch:14},{wch:40},{wch:10},{wch:12},{wch:10},{wch:10},{wch:10},{wch:30},{wch:20}];
      addS(ao(rows),"System KPI's",cols);
    }

    var out  = XLSX.write(wb,{bookType:'xlsx',type:'base64'});
    var uri  = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+out;
    var a    = document.createElement('a');
    a.href   = uri;
    a.download = filename + '_' + new Date().toISOString().slice(0,10) + '.xlsx';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 500);
    toast('Excel file downloaded: ' + a.download, 'success');
  } catch(err){
    console.error('exportTabXlsx error:', err);
    toast('Export failed: ' + err.message, 'error');
  }
}

function exportKpiXlsx(){
  /* Redirect to the consolidated all-tabs export */
  exportTabXlsx('all');
}

/*  KPI JSON export helper  */
function exportKpiJson(){
  const out = { exportDate: new Date().toISOString(), kpiConfig: {} };
  KPI_MASTER.forEach(kpi=>{
    out.kpiConfig[kpi.id] = { label:kpi.label, ...(STATE._kpiConfig?.[kpi.id]||{}) };
  });
  const blob = new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='KPI_Configuration_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('KPI Configuration JSON downloaded','success');
}
