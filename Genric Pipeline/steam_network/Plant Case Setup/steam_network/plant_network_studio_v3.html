        const tabBar=el('div'); tabBar.style.cssText='display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid #2d3448;margin-bottom:14px;flex-shrink:0';
        const ssTabDefs=[
          {id:'x',     label:'X Attributes', icon:'📥', tip:'Input features / independent variables'},
          {id:'y',     label:'Y Attributes', icon:'📤', tip:'Target / output variables'},
          {id:'model', label:'Model Selection', icon:'🧠', tip:'ML model configuration'}
        ];
        const tabBtnEls={};
        ssTabDefs.forEach((td,i)=>{
          const tb=el('button');
          tb.style.cssText='flex:1;padding:9px 8px;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px'+(i<ssTabDefs.length-1?';border-right:1px solid #2d3448':'');
          tb.innerHTML='<span>'+td.icon+'</span><span>'+td.label+'</span>';
          tb.title=td.tip;
          tb.onclick=()=>{ activeSsTab=td.id; syncSsTabs(); renderSsContent(); };
          tabBar.appendChild(tb); tabBtnEls[td.id]=tb;
        });
        dynPane.appendChild(tabBar);

        const ssContent=el('div'); dynPane.appendChild(ssContent);

        function syncSsTabs(){
          ssTabDefs.forEach(td=>{
            const tb=tabBtnEls[td.id]; const on=activeSsTab===td.id;
            tb.style.background=on?'#252b3b':'#1a1f2e';
            tb.style.color=on?'#BC8CFF':'#8b949e';
            tb.style.borderBottom=on?'2px solid #BC8CFF':'2px solid transparent';
          });
        }

        function renderSsContent(){
          ssContent.innerHTML='';

          if(activeSsTab==='x'){
            const xHd=el('div'); xHd.style.cssText='font-size:11px;color:#8b949e;margin-bottom:8px;line-height:1.5';
            xHd.innerHTML='<strong style="color:#BC8CFF">X (Input) attributes</strong> — independent variables / features fed into the ML model.';
            ssContent.appendChild(xHd);
            buildTagTable(ssContent, kpi.tags, pendingXCfg, '#BC8CFF', true);
            return;
          }

          if(activeSsTab==='y'){
            const yHd=el('div'); yHd.style.cssText='font-size:11px;color:#8b949e;margin-bottom:8px;line-height:1.5';
            yHd.innerHTML='<strong style="color:#56D6FF">Y (Target) attributes</strong> — output / dependent variables the model predicts.';
            ssContent.appendChild(yHd);
            buildTagTable(ssContent, [], pendingYCfg, '#56D6FF', true);
            return;
          }

          if(activeSsTab==='model'){
            const mg=el('div'); mg.style.cssText='display:flex;flex-direction:column;gap:12px';

            /* row helper */
            function mField(label, elem){ const w=el('div'); w.style.cssText='display:flex;flex-direction:column;gap:5px';
              const l=el('div'); l.style.cssText='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#8b949e'; l.textContent=label; w.appendChild(l); w.appendChild(elem); return w; }
            function mInput(val, ph, key){ const i=el('input'); i.type='text'; i.value=val||''; i.placeholder=ph;
              i.style.cssText='padding:8px 12px;border-radius:7px;border:1.5px solid #2d3448;background:#1e2436;color:#e6edf3;font-size:12px;outline:none;font-family:inherit;width:100%;box-sizing:border-box';
              i.onfocus=()=>i.style.borderColor='#BC8CFF'; i.onblur=()=>i.style.borderColor='#2d3448'; i.oninput=()=>pendingModel[key]=i.value; return i; }
            function mSelect(val, opts, key){ const s=el('select');
              s.style.cssText='padding:8px 12px;border-radius:7px;border:1.5px solid #2d3448;background:#1e2436;color:#e6edf3;font-size:12px;outline:none;font-family:inherit;width:100%;cursor:pointer;appearance:none;-webkit-appearance:none;box-sizing:border-box';
              s.onfocus=()=>s.style.borderColor='#BC8CFF'; s.onblur=()=>s.style.borderColor='#2d3448'; s.onchange=()=>pendingModel[key]=s.value;
              opts.forEach(o=>{ const op=el('option'); op.value=o.v; op.textContent=o.l; if(val===o.v) op.selected=true; s.appendChild(op); }); return s; }

            /* row 1: type + name */
            const r1=el('div'); r1.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px';
            r1.appendChild(mField('Model Type', mSelect(pendingModel.type,[
              {v:'',l:'— Select model type —'},{v:'rf',l:'Random Forest'},{v:'xgb',l:'XGBoost'},
              {v:'gbm',l:'Gradient Boosting'},{v:'lr',l:'Linear Regression'},{v:'svr',l:'Support Vector Regression'},
              {v:'nn',l:'Neural Network (MLP)'},{v:'lstm',l:'LSTM'},{v:'gru',l:'GRU'},
              {v:'transformer',l:'Transformer'},{v:'other',l:'Other'}],'type')));
            r1.appendChild(mField('Model Name / ID', mInput(pendingModel.name,'e.g. TotalProducts_RF_v2','name')));
            mg.appendChild(r1);

            /* row 2: version + training freq */
            const r2=el('div'); r2.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px';
            r2.appendChild(mField('Model Version', mInput(pendingModel.version,'e.g. v1.0.2','version')));
            r2.appendChild(mField('Training Frequency', mSelect(pendingModel.trainFreq,[
              {v:'',l:'— Select frequency —'},{v:'realtime',l:'Real-time'},{v:'hourly',l:'Hourly'},
              {v:'daily',l:'Daily'},{v:'weekly',l:'Weekly'},{v:'monthly',l:'Monthly'},{v:'adhoc',l:'Ad-hoc'}],'trainFreq')));
            mg.appendChild(r2);

            /* notes */
            const notesEl=el('textarea'); notesEl.placeholder='Model description, assumptions, references…'; notesEl.value=pendingModel.notes||'';
            notesEl.style.cssText='padding:9px 12px;border-radius:7px;border:1.5px solid #2d3448;background:#1e2436;color:#e6edf3;font-size:12px;outline:none;font-family:inherit;width:100%;box-sizing:border-box;resize:vertical;min-height:72px;line-height:1.5';
            notesEl.onfocus=()=>notesEl.style.borderColor='#BC8CFF'; notesEl.onblur=()=>notesEl.style.borderColor='#2d3448'; notesEl.oninput=()=>pendingModel.notes=notesEl.value;
            mg.appendChild(mField('Notes / Description', notesEl));

            ssContent.appendChild(mg);
          }
        }

        syncSsTabs(); renderSsContent();
        return;
      }
    }

    /* wire DS buttons */
    dsBtnEls.forEach((b,i)=>{ b.onclick=()=>{ pendingDS=DS[i].id; syncDSBtns(); renderDyn(); syncSubmit(); }; });
    syncDSBtns(); renderDyn();

    /* ══ Formula toggle — Calculate mode only ═════════════════════ */
    if(kpi.formula){
      const fWrap=el('div');
      fWrap.style.display = (pendingDS==='calculate') ? '' : 'none';
      const fBtn=el('button'); fBtn.style.cssText='display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#8b949e;padding:0;font-family:inherit';
      const fChev=el('span'); fChev.style.cssText='transition:transform .18s;display:inline-block'; fChev.textContent='▶';
      fBtn.appendChild(fChev); fBtn.append(' Formula');
      const fBox=el('div'); fBox.style.cssText='margin-top:7px;padding:10px 13px;background:#0d1117;border-radius:7px;font-size:11px;font-family:monospace;color:#56D6FF;word-break:break-all;border:1px solid #2d3448;display:none';
      fBox.textContent=kpi.formula;
      let fo=false;
      fBtn.onclick=()=>{ fo=!fo; fBox.style.display=fo?'block':'none'; fChev.style.transform=fo?'rotate(90deg)':''; };
      fWrap.appendChild(fBtn); fWrap.appendChild(fBox); mbody.appendChild(fWrap);
      /* show/hide when DS changes */
      const _origSync=syncDSBtns;
      syncDSBtns=()=>{ _origSync(); fWrap.style.display=pendingDS==='calculate'?'':'none'; };
    }

    /* ══ Footer ════════════════════════════════════════════════ */
    const footer=el('div');
    footer.style.cssText='display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:13px 20px;border-top:1px solid #2d3448;flex-shrink:0;background:#1a1f2e';

    const cancelBtn=el('button');
    cancelBtn.style.cssText='padding:9px 20px;border-radius:8px;border:1px solid #2d3448;background:transparent;color:#8b949e;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s';
    cancelBtn.textContent='Cancel';
    cancelBtn.onmouseenter=()=>{cancelBtn.style.background='#252b3b';cancelBtn.style.color='#c9d1d9';};
    cancelBtn.onmouseleave=()=>{cancelBtn.style.background='transparent';cancelBtn.style.color='#8b949e';};
    cancelBtn.onclick=()=>ov.remove();

    const submitBtn=el('button');
    submitBtn.style.cssText='padding:9px 24px;border-radius:8px;background:#F0883E;border:none;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;opacity:.38;pointer-events:none;transition:opacity .15s';
    submitBtn.innerHTML='&#10003; Confirm &amp; Save';

    function syncSubmit(){ const ok=!!pendingDS; submitBtn.style.opacity=ok?'1':'.38'; submitBtn.style.pointerEvents=ok?'auto':'none'; }
    syncSubmit();

    submitBtn.onclick=()=>{
      c.dataSource = pendingDS;
      if(pendingDS==='pi_sensor'){
        c.piSensor={selectedTag:pendingPiSel, props:Object.assign({},pendingPiProps)};
      } else if(pendingDS==='calculate'){
        c.calcCfg=JSON.parse(JSON.stringify(pendingCalcCfg));
      } else if(pendingDS==='soft_sensor'){
        c.ssCfg={xAttrs:JSON.parse(JSON.stringify(pendingXCfg)), yAttrs:JSON.parse(JSON.stringify(pendingYCfg)), model:Object.assign({},pendingModel)};
      }
      c.submitted=true;
      saveState(); refreshCard(kpi.id); updateProgress(); ov.remove();
    };

    footer.appendChild(cancelBtn); footer.appendChild(submitBtn);
    panel.appendChild(footer);
    document.body.appendChild(ov);
    ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  }

  /* ── Build KPI tiles ─────────────────────────────────── */
  function refreshCard(id){
    const card=cardMap[id]; if(!card) return;
    const c=cfg(id); const dsObj=getDSObj(c.dataSource);
    const badge=card.querySelector('.kpi-ds-badge');
    if(!badge) return;
    if(dsObj){
      badge.style.cssText=`font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;background:${dsObj.bg};color:${dsObj.color};border:1px solid ${dsObj.color}50;flex-shrink:0`;
      badge.innerHTML=dsObj.icon+' '+dsObj.label;
    } else {
      badge.style.cssText='font-size:10px;padding:3px 9px;border-radius:6px;background:var(--bg4);color:var(--text3);border:1px solid var(--border);flex-shrink:0';
      badge.textContent='Not set';
    }
    updateProgress();
  }

  KPI_MASTER.forEach(kpi=>{
    const catId=getCatId(kpi.id);
    const cat=CATS[catId];

    const card=el('div');
    card.style.cssText='position:relative;border-radius:10px;border:2px solid var(--border);'
      +'background:var(--bg3);cursor:pointer;transition:border-color .18s,box-shadow .18s;overflow:hidden;display:flex;flex-direction:column';
    card.dataset.kpiId=kpi.id;

    /* category color accent bar */
    const acBar=el('div');
    acBar.style.cssText=`height:3px;background:linear-gradient(90deg,${cat.color},${cat.color}60);flex-shrink:0`;
    card.appendChild(acBar);

    const inner=el('div'); inner.style.cssText='padding:13px 14px 12px;flex:1;display:flex;flex-direction:column;gap:0';

    /* top row: category pill + checkbox */
    const topRow=el('div'); topRow.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:9px';
    const pill=el('span');
    pill.style.cssText=`font-size:9px;font-weight:700;padding:2px 8px;border-radius:6px;background:${cat.bg};color:${cat.color};border:1px solid ${cat.border};text-transform:uppercase;letter-spacing:.5px`;
    pill.textContent=cat.icon+' '+cat.subLabel;
    const chk=el('input'); chk.type='checkbox';
    chk.style.cssText='width:15px;height:15px;accent-color:var(--net-color);cursor:pointer;flex-shrink:0';
    chk.onclick=e=>e.stopPropagation();
    chk.onchange=()=>{
      if(chk.checked){ selected.add(kpi.id); card.style.borderColor='var(--net-color)'; card.style.boxShadow='0 0 0 3px rgba(240,136,62,.18)'; }
      else { selected.delete(kpi.id); card.style.borderColor='var(--border)'; card.style.boxShadow='none'; }
      updateSelAll(); updateBulkBar();
    };
    topRow.appendChild(pill); topRow.appendChild(chk);
    inner.appendChild(topRow);

    /* KPI name */
    const nameEl=el('div');
    nameEl.style.cssText='font-size:12.5px;font-weight:600;color:var(--text);line-height:1.38;flex:1;margin-bottom:10px;min-height:34px';
    nameEl.textContent=kpi.label;
    inner.appendChild(nameEl);

    /* bottom: DS badge + tag count */
    const botRow=el('div'); botRow.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:6px';
    const badge=el('span'); badge.className='kpi-ds-badge';
    const tagCnt=el('span');
    tagCnt.style.cssText='font-size:10px;color:var(--text3);flex-shrink:0;white-space:nowrap';
    tagCnt.textContent=kpi.tags.length+' tags';
    botRow.appendChild(badge); botRow.appendChild(tagCnt);
    inner.appendChild(botRow);
    card.appendChild(inner);

    /* hover */
    card.onmouseenter=()=>{ if(!selected.has(kpi.id)){ card.style.borderColor=cat.color+'90'; card.style.boxShadow=`0 4px 16px ${cat.color}18`; } };
    card.onmouseleave=()=>{ if(!selected.has(kpi.id)){ card.style.borderColor='var(--border)'; card.style.boxShadow='none'; } };
    card.onclick=()=>openKpiModal(kpi);

    secEls[catId].grid.appendChild(card);
    cardMap[kpi.id]=card;
    cardMeta.push({id:kpi.id, catId, card, chk, ll:kpi.label.toLowerCase(), il:kpi.id.toLowerCase()});
  });

  /* ── Per-category collapse: first 5 visible, rest collapsible ── */
  const PREVIEW_N = 5;
  const catExpanded = {};

  Object.entries(CATS).forEach(([catId, cat]) => {
    catExpanded[catId] = false;
    const catCards = cardMeta.filter(m => m.catId === catId);
    if (catCards.length <= PREVIEW_N) return;

    /* mark overflow cards */
    catCards.slice(PREVIEW_N).forEach(m => { m.card.dataset.overflow = '1'; });

    const overflowCnt = catCards.length - PREVIEW_N;

    /* "Show more" row — spans full grid width */
    const smRow = el('div');
    smRow.style.cssText = 'grid-column:1/-1;margin-top:4px';

    const smBtn = el('button');
    smBtn.style.cssText = 'width:100%;padding:10px 0;border-radius:9px;'
      + 'border:1.5px dashed ' + cat.color + '50;background:' + cat.bg + ';color:' + cat.color + ';'
      + 'font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);'
      + 'transition:opacity .15s,border-color .15s;display:flex;align-items:center;justify-content:center;gap:8px';
    smBtn.innerHTML = '<span class="smchev" style="transition:transform .25s;display:inline-block;font-size:10px">▼</span>'
      + '<span class="smlbl">Show ' + overflowCnt + ' more KPI' + (overflowCnt > 1 ? 's' : '') + '</span>';
    smBtn.onmouseenter = () => { smBtn.style.opacity = '.75'; smBtn.style.borderColor = cat.color + '90'; };
    smBtn.onmouseleave = () => { smBtn.style.opacity = '1';   smBtn.style.borderColor = cat.color + '50'; };
    smBtn.onclick = () => {
      catExpanded[catId] = !catExpanded[catId];
      applyOverflow(catId);
    };
    smRow.appendChild(smBtn);
    secEls[catId].grid.appendChild(smRow);
    secEls[catId].smRow = smRow;
    secEls[catId].smBtn = smBtn;
  });

  function applyOverflow(catId) {
    const expanded = catExpanded[catId];
    const catCards  = cardMeta.filter(m => m.catId === catId);
    catCards.slice(PREVIEW_N).forEach(m => {
      m.card.dataset.overflow = expanded ? '' : '1';
    });
    const smBtn = secEls[catId].smBtn;
    if (!smBtn) return;
    const hiddenCnt = catCards.length - PREVIEW_N;
    smBtn.querySelector('.smchev').style.transform = expanded ? 'rotate(180deg)' : 'rotate(0)';
    smBtn.querySelector('.smlbl').textContent = expanded
      ? 'Show less'
      : 'Show ' + hiddenCnt + ' more KPI' + (hiddenCnt > 1 ? 's' : '');
    applyFilters();
  }

  /* init all badges */
  KPI_MASTER.forEach(k=>refreshCard(k.id));

  /* section counts */
  Object.entries(CATS).forEach(([catId])=>{
    const cnt=cardMeta.filter(m=>m.catId===catId).length;
    secEls[catId].cntB.textContent=cnt+' KPIs';
  });

  /* ── Category summary cards ────────────────────────────── */
  Object.entries(CATS).forEach(([catId,cat])=>{
    const cc=el('div');
    cc.style.cssText=`border-radius:11px;border:2px solid ${cat.border};background:${cat.bg};`
      +`padding:18px 20px;cursor:pointer;transition:border-color .18s,box-shadow .18s;position:relative;overflow:hidden`;
    cc.onmouseenter=()=>{ cc.style.borderColor=cat.color; cc.style.boxShadow=`0 6px 24px ${cat.color}22`; };
    cc.onmouseleave=()=>{ cc.style.borderColor=cat.border; cc.style.boxShadow='none'; };
    cc.onclick=()=>{ activeCat=catId; applyFilters(); refreshPillStyles();
      secEls[catId].sec.scrollIntoView({behavior:'smooth',block:'start'}); };
    /* decorative bg icon */
    const bgIcon=el('div');
    bgIcon.style.cssText=`position:absolute;right:14px;top:10px;font-size:42px;opacity:.12;line-height:1;pointer-events:none`;
    bgIcon.textContent=cat.icon;
    cc.appendChild(bgIcon);
    const statLine=el('div'); statLine.className='cat-stat-'+catId;
    statLine.style.cssText=`font-size:11.5px;color:${cat.color};font-weight:700;margin-top:8px`;
    cc.innerHTML+=`<div style="font-size:28px;margin-bottom:6px">${cat.icon}</div>
      <div style="font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:3px">${cat.label}</div>
      <div style="font-size:11px;color:var(--text3);line-height:1.4;margin-bottom:2px">${cat.desc}</div>`;
    cc.appendChild(statLine);
    catCardsWrap.appendChild(cc);
  });

  /* ── Progress ──────────────────────────────────────────── */
  function updateProgress(){
    const total=KPI_MASTER.length;
    const done=KPI_MASTER.filter(k=>cfg(k.id).dataSource).length;
    const pct=total?Math.round(done/total*100):0;
    progPill.innerHTML=`<span style="font-size:11px;color:var(--text3)">Configured:</span>
      <span style="font-size:14px;font-weight:700;color:var(--text)">${done}</span>
      <span style="font-size:11px;color:var(--text3)">/ ${total}</span>
      <div style="width:70px;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:var(--net-color);border-radius:3px;transition:width .35s"></div>
      </div>
      <span style="font-size:11px;font-weight:700;color:var(--net-color)">${pct}%</span>`;
    Object.entries(CATS).forEach(([catId])=>{
      const catKpis=KPI_MASTER.filter(k=>getCatId(k.id)===catId);
      const catDone=catKpis.filter(k=>cfg(k.id).dataSource).length;
      const sl=document.querySelector('.cat-stat-'+catId);
      if(sl) sl.textContent=catDone+' / '+catKpis.length+' assigned';
    });
  }
  updateProgress();

  /* ── Bulk DS apply ────────────────────────────────────── */
  function applyBulkDS(dsId){
    selected.forEach(id=>{ cfg(id).dataSource=dsId; refreshCard(id); });
    saveState(); updateProgress();
  }

  function updateBulkBar(){
    if(selected.size>0){
      bulkBar.style.display='flex';
      bulkLbl.textContent=selected.size+' KPI'+(selected.size>1?'s':'')+' selected ·';
    } else { bulkBar.style.display='none'; }
  }

  function updateSelAll(){
    const vis=cardMeta.filter(m=>m.card.style.display!=='none');
    const checked=vis.filter(m=>m.chk.checked);
    selAllChk.checked=vis.length>0&&checked.length===vis.length;
    selAllChk.indeterminate=checked.length>0&&checked.length<vis.length;
  }

  selAllChk.onchange=()=>{
    cardMeta.filter(m=>m.card.style.display!=='none').forEach(m=>{
      m.chk.checked=selAllChk.checked;
      if(selAllChk.checked){ selected.add(m.id); m.card.style.borderColor='var(--net-color)'; m.card.style.boxShadow='0 0 0 3px rgba(240,136,62,.18)'; }
      else { selected.delete(m.id); m.card.style.borderColor='var(--border)'; m.card.style.boxShadow='none'; }
    });
    updateBulkBar();
  };

  /* ── Filter / search ────────────────────────────────────── */
  function applyFilters(){
    const q = srch.value.trim().toLowerCase();
    const isFiltered = q.length > 0 || activeCat !== 'all';
    const catCnts = {performance:0, keyops:0, monitoring:0};
    cardMeta.forEach(m => {
      const matchFilter = (activeCat==='all' || m.catId===activeCat)
                       && (!q || m.ll.includes(q) || m.il.includes(q));
      /* overflow cards hidden unless: category expanded OR actively searching/filtering */
      const inOverflow = m.card.dataset.overflow === '1';
      const show = matchFilter && (!inOverflow || (typeof catExpanded!=='undefined' && catExpanded[m.catId]) || isFiltered);
      m.card.style.display = show ? '' : 'none';
      if(show) catCnts[m.catId]++;
    });
    Object.entries(secEls).forEach(([catId, s]) => {
      s.sec.style.display = catCnts[catId] > 0 ? '' : 'none';
      /* hide show-more button while searching/filtering; restore otherwise */
      if(s.smRow) s.smRow.style.display = isFiltered ? 'none' : '';
    });
    const vis = Object.values(catCnts).reduce((a,b) => a+b, 0);
    cntLbl.textContent = vis + ' KPIs shown';
    updateSelAll();
  }
  srch.oninput=applyFilters;
  applyFilters();

  function refreshPillStyles(){
    Object.entries(catPillEls).forEach(([id,p])=>{
      if(id===activeCat){ p.style.background='var(--net-color)'; p.style.color='#fff'; p.style.borderColor='var(--net-color)'; }
      else { p.style.background='var(--bg3)'; p.style.color='var(--text3)'; p.style.borderColor='var(--border)'; }
    });
  }
  refreshPillStyles();

  w.insertBefore(buildSubBar(), w.firstChild);
  return w;
}


/* ============================================================================
 *  EQUIPMENT INVENTORY PANE  (first sub-tab of KPI Config)
 *  Read-only view of all equipment instances across the 6 networks. Source-
 *  of-truth list used by Status Mapping (next sub-tab) and KPI calculation.
 *  Filters by network + plant + free-text search. Persists filter selections.
 * ============================================================================ */
function paneInventory(){
  const items = buildEquipmentInventory();

  /* Silent default application — every instance gets a status entry on first view.
     Pre-populates from STATUS_DEFAULTS keyed by elemKey. User can customize via
     the Status modal (click any row). isDefault:true flips to false on edit. */
  if(!STATE.equipmentStatus){ STATE.equipmentStatus = {}; }
  /* Always run ensureStatusEntry — it is idempotent for valid entries and
     migrates legacy always_on / none entries so they never show as "Unset". */
  items.forEach(it=>{ ensureStatusEntry(it); });
  saveState();

  /* Filter state — stored as arrays so JSON round-trip is clean. Sets are used in-memory. */
  if(!STATE._invFilter) STATE._invFilter = {};
  if(!Array.isArray(STATE._invFilter.netKeys))  STATE._invFilter.netKeys  = Object.keys(NETWORKS);
  if(!Array.isArray(STATE._invFilter.plantIds)) STATE._invFilter.plantIds = (STATE.plants||[]).map(p=>p.id);
  if(typeof STATE._invFilter.search !== 'string') STATE._invFilter.search = '';
  if(!STATE._invOpen) STATE._invOpen = {};
  /* Backfill any new network/plant that wasn't in the saved filter */
  Object.keys(NETWORKS).forEach(k => { if(!STATE._invFilter.netKeys.includes(k)) STATE._invFilter.netKeys.push(k); });
  (STATE.plants||[]).forEach(p => { if(!STATE._invFilter.plantIds.includes(p.id)) STATE._invFilter.plantIds.push(p.id); });

  const netSel   = new Set(STATE._invFilter.netKeys);
  const plantSel = new Set(STATE._invFilter.plantIds);

  const w = el('div');
  w.innerHTML = `
    <div class="section-title"><span class="accent"></span>&#128203; Equipment Inventory</div>
    <div class="section-hint">All equipment instances placed across your networks. This is the source-of-truth list that will drive Status Mapping (next sub-tab) and KPI calculation.</div>
  `;

  /* ── Empty-network short-circuit ── */
  if(items.length === 0){
    const empty = el('div');
    empty.style.cssText = 'margin-top:24px';
    empty.appendChild(emptyState('🏭','No equipment placed yet','Go to Plant Config &rarr; Network Config and add equipment to one or more networks first.'));
    w.appendChild(empty);
    return w;
  }

  /* ── Filter bar (search + network chips) ── */
  const fbar = el('div');
  fbar.style.cssText = 'display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 10px';

  const srch = el('input');
  srch.type='text';
  srch.placeholder='Search instances, headers, PI tag bases…';
  srch.value = STATE._invFilter.search || '';
  srch.style.cssText='flex:1;min-width:240px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;outline:none;font-family:var(--font)';
  srch.onfocus=()=>srch.style.borderColor='var(--net-color)';
  srch.onblur =()=>srch.style.borderColor='var(--border)';
  srch.oninput=()=>{ STATE._invFilter.search = srch.value; saveState(); applyAndRender(); };
  fbar.appendChild(srch);

  const netChips = el('div');
  netChips.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center';
  Object.entries(NETWORKS).forEach(([nk, nd])=>{
    const on = netSel.has(nk);
    const chip = el('label');
    chip.style.cssText = 'display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1.5px solid '+(on?nd.color:'var(--border)')+';background:'+(on?nd.color+'22':'var(--bg3)')+';cursor:pointer;font-size:11.5px;color:var(--text);font-weight:600;user-select:none;transition:all .15s';
    const shortName = nd.name.replace(' Network','').replace('Distribution Network','Power').replace('Specific Energy Consumers','SEC');
    chip.innerHTML = '<input type="checkbox" '+(on?'checked':'')+' style="accent-color:'+nd.color+';width:13px;height:13px;cursor:pointer">'+nd.icon+' '+esc(shortName);
    chip.querySelector('input').onchange = (e)=>{
      if(e.target.checked) netSel.add(nk); else netSel.delete(nk);
      STATE._invFilter.netKeys = [...netSel];
      saveState(); applyAndRender();
    };
    netChips.appendChild(chip);
  });
  fbar.appendChild(netChips);
  w.appendChild(fbar);

  /* ── Plant filter bar ── */
  if ((STATE.plants||[]).length > 1){
    const pbar = el('div');
    pbar.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px';
    const plbl = el('span');
    plbl.style.cssText='font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-right:4px;font-weight:600';
    plbl.textContent = '🏭 Plants:';
    pbar.appendChild(plbl);
    (STATE.plants||[]).forEach(p=>{
      const on = plantSel.has(p.id);
      const chip = el('label');
      chip.style.cssText = 'display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid '+(on?'var(--net-color)':'var(--border)')+';background:'+(on?'rgba(240,136,62,.10)':'var(--bg3)')+';cursor:pointer;font-size:11px;color:var(--text);user-select:none;transition:all .15s';
      chip.innerHTML = '<input type="checkbox" '+(on?'checked':'')+' style="accent-color:var(--net-color);width:12px;height:12px;cursor:pointer">'+esc(p.name);
      chip.querySelector('input').onchange = (e)=>{
        if(e.target.checked) plantSel.add(p.id); else plantSel.delete(p.id);
        STATE._invFilter.plantIds = [...plantSel];
        saveState(); applyAndRender();
      };
      pbar.appendChild(chip);
    });
    w.appendChild(pbar);
  }

  /* ── Counter strip ── */
  const counterStrip = el('div');
  counterStrip.style.cssText='display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap';
  w.appendChild(counterStrip);

  /* ── Body ── */
  const body = el('div');
  w.appendChild(body);

  function applyAndRender(){
    const q = (STATE._invFilter.search||'').trim().toLowerCase();
    const visible = items.filter(r=>{
      if(!netSel.has(r.netKey)) return false;
      if(!plantSel.has(r.plantId)) return false;
      if(!q) return true;
      return [r.instLabel, r.elemName, r.header, r.piTagBase, r.routeLabel, r.plantName, r.netName, r.role]
        .some(s=>(s||'').toLowerCase().includes(q));
    });
    renderCounters(visible);
    renderBody(visible);
  }

  function renderCounters(visible){
    counterStrip.innerHTML = '';
    const total = el('div');
    total.style.cssText='padding:7px 14px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);font-size:12px;color:var(--text);font-weight:700';
    total.innerHTML = '<span style="color:var(--text3);font-weight:500;margin-right:6px">Showing</span>'+visible.length+'<span style="color:var(--text3);font-weight:500;margin-left:4px">of '+items.length+'</span>';
    counterStrip.appendChild(total);

    const byNet = {};
    visible.forEach(r=>{ byNet[r.netKey] = (byNet[r.netKey]||0) + 1; });
    Object.entries(NETWORKS).forEach(([nk, nd])=>{
      if(!byNet[nk]) return;
      const shortName = nd.name.replace(' Network','').replace('Distribution Network','Power').replace('Specific Energy Consumers','SEC');
      const pill = el('div');
      pill.style.cssText = 'padding:6px 12px;border-radius:8px;background:'+nd.color+'1A;border:1px solid '+nd.color+'55;font-size:11.5px;color:var(--text);font-weight:600';
      pill.innerHTML = nd.icon+' '+esc(shortName)+' <span style="color:'+nd.color+';margin-left:4px;font-weight:700">'+byNet[nk]+'</span>';
      counterStrip.appendChild(pill);
    });
  }

  function renderBody(visible){
    body.innerHTML = '';
    if(visible.length === 0){
      body.appendChild(emptyState('🔍','No matches','Try widening your filters or clearing the search box.'));
      return;
    }
    /* Group: netKey → plantId → [rows] */
    const groups = {};
    visible.forEach(r=>{
      if(!groups[r.netKey]) groups[r.netKey] = {};
      if(!groups[r.netKey][r.plantId]) groups[r.netKey][r.plantId] = [];
      groups[r.netKey][r.plantId].push(r);
    });
    /* Render in NETWORKS order, then STATE.plants order */
    Object.keys(NETWORKS).forEach(nk=>{
      if(!groups[nk]) return;
      const nd = NETWORKS[nk];
      const netCnt = Object.values(groups[nk]).reduce((s,a)=>s+a.length, 0);

      const netSec = el('div');
      netSec.style.cssText = 'margin-bottom:14px;border:1.5px solid '+nd.color+'33;border-radius:10px;overflow:hidden;background:var(--bg2)';

      const openKey = 'net_'+nk;
      if(STATE._invOpen[openKey] === undefined) STATE._invOpen[openKey] = true;
      const isOpen = STATE._invOpen[openKey];

      const netHdr = el('div');
      netHdr.style.cssText = 'padding:10px 14px;background:'+nd.color+'1A;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;border-bottom:'+(isOpen?'1px solid '+nd.color+'33':'none');
      netHdr.innerHTML = '<span style="font-size:13px;color:var(--text2);transition:transform .15s">'+(isOpen?'▾':'▸')+'</span>'
        + '<span style="font-size:15px">'+nd.icon+'</span>'
        + '<span style="font-weight:700;color:var(--text);font-size:13px">'+esc(nd.name)+'</span>'
        + '<span style="margin-left:auto;font-size:11px;color:var(--text3)">'+netCnt+' instance'+(netCnt!==1?'s':'')+'</span>';
      netHdr.onclick = ()=>{
        STATE._invOpen[openKey] = !STATE._invOpen[openKey];
        saveState(); applyAndRender();
      };
      netSec.appendChild(netHdr);

      if(isOpen){
        const plantsBox = el('div');
        plantsBox.style.cssText = 'padding:6px 14px 12px';
        (STATE.plants||[]).forEach(p=>{
          const plantRows = groups[nk][p.id];
          if(!plantRows || !plantRows.length) return;
          const plantHd = el('div');
          plantHd.style.cssText = 'margin:12px 0 6px;font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:700';
          plantHd.innerHTML = '🏭 '+esc(p.name)+' <span style="color:var(--text2);margin-left:6px">· '+plantRows.length+'</span>';
          plantsBox.appendChild(plantHd);
          plantsBox.appendChild(renderTable(plantRows, nd));
        });
        netSec.appendChild(plantsBox);
      }
      body.appendChild(netSec);
    });
  }

  function renderTable(rowsIn, nd){
    const tbl = el('table');
    tbl.style.cssText = 'width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px';
    const thS = 'text-align:left;padding:7px 10px;font-size:9.5px;color:var(--text3);'
      + 'text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);font-weight:700';
    tbl.innerHTML = `<thead><tr style="background:var(--bg4)">
      <th style="${thS};width:28px">#</th>
      <th style="${thS}">Instance</th>
      <th style="${thS}">Header / Route</th>
      <th style="${thS}">Attribute</th>
      <th style="${thS}">PI Tag</th>
      <th style="${thS};text-align:center;width:52px">Done</th>
    </tr></thead><tbody></tbody>`;
    const tb = tbl.querySelector('tbody');

    rowsIn.forEach((r, gi)=>{
      const entry  = ensureStatusEntry(r);
      const atTags = entry.attrTags;          /* guaranteed by ensureStatusEntry */
      const attrs  = r.attrs || [];
      const openKey = 'item_' + r.instanceId;

      /* helpers */
      const safeId = r.instanceId.replace(/[^a-zA-Z0-9]/g,'_');
      function countMapped(){ return attrs.filter(a => !!atTags[a.name]).length; }
      function isOpen(){ return !!STATE._invOpen[openKey]; }

      function headerPillHtml(){
        if(!r.header) return '<span style="color:var(--text3)">—</span>';
        return '<span style="display:inline-block;padding:1.5px 7px;border-radius:99px;background:'
          +nd.color+'22;color:'+nd.color+';font-weight:700;font-size:10px;font-family:var(--mono)">'
          +esc(r.header)+'</span>'
          +(r.routeLabel?'<span style="color:var(--text2);font-size:10px;margin-left:5px">'+esc(r.routeLabel)+'</span>':'');
      }
      function badgeHtml(){
        const mc = countMapped(), tot = attrs.length;
        const col = (mc===tot&&tot>0) ? '#56d364' : (mc>0 ? '#e3b341' : 'var(--text3)');
        return '<span class="ab_'+safeId+'" style="font-size:10.5px;color:'+col+';font-weight:700">'
          +mc+'/'+tot+' attrs</span>';
      }

      /* ── Group header row ────────────────────────────── */
      const grpTr = el('tr');
      const baseBg = gi%2 ? 'rgba(255,255,255,.015)' : 'transparent';
      grpTr.style.cssText = 'border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;'
        +'transition:background .12s;background:'+(isOpen()?nd.color+'0d':baseBg);
      grpTr.onmouseenter = ()=>{ grpTr.style.background = nd.color+'1c'; };
      grpTr.onmouseleave = ()=>{ grpTr.style.background = isOpen()?nd.color+'0d':baseBg; };
      const statusEntry = STATE.equipmentStatus[r.instanceId];
      const statusPill  = renderStatusPill(statusEntry);
      grpTr.innerHTML =
        '<td style="padding:8px 10px;color:var(--text3);font-size:10px;font-family:var(--mono)">'+(gi+1)+'</td>'
        +'<td style="padding:8px 10px;color:var(--text);font-weight:600">'
        +  '<span style="font-size:13px;margin-right:5px">'+(isOpen()?'▾':'▸')+'</span>'
        +  '<span style="margin-right:5px">'+(r.elemIcon||'📦')+'</span>'
        +  esc(r.instLabel)
        +  (r.electricDriver?'<span title="Electric driver" style="margin-left:5px;font-size:10px;color:var(--yellow)">⚡</span>':'')
        +'</td>'
        +'<td style="padding:8px 10px">'+headerPillHtml()+'</td>'
        +'<td style="padding:8px 10px">'+badgeHtml()+'</td>'
        +'<td style="padding:8px 10px">'+statusPill+'</td>'
        +'<td style="padding:8px 10px;text-align:center">'
        +  '<button class="st_edit_'+safeId+'" style="padding:3px 9px;border-radius:5px;border:1px solid '
        +  nd.color+'55;background:'+nd.color+'18;color:'+nd.color+';font-size:10.5px;cursor:pointer;font-weight:600">✎</button>'
        +'</td>';
      grpTr.querySelector('.st_edit_'+safeId).onclick = e=>{
        e.stopPropagation(); openStatusModal(r);
      };
      grpTr.onclick = ()=>{
        STATE._invOpen[openKey] = !STATE._invOpen[openKey];
        saveState(); applyAndRender();
      };
      tb.appendChild(grpTr);

      if(!isOpen()) return;   /* collapsed — skip sub-rows */

      /* ── Status sub-row ──────────────────────────────── */
      const sTr = el('tr');
      sTr.style.cssText = 'background:'+nd.color+'09;border-bottom:1px solid rgba(255,255,255,.025)';
      const stE = STATE.equipmentStatus[r.instanceId];
      const stDesc = stE?.dataSource === 'pi_sensor'
        ? ('PI: '+(stE.piTag||'(unset)'))
        : ('Formula: '+(stE?.formula||'1'));
      sTr.innerHTML =
        '<td></td>'
        +'<td colspan="2" style="padding:5px 10px 5px 32px;color:var(--text3);font-size:11px">'
        +  '<span style="font-size:11px;margin-right:6px">⚙️</span>'
        +  '<span style="font-style:italic">Status Signal</span>'
        +'</td>'
        +'<td style="padding:5px 10px;color:var(--text2);font-size:10.5px;font-family:var(--mono)">'+esc(stDesc)+'</td>'
        +'<td style="padding:5px 10px">'+renderStatusPill(stE)+'</td>'
        +'<td style="padding:5px 10px;text-align:center">'
        +  '<button class="st_edit2_'+safeId+'" style="padding:2px 8px;border-radius:5px;border:1px solid '
        +  nd.color+'55;background:'+nd.color+'18;color:'+nd.color+';font-size:10px;cursor:pointer;font-weight:600">✎ Edit</button>'
        +'</td>';
      sTr.querySelector('.st_edit2_'+safeId).onclick = e=>{ e.stopPropagation(); openStatusModal(r); };
      tb.appendChild(sTr);

      /* ── Attribute sub-rows ──────────────────────────── */
      attrs.forEach((attr, ai)=>{
        const atr = el('tr');
        atr.style.cssText = 'background:'+(ai%2?nd.color+'06':nd.color+'0b')
          +';border-bottom:1px solid rgba(255,255,255,.018)';

        const curVal  = atTags[attr.name] || '';
        const isMapped = !!curVal;

        atr.innerHTML =
          '<td></td>'
          +'<td colspan="2" style="padding:5px 10px 5px 32px;color:var(--text2);font-size:11.5px">'
          +  '<span style="color:var(--text3);font-size:10px;margin-right:6px">'+(ai+1)+'.</span>'
          +  esc(attr.name)
          +  (attr.uom?'<span style="color:var(--text3);font-size:9.5px;margin-left:5px">('+esc(attr.uom)+')</span>':'')
          +'</td>'
          +'<td style="padding:4px 10px 4px 8px;width:50%">'
          +  '<input type="text" value="'+esc(curVal)+'" placeholder="Enter PI tag…"'
          +  ' style="width:100%;padding:5px 8px;border-radius:5px;border:1.5px solid '
          +  (isMapped?nd.color+'99':'var(--border)')+';background:var(--bg4);'
          +  'color:'+(isMapped?'var(--cyan)':'var(--text2)')+';font-family:var(--mono);font-size:11px;'
          +  'outline:none;box-sizing:border-box;transition:border-color .12s">'
          +'</td>'
          +'<td class="done_'+safeId+'_'+ai+'" style="padding:5px 10px;text-align:center;font-size:13px">'
          +(isMapped?'✅':'⬜')+'</td>';

        const inp = atr.querySelector('input');
        function saveTag(){
          const v = inp.value.trim();
          atTags[attr.name] = v;
          STATE.equipmentStatus[r.instanceId].attrTags = atTags;
          saveState();
          /* update badge in header row */
          const badge = tbl.querySelector('.ab_'+safeId);
          if(badge){ const mc=countMapped(), tot=attrs.length;
            const col=(mc===tot&&tot>0)?'#56d364':(mc>0?'#e3b341':'var(--text3)');
            badge.style.color=col; badge.textContent=mc+'/'+tot+' attrs'; }
          /* update done cell */
          const dc = tbl.querySelector('.done_'+safeId+'_'+ai);
          if(dc) dc.textContent = v ? '✅' : '⬜';
          inp.style.borderColor = v ? nd.color+'99' : 'var(--border)';
          inp.style.color       = v ? 'var(--cyan)' : 'var(--text2)';
        }
        inp.onblur   = saveTag;
        inp.onkeydown= e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } };
        inp.onfocus  = ()=>{ inp.style.borderColor = nd.color; };
        inp.onclick  = e=>e.stopPropagation();
        tb.appendChild(atr);
      });

      /* subtle bottom-separator after last attr row */
      const sep = el('tr');
      sep.innerHTML = '<td colspan="6" style="height:4px;background:var(--bg4)"></td>';
      tb.appendChild(sep);
    });

    return tbl;
  }

  applyAndRender();
  return w;
}


/* ============================================================================
 *  STATUS CONFIGURATION MODAL
 *  Mirrors the KPI Config detail-modal pattern: color bar, header with
 *  element meta, step-1 data-source selector (4 modes), step-2 configure
 *  form (varies by mode), symbolic PI-tag preview, Save/Cancel/Reset.
 * ============================================================================ */
function openStatusModal(item){
  const entry = ensureStatusEntry(item);
  let pendingDS      = entry.dataSource;
  let pendingFormula = entry.formula || '';
  let pendingPiTag   = entry.piTag   || '';

  /* ── Overlay + panel ───────────────────────────────────── */
  const ov = el('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:9100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)';
  ov.onclick = (e)=>{ if(e.target===ov) ov.remove(); };

  const panel = el('div');
  panel.style.cssText = 'display:flex;flex-direction:column;width:100%;max-width:720px;max-height:90vh;border-radius:12px;overflow:hidden;box-shadow:0 28px 72px rgba(0,0,0,.7);background:#1a1f2e;border:1.5px solid #2d3448';
  ov.appendChild(panel);

  const cbar = el('div');
  cbar.style.cssText = 'height:4px;flex-shrink:0;background:linear-gradient(90deg,'+item.netColor+','+item.netColor+'44)';
  panel.appendChild(cbar);

  /* ── Header ─────────────────────────────────────────────── */
  const mhdr = el('div');
  mhdr.style.cssText = 'display:flex;align-items:flex-start;gap:14px;padding:16px 20px 14px;border-bottom:1px solid #2d3448;flex-shrink:0;background:#1a1f2e';
  const hIco = el('span'); hIco.style.cssText='font-size:28px;line-height:1;flex-shrink:0'; hIco.textContent = item.elemIcon || '📦';
  const hMid = el('div'); hMid.style.cssText='flex:1;min-width:0';
  const hNm  = el('div'); hNm.style.cssText='font-size:15px;font-weight:700;color:#e6edf3;margin-bottom:6px';
  hNm.textContent = item.instLabel;
  const hSub = el('div'); hSub.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap';
  const netShort = item.netName.replace(' Network','').replace('Distribution Network','Power').replace('Specific Energy Consumers','SEC');
  const hCat = el('span');
  hCat.style.cssText='font-size:10px;padding:2px 9px;border-radius:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:'+item.netColor+'22;color:'+item.netColor+';border:1px solid '+item.netColor+'66';
  hCat.textContent = netShort + (item.role ? ' · '+item.role : '');
  hSub.appendChild(hCat);
  if(item.header){
    const hHdr = el('span'); hHdr.style.cssText='font-size:11px;color:#8b949e';
    hHdr.textContent = 'Header: '+item.header + (item.routeLabel ? '  ('+item.routeLabel+')' : '');
    hSub.appendChild(hHdr);
  }
  if(item.plantName){
    const hP = el('span'); hP.style.cssText='font-size:11px;color:#8b949e';
    hP.textContent = '🏭 '+item.plantName;
    hSub.appendChild(hP);
  }
  hMid.appendChild(hNm); hMid.appendChild(hSub);
  const xBtn = el('button');
  xBtn.style.cssText='flex-shrink:0;width:28px;height:28px;border-radius:6px;border:1px solid #2d3448;background:#252b3b;color:#8b949e;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px';
  xBtn.textContent = '✕';
  xBtn.onmouseenter=()=>{ xBtn.style.background='#313850'; xBtn.style.color='#e6edf3'; };
  xBtn.onmouseleave=()=>{ xBtn.style.background='#252b3b'; xBtn.style.color='#8b949e'; };
  xBtn.onclick = ()=>ov.remove();
  mhdr.appendChild(hIco); mhdr.appendChild(hMid); mhdr.appendChild(xBtn);
  panel.appendChild(mhdr);

  /* ── Scrollable body ────────────────────────────────────── */
  const mbody = el('div');
  mbody.style.cssText = 'flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px;background:#151b2b';
  panel.appendChild(mbody);

  /* ── Section 0 — Attribute PI Tag Mapping ─────────────── */
  /* Each measurement attribute maps to a physical PI sensor tag.
     These are referenced by [Attribute Name] tokens in the status formula. */
  const modalAttrs = item.attrs || [];
  if(modalAttrs.length > 0){
    const atSec = el('div');
    atSec.style.cssText = 'border:1px solid #2d3448;border-radius:10px;overflow:hidden;background:#1e2436';

    const atSecHd = el('div');
    atSecHd.style.cssText = 'padding:10px 14px;background:#252b3b;border-bottom:1px solid #2d3448;'
      + 'display:flex;align-items:center;gap:8px';
    atSecHd.innerHTML = '<span style="font-size:10px;font-weight:700;text-transform:uppercase;'
      + 'letter-spacing:.8px;color:#8b949e">① Attribute PI Tags</span>'
      + '<span style="font-size:10px;color:#8b949e;margin-left:4px">— map each measurement to its PI sensor</span>';
    atSec.appendChild(atSecHd);

    const atTbl = el('table');
    atTbl.style.cssText = 'width:100%;border-collapse:collapse;font-size:12px';
    const atTbody = el('tbody');

    modalAttrs.forEach((attr, ai)=>{
      const curVal   = entry.attrTags[attr.name] || '';
      const isMapped = !!curVal;

      const aRow = el('tr');
      aRow.style.cssText = 'border-bottom:1px solid #232940';
      aRow.innerHTML =
        '<td style="padding:8px 14px;width:36%;color:'+(isMapped?'#e6edf3':'#8b949e')+';font-size:11.5px;font-weight:'+(isMapped?'600':'400')+'">'
        +  esc(attr.name)
        +  (attr.uom?'<span style="color:#8b949e;font-size:9.5px;margin-left:5px">('+esc(attr.uom)+')</span>':'')
        +'</td>'
        +'<td style="padding:6px 14px 6px 6px;">'
        +  '<input type="text" value="'+esc(curVal)+'" placeholder="PI tag, e.g. UN.UO.FUE101.STEAMOUTPUT"'
        +  ' style="width:100%;padding:6px 10px;border-radius:6px;border:1.5px solid '+(isMapped?item.netColor+'88':'#2d3448')+';'
        +  'background:#1a1f2e;color:'+(isMapped?'var(--cyan,#56b6c2)':'#c9d1d9')+';'
        +  'font-family:var(--mono,monospace);font-size:11px;outline:none;box-sizing:border-box;transition:border-color .12s">'
        +'</td>'
        +'<td style="padding:6px 10px 6px 0;width:28px;text-align:center;font-size:13px">'
        +(isMapped?'✅':'⬜')+'</td>';

      const inp  = aRow.querySelector('input');
      const doneTd = aRow.querySelector('td:last-child');
      const labelTd = aRow.querySelector('td:first-child');

      function saveAttr(){
        const v = inp.value.trim();
        entry.attrTags[attr.name] = v;
        saveState();
        const mapped = !!v;
        inp.style.borderColor = mapped ? item.netColor+'88' : '#2d3448';
        inp.style.color       = mapped ? 'var(--cyan,#56b6c2)' : '#c9d1d9';
        doneTd.textContent    = mapped ? '✅' : '⬜';
        labelTd.style.color   = mapped ? '#e6edf3' : '#8b949e';
        labelTd.style.fontWeight = mapped ? '600' : '400';
        /* also refresh the resolved-formula preview (renderPreview is hoisted) */
        if(pendingDS === 'calculate') renderPreview();
      }
      inp.onblur   = saveAttr;
      inp.onkeydown= e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } };
      inp.onfocus  = ()=>{ inp.style.borderColor = item.netColor; };

      atTbody.appendChild(aRow);
    });

    atTbl.appendChild(atTbody);
    atSec.appendChild(atTbl);

    const atNote = el('div');
    atNote.style.cssText = 'padding:8px 14px;font-size:10px;color:#8b949e;border-top:1px solid #2d3448;background:#1a1f2e';
    atNote.innerHTML = '💡 Use <span style="font-family:var(--mono);color:#79c0ff">[Attribute Name]</span> in the formula below — it will resolve to the PI tag mapped above.';
    atSec.appendChild(atNote);
    mbody.appendChild(atSec);
  }

  /* Step 2 — DS selector ────────────────────────────────── */
  const s1Hd = el('div');
  s1Hd.style.cssText='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#8b949e;margin-bottom:2px';
  s1Hd.innerHTML = (modalAttrs.length > 0 ? '\u{2461}' : '\u{2460}') + ' Select Status Source';
  mbody.appendChild(s1Hd);

  const dsGrid = el('div');
  dsGrid.style.cssText = 'display:grid;grid-template-columns:repeat(2,1fr);gap:10px';
  const dsBtnEls = [];
  STATUS_DS.forEach(d=>{
    const b = el('button');
    b.style.cssText = 'display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-radius:10px;cursor:pointer;font-family:inherit;text-align:left;transition:all .15s;border:2px solid #2d3448;background:#1e2436;color:#8b949e';
    const ico = el('span'); ico.style.cssText='font-size:20px;line-height:1;flex-shrink:0;margin-top:1px'; ico.textContent = d.icon;
    const tx  = el('div');  tx.style.cssText='flex:1;min-width:0';
    const lab = el('div');  lab.style.cssText='font-size:12px;font-weight:700;margin-bottom:3px'; lab.textContent = d.label;
    const sub = el('div');  sub.style.cssText='font-size:10px;color:#8b949e;line-height:1.3'; sub.textContent = d.desc;
    tx.appendChild(lab); tx.appendChild(sub);
    b.appendChild(ico); b.appendChild(tx);
    b.onclick = ()=>{ pendingDS = d.id; sync(); };
    dsGrid.appendChild(b);
    dsBtnEls.push({el:b, d});
  });
  mbody.appendChild(dsGrid);

  /* Step 2 — Configure (dynamic per DS mode) */
  const s2Hd = el('div');
  s2Hd.style.cssText='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#8b949e;margin-bottom:2px;margin-top:4px';
  s2Hd.innerHTML = '\u{2461} Configure';
  mbody.appendChild(s2Hd);

  const cfgBox = el('div');
  cfgBox.style.cssText = 'display:flex;flex-direction:column;gap:12px';
  mbody.appendChild(cfgBox);

  /* helpers (closure-local) */
  function mkInput(value, ph){
    const i = el('input');
    i.type='text'; i.value = value || ''; i.placeholder = ph || '';
    i.style.cssText = 'width:100%;padding:7px 11px;border-radius:6px;border:1px solid #2d3448;background:#1e2436;color:#e6edf3;font-size:12px;font-family:var(--mono);outline:none;transition:border-color .15s';
    i.onfocus=()=>{ i.style.borderColor='#F0C040'; };
    i.onblur =()=>{ i.style.borderColor='#2d3448'; };
    return i;
  }
  function field(label, hintHTML, inputEl){
    const wrap = el('div');
    const lab = el('label'); lab.style.cssText='display:block;font-size:11px;color:#e6edf3;margin-bottom:5px;font-weight:600'; lab.textContent = label;
    wrap.appendChild(lab);
    wrap.appendChild(inputEl);
    if(hintHTML){
      const h = el('div'); h.style.cssText='font-size:10.5px;color:#8b949e;margin-top:5px;line-height:1.45';
      h.innerHTML = hintHTML;
      wrap.appendChild(h);
    }
    return wrap;
  }

  let previewBoxEl = null;
  function attachPreview(parent){
    previewBoxEl = el('div');
    previewBoxEl.style.cssText = 'padding:10px 12px;border-radius:8px;background:#1e2436;border:1px solid #2d3448;font-family:var(--mono);font-size:11px;color:#56D4DD;word-break:break-all;line-height:1.6';
    parent.appendChild(previewBoxEl);
    renderPreview();
  }
  function renderPreview(){
    if(!previewBoxEl) return;
    let expanded = '';
    if(pendingDS === 'pi_sensor'){
      expanded = pendingPiTag
        ? 'if(['+pendingPiTag+'] > 0.5, 1, 0)'
        : '(enter a PI tag above)';
    } else if(pendingDS === 'calculate'){
      const sym = (pendingFormula||'').trim();
      if(!sym){ expanded = '(enter a formula above)'; }
      else { expanded = 'if( '+expandFormulaForInstance(sym, item)+' , 1, 0 )'; }
    }
    previewBoxEl.innerHTML = '<div style="font-size:9.5px;color:#8b949e;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-family:var(--font);font-weight:700">↳ Status value resolved at export to</div>'+esc(expanded);
  }

  function renderCfg(){
    cfgBox.innerHTML = '';

    if(pendingDS === 'pi_sensor'){
      const piInp = mkInput(pendingPiTag, 'e.g. UB.UB.BLR-101.RUN.PV');
      piInp.oninput = (e)=>{ pendingPiTag = e.target.value; renderPreview(); };
      cfgBox.appendChild(field(
        'Source PI Tag (DCS boolean)',
        'The 0/1 status value comes directly from this DCS tag. Use this when your control system already publishes a running indicator.',
        piInp
      ));
      attachPreview(cfgBox);
    }
    else if(pendingDS === 'calculate'){
      const fInp = mkInput(pendingFormula, '[Attribute] > value');
      fInp.oninput = (e)=>{ pendingFormula = e.target.value; renderPreview(); };
      const fWrap = field(
        'Formula',
        'Composite boolean expression. Operators: <code style="background:#1e2436;padding:1px 5px;border-radius:4px">&gt; &gt;= &lt; &lt;= == != &amp;&amp; ||</code> arithmetic, and <code style="background:#1e2436;padding:1px 5px;border-radius:4px">if(c,t,e)</code>, <code style="background:#1e2436;padding:1px 5px;border-radius:4px">min</code>, <code style="background:#1e2436;padding:1px 5px;border-radius:4px">max</code>, <code style="background:#1e2436;padding:1px 5px;border-radius:4px">ceil</code>. Reference this instance\'s attributes by name in <code style="background:#1e2436;padding:1px 5px;border-radius:4px">[brackets]</code>.',
        fInp
      );
      cfgBox.appendChild(fWrap);

      /* Attribute insert chips */
      if((item.attrs||[]).length){
        const chipsRow = el('div');
        chipsRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center';
        const chipLbl = el('span');
        chipLbl.style.cssText='font-size:10px;color:#8b949e;margin-right:6px;font-weight:600';
        chipLbl.textContent='📎 Insert attribute:';
        chipsRow.appendChild(chipLbl);
        item.attrs.forEach(a=>{
          const c = el('button');
          c.style.cssText = 'padding:3px 9px;border-radius:99px;border:1px solid #2d3448;background:#1e2436;color:#e6edf3;font-size:10.5px;cursor:pointer;font-family:var(--mono);transition:all .12s';
          c.textContent = a.name;
          c.onmouseenter = ()=>{ c.style.background='#252b3b'; c.style.borderColor='#F0C040'; };
          c.onmouseleave = ()=>{ c.style.background='#1e2436'; c.style.borderColor='#2d3448'; };
          c.onclick = (ev)=>{
            ev.preventDefault();
            const insert = '['+a.name+']';
            const start = fInp.selectionStart || fInp.value.length;
            const end   = fInp.selectionEnd   || fInp.value.length;
            fInp.value  = fInp.value.slice(0,start) + insert + fInp.value.slice(end);
            pendingFormula = fInp.value;
            fInp.focus();
            const pos = start + insert.length;
            try { fInp.setSelectionRange(pos, pos); } catch(_){}
            renderPreview();
          };
          chipsRow.appendChild(c);
        });
        fWrap.appendChild(chipsRow);
      }

      /* Default-applied hint */
      const def = getStatusDefault(item.elemKey, item.electricDriver);
      if(def.dataSource === 'calculate' && def.formula){
        const dhint = el('div');
        dhint.style.cssText = 'font-size:10.5px;color:#8b949e;margin-top:8px;padding:6px 10px;border-radius:6px;background:rgba(63,185,80,.08);border-left:2px solid #3FB950;line-height:1.45';
        dhint.innerHTML = '\u{1F4A1} Default for <strong>'+esc(item.elemName)+'</strong>: <code style="background:#1e2436;padding:1px 5px;border-radius:4px;color:#F0C040">'+esc(def.formula)+'</code>';
        cfgBox.appendChild(dhint);
      }
      attachPreview(cfgBox);
    }
  }

  function sync(){
    dsBtnEls.forEach(({el:b, d})=>{
      const on = pendingDS === d.id;
      b.style.borderColor = on ? d.color : '#2d3448';
      b.style.background  = on ? d.bg    : '#1e2436';
      b.style.color       = on ? '#e6edf3' : '#8b949e';
    });
    renderCfg();
  }

  /* ── Footer ─────────────────────────────────────────────── */
  const mfoot = el('div');
  mfoot.style.cssText = 'display:flex;gap:8px;padding:14px 20px;border-top:1px solid #2d3448;background:#1a1f2e;flex-shrink:0;align-items:center';

  const resetBtn = el('button');
  resetBtn.style.cssText = 'padding:8px 14px;border-radius:7px;border:1px solid #2d3448;background:transparent;color:#8b949e;font-size:12px;cursor:pointer;font-weight:600;transition:all .12s';
  resetBtn.textContent = '↺ Reset to default';
  resetBtn.title = 'Restore the studio default for this element type';
  resetBtn.onmouseenter=()=>{ resetBtn.style.background='#252b3b'; resetBtn.style.color='#e6edf3'; };
  resetBtn.onmouseleave=()=>{ resetBtn.style.background='transparent'; resetBtn.style.color='#8b949e'; };
  resetBtn.onclick = ()=>{
    const def = getStatusDefault(item.elemKey, item.electricDriver);
    pendingDS      = def.dataSource;
    pendingFormula = def.formula || '';
    pendingPiTag   = '';
    sync();
  };
  mfoot.appendChild(resetBtn);

  const spacer = el('div'); spacer.style.cssText='flex:1';
  mfoot.appendChild(spacer);

  /* ── Apply-to-all button (only shown when >1 instance of this element type) ── */
  const _applyAllInv   = buildEquipmentInventory();
  const _sameTypeItems = _applyAllInv.filter(
    it => it.elemKey === item.elemKey && it.netKey === item.netKey
  );
  if (_sameTypeItems.length > 1) {
    const applyAllBtn = el('button');
    applyAllBtn.style.cssText = 'padding:8px 14px;border-radius:7px;border:1px solid #3a4468;'
      + 'background:#252b3b;color:#f0883e;font-size:12px;cursor:pointer;font-weight:600;'
      + 'transition:all .12s;white-space:nowrap';
    applyAllBtn.textContent = '⚡ Apply to all ' + _sameTypeItems.length + ' × ' + item.elemName;
    applyAllBtn.title = 'Save this configuration to every instance of ' + item.elemName
      + ' in the ' + item.netLabel + ' network (' + _sameTypeItems.length + ' total)';
    applyAllBtn.onmouseenter = () => {
      applyAllBtn.style.background    = '#2d3448';
      applyAllBtn.style.borderColor   = '#f0883e';
    };
    applyAllBtn.onmouseleave = () => {
      applyAllBtn.style.background    = '#252b3b';
      applyAllBtn.style.borderColor   = '#3a4468';
    };
    applyAllBtn.onclick = () => {
      const def2       = getStatusDefault(item.elemKey, item.electricDriver);
      const wasDefault2 = (pendingDS === def2.dataSource)
        && ((pendingDS !== 'calculate') || (pendingFormula === (def2.formula || '')))
        && ((pendingDS !== 'pi_sensor') || (pendingPiTag === ''));
      _sameTypeItems.forEach(it => {
        STATE.equipmentStatus[it.instanceId] = {
          dataSource: pendingDS,
          piTag:      pendingDS === 'pi_sensor' ? pendingPiTag : '',
          formula:    pendingDS === 'calculate' ? pendingFormula : '',
          isDefault:  wasDefault2,
        };
      });
      saveState();
      ov.remove();
      render();
    };
    mfoot.appendChild(applyAllBtn);
  }

  const cancelBtn = el('button');
  cancelBtn.style.cssText = 'padding:8px 16px;border-radius:7px;border:1px solid #2d3448;background:#252b3b;color:#e6edf3;font-size:12px;cursor:pointer;font-weight:600';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = ()=>ov.remove();
  mfoot.appendChild(cancelBtn);

  const saveBtn = el('button');
  saveBtn.style.cssText = 'padding:8px 20px;border-radius:7px;border:none;background:'+item.netColor+';color:#fff;font-size:12px;cursor:pointer;font-weight:700';
  saveBtn.textContent = 'Save Status';
  saveBtn.onclick = ()=>{
    const def = getStatusDefault(item.elemKey, item.electricDriver);
    const wasDefault = (pendingDS === def.dataSource)
      && ((pendingDS !== 'calculate') || (pendingFormula === (def.formula||'')))
      && ((pendingDS !== 'pi_sensor') || (pendingPiTag === ''));
    STATE.equipmentStatus[item.instanceId] = {
      dataSource: pendingDS,
      piTag:      pendingDS === 'pi_sensor' ? pendingPiTag : '',
      formula:    pendingDS === 'calculate' ? pendingFormula : '',
      isDefault:  wasDefault,
    };
    saveState();
    ov.remove();
    render();
  };
  mfoot.appendChild(saveBtn);

  panel.appendChild(mfoot);
  document.body.appendChild(ov);
  sync();
}


/* ============================================================================
 *  KPI REVIEW PANE
 * ============================================================================ */
function paneKpiReview(){
  const CATS={
    performance:{ label:'Business KPIs',   icon:'🏭', color:'#F0883E', bg:'rgba(240,136,62,.13)', border:'rgba(240,136,62,.38)',
      ids:new Set(['Total_Products','Total_Energy_Consumption','Total_Energy_Bill','Total_Fuel_For_Boilers','Total_Power_For_Drives','Total_Fuel_Demand','Total_BLR_HPS_Generation','Total_DMW_Demand']) },
    keyops:{ label:'Key KPIs',       icon:'⚡', color:'#F0C040', bg:'rgba(240,192,64,.12)', border:'rgba(240,192,64,.38)',
      ids:new Set(['Total_Steam_Turbines_Running','Total_Boilers_Running','Total_CW_Motors_Header_1_Running','Total_CW_Motors_Header_2_Running','Total_CW_Running','Total_Steam_To_Regenerator_EG1','Total_Steam_To_Regenerator_EG2','Total_Steam_To_Regenerator_EG3','Total_Steam_To_Stripping_Column_EG1','Total_Steam_To_Stripping_Column_EG2','Total_Reboiler_Steam_flow_C_2620','Total_Reboiler_Steam_flow_C_4620','Total_Reboiler_Steam_flow_C_6620','Total_Flow_to_Deareator_A_t_hr','Total_Flow_to_Deareator_B_t_hr']) },
    monitoring:{ label:'Monitoring KPIs', icon:'🔍', color:'#56D6FF', bg:'rgba(86,214,255,.09)', border:'rgba(86,214,255,.32)', ids:null }
  };
  function getCat(id){ if(CATS.performance.ids.has(id)) return 'performance'; if(CATS.keyops.ids.has(id)) return 'keyops'; return 'monitoring'; }

  const DS_MAP={
    pi_sensor:  { label:'PI Sensor',  icon:'🔴', color:'#58A6FF', bg:'rgba(88,166,255,.15)' },
    calculate:  { label:'Calculate',  icon:'⚙️',  color:'#F0C040', bg:'rgba(240,192,64,.15)' },
    soft_sensor:{ label:'Soft Sensor / ML', icon:'🤖', color:'#BC8CFF', bg:'rgba(188,140,255,.15)' }  /* kept for display of legacy saved data */
  };

  const cfg = id => STATE._kpiConfig?.[id] || {};

  const w = el('div');
  w.innerHTML = `<div class="section-title" style="margin-bottom:6px"><span class="accent"></span>&#9989; KPI Configuration Review</div>
    <div style="font-size:12.5px;color:var(--text3);margin-bottom:20px">Summary of all KPI data-source assignments. Use KPI Config tab to make changes.</div>`;

  /* ── Summary stat cards ── */
  const total   = KPI_MASTER.length;
  const cfgd    = KPI_MASTER.filter(k=>cfg(k.id).dataSource).length;
  const pending = total - cfgd;
  const byDS    = { pi_sensor:0, calculate:0 };
  KPI_MASTER.forEach(k=>{ const ds=cfg(k.id).dataSource; if(ds && byDS[ds]!==undefined) byDS[ds]++; });

  const statGrid = el('div');
  statGrid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:22px';
  const statCards = [
    { label:'Total KPIs',      val:total,           color:'var(--text)',   bg:'var(--bg3)',              border:'var(--border)' },
    { label:'Configured',      val:cfgd,            color:'#3FB950',       bg:'rgba(63,185,80,.1)',       border:'rgba(63,185,80,.3)' },
    { label:'Pending',         val:pending,         color:pending?'#F0883E':'#3FB950', bg:pending?'rgba(240,136,62,.1)':'rgba(63,185,80,.1)', border:pending?'rgba(240,136,62,.3)':'rgba(63,185,80,.3)' },
    { label:'PI Sensor',  val:byDS.pi_sensor, color:'#58A6FF', bg:'rgba(88,166,255,.1)',  border:'rgba(88,166,255,.3)' },
    { label:'Calculate',  val:byDS.calculate, color:'#F0C040', bg:'rgba(240,192,64,.1)',  border:'rgba(240,192,64,.3)' },
  ];
  statCards.forEach(s=>{
    const c=el('div');
    c.style.cssText=`padding:14px 16px;border-radius:10px;background:${s.bg};border:1.5px solid ${s.border};text-align:center`;
    c.innerHTML=`<div style="font-size:26px;font-weight:700;color:${s.color};line-height:1.1">${s.val}</div>
      <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-top:5px">${s.label}</div>`;
    statGrid.appendChild(c);
  });
  w.appendChild(statGrid);

  /* ── Progress bar ── */
  const pct = total ? Math.round(cfgd/total*100) : 0;
  const progWrap = el('div');
  progWrap.style.cssText = 'margin-bottom:22px;padding:14px 18px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap';
  progWrap.innerHTML = `
    <span style="font-size:12px;color:var(--text3);flex-shrink:0">Overall completion:</span>
    <div style="flex:1;min-width:120px;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${pct===100?'#3FB950':'var(--net-color)'};border-radius:4px;transition:width .4s"></div>
    </div>
    <span style="font-size:14px;font-weight:700;color:${pct===100?'#3FB950':'var(--net-color)'};flex-shrink:0">${pct}%</span>
    <span style="font-size:11px;color:var(--text3);flex-shrink:0">${cfgd} / ${total} KPIs assigned</span>`;
  w.appendChild(progWrap);

  /* ── Filter toolbar ── */
  const toolbar = el('div');
  toolbar.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap';
  let filterCat = 'all', filterDS = 'all';

  const catPills = {}; const dsPills = {};
  const pillStyle = (on,color) => `padding:5px 12px;font-size:11px;border-radius:14px;cursor:pointer;border:1.5px solid ${on?color:'var(--border)'};background:${on?color+'22':'var(--bg3)'};color:${on?color:'var(--text3)'};font-weight:${on?'700':'500'};transition:all .15s;font-family:var(--font)`;

  const sep = el('span'); sep.style.cssText='color:var(--border2);font-size:12px;flex-shrink:0'; sep.textContent='|';

  [{ id:'all',label:'All Categories',icon:'◉',color:'var(--text2)'},
   {id:'performance',label:'Business',icon:'🏭',color:'#F0883E'},
   {id:'keyops',label:'Key KPIs',icon:'⚡',color:'#F0C040'},
   {id:'monitoring',label:'Monitoring',icon:'🔍',color:'#56D6FF'}
  ].forEach(c=>{
    const b=el('button'); b.style.cssText=pillStyle(filterCat===c.id,c.color); b.textContent=c.icon+' '+c.label;

        ? `<span style="font-family:monospace;font-size:10.5px;color:#58A6FF;background:rgba(88,166,255,.12);padding:2px 7px;border-radius:4px">${esc(tag)}</span>`

        : '<span style="color:#F0883E;font-size:11px">Tag not selected</span>';
    } else if(c.dataSource==='calculate' && c.calcCfg){
      const incl = Object.values(c.calcCfg).filter(t=>t.included).length;
      const tot  = Object.keys(c.calcCfg).length;
      detail = `<span style="font-size:11px;color:var(--text2)">${incl} / ${tot} input tags included</span>`
        + (kpi.formula?` <span style="font-size:10px;color:var(--text3);font-family:monospace;display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px" title="${esc(kpi.formula)}">${esc(kpi.formula.slice(0,60))}${kpi.formula.length>60?'…':''}</span>`:'');
    } else if(c.dataSource==='soft_sensor' && c.ssCfg){
      const xc = Object.keys(c.ssCfg.xAttrs||{}).length;
      const yc = Object.keys(c.ssCfg.yAttrs||{}).length;
      const mt = c.ssCfg.model?.type || '';
      const mn = c.ssCfg.model?.name || '';
      detail = `<span style="font-size:11px;color:var(--text2)">${xc} X-attr · ${yc} Y-attr</span>`
        + (mt?` <span style="font-size:10.5px;font-weight:600;color:#BC8CFF;margin-left:6px">${esc(mt.toUpperCase())}</span>`:'')
        + (mn?` <span style="font-size:10px;color:var(--text3)">${esc(mn)}</span>`:'');
    }

    const row = el('div');
    row.style.cssText = `display:grid;grid-template-columns:2fr 1fr 1.5fr 2fr;gap:0;padding:10px 16px;align-items:center;`
      + `background:${i%2?'transparent':'rgba(255,255,255,.018)'};border-bottom:1px solid rgba(255,255,255,.04);transition:background .12s`;
    row.onmouseenter=()=>row.style.background='rgba(255,255,255,.05)';
    row.onmouseleave=()=>row.style.background=i%2?'transparent':'rgba(255,255,255,.018)';

    const nameCell = el('div');
    nameCell.innerHTML = `<div style="font-size:12px;font-weight:600;color:var(--text);line-height:1.35">${esc(kpi.label)}</div>
      <div style="font-size:10px;color:var(--text3);font-family:monospace;margin-top:1px">${esc(kpi.id)}</div>`;

    const catCell = el('div');
    catCell.innerHTML = `<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:${cat.bg};color:${cat.color};border:1px solid ${cat.border};white-space:nowrap">${cat.icon} ${cat.label}</span>`;

    const dsCell = el('div');
    dsCell.innerHTML = ds
      ? `<span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:${ds.bg};color:${ds.color};border:1px solid ${ds.color}50">${ds.icon} ${ds.label}</span>`

    const detCell = el('div');
    detCell.innerHTML = `<div style="font-size:11.5px;line-height:1.5">${detail}</div>`;

    row.appendChild(nameCell); row.appendChild(catCell); row.appendChild(dsCell); row.appendChild(detCell);
    tbody.appendChild(row);
    rowEls.push({ row, catId, ds: c.dataSource || 'none' });
  });

  /* last row — remove bottom border */
  if(tbody.lastChild) tbody.lastChild.style.borderBottom='none';

  function applyFilter(){
    rowEls.forEach(r=>{
      const catOk = filterCat==='all' || r.catId===filterCat;
      const dsOk  = filterDS==='all'
        || (filterDS==='configured' && r.ds!=='none')
        || (filterDS==='pending'    && r.ds==='none')
        || r.ds===filterDS;
      r.row.style.display = (catOk && dsOk) ? '' : 'none';
    });
  }
  applyFilter();

  return w;
}

/* ── KPI XLSX export helper ──────────────────────────────────────────────── */
function exportKpiXlsx(){
  if(typeof XLSX==='undefined'){ toast('XLSX library not loaded','warn'); return; }
  const rows = [['Category','KPI ID','KPI Name','Data Source','PI Tag','UOM','Design Data','Min','Max','Default','Model Type','Model Name','Model Version','Train Frequency','Notes','X Attributes','Y Attributes']];
  const catOf = id=>{
    const perf=['Total_Products','Total_Energy_Consumption','Total_Energy_Bill','Total_Fuel_For_Boilers','Total_Power_For_Drives','Total_Fuel_Demand','Total_BLR_HPS_Generation','Total_DMW_Demand'];
    const key=['Total_Steam_Turbines_Running','Total_Boilers_Running','Total_CW_Motors_Header_1_Running','Total_CW_Motors_Header_2_Running','Total_CW_Running','Total_Steam_To_Regenerator_EG1','Total_Steam_To_Regenerator_EG2','Total_Steam_To_Regenerator_EG3','Total_Steam_To_Stripping_Column_EG1','Total_Steam_To_Stripping_Column_EG2','Total_Reboiler_Steam_flow_C_2620','Total_Reboiler_Steam_flow_C_4620','Total_Reboiler_Steam_flow_C_6620','Total_Flow_to_Deareator_A_t_hr','Total_Flow_to_Deareator_B_t_hr'];
    return perf.includes(id)?'Business KPIs':key.includes(id)?'Key KPIs':'Monitoring KPIs';
  };
  KPI_MASTER.forEach(kpi=>{
    const c = STATE._kpiConfig?.[kpi.id]||{};
    let tag='',uom='',design='',min='',max='',def='',mtype='',mname='',mver='',mfreq='',notes='',xc='',yc='';
    if(c.dataSource==='pi_sensor' && c.piSensor){
      tag=c.piSensor.selectedTag||''; const p=c.piSensor.props||{};
      uom=p.uom||''; design=p.designData||''; min=p.min||''; max=p.max||''; def=p.defaultVal||'';
    } else if(c.dataSource==='calculate' && c.calcCfg){
      const incl=Object.entries(c.calcCfg).filter(([,v])=>v.included);
      tag=incl.map(([k])=>k).join('; ');
      if(incl.length){ const [,pv]=incl[0]; uom=pv.uom||''; design=pv.designData||''; min=pv.min||''; max=pv.max||''; def=pv.defaultVal||''; }
    } else if(c.dataSource==='soft_sensor' && c.ssCfg){
      const m=c.ssCfg.model||{}; mtype=m.type||''; mname=m.name||''; mver=m.version||''; mfreq=m.trainFreq||''; notes=m.notes||'';
      xc=Object.keys(c.ssCfg.xAttrs||{}).join('; ');
      yc=Object.keys(c.ssCfg.yAttrs||{}).join('; ');
    }
    rows.push([catOf(kpi.id), kpi.id, kpi.label, c.dataSource||'', tag, uom, design, min, max, def, mtype, mname, mver, mfreq, notes, xc, yc]);
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [10,22,36,14,30,8,10,8,8,8,16,20,12,14,30,30,30].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, 'KPI Configuration');
  XLSX.writeFile(wb, 'KPI_Configuration_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('KPI Configuration XLSX downloaded','success');
}

/* ── KPI JSON export helper ──────────────────────────────────────────────── */
function exportKpiJson(){
  const out = { exportDate: new Date().toISOString(), kpiConfig: {} };
  KPI_MASTER.forEach(kpi=>{
    out.kpiConfig[kpi.id] = { label:kpi.label, ...(STATE._kpiConfig?.[kpi.id]||{}) };

  const blob = new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='KPI_Configuration_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('KPI Configuration JSON downloaded','success');
}
