<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plant Network Studio — Multi-Utility Builder</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
/* ============================================================================
 *  SABIC BRANDING — Plant Network Studio
 *  Theme variables remapped to SABIC palette + typefaces.
 *  Default = SABIC light. Dark toggle is kept (re-skinned) for low-light use.
 * ============================================================================ */
@font-face{font-family:'sabic_text_regular';src:url('frontend/src/assets/sabic_webfonts/sabictypefacetext_rg-webfont.woff2') format('woff2'),url('frontend/src/assets/sabic_webfonts/sabictypefacetext_rg-webfont.woff') format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'sabic_text_light';src:url('frontend/src/assets/sabic_webfonts/sabictypefacetext_lt-webfont.woff2') format('woff2'),url('frontend/src/assets/sabic_webfonts/sabictypefacetext_lt-webfont.woff') format('woff');font-weight:300;font-display:swap}
@font-face{font-family:'sabic_text_bold';src:url('frontend/src/assets/sabic_webfonts/sabictypefacetext_bd-webfont.woff2') format('woff2'),url('frontend/src/assets/sabic_webfonts/sabictypefacetext_bd-webfont.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'sabic_headline_regular';src:url('frontend/src/assets/sabic_webfonts/sabictypefaceheadline_rg-webfont.woff2') format('woff2'),url('frontend/src/assets/sabic_webfonts/sabictypefaceheadline_rg-webfont.woff') format('woff');font-display:swap}
@font-face{font-family:'sabic_headline_light';src:url('frontend/src/assets/sabic_webfonts/sabictypefaceheadline_lt-webfont.woff2') format('woff2'),url('frontend/src/assets/sabic_webfonts/sabictypefaceheadline_lt-webfont.woff') format('woff');font-display:swap}
@font-face{font-family:'sabic_headline_bold';src:url('frontend/src/assets/sabic_webfonts/sabictypefaceheadline_bd-webfont.woff2') format('woff2'),url('frontend/src/assets/sabic_webfonts/sabictypefaceheadline_bd-webfont.woff') format('woff');font-display:swap}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ====== DEFAULT: SABIC LIGHT THEME ====== */
:root{
  --bg:#f0f0f1;--bg2:#ffffff;--bg3:#f7f7f7;--bg4:#eff0f1;--bg5:#e6e7e8;
  --border:#e6e7e8;--border2:#c6c8ca;--border3:#939598;
  --text:#4d4d4d;--text2:#939598;--text3:#c6c8ca;
  /* "orange" variable names are kept (the doc uses them everywhere); they now map to SABIC blue. */
  --orange:#009fdf;--orange2:#041e41;--orange3:#1fb8f5;--orange-glow:rgba(0,159,223,.3);
  --green:#07844e;--red:#e35205;--blue:#009fdf;--purple:#bc8cff;--yellow:#ffcd00;--cyan:#56d4dd;--pink:#f778ba;
  --radius:10px;--radius2:8px;
  --font:'sabic_text_regular','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'Cascadia Code','Fira Code',Consolas,monospace;
  --transition:all .25s cubic-bezier(.4,0,.2,1);
  --net-color:var(--orange);
  --sabic-blue:#009fdf;
  --sabic-dark-blue:#041e41;
  --sabic-yellow:#ffcd00;
}

/* ====== DARK TOGGLE (kept for engineers who prefer dark) ====== */
body[data-theme="dark"]{
  --bg:#0a0e17;--bg2:#111827;--bg3:#1a2236;--bg4:#232f47;--bg5:#2d3a55;
  --border:#2a3450;--border2:#3a4a6b;--border3:#4a5a80;
  --text:#e6edf3;--text2:#8b949e;--text3:#5a6578;
}
body[data-theme="dark"]{background:radial-gradient(ellipse at top,#10182a 0%,var(--bg) 60%)}
body[data-theme="dark"] .studio{box-shadow:0 32px 96px rgba(0,0,0,.55)}
body[data-theme="dark"] .toast.success{background:rgba(63,185,80,.18);color:#3fb950}
body[data-theme="dark"] .toast.info{background:rgba(88,166,255,.18);color:#58a6ff}
body[data-theme="dark"] .toast.warn{background:rgba(228,82,5,.18);color:#e35205}

/* SABIC light specifics */
.studio{box-shadow:0 16px 64px rgba(0,0,0,.10)}
.ufd-svg,#diagramBox{background:#eef2f8}
.tree{background:#f7f7f7}
.toast.success{background:rgba(7,132,78,.10);color:#07844e}
.toast.info{background:rgba(0,159,223,.10);color:#009fdf}
.toast.warn{background:rgba(228,82,5,.10);color:#e35205}

/* ── Theme toggle button ── */
.theme-btn{
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);
  background:var(--bg3);color:var(--text2);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:var(--transition);
  flex-shrink:0;
}
.theme-btn:hover{border-color:var(--net-color);color:var(--net-color);background:var(--bg4);transform:scale(1.1)}

html,body{height:100%;font-size:14px}
body{font-family:var(--font);background:#ffffff;color:var(--text);margin:0;padding:0;overflow-x:hidden;display:block}
body[data-theme="dark"]{background:#0a0e17}

/* ============================================================================
 *  EO FULL-BLEED SHELL — header / 0.4% blue stripe / sidebar+main / 0.4% yellow stripe / footer
 * ============================================================================ */
.eo-shell{width:100%;min-height:100vh;height:100vh;display:flex;flex-direction:column;background:#ffffff}
.eo-header{height:12.3%;width:100%;background:var(--bg2)}
.eo-stripe-blue{height:0.4%;min-height:4px;background-image:linear-gradient(130deg,#0047bb 0%,var(--sabic-blue,#009fdf) 100%)}
.eo-stripe-yellow{height:0.4%;min-height:4px;background-image:linear-gradient(130deg,var(--sabic-yellow,#ffcd00) 0%,rgba(253,212,50,.6) 100%)}
.eo-content{flex:1;display:flex;width:100%;background:var(--bg2);min-height:0;overflow:hidden}
.eo-sidebar{width:19vmin;min-width:170px;background:var(--bg2);box-shadow:0 0 8px var(--primary_shadow_box,rgba(0,0,0,.16));padding:1.5vmin 0;flex-shrink:0;overflow-y:auto;z-index:5}
.eo-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);overflow:hidden}
.eo-topbar{height:5vmin;min-height:42px;padding:0.4vmin 2vmin 0.1vmin 2vmin;display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.eo-breadcrumb{font-family:'sabic_text_bold',serif;font-size:1.4vmin;font-weight:700;letter-spacing:.05vmin;text-transform:uppercase;color:var(--sabic-dark-blue,#041e41)}
.eo-main-body{flex:1;overflow-y:auto;padding:0;background:var(--bg2);min-height:0}
.eo-footer{height:4vmin;min-height:34px;width:100%;background:var(--bg2);padding:0 2vmin;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);flex-shrink:0}

/* ====== SABIC HEADER ROW ====== */
.sabic-header{height:100%;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 4%;background:var(--bg2)}
.sabic-header .sh-left{display:flex;align-items:center;gap:18px}
.sabic-header .eo-mark{width:19vmin;max-width:200px;height:auto;display:block}
.sabic-header .sh-title h1{font-family:'sabic_headline_bold','sabic_text_bold',serif;font-size:1.6vmin;font-weight:700;letter-spacing:.2px;color:var(--sabic-dark-blue,#041e41);line-height:1.2}
.sabic-header .sh-title p{font-family:'sabic_text_regular',serif;font-size:1.2vmin;color:var(--text2);margin-top:2px}
.sabic-header .sh-right{display:flex;align-items:center;gap:18px}
.sabic-header .sabic-mark{width:12vmin;max-width:140px;height:auto;display:block}
.sabic-header .sh-user{display:flex;align-items:center;gap:8px}
.sabic-header .sh-user .sh-avatar{width:4vmin;min-width:34px;height:4vmin;min-height:34px;border-radius:50%;border:1px solid var(--border2);background:#eaf9ff;color:var(--sabic-blue,#009fdf);font-family:'sabic_text_bold',serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:1.2vmin}
.sabic-header .sh-user .sh-meta p{margin:0;line-height:1.2;font-family:'sabic_headline_light',serif}
.sabic-header .sh-user .sh-meta .sh-welcome{font-size:1.2vmin;color:var(--sabic-blue,#009fdf);font-weight:700}
.sabic-header .sh-user .sh-meta .sh-name{font-size:1.3vmin;color:var(--text);font-weight:700}
.sabic-header .sh-user .sh-meta .sh-role{font-size:1.2vmin;color:var(--text3)}
body[data-theme="dark"] .sabic-header .eo-mark,
body[data-theme="dark"] .sabic-header .sabic-mark{filter:brightness(0) invert(1)}

/* ====== EO SIDEBAR NAV ====== */
.eo-nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4vmin}
.eo-nav-section{padding:0 1.5vmin 1.5vmin;border-bottom:1px solid var(--border);margin-bottom:1vmin;display:flex;align-items:center;gap:1vmin}
.eo-nav-section .eo-nav-title{font-family:'sabic_headline_bold',serif;font-size:1.4vmin;font-weight:700;color:var(--sabic-dark-blue,#041e41);text-transform:uppercase;letter-spacing:.05vmin}
.eo-nav-section .eo-nav-mark{font-size:1.6vmin;color:var(--sabic-blue,#009fdf)}
.eo-nav-item{display:flex;align-items:center;gap:1vmin;padding:1vmin 1.4vmin;margin:0 0.8vmin;border-radius:.4vmin;text-decoration:none;font-family:'sabic_text_bold',serif;font-size:1.3vmin;font-weight:600;color:var(--text);background:transparent;border:none;cursor:pointer;text-align:left;transition:all .2s ease;text-transform:uppercase;letter-spacing:.05vmin}
.eo-nav-item:hover{background:#eaf9ff;color:var(--sabic-blue,#009fdf)}
.eo-nav-item.active{background:var(--sabic-blue,#009fdf);color:#ffffff}
.eo-nav-item .eo-nav-icon{width:2.2vmin;height:2.2vmin;display:inline-flex;align-items:center;justify-content:center;font-size:1.4vmin;font-weight:700;border-radius:.3vmin;background:rgba(0,0,0,.05)}
.eo-nav-item.active .eo-nav-icon{background:rgba(255,255,255,.18);color:#ffffff}

/* ====== EO FOOTER ====== */
.eo-footer .eo-footer-info{display:flex;align-items:center;gap:8px;font-family:'sabic_text_regular',serif;font-size:1.2vmin;color:var(--text2)}
.eo-footer .eo-footer-info .eo-footer-dot{width:8px;height:8px;border-radius:50%;background:#07844e;box-shadow:0 0 8px rgba(7,132,78,.6)}
.eo-footer .eo-footer-version{font-family:'sabic_text_regular',serif;font-size:1.2vmin;color:var(--text3)}

/* Studio toolbar row inside eo-main — keep buttons but visually integrate */
.eo-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eo-topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.eo-net-badge{width:3.6vmin;min-width:30px;height:3.6vmin;min-height:30px;border-radius:.6vmin;background:linear-gradient(135deg,var(--sabic-blue,#009fdf),var(--sabic-dark-blue,#041e41));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:1.6vmin;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.18);flex-shrink:0}

/* Neutralise the old centered .studio card */
.studio{width:100%;max-width:none;border-radius:0;border:none;box-shadow:none;background:transparent;display:block;min-height:auto;overflow:visible}

/* Dark-mode shell */
body[data-theme="dark"] .eo-shell,body[data-theme="dark"] .eo-header,body[data-theme="dark"] .eo-content,body[data-theme="dark"] .eo-main,body[data-theme="dark"] .eo-footer,body[data-theme="dark"] .eo-topbar{background:var(--bg2)}
body[data-theme="dark"] .eo-main-body,body[data-theme="dark"] .eo-main{background:var(--bg)}
body[data-theme="dark"] .eo-sidebar{background:var(--bg3)}
body[data-theme="dark"] .eo-nav-item:hover{background:rgba(0,159,223,.18);color:var(--sabic-blue,#009fdf)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--border3)}

.studio{width:100%;max-width:1480px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;box-shadow:0 32px 96px rgba(0,0,0,.55);display:flex;flex-direction:column;min-height:94vh;overflow:hidden}

/* ====== HEADER ====== */
.studio-header{padding:16px 26px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(240,136,62,.04),transparent)}
.studio-icon{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--net-color),var(--orange2));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:var(--transition)}
.studio-title h1{font-size:18px;font-weight:700;letter-spacing:.2px}
.studio-title p{font-size:12px;color:var(--text2);margin-top:2px}
.studio-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ====== AFFILIATE + PLANTS STRIP ====== */
.affbar{display:flex;align-items:center;gap:14px;padding:10px 26px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(240,136,62,.025),transparent);flex-wrap:wrap}
.affbar .aff-block{display:flex;align-items:center;gap:6px}
.affbar .aff-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px}
.affbar input.aff-input{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12.5px;font-family:var(--font);outline:none;transition:var(--transition);min-width:140px}
.affbar input.aff-input:focus{border-color:var(--net-color);box-shadow:0 0 0 2px rgba(240,136,62,.12)}
.affbar .plant-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.affbar .plant-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 4px 5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:14px;font-size:11.5px;font-weight:600;transition:var(--transition)}
.affbar .plant-chip:hover{border-color:var(--border2)}
.affbar .plant-chip input{background:transparent;border:none;color:var(--text);font-size:11.5px;font-family:var(--font);font-weight:600;outline:none;width:54px;padding:0;text-align:center}
.affbar .plant-chip .pc-del{width:18px;height:18px;border-radius:50%;background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:13px;line-height:1;opacity:.55;transition:var(--transition)}
.affbar .plant-chip:hover .pc-del{opacity:1}
.affbar .plant-chip .pc-del:hover{background:rgba(248,81,73,.2);color:var(--red)}
.affbar .plant-add{padding:5px 10px;background:transparent;border:1px dashed var(--border2);border-radius:14px;color:var(--text3);font-size:11.5px;font-weight:600;cursor:pointer;transition:var(--transition)}
.affbar .plant-add:hover{border-color:var(--net-color);color:var(--net-color)}

/* ====== NETWORK SWITCHER ====== */
.netbar{display:flex;gap:6px;padding:10px 26px;border-bottom:1px solid var(--border);background:var(--bg);overflow-x:auto}
.netbtn{padding:9px 16px;border-radius:10px;background:var(--bg3);border:1.5px solid var(--border);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:var(--transition);font-family:var(--font)}
.netbtn:hover{border-color:var(--border3);color:var(--text)}
.netbtn .nb-ic{font-size:16px}
.netbtn .nb-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.netbtn.active{border-color:var(--net-color);color:var(--net-color);background:rgba(240,136,62,.06);box-shadow:0 0 0 3px rgba(240,136,62,.08)}
.netbtn.active .nb-dot{opacity:1;box-shadow:0 0 8px currentColor}
.netbtn .nb-count{font-size:10px;font-family:var(--mono);background:var(--bg);padding:1px 6px;border-radius:8px;color:var(--text2)}
.netbtn.active .nb-count{background:var(--net-color);color:#fff}

/* ====== WORKFLOW TABS ====== */
.tab-bar{display:flex;gap:0;padding:12px 26px 0;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:10px 16px 12px;font-size:12.5px;font-weight:500;color:var(--text3);cursor:pointer;transition:var(--transition);border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font)}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--net-color);border-bottom-color:var(--net-color);font-weight:600}
.tab.completed{color:var(--green)}
.tab .tab-num{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--bg3);color:var(--text3);transition:var(--transition)}
.tab.active .tab-num{background:var(--net-color);color:#fff}
.tab.completed .tab-num{background:var(--green);color:#fff}

.body{flex:1;overflow-y:auto;padding:24px 28px;min-height:480px}
.pane{display:none;animation:fade .25s ease}
.pane.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.footer{padding:13px 26px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.footer-info{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:8px}
.footer-info .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(63,185,80,.6)}
.footer-actions{display:flex;gap:8px}

/* ====== BUTTONS ====== */
.btn{padding:9px 18px;border-radius:var(--radius2);font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);border:none;display:inline-flex;align-items:center;gap:8px;font-family:var(--font)}
.btn-primary{background:var(--net-color);color:#fff}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 4px 20px var(--orange-glow);transform:translateY(-1px)}
.btn-secondary{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--text2);color:var(--text)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{box-shadow:0 4px 20px rgba(63,185,80,.4);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text2);border:none}
.btn-ghost:hover{color:var(--text);background:var(--bg3)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-xs{padding:4px 8px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* ====== FORMS ====== */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.7px}
.form-hint{font-size:11px;color:var(--text3);margin-bottom:8px;line-height:1.5}
.form-input{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);color:var(--text);font-size:13px;font-family:var(--font);transition:var(--transition);outline:none}
.form-input:focus{border-color:var(--net-color);box-shadow:0 0 0 3px rgba(240,136,62,.12)}
.form-input::placeholder{color:var(--text3)}
.form-input.small{padding:6px 10px;font-size:12px}
.form-row{display:grid;gap:10px}
.form-row-2{grid-template-columns:1fr 1fr}
.form-row-3{grid-template-columns:1fr 1fr 1fr}
.form-row-4{grid-template-columns:repeat(4,1fr)}

.section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.section-title .accent{width:4px;height:14px;background:var(--net-color);border-radius:2px}
.section-hint{font-size:11px;color:var(--text3);margin-bottom:14px;line-height:1.6}

/* ====== ELEMENT TREE (hierarchy view) ====== */
.eh-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.eh-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.eh-head .eh-ic{font-size:20px}
.eh-head h3{font-size:14px;font-weight:700;flex:1}
.eh-head .eh-tag{font-family:var(--mono);font-size:10px;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:8px}

.eh-tree{font-family:var(--font);font-size:12.5px}
.eh-node{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;transition:var(--transition);cursor:pointer;position:relative}
.eh-node:hover{background:var(--bg4)}
.eh-node.selected{background:rgba(240,136,62,.08);border-left:3px solid var(--net-color)}
.eh-node .eh-twist{width:14px;color:var(--text3);font-size:10px;display:inline-flex;justify-content:center}
.eh-node .eh-dot{width:8px;height:8px;border-radius:50%;background:var(--net-color);opacity:.55;flex-shrink:0}
.eh-node .eh-nm{font-weight:600;color:var(--text)}
.eh-node .eh-key{font-family:var(--mono);font-size:10.5px;color:var(--text2);background:var(--bg);padding:2px 7px;border-radius:6px}
.eh-node .eh-cnt{font-family:var(--mono);font-size:11px;color:var(--text3);margin-left:auto}
.eh-node .eh-cnt.has{color:var(--net-color);font-weight:700}
.eh-children{margin-left:18px;border-left:1px dashed var(--border2);padding-left:8px}

/* ====== AREA / UNIT CARDS ====== */
.area-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;transition:var(--transition)}
.area-card:hover{border-color:var(--border2)}
.area-card.active{border-color:var(--net-color);background:rgba(240,136,62,.04);box-shadow:0 0 0 3px rgba(240,136,62,.06)}
.area-card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.area-card-head .ac-ic{font-size:18px}
.area-card-head input.ac-name{flex:1;background:transparent;border:1px solid transparent;color:var(--text);font-size:13.5px;font-weight:700;padding:4px 8px;border-radius:6px;font-family:var(--font);outline:none}
.area-card-head input.ac-name:focus{border-color:var(--net-color);background:var(--bg)}
.area-card-head .ac-tag{font-family:var(--mono);font-size:10.5px;color:var(--text2);background:var(--bg);padding:3px 8px;border-radius:7px}
.area-card-head .ac-del{width:26px;height:26px;border-radius:6px;background:transparent;border:none;color:var(--text3);cursor:pointer;opacity:.4;transition:var(--transition)}
.area-card:hover .ac-del{opacity:1}
.area-card-head .ac-del:hover{background:rgba(248,81,73,.15);color:var(--red)}
.area-card-meta{font-size:11px;color:var(--text3);font-family:var(--mono)}

/* ====== EQUIPMENT GRID ====== */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:8px 0}
.eq-card{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius2);border:1px solid var(--border);background:var(--bg3);transition:var(--transition);position:relative}
.eq-card:hover{border-color:var(--border2)}
.eq-card.has-items{border-color:var(--net-color);background:rgba(240,136,62,.04);box-shadow:0 0 0 2px rgba(240,136,62,.05)}
.eq-card .e-icon{font-size:20px;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;color:var(--net-color)}
.eq-isa-svg{display:inline-block;vertical-align:middle;color:var(--net-color)}
.eq-emoji{display:inline-block;font-size:1em;line-height:1}
.eh-node .eh-nm .eq-isa-svg{color:var(--net-color);margin-right:2px;vertical-align:-4px}
.eh-node .eh-nm .eq-emoji{margin-right:4px}
.tnode .eq-isa-svg{color:var(--net-color);vertical-align:-3px;margin-right:4px}
.eq-isa-svg-on-bg{color:#0d1117}
/* SABIC light is now default; dark uses its original filter (none extra needed). */
.eq-card .e-body{flex:1;min-width:0}
.eq-card .e-name{font-size:12.5px;font-weight:600;line-height:1.3}
.eq-card .e-key{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:2px}
.eq-card .e-count{width:56px;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:var(--mono);text-align:center;outline:none;transition:var(--transition);font-weight:700}
.eq-card .e-count:focus{border-color:var(--net-color);box-shadow:0 0 0 2px rgba(240,136,62,.15)}

/* ====== SUB-TABS (within an area) ====== */
.subtabs{display:flex;gap:0;border-radius:var(--radius2);overflow:hidden;border:1px solid var(--border);margin-bottom:14px}
.subtab{flex:1;padding:9px 14px;background:var(--bg3);border:none;color:var(--text2);font-size:12.5px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:8px}
.subtab:hover{background:var(--bg4)}
.subtab.active{background:var(--bg4);color:var(--text);border-bottom:2px solid var(--net-color)}
.subtab .scount{font-size:11px;font-weight:700;font-family:var(--mono);background:var(--bg);padding:1px 7px;border-radius:8px;color:var(--text3)}
.subtab.active .scount{background:var(--net-color);color:#fff}

/* ====== PILL ROW (area selector) ====== */
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pill{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--radius2);border:1.5px solid var(--border);background:var(--bg3);cursor:pointer;transition:var(--transition);font-family:var(--font)}
.pill:hover{border-color:var(--border2)}
.pill.active{border-color:var(--net-color);background:rgba(240,136,62,.06);box-shadow:0 0 0 3px rgba(240,136,62,.1)}
.pill .pill-dot{width:10px;height:10px;border-radius:50%;background:var(--net-color)}
.pill .pill-name{font-size:12.5px;font-weight:600}
.pill .pill-count{font-size:10px;font-weight:700;font-family:var(--mono);background:var(--bg);padding:1px 6px;border-radius:8px;color:var(--text2)}
.pill.active .pill-count{background:var(--net-color);color:#fff}
.pill.done{border-color:var(--green)}
.pill.done .pill-count{background:var(--green);color:#fff}

/* ====== ADD ROW ====== */
.add-row{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border:1.5px dashed var(--border);border-radius:var(--radius2);color:var(--text3);font-size:13px;cursor:pointer;transition:var(--transition);margin-top:8px;font-weight:600}
.add-row:hover{border-color:var(--net-color);color:var(--net-color);background:rgba(240,136,62,.04)}

/* ====== ATTR TABLE ====== */
.attr-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;background:var(--bg3);border-radius:var(--radius2);overflow:hidden}
.attr-table thead{background:var(--bg4)}
.attr-table th{text-align:left;font-weight:600;color:var(--text2);padding:9px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.attr-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.attr-table tbody tr:hover{background:var(--bg4)}
.attr-table input,.attr-table select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:5px;font-size:12px;font-family:var(--mono);outline:none;width:100%;transition:var(--transition)}
.attr-table input:focus,.attr-table select:focus{border-color:var(--net-color);box-shadow:0 0 0 2px rgba(240,136,62,.15)}
.attr-table .num{font-family:var(--mono);font-size:11px;color:var(--text3);text-align:center}

/* ====== ROUTING CARD (connections) ====== */
.route-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);margin-bottom:8px;transition:var(--transition)}
.route-card:hover{border-color:var(--border2)}
.route-card .rc-from,.route-card .rc-to{flex:1;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.route-card .rc-arrow{color:var(--net-color);font-size:18px;font-weight:bold}
.route-card .rc-qty{width:60px}
.route-card select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:12px;font-family:var(--font);outline:none;flex:1;transition:var(--transition)}
.route-card select:focus{border-color:var(--net-color)}
.route-card .rc-del{width:26px;height:26px;border-radius:6px;background:transparent;border:none;color:var(--text3);cursor:pointer;opacity:.5}
.route-card .rc-del:hover{opacity:1;background:rgba(248,81,73,.15);color:var(--red)}

/* ====== REVIEW ====== */
.review-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
.rs{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:14px 10px;text-align:center;transition:var(--transition)}
.rs:hover{border-color:var(--net-color);transform:translateY(-1px)}
.rs .val{font-size:26px;font-weight:800;font-family:var(--mono);color:var(--net-color);line-height:1}
.rs .lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:5px}

.tree{font-family:var(--mono);font-size:11.5px;color:var(--text2);background:var(--bg);padding:16px;border-radius:var(--radius2);border:1px solid var(--border);max-height:480px;overflow:auto;line-height:1.8}
.tree .tnode{color:var(--text)}
.tree .tlevel{color:var(--net-color);font-weight:600}
.tree .tcount{color:var(--text3);font-size:10px}
.tree .tarea{color:var(--cyan);font-weight:700}

.warn{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:6px;font-size:12px;margin-bottom:6px;line-height:1.5}
.warn.error{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.2);color:var(--red)}
.warn.warning{background:rgba(240,136,62,.08);border:1px solid rgba(240,136,62,.2);color:var(--orange)}
.warn.ok{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.25);color:var(--green)}

/* ====== TOASTS ====== */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 16px;border-radius:8px;font-size:12px;font-weight:500;animation:slide .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:340px}
.toast.success{background:rgba(63,185,80,.15);border:1px solid rgba(63,185,80,.3);color:var(--green)}
.toast.info{background:rgba(88,166,255,.15);border:1px solid rgba(88,166,255,.3);color:var(--blue)}
.toast.warn{background:rgba(240,136,62,.15);border:1px solid rgba(240,136,62,.3);color:var(--orange)}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;font-family:var(--mono)}
.badge-net{background:rgba(240,136,62,.15);color:var(--net-color)}
.badge-green{background:rgba(63,185,80,.15);color:var(--green)}
.badge-blue{background:rgba(88,166,255,.15);color:var(--blue)}
.badge-cyan{background:rgba(86,212,221,.15);color:var(--cyan)}

/* ====== DIAGRAM ====== */
#diagramBox{background:#0d1117;border:1px solid var(--border);border-radius:var(--radius);min-height:520px;position:relative;overflow:hidden}
.ufd-svg{background:#0d1117;display:block;font-family:'Cascadia Code',monospace}
.ufd-node{fill:#161b22;stroke:var(--net-color);stroke-width:1.5px;transition:var(--transition);cursor:pointer}
.ufd-node:hover{fill:#1a2236;stroke-width:2px}
.ufd-link{fill:none;stroke:var(--net-color);stroke-width:1.6px;opacity:.7;stroke-dasharray:5 4;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.ufd-label{fill:var(--text);font-size:11px;font-weight:600;text-anchor:middle;pointer-events:none}
.ufd-sub{fill:var(--text3);font-size:9px;text-anchor:middle;pointer-events:none}
.ufd-qty{fill:var(--net-color);font-size:10px;font-weight:700;text-anchor:middle;pointer-events:none}
.ufd-tooltip{position:absolute;z-index:99999;pointer-events:none;background:rgba(13,17,23,.97);border:1px solid var(--border3);color:var(--text);padding:10px 14px;border-radius:8px;font-family:var(--mono);font-size:11px;line-height:1.5;min-width:200px;max-width:340px;box-shadow:0 12px 36px rgba(0,0,0,.7);opacity:0;transition:opacity .1s linear}
.ufd-tooltip .ttl{font-weight:700;color:var(--net-color);margin-bottom:4px;font-size:12px}
.ufd-tooltip .row{display:flex;justify-content:space-between;gap:12px;padding:1px 0;color:var(--text2)}
.ufd-tooltip .row b{color:var(--yellow)}

/* ====== EMPTY STATE ====== */
.empty{padding:40px 20px;text-align:center;color:var(--text3);background:var(--bg3);border:1px dashed var(--border);border-radius:var(--radius);margin:8px 0}
.empty .e-ic{font-size:38px;margin-bottom:8px;opacity:.5}
.empty .e-tt{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}
.empty .e-st{font-size:11px}

/* ====== MODAL ====== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9998;animation:fade .2s}
.modal-mask.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:22px;width:90%;max-width:540px;box-shadow:0 32px 96px rgba(0,0,0,.7)}
.modal h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

@media(max-width:1100px){.review-stats{grid-template-columns:repeat(3,1fr)}.form-row-3,.form-row-4{grid-template-columns:1fr 1fr}}
@media(max-width:700px){body{padding:8px}.studio{border-radius:12px}.body{padding:16px}.tab-bar,.netbar,.studio-header,.footer{padding-left:14px;padding-right:14px}.review-stats{grid-template-columns:repeat(2,1fr)}.form-row-2,.form-row-3,.form-row-4{grid-template-columns:1fr}}
</style>
</head>

<script>
/* ============================================================================
 *  PLANT NETWORK STUDIO  —  Multi-utility builder
 *  Builds the same shape of network as steam_network_studio_v12, generalized.
 * ============================================================================ */

/* ---------- NETWORK DEFINITIONS (from plant config screenshots) ----------- */
const NETWORKS = {
  air: {
    name: 'Air Network', key:'air_network', icon:'💨', color:'#56d4dd',
    subtitle:'Instrument & plant air distribution',
    /* Tree of allowed element types (hierarchy from plant config) */
    elementTree: [
      { key:'instrument_air_compressor', name:'Instrument Air Compressor', icon:'🌀', group:'gen', role:'Generator',
        attrs:[{name:'Suction Flow',uom:'Nm3/h'},{name:'Suction Pressure',uom:'bar'},{name:'Suction Temperature',uom:'degC'},{name:'Discharge Pressure',uom:'bar'},{name:'Discharge Temperature',uom:'degC'},{name:'Driver Power',uom:'kW'},{name:'Polytropic Efficiency',uom:'percent'}] },
      { key:'plant_air_compressor', name:'Plant Air Compressor', icon:'🌀', group:'gen', role:'Generator',
        attrs:[{name:'Suction Flow',uom:'Nm3/h'},{name:'Suction Pressure',uom:'bar'},{name:'Discharge Pressure',uom:'bar'},{name:'Driver Power',uom:'kW'},{name:'Polytropic Efficiency',uom:'percent'}] },
      { key:'air_dryer', name:'Air Dryer', icon:'🌬️', group:'dist', role:'Distribution',
        attrs:[{name:'Inlet Flow',uom:'Nm3/h'},{name:'Inlet Dew Point',uom:'degC'},{name:'Outlet Dew Point',uom:'degC'},{name:'Pressure Drop',uom:'bar'}] },
      { key:'air_receiver', name:'Air Receiver / Surge Drum', icon:'🛢️', group:'dist', role:'Distribution',
        attrs:[{name:'Volume',uom:'m3'},{name:'Operating Pressure',uom:'bar'},{name:'Operating Temperature',uom:'degC'}] },
      { key:'air_filter', name:'Air Filter', icon:'🧰', group:'dist', role:'Distribution',
        attrs:[{name:'Inlet Flow',uom:'Nm3/h'},{name:'Pressure Drop',uom:'bar'},{name:'Filter Rating',uom:'micron'}] },
      { key:'air_consumer', name:'Air Consumer (PCV/Inst.)', icon:'📍', group:'con', role:'Consumer',
        attrs:[{name:'Demand Flow',uom:'Nm3/h'},{name:'Supply Pressure',uom:'bar'},{name:'Critical Service',uom:''}] },
    ],
    groups:{
      gen:  { name:'Air Generators',   icon:'🌀', color:'#f0883e' },
      dist: { name:'Air Distribution', icon:'🌬️', color:'#56d4dd' },
      con:  { name:'Air Consumers',    icon:'📍', color:'#3fb950' },
    },
    /* Areas are user-defined plant units; defaults seed them. */
    defaultAreas:[
      { name:'Utility Block', tag:'UB' },
      { name:'Olefin Plant', tag:'OLE' },
    ],
    /* Routing: from one element type to another within network */
    routing:{ enabled:true, from:['instrument_air_compressor','plant_air_compressor'], to:['air_receiver','air_dryer','air_consumer'] },
  },

  fuel: {
    name: 'Fuel Network', key:'fuel_network', icon:'⛽', color:'#f0c040',
    subtitle:'Fuel gas distribution from import to consumers',
    elementTree:[
      { key:'fuel_import', name:'Fuel Import To Complex', icon:'📥', group:'src', role:'Source',
        attrs:[{name:'Imported Flow',uom:'Nm3/h'},{name:'Inlet Pressure',uom:'bar'},{name:'Inlet Temperature',uom:'degC'},{name:'LHV',uom:'kcal/Nm3'},{name:'Composition',uom:''}] },
      { key:'fuel_header', name:'Fuel Header / Knock-out Drum', icon:'🛢️', group:'dist', role:'Distribution',

/* Returns SVG icon markup for an element (size in px). Falls back to ed.icon emoji. */
function isaSVG(key, size){
  const svg = EQUIPMENT_ICONS[key];
  if (!svg) return '';
  const s = size || 22;
  return svg.replace('<svg ', `<svg width="${s}" height="${s}" class="eq-isa-svg" `);
}
function eqIcon(ed, size){
  const ikey = ICON_MAP[ed && ed.key];
  if (ikey && EQUIPMENT_ICONS[ikey]) return isaSVG(ikey, size);
  return `<span class="eq-emoji">${ed && ed.icon ? ed.icon : '📦'}</span>`;
}

/* Steam area data shape:
   a.steam = { gen:{hdrKey:{elKey:n}}, con:{hdrKey:{elKey:n}},
               tbn:{srcHdrKey:{routeKey:n}}, let:{srcHdrKey:{dstHdrKey:n}} }
   routeKey = `${typeKey}|${dst1}|${dst2}` (dsts are header keys) */
function ensureSteam(a){
  if (!a.steam) a.steam = {};
  ['gen','con','tbn','exch','let'].forEach(k=>{ if(!a.steam[k]) a.steam[k]={}; });
  return a.steam;
}
function steamHdrByKey(k){ return STEAM_HEADERS.find(h=>h.key===k); }
function steamLowerHeaders(hk){
  const i = STEAM_HEADERS.findIndex(h=>h.key===hk);
  return i<0 ? [] : STEAM_HEADERS.slice(i+1).filter(h=>h.key!=='cnd');
}
/* For routed consumers (exchangers): destination pool = lower headers + condensate header */
function steamCondHeaders(hk){
  const i = STEAM_HEADERS.findIndex(h=>h.key===hk);
  return i<0 ? [] : STEAM_HEADERS.slice(i+1); /* includes 'cnd' */
}
function trbRouteKey(typeKey, dsts, subcat){ 
  return [typeKey + (subcat ? ':' + subcat : ''), ...(dsts||[])].join('|'); 
}
function trbParse(rk){ 
  const p=String(rk||'').split('|'); 
  const idx = p[0].indexOf(':');
  if(idx > -1) {
    return {typeKey: p[0].substring(0, idx), subcat: p[0].substring(idx+1), dsts: p.slice(1)};
  }
  return {typeKey:p[0], subcat:'', dsts:p.slice(1)}; 
}
function steamAreaTotal(a){
  const s=ensureSteam(a); let t=0;
  ['gen','con','tbn','exch','let'].forEach(g=> Object.values(s[g]).forEach(m=> Object.values(m).forEach(v=>t+=(+v||0))));
  return t;
}

function getElementCountInArea(a, ek) {
  const n = curNet(), d = curDef();
  const isSteam = d.customUI === 'steam';
  if (!isSteam) return +a.counts[ek] || 0;
  const s = ensureSteam(a);
  if (ek.startsWith('steam_header_') || ek === 'condensate_header') return 1;
  if (STEAM_GEN.some(tg => tg.key === ek)) {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.gen[h.key]?.[ek] || 0));
    return c;
  }
  if (STEAM_CON.some(tc => tc.key === ek)) {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.con[h.key]?.[ek] || 0));
    return c;
  }
  if (STEAM_TURBINE.some(tt => tt.key === ek)) {
    let c = 0; STEAM_HEADERS.forEach(h => {
      Object.entries(s.tbn[h.key] || {}).forEach(([rk, cnt]) => {
        if (trbParse(rk).typeKey === ek) c += cnt;
      });
    });
    return c;
  }
  if (ek === 'steam_exchanger') {
    let c = 0;
    STEAM_HEADERS.forEach(h => {
      c += (s.con[h.key]?.[ek] || 0);
      Object.values(s.exch[h.key] || {}).forEach(cnt => c += cnt);
    });
    return c;
  }
  if (ek === 'letdown_station') {
    let c = 0;
    STEAM_HEADERS.forEach(h => {
      Object.values(s.let[h.key] || {}).forEach(cnt => c += cnt);
    });
    return c;
  }
  return 0;
}

function buildCountsSource(a, d, isSteam) {
  if (!isSteam) return a.counts;
  const countsSource = {};
  const s = ensureSteam(a);
  
  // Headers: always 1 of each
  STEAM_HEADERS.forEach(h => {
    const key = h.key === 'cnd' ? 'condensate_header' : 'steam_header_' + h.key;
    countsSource[key] = 1;
  });
  
  // Generators
  STEAM_GEN.forEach(tg => {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.gen[h.key]?.[tg.key] || 0));
    if (c > 0) countsSource[tg.key] = c;
  });
  
  // Consumers
  STEAM_CON.forEach(tc => {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.con[h.key]?.[tc.key] || 0));
    if (c > 0) countsSource[tc.key] = c;
  });
  
  // Turbines
  STEAM_TURBINE.forEach(tt => {
    let c = 0; STEAM_HEADERS.forEach(h => {
      Object.entries(s.tbn[h.key] || {}).forEach(([rk, cnt]) => {
        if (trbParse(rk).typeKey === tt.key) c += cnt;
      });
    });
    if (c > 0) countsSource[tt.key] = c;
  });
  
  // Exchangers
  let exchC = 0; STEAM_HEADERS.forEach(h => {
    Object.values(s.exch[h.key] || {}).forEach(cnt => exchC += cnt);
  });
  if (exchC > 0) {
    countsSource['steam_exchanger'] = (countsSource['steam_exchanger'] || 0) + exchC;
  }
  
  // Letdowns
  let letC = 0; STEAM_HEADERS.forEach(h => {
    Object.values(s.let[h.key] || {}).forEach(cnt => letC += cnt);
  });
  if (letC > 0) countsSource['letdown_station'] = letC;
  
  return countsSource;
}

function getSteamElementHeader(a, ek, i) {
  const s = ensureSteam(a);
  let accumulated = 0;
  if (ek.startsWith('steam_header_') || ek === 'condensate_header') return '';
  
  if (STEAM_GEN.some(tg => tg.key === ek)) {
    for (const h of STEAM_HEADERS) {
      const c = (s.gen[h.key]?.[ek] || 0);
      if (i < accumulated + c) return h.short;
      accumulated += c;
    }
  }
  if (STEAM_CON.some(tc => tc.key === ek)) {
    for (const h of STEAM_HEADERS) {
      const c = (s.con[h.key]?.[ek] || 0);
      if (i < accumulated + c) return h.short;
      accumulated += c;
    }
  }
  if (STEAM_TURBINE.some(tt => tt.key === ek)) {
    for (const h of STEAM_HEADERS) {
      let c = 0;
      Object.entries(s.tbn[h.key] || {}).forEach(([rk, cnt]) => {
        if (trbParse(rk).typeKey === ek) c += cnt;
      });
      if (i < accumulated + c) return h.short;
      accumulated += c;
    }
  }
  if (ek === 'steam_exchanger') {
    for (const h of STEAM_HEADERS) {
      const c = (s.con[h.key]?.[ek] || 0);

      if (i < accumulated + c) return h.short;
      accumulated += c;
    }
  }
  if (ek === 'letdown_station') {
    for (const h of STEAM_HEADERS) {
      let c = 0;
      Object.values(s.let[h.key] || {}).forEach(cnt => c += cnt);
      if (i < accumulated + c) return h.short;
      accumulated += c;

}

function getSteamInstanceInfo(a, ek, i) {
  const s = ensureSteam(a);
  let accumulated = 0;
  
  if (ek.startsWith('steam_header_') || ek === 'condensate_header') {
    return {
      hdrShort: '',
      suffix: ek === 'condensate_header' ? 'condensate header a' : 'steam header a'
    };
  }
  
  if (STEAM_GEN.some(tg => tg.key === ek)) {
    const ed = elemDef(ek);
    for (const h of STEAM_HEADERS) {
      const c = (s.gen[h.key]?.[ek] || 0);
      if (i < accumulated + c) {
        const subIndex = i - accumulated;
        const suffix = `${ed.name.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
        return { hdrShort: h.short, suffix };
      }
      accumulated += c;
    }
  }
  
  if (STEAM_CON.some(tc => tc.key === ek)) {
    const edName = elemDef(ek)?.name || ek;
    for (const h of STEAM_HEADERS) {
      const c = (s.con[h.key]?.[ek] || 0);
      if (i < accumulated + c) {
        const subIndex = i - accumulated;
        const suffix = `${edName.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
        return { hdrShort: h.short, suffix };
      }
      accumulated += c;
    }
  }
  
  if (STEAM_TURBINE.some(tt => tt.key === ek)) {
    const ed = elemDef(ek);
    for (const h of STEAM_HEADERS) {
      let c = 0;
      const tbnRoutes = Object.entries(s.tbn[h.key] || {}).filter(([rk]) => trbParse(rk).typeKey === ek);
      for (const [rk, cnt] of tbnRoutes) {
        if (i < accumulated + cnt) {
          const subIndex = i - accumulated;
          const parsed = trbParse(rk);
          const sc = TURBINE_SUBCATS.find(x => x.id === parsed.subcat);
          let scLabel = sc ? sc.label : (parsed.subcat === 'other' ? 'Other' : parsed.subcat);
          if (!scLabel || scLabel === '(Generic)') scLabel = ed.name;
          const suffix = `${scLabel.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
          return { hdrShort: h.short, suffix };
        }
        accumulated += cnt;
      }
    }
  }
  
  if (ek === 'steam_exchanger') {
    const ed = elemDef(ek);
    for (const h of STEAM_HEADERS) {
      const c = (s.con[h.key]?.[ek] || 0);
      if (i < accumulated + c) {
        const subIndex = i - accumulated;
        const suffix = `${ed.name.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
        return { hdrShort: h.short, suffix };
      }
      accumulated += c;
    }
    for (const h of STEAM_HEADERS) {
      let c = 0;
      const exchRoutes = Object.entries(s.exch[h.key] || {});
      for (const [rk, cnt] of exchRoutes) {
        if (i < accumulated + cnt) {
          const subIndex = i - accumulated;
          const suffix = `${ed.name.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
          return { hdrShort: h.short, suffix };
        }
        accumulated += cnt;
      }
    }
  }
  
  if (ek === 'letdown_station') {
    const ed = elemDef(ek);
    for (const h of STEAM_HEADERS) {
      let c = 0;
      const letRoutes = Object.entries(s.let[h.key] || {});
      for (const [dst, cnt] of letRoutes) {
        if (i < accumulated + cnt) {
          const subIndex = i - accumulated;
          const suffix = `${ed.name.toLowerCase()} ${String.fromCharCode(97 + subIndex)}`;
          return { hdrShort: h.short, suffix };
        }
        accumulated += cnt;
      }
    }
  }
  
  return { hdrShort: '', suffix: '' };
}

function netTotalRoutes(net){

function getAreaPlacedElementsSummary(a, isSteam) {

    return Object.entries(a.counts).filter(([,v])=>+v>0).map(([k,v])=>{
      const ed=elemDef(k); return { ed, count: v };
    });
  }
  const s = ensureSteam(a);
  const summary = [];
  
  STEAM_GEN.forEach(tg => {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.gen[h.key]?.[tg.key] || 0));
    if (c > 0) summary.push({ ed: elemDef(tg.key), count: c });
  });
  
  STEAM_CON.forEach(tc => {
    let c = 0; STEAM_HEADERS.forEach(h => c += (s.con[h.key]?.[tc.key] || 0));
    if (c > 0) summary.push({ ed: elemDef(tc.key), count: c });
  });
  
  STEAM_TURBINE.forEach(tt => {
    let c = 0; STEAM_HEADERS.forEach(h => {
      Object.entries(s.tbn[h.key] || {}).forEach(([rk, cnt]) => {
        if (trbParse(rk).typeKey === tt.key) c += cnt;
      });
    });
    if (c > 0) summary.push({ ed: elemDef(tt.key), count: c });
  });
  
  let exchC = 0; STEAM_HEADERS.forEach(h => {
    Object.values(s.exch[h.key] || {}).forEach(cnt => exchC += cnt);
  });
  if (exchC > 0) {
    const existing = summary.find(x => x.ed?.key === 'steam_exchanger');
    if (existing) {
      existing.count += exchC;
    } else {
      summary.push({ ed: elemDef('steam_exchanger'), count: exchC });
    }
  }
  
  let letC = 0; STEAM_HEADERS.forEach(h => {
    Object.values(s.let[h.key] || {}).forEach(cnt => letC += cnt);
  });
  if (letC > 0) summary.push({ ed: elemDef('letdown_station'), count: letC });
  
  return summary;
}

  const s = {

  for (const [k,def] of Object.entries(NETWORKS)){

function blankNet(k,def){
  /* Round-robin assign default areas to plants. Guarded with try/catch
     because STATE may be in the TDZ when buildInitialState calls us. */
  let plants;
  try { plants = STATE && STATE.plants; } catch(e){ plants = null; }
  if (!plants || !plants.length){
    plants = [{id:'p_olf',name:'OLF'},{id:'p_eg1',name:'EG1'},{id:'p_eg2',name:'EG2'}];
  }
  const areas = (def.defaultAreas||[]).map((a,i)=>({

    name:a.name, tag:a.tag,
    plantId: plants[i % plants.length].id,
    counts:{}, attrs:{}, meta:{},
  }));
  return { areas, routing:[], activeArea: areas[0]?.id||null, activeSub:'all', objective:'min_cost' };
}
function loadState(){
  try{ const s=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(s && s.nets && s.activeNet){
      /* Backfill new top-level fields if loading older state */
      if(!s.affiliate)  s.affiliate = 'United';
      if(!s.region)     s.region = 'Petrochemical Complex';
      if(!Array.isArray(s.plants)) s.plants = [{id:'p_olf',name:'OLF'},{id:'p_eg1',name:'EG1'},{id:'p_eg2',name:'EG2'}];
      /* Steam was previously an external iframe (empty areas). Seed it now that it is native. */
      if (!s.nets.steam || !s.nets.steam.areas || !s.nets.steam.areas.length){
        s.nets.steam = blankNet('steam', NETWORKS.steam);
      }
      /* Ensure every network key exists (handles new networks added after a save) */
      for (const [k,def] of Object.entries(NETWORKS)){
        if (!s.nets[k]) s.nets[k] = blankNet(k, def);
      }
      return s;
    }
  }catch(e){}
  return null;
}

/* ============================================================================
 *  EO OPTIMIZATION DOMAIN HELPERS
 *  Variable classification: every attribute is classified as one of:
 *    MV  – Manipulated Variable (operator/optimizer can set: valve openings,
 *          excess O2 setpoint, firing rate, damper opening, load setpoint)
 *    CV  – Controlled Variable (measured & constrained: pressures,
 *          temperatures, flows that have setpoints, drum levels)
 *    DV  – Disturbance Variable (measured but uncontrollable: ambient T,
 *          humidity, fuel composition, LHV, salinity, hardness)
 *    PV  – Process Value (passive monitor: emissions, status, efficiency,
 *          vibration, bearing temp — informational, not decision/constraint)
 *  Cost type: tags an attribute as a utility cost driver for objective func.
 * ============================================================================ */
const VAR_TYPES = ['MV','CV','DV','PV'];
const VAR_TYPE_INFO = {
  MV:{name:'Manipulated', color:'#f0883e', desc:'Optimizer sets this directly'},
  CV:{name:'Controlled',  color:'#3fb950', desc:'Measured & constrained to a band'},
  DV:{name:'Disturbance', color:'#bc8cff', desc:'Uncontrollable input (weather, feed comp)'},
  PV:{name:'Process Value',color:'#56d4dd',desc:'Passive monitor — not a decision'},
};
const COST_TYPES = {
  '':            {name:'(none)',          rateAttr:''},
  fuel:          {name:'Fuel Gas',        rateAttr:'Fuel Gas Cost',     uom:'USD/Nm3'},
  electricity:   {name:'Electricity',     rateAttr:'Electricity Cost',  uom:'USD/kWh'},
  steam_vhp:     {name:'Steam — VHP',     rateAttr:'Steam Cost — VHP',  uom:'USD/metric_ton'},
  steam_hp:      {name:'Steam — HP',      rateAttr:'Steam Cost — HP',   uom:'USD/metric_ton'},
  steam_mp:      {name:'Steam — MP',      rateAttr:'Steam Cost — MP',   uom:'USD/metric_ton'},
  steam_lp:      {name:'Steam — LP',      rateAttr:'Steam Cost — LP',   uom:'USD/metric_ton'},
  cooling_water: {name:'Cooling Water',   rateAttr:'Cooling Water Cost',uom:'USD/m3'},
  product:       {name:'Product (rev -)', rateAttr:'',                  uom:'USD/unit'},
  feed:          {name:'Feed (cost +)',   rateAttr:'',                  uom:'USD/unit'},
};

/* Infer Variable Type from attribute name + element context */
function inferVarType(attrName, ed){
  const n = String(attrName||'').toLowerCase();
  /* MV: operator-actionable handles */
  if (/(setpoint|valve opening|damper opening|controller opening|firing rate|load setpoint|target)/i.test(n)) return 'MV';
  if (/(excess o2 setpoint|attemperator|spray valve|inlet damper)/i.test(n)) return 'MV';
  /* DV: external / feed properties not controllable */
  if (/(ambient|wet bulb|humidity|salinity|hardness|conductivity)/i.test(n)) return 'DV';
  if (/(lhv|calorific|molecular weight|composition|fuel gas (c\d|h2|n2|i?c\d|n?c\d|co2|ch3oh)|liquid fuel component)/i.test(n)) return 'DV';
  /* PV: status / emission / passive metric */
  if (/(status|cycle|leakage|drift|emission|nox|sox|co in|o2 in|tds|stack draft|drum level|tube skin|bearing temperature|vibration|critical service)/i.test(n)) return 'PV';
  if (/(efficiency|filter rating|approach|range|specific energy)/i.test(n)) return 'PV';
  /* CV: default — measured & bounded */
  return 'CV';
}

/* Infer Cost Type from attribute name + element context */
function inferCostType(attrName, ed){
  const n = String(attrName||'').toLowerCase();
  if (/(driver power|shaft power|motor current|power output|burner fuel flow)/i.test(n) && !/atomizing|pilot/.test(n)){
    if (/(burner fuel flow|fuel flow|fuel gas flow|imported flow)/i.test(n)) return 'fuel';
    if (/(driver power|shaft power|motor current|power output)/i.test(n))  return 'electricity';
  }
  if (/(fuel flow|fuel gas flow|imported flow|burner fuel flow)/i.test(n))  return 'fuel';
  if (/(driver power|shaft power|motor current|power output)/i.test(n))     return 'electricity';
  if (/(cw flow|cooling water|sw flow|sea water|service water)/i.test(n))   return 'cooling_water';
  if (/(steam generation|steam output|outlet steam flow)/i.test(n))         return 'steam_hp'; /* default; user can change */
  if (/(steam flow|steam inlet flow|heating steam flow|live steam|reboiler|steam exchanger)/i.test(n)) return 'steam_mp';
  return '';
}

/* Read a SYSTEM_ATTRS cost rate by name (user-set default) */
function getSystemCostRate(rateName){
  const a = SYSTEM_ATTRS.find(x=>x.name===rateName);
  return a?.defaultRate ?? '';
}

/* Auto-generate a base ISA-style PI tag prefix for an instance */
function makePITagBase(plantName, areaTag, ed, instIdx){
  const safe = s => String(s||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  const plantCode = safe(plantName).slice(0,4) || 'PLNT';
  const areaCode  = safe(areaTag).slice(0,4)  || 'AREA';
  /* element abbreviation */
  const abbr = {
    boiler:'BLR', furnace:'FRN', fired_heater:'FH', reformer:'RFM',
    fh_boiler:'BLR', fh_furnace:'FRN', fh_feed_preheater:'FPH', fh_reformer:'RFM',
    instrument_air_compressor:'IAC', plant_air_compressor:'PAC',
    air_dryer:'AD', air_receiver:'AR', air_filter:'AF', air_consumer:'AU',
    fuel_import:'FIN', fuel_header:'FHD',
    cw_supply_header:'CWS', cw_return_header:'CWR', cw_pump:'CWP',
    cooling_tower:'CT', cw_user:'CWU',
    sw_supply_header:'SWS', sw_return_header:'SWR', sw_pump:'SWP', sw_user:'SWU',
    service_water_header:'SVW',
    compressor:'COMP', extruder:'EXT', fans:'FAN', pump:'PMP',
    col_live_steam:'LSI', col_reboiler:'REB', steam_exchanger:'SHX', sec_turbine:'TBN',
  }[ed.key] || safe(ed.name).slice(0,3) || 'EQ';
  const num = String(101+instIdx).padStart(3,'0');
  return `${plantCode}.${areaCode}.${abbr}-${num}`;
}

/* Suffix for the attribute portion of a PI tag */
function makePITagSuffix(attrName){
  const n = String(attrName||'').toLowerCase();
  if (/flow/.test(n))         return 'FLOW';
  if (/pressure/.test(n))     return /(inlet|suction)/.test(n)?'PRESS_IN' : /(outlet|discharge|exhaust|extraction)/.test(n)?'PRESS_OUT':'PRESS';
  if (/temperature|temp/.test(n)) return /(inlet|suction)/.test(n)?'TEMP_IN' : /(outlet|discharge|exhaust|extraction|stack)/.test(n)?'TEMP_OUT':'TEMP';
  if (/(power|kw)/.test(n))   return 'POWER';
  if (/efficiency/.test(n))   return 'EFF';
  if (/level/.test(n))        return 'LVL';
  if (/opening/.test(n))      return 'OPEN';
  if (/duty/.test(n))         return 'DUTY';
  if (/speed/.test(n))        return 'SPEED';
  if (/status/.test(n))       return 'STAT';
  if (/vibration/.test(n))    return 'VIB';
  return String(attrName||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,12);
}

/* Deterministic hash — same shape v12 uses for Element ID / Attribute ID */
function hash(str){
  let h = 5381; const s = String(str||'');
  for (let i=0; i<s.length; i++) h = ((h<<5)+h) ^ s.charCodeAt(i);
  return 'k_' + (h>>>0).toString(36);
}

function applyNetColor(){
  const c = curDef().color;
  document.documentElement.style.setProperty('--net-color',c);

function hexToRGBA(hex,a){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function shade(hex,p){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const f=(x)=>Math.max(0,Math.min(255, Math.round(x+(p/100)*255)));
  return '#'+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function paneSteamPlace(){
  const n=curNet(), d=curDef();
  const w=el('div');
  if (!n.areas.length){ w.appendChild(emptyState('🗂️','No plant areas yet','Define one in step 1.')); return w; }
  w.innerHTML = `
    <div class="section-title"><span class="accent"></span>📦 Place Elements — Steam Network (v12 shape)</div>
    <div class="section-hint">Pick an <b>area</b>, then a <b>header</b> (pressure level), then place Generators, Consumers, Turbines, Letdowns. Turbines and letdowns can only route to <b>lower</b> headers (pressure always drops).</div>`;

  /* Area pills */
  const pills = el('div','pill-row');
  n.areas.forEach(a=>{
    const cnt = steamAreaTotal(a);
    const p = el('button','pill'+(a.id===n.activeArea?' active':'')+(cnt>0?' done':''));
    p.innerHTML = `<span class="pill-dot"></span><span class="pill-name">${esc(a.name)}</span><span class="pill-count">${cnt}</span>`;
    p.onclick=()=>{ n.activeArea=a.id; render(); };
    pills.appendChild(p);
  });
  w.appendChild(pills);

  const a = curArea(); if(!a) return w;
  const s = ensureSteam(a);

  /* Header pills row */
  if(!n.activeHdr) n.activeHdr = STEAM_HEADERS[0].key;
  const hbar = el('div','pill-row'); hbar.style.marginBottom='10px';
  STEAM_HEADERS.forEach(h=>{
    let cnt = 0;
    cnt += Object.values(s.gen[h.key]||{}).reduce((x,v)=>x+(+v||0),0);
    cnt += Object.values(s.con[h.key]||{}).reduce((x,v)=>x+(+v||0),0);
    cnt += Object.values(s.tbn[h.key]||{}).reduce((x,v)=>x+(+v||0),0);
    cnt += Object.values(s.exch[h.key]||{}).reduce((x,v)=>x+(+v||0),0);
    cnt += Object.values(s.let[h.key]||{}).reduce((x,v)=>x+(+v||0),0);
    /* Incoming letdowns from higher headers also touch this header */
    STEAM_HEADERS.forEach((o,oi)=>{
      const i = STEAM_HEADERS.findIndex(x=>x.key===h.key);
      if (oi<i){ cnt += +(s.let[o.key]?.[h.key]||0); }
    });
    const active = n.activeHdr===h.key;
    const p = el('button','pill'+(active?' active':'')+(cnt>0?' done':''));
    p.style.borderColor = active ? h.color : '';
    p.innerHTML = `<span class="pill-dot" style="background:${h.color}"></span><span class="pill-name">${esc(h.short)} <span style="color:var(--text3);font-weight:400">${h.range?'· '+h.range:''}</span></span><span class="pill-count" ${active?'style="background:'+h.color+';color:#fff"':''}>${cnt}</span>`;
    p.onclick=()=>{ n.activeHdr=h.key; n.activeSub='gen'; render(); };
    hbar.appendChild(p);
  });
  w.appendChild(hbar);

  const hdr = steamHdrByKey(n.activeHdr); if(!hdr) return w;
  const lower = steamLowerHeaders(hdr.key);
  const condDestPool = steamCondHeaders(hdr.key);   /* lower headers + CND for exchangers */
  s.gen[hdr.key]=s.gen[hdr.key]||{}; s.con[hdr.key]=s.con[hdr.key]||{};
  s.tbn[hdr.key]=s.tbn[hdr.key]||{}; s.exch[hdr.key]=s.exch[hdr.key]||{}; s.let[hdr.key]=s.let[hdr.key]||{};

  /* Header banner */
  const banner = el('div'); banner.style.cssText=`background:${hexToRGBA(hdr.color,.08)};border:1px solid ${hdr.color};border-radius:var(--radius);padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px`;

  w.appendChild(banner);

  /* Sub-tabs: Gen / Con — Turbines, Exchangers, Letdowns all live inside Con */
  if(!n.activeSub || !['gen','con'].includes(n.activeSub)) n.activeSub='gen';
  const tG = Object.values(s.gen[hdr.key]).reduce((x,v)=>x+(+v||0),0);
  const tT = Object.values(s.tbn[hdr.key]).reduce((x,v)=>x+(+v||0),0);
  const tC = Object.values(s.con[hdr.key]).reduce((x,v)=>x+(+v||0),0);
  const tE = Object.values(s.exch[hdr.key]).reduce((x,v)=>x+(+v||0),0);
  const tL = Object.values(s.let[hdr.key]).reduce((x,v)=>x+(+v||0),0);
  const subs = el('div','subtabs');
  [['gen','♨️ Generators',tG],['con','🔀 Consumers, Turbines &amp; Letdowns',tC+tE+tT+tL]].forEach(([k,lbl,c])=>{
    const b = el('button','subtab'+(n.activeSub===k?' active':''));
    b.innerHTML = `${lbl} <span class="scount">${c}</span>`;
    b.onclick=()=>{ n.activeSub=k; render(); };
    subs.appendChild(b);
  });
  w.appendChild(subs);

  /* Card content per subtab */
  if (n.activeSub==='gen'){
    w.appendChild(steamCardsGen(s, hdr));
  }
  if (n.activeSub==='con'){
    w.appendChild(steamCardsCon(s, hdr));
    /* Steam Exchangers are routed consumers — show their routing UI below the static cons */
    const exWrap = el('div'); exWrap.style.marginTop='10px';
    const exHead = el('div','section-hint');
    exHead.innerHTML = `<b style="color:var(--cyan)">${isaSVG('heat_exchanger',14)} Steam Exchangers (routed consumers)</b> — steam IN from ${esc(hdr.short)}, condensate OUT to a selectable destination (lower header or CND).`;
    exWrap.appendChild(exHead);
    exWrap.appendChild(steamCardsExch(s, hdr, condDestPool));
    w.appendChild(exWrap);

    /* Turbines are routed consumers — show their routing UI below the static cons */
    const tbWrap = el('div'); tbWrap.style.marginTop='10px';
    const tbHead = el('div','section-hint');
    tbHead.innerHTML = `<b style="color:var(--purple)">${isaSVG('turbine',14)} Turbines (routed consumers)</b> — source = ${esc(hdr.short)}, destination(s) = lower header(s). Pressure always drops.`;
    tbWrap.appendChild(tbHead);
    tbWrap.appendChild(steamCardsTbn(s, hdr, lower));
    w.appendChild(tbWrap);

    /* Letdowns */
    w.appendChild(steamCardsLet(s, hdr, lower));
  }
  return w;
}
function steamCardCount(name, ikey, count, onChange){

    <div class="e-body"><div class="e-name">${esc(name)}</div></div>
    <input type="number" class="e-count" min="0" value="${count}">`;
  wrap.querySelector('input').oninput = e => { onChange(Math.max(0,parseInt(e.target.value||'0',10))); };
  return wrap;
}

function steamCardsCon(s, hdr){

/* Routed consumers — Steam Exchangers (and any future STEAM_CON entry with dsts).
   Steam IN from current header, condensate OUT to a selectable destination header (lower P or CND). */
function steamCardsExch(s, hdr, condDestPool){
  const wrap=el('div');
  const routedTypes = STEAM_CON.filter(t=>t.dsts && (!t.restrict || t.restrict.includes(hdr.key)));
  if (!routedTypes.length || !condDestPool.length) return wrap;
  routedTypes.forEach(tt=>{
    wrap.appendChild(el('div','section-hint',`<b style="color:var(--green)">${isaSVG(tt.ikey,16)} ${esc(tt.name)} <span style="color:var(--text3);font-weight:400">— routed: condensate destination is selectable per row</span></b>`));
    const existing = Object.entries(s.exch[hdr.key]).filter(([rk])=>trbParse(rk).typeKey===tt.key);
    existing.forEach(([rk,cnt])=>{
      const {dsts} = trbParse(rk);
      const row = el('div','eq-card has-items');
      row.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap';
      let html = `<span class="e-icon">${isaSVG(tt.ikey,24)}</span><div class="e-name" style="flex:0 0 auto">${esc(tt.name)}</div>`;
      tt.dsts.forEach((d,di)=>{
        html += `<span style="font-size:11px;color:var(--text3)">${esc(d.label)}</span>
          <select data-di="${di}" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:12px">${condDestPool.map(lh=>`<option value="${lh.key}" ${dsts[di]===lh.key?'selected':''}>${esc(lh.short)}</option>`).join('')}</select>`;
      });
      html += `<input type="number" class="e-count" min="0" value="${cnt}">
        <button class="btn-ghost" title="Remove" style="background:transparent;border:1px solid var(--border);color:var(--text3);padding:2px 8px;border-radius:5px;cursor:pointer;font-size:13px">✕</button>`;
      row.innerHTML = html;
      row.querySelector('input').oninput = e => {
        const v = Math.max(0,parseInt(e.target.value||'0',10));
        if(v===0) delete s.exch[hdr.key][rk]; else s.exch[hdr.key][rk]=v;
        saveState(); render();
      };
      row.querySelectorAll('select').forEach(sel=>{
        sel.onchange = e => {
          const di = +e.target.dataset.di;
          const newDsts = dsts.slice(); newDsts[di] = e.target.value;
          const newRk = trbRouteKey(tt.key, newDsts);
          if(newRk===rk){ render(); return; }
          s.exch[hdr.key][newRk] = (s.exch[hdr.key][newRk]||0) + (s.exch[hdr.key][rk]||0);
          delete s.exch[hdr.key][rk];
          saveState(); render();
        };
      });
      row.querySelector('button').onclick = ()=>{ delete s.exch[hdr.key][rk]; saveState(); render(); };
      wrap.appendChild(row);
    });
    const addBtn = el('button','add-row',`＋ Add ${tt.name} routing`);
    addBtn.style.marginBottom='10px';
    addBtn.onclick = ()=>{
      /* Default destination: condensate header if available, else first lower */
      const def = (condDestPool.find(h=>h.key==='cnd') || condDestPool[0]).key;
      const defaults = tt.dsts.map(()=> def);
      const rk = trbRouteKey(tt.key, defaults);
      s.exch[hdr.key][rk] = (s.exch[hdr.key][rk]||0) + 1;
      saveState(); render();
    };
    wrap.appendChild(addBtn);
  });
  return wrap;
}
function steamCardsTbn(s, hdr, lower){
  const condDestPool = steamCondHeaders(hdr.key); /* lower headers + CND for exhaust */
  const wrap=el('div');
  STEAM_TURBINE.forEach(tt=>{
    wrap.appendChild(el('div','section-hint',`<b style="color:var(--purple)">${isaSVG('turbine',16)} ${esc(tt.name)}</b>`));
    const existing = Object.entries(s.tbn[hdr.key]).filter(([rk])=>trbParse(rk).typeKey===tt.key);
    if(tt.dsts.length && !lower.length){
      wrap.appendChild(el('div','section-hint','<span style="color:var(--text3)">No lower headers — cannot route this turbine type from the lowest header.</span>'));
    } else {
      /* Routing rows */
      existing.forEach(([rk,cnt])=>{
        const {dsts, subcat} = trbParse(rk);
        const row = el('div','eq-card has-items');
        row.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap';
        const isCustom = subcat && !TURBINE_SUBCATS.find(x=>x.id===subcat && x.id!=='other');
        const selVal = isCustom ? 'other' : subcat;
        let html = `<span class="e-icon">${isaSVG('turbine',24)}</span><div class="e-name" style="flex:0 0 auto">${esc(tt.name)}</div>
          <select data-rk="${esc(rk)}" class="subcat-sel" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:12px">`+
          TURBINE_SUBCATS.map(sc=>`<option value="${sc.id}" ${selVal===sc.id?'selected':''}>${esc(sc.label)}</option>`).join('')+
          `</select>`;
        if(selVal === 'other') {
           const customVal = isCustom && subcat!=='other' ? subcat : '';
           html += `<input type="text" class="subcat-custom" data-rk="${esc(rk)}" value="${esc(customVal)}" placeholder="Custom name..." style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:12px;width:120px;">`;
        }
        tt.dsts.forEach((d,di)=>{
          /* Exhaust role can go to condensate header; extraction stays on steam headers */
          const pool = (d.role==='exh') ? condDestPool : lower;
          html += `<span style="font-size:11px;color:var(--text3)">${esc(d.label)}</span>
            <select data-di="${di}" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:12px">${pool.map(lh=>`<option value="${lh.key}" ${dsts[di]===lh.key?'selected':''}>${esc(lh.short)}</option>`).join('')}</select>`;
        });
        if(!tt.dsts.length){
          html += `<span style="font-size:11px;color:var(--text3)">(→ condenser)</span>`;
        }
        html += `<input type="number" class="e-count" min="0" value="${cnt}">
          <button class="btn-ghost" title="Remove" style="background:transparent;border:1px solid var(--border);color:var(--text3);padding:2px 8px;border-radius:5px;cursor:pointer;font-size:13px">✕</button>`;
        row.innerHTML = html;
        row.querySelector('input[type="number"]').onchange = e => {
          const v = Math.max(0,parseInt(e.target.value||'0',10));
          e.target.value = v; /* Normalize display */
          if(v === (s.tbn[hdr.key][rk]||0)) return; /* No change */
          if(v===0) delete s.tbn[hdr.key][rk]; else s.tbn[hdr.key][rk]=v;
          saveState(); render();
        };
        row.querySelectorAll('select[data-di]').forEach(sel=>{
          sel.onchange = e => {
            const di = +e.target.dataset.di;
            const newDsts = dsts.slice(); newDsts[di] = e.target.value;
            const newRk = trbRouteKey(tt.key, newDsts, subcat);
            if(newRk===rk){ render(); return; }
            s.tbn[hdr.key][newRk] = (s.tbn[hdr.key][newRk]||0) + (s.tbn[hdr.key][rk]||0);
            delete s.tbn[hdr.key][rk];
            saveState(); render();
          };
        });
        const subcatSel = row.querySelector('.subcat-sel');
        if(subcatSel) {
          subcatSel.onchange = e => {
            const newSubcat = e.target.value;
            const newRk = trbRouteKey(tt.key, dsts, newSubcat);
            if(newRk===rk){ render(); return; }
            s.tbn[hdr.key][newRk] = (s.tbn[hdr.key][newRk]||0) + (s.tbn[hdr.key][rk]||0);
            delete s.tbn[hdr.key][rk];
            saveState(); render();
          };
        }
        const customInp = row.querySelector('.subcat-custom');
        if(customInp) {
          customInp.onchange = e => {
            let newSubcat = e.target.value.trim();
            // Do not allow pipes or colons to break the router format
            newSubcat = newSubcat.replace(/[|:]/g, '-');
            if(!newSubcat) newSubcat = 'other';
            const newRk = trbRouteKey(tt.key, dsts, newSubcat);
            if(newRk===rk){ render(); return; }
            s.tbn[hdr.key][newRk] = (s.tbn[hdr.key][newRk]||0) + (s.tbn[hdr.key][rk]||0);
            delete s.tbn[hdr.key][rk];
            saveState(); render();
          };
        }
        row.querySelector('button').onclick = ()=>{ delete s.tbn[hdr.key][rk]; saveState(); render(); };
        wrap.appendChild(row);
      });
      const addBtn = el('button','add-row',`＋ Add ${tt.name}`);
      addBtn.style.marginBottom='10px';
      addBtn.onclick = ()=>{
        const defaults = tt.dsts.map((d)=> d.role==='exh' ? (condDestPool.find(h=>h.key==='cnd')||condDestPool[0]).key : (lower[0]||condDestPool[0]).key);
        const rk = trbRouteKey(tt.key, defaults, '');
        s.tbn[hdr.key][rk] = (s.tbn[hdr.key][rk]||0) + 1;
        saveState(); render();
      };
      wrap.appendChild(addBtn);
    }
  });
  return wrap;
}
function steamCardsLet(s, hdr, lower){

  return wrap;
}
